<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found · EpochArc</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --surface: #ffffff;
      --fg: #121826;
      --muted: #5f6b7a;
      --border: #dde2ea;
      --accent: #2077ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top right, rgba(32, 119, 255, 0.12), transparent 30%), var(--bg);
      color: var(--fg);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
    }
    .card {
      max-width: 560px;
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(32px, 5vw, 48px);
      line-height: 1.05;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    a {
      color: inherit;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    a.primary {
      background: var(--fg);
      color: var(--surface);
      border-color: var(--fg);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <p>页面不存在，或者链接已经被调整。可以回到时间轴首页，或者查看项目的方法页。</p>
    <div class="actions">
      <a class="primary" href="index.html">返回首页</a>
      <a href="methods.html">方法与来源</a>
    </div>
  </div>
</body>
</html>
