<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" fill="none">
  <!-- EpochArc Brand Icon - Blue Theme -->
  
  <!-- Background Grid/Orbit (Deepened & Distinct) -->
  <circle cx="50" cy="50" r="40" stroke="#64748b" stroke-width="1.5" />
  <path d="M50 10 V90" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.6" />
  <path d="M10 50 H90" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.6" />

  <!-- Outer Dynamic Arc (Representing trajectory/acceleration of epochs) -->
  <path d="M20 70C25 45 45 25 70 30" stroke="#2563eb" stroke-width="6" stroke-linecap="round" />
  
  <!-- Inner Connecting Dashed Path -->
  <path d="M20 70C35 75 65 70 80 50" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 3" />
  
  <!-- Epoch Nodes (Key milestones in time) -->
  <!-- Node 1: Foundation (Dark Slate) -->
  <circle cx="20" cy="70" r="6" fill="#0f172a" stroke="#ffffff" stroke-width="2" />
  
  <!-- Node 2: Transition (Blue Accent) -->
  <circle cx="45" cy="33" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="2" />
  
  <!-- Node 3: Breakthrough (Large Blue Accent) -->
  <circle cx="70" cy="30" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="2" />
  
  <!-- Node 4: Intelligence/Agents (Dark Slate) -->
  <circle cx="80" cy="50" r="6" fill="#0f172a" stroke="#ffffff" stroke-width="2" />
</svg>
