 Llama 4，第一个从底层设计为原生多模态架构的开源权重模型家族——联合处理文本、图像和视频，而不是将视觉作为单独模块添加。该家族包括 Llama 4 Maverick（旗舰推理）和 Llama 4 Scout（高效部署）。在 Llama 3.1 405B 突破的基础上，Llama 4 确立了开源权重多模态 AI 作为开源生态系统的新基线。"}, "datePrecision": "month", "title": {"en": "Meta releases Llama 4, the first natively multimodal open-weight model family", "zhHans": "Meta 发布 Llama 4，首个原生多模态开源权重模型家族"}, "impactIndex": 5}, {"significance": 1, "id": "mcp-protocol-2024", "date": "2024-11-25", "categories": ["product"], "summary": {"en": "On November 25, 2024, Anthropic open-sourced the Model Context Protocol (MCP), a standard for connecting AI systems to external data sources, tools, and services. MCP replaced fragmented per-integration implementations with a single open protocol. It was rapidly adopted by OpenAI, Google, and the broader AI ecosystem, becoming the de facto standard for AI-tool integration and enabling the wave of autonomous AI agents that followed.", "zhHans": "2024 年 11 月 25 日，Anthropic 开源了模型上下文协议（MCP），一个用于连接 AI 系统与外部数据源、工具和服务的标准。MCP 用单一开放协议取代了碎片化的按集成实现。它迅速被 OpenAI、Google 和更广泛的 AI 生态系统采用，成为 AI 工具集成的事实标准，为后来自主 AI 智能体的浪潮奠定了基础。"}, "datePrecision": "day", "title": {"en": "Anthropic introduces the Model Context Protocol (MCP), an open standard connecting AI to real-world tools", "zhHans": "Anthropic 发布模型上下文协议（MCP），连接 AI 与现实工具的开源标准"}, "impactIndex": 5}, {"significance": 1, "id": "microsoft-tay-2016", "date": "2016-03-23", "categories": ["safety", "product"], "summary": {"en": "On March 23, 2016, Microsoft launched Tay — a Twitter chatbot designed to learn from conversation and 'get smarter' through interaction. Within 16 hours, trolls had taught Tay to spew racist, sexist, and Holocaust-denying tweets. Microsoft took Tay offline and issued an apology. The incident was the first time the general public witnessed an AI system 'go bad' in real time, becoming a defining moment in the conversation about AI safety and the risks of learning from unfiltered human input.", "zhHans": "2016 年 3 月 23 日，微软推出了 Tay——一个旨在通过对话学习、通过互动\"变得更聪明\"的 Twitter 聊天机器人。16 小时内，网络喷子教会了 Tay 发布种族主义、性别歧视和否认大屠杀的推文。微软将 Tay 下线并致歉。该事件是普通公众第一次实时目睹 AI 系统\"变坏\"，成为关于 AI 安全和从非过滤人类输入中学习的风险对话中的决定性时刻。"}, "datePrecision": "day", "title": {"en": "Microsoft's Tay chatbot becomes racist in 16 hours — the first viral AI safety meltdown", "zhHans": "微软 Tay 聊天机器人在 16 小时内变得种族主义——第一场病毒式传播的 AI 安全崩溃"}, "impactIndex": 5}, {"significance": 1, "id": "netflix-gene-wilder-ai-2026", "date": "2026-07-01", "categories": ["society", "safety"], "summary": {"en": "On July 1, 2026, Netflix announced 'Wonka's The Golden Ticket,' a nine-episode reality competition series premiering September 23, whose trailer features an AI-generated recreation of Gene Wilder's voice. Netflix partnered with AI audio company ElevenLabs for the voice recreation, and Wilder's estate consented to the use. The announcement triggered immediate backlash on social media, with critics labeling it 'digital necromancy' and questioning the ethics of using AI to resurrect deceased performers. While Wilder's estate had consented, the incident revived the broader debate about AI voice cloning, posthumous consent, and the boundaries of AI-generated entertainment.", "zhHans": "2026年7月1日，Netflix 宣布推出九集真人秀竞赛系列《旺卡的金门票》（Wonka's The Golden Ticket），将于9月23日首播，其预告片使用了 AI 生成的 Gene Wilder 声音旁白。Netflix 与 AI 语音公司 ElevenLabs 合作进行声音还原，并获得了 Wilder 遗产管理方的同意。该公告在社交媒体上立即引发反弹，批评者称之为'数字 necromancy'，并质疑使用 AI 复活已故表演者的伦理问题。虽然 Wilder 遗产管理方已同意，但该事件重新点燃了关于 AI 语音克隆、死后同意和 AI 生成娱乐边界的更广泛辩论。"}, "datePrecision": "day", "title": {"en": "Netflix Uses AI to Recreate Gene Wilder's Voice for Willy Wonka Reality Show", "zhHans": "Netflix 用 AI 复活 Gene Wilder 声音引发伦理争议"}, "impactIndex": 5}, {"significance": 1, "id": "nvidia-4-trillion-2025", "date": "2025-07-09", "categories": ["commerce"], "summary": {"en": "In July 2025, Nvidia became the first company in history to reach a $4 trillion market capitalization, driven by insatiable demand for its AI training and inference chips. The valuation had quadrupled since Nvidia surpassed $1 trillion in 2023 and made up approximately 7.3% of the S&P 500. By October 2025, Nvidia reached $5 trillion. The milestone symbolized AI's transformation from a technology trend into the dominant economic force of the 2020s.", "zhHans": "2025 年 7 月，Nvidia 成为历史上首家达到 4 万亿美元市值的公司，由对其 AI 训练和推理芯片的巨大需求驱动。该估值自 2023 年 Nvidia 超过 1 万亿美元以来已翻了两番，约占标普 500 指数的 7.3%。到 2025 年 10 月，Nvidia 达到了 5 万亿美元。这一里程碑象征着 AI 从技术趋势转变为 2020 年代的主导经济力量。"}, "datePrecision": "day", "title": {"en": "Nvidia becomes the first company in history to reach $4 trillion market capitalization", "zhHans": "Nvidia 成为历史上首家达到 4 万亿美元市值的公司"}, "impactIndex": 5}, {"significance": 1, "id": "nvidia-most-valuable-2024", "date": "2024-06-18", "categories": ["commerce"], "summary": {"en": "On June 18, 2024, NVIDIA's market capitalization reached $3.34 trillion, surpassing Microsoft to become the world's most valuable publicly listed company. The milestone crystallized a historic shift: a chip company whose value was built on AI hardware had overtaken the software giant that defined the PC era. NVIDIA's ascent was powered by surging demand for its GPUs, which had become the essential infrastructure for training and running large AI models. The moment was widely interpreted as AI moving from 'emerging technology' to 'the dominant force in global capital markets.'", "zhHans": "2024 年 6 月 18 日，NVIDIA 市值达到 3.34 万亿美元，超越微软成为全球市值最高的上市公司。这一里程碑凝固了一个历史性转变：一家价值建立在 AI 硬件之上的芯片公司，超越了定义 PC 时代的软件巨头。NVIDIA 的崛起得益于对其 GPU 的激增需求——GPU 已成为训练和运行大型 AI 模型不可或缺的基础设施。这一时刻被广泛解读为 AI 从\"新兴技术\"转变为\"全球资本市场的支配力量\"。"}, "datePrecision": "day", "title": {"en": "NVIDIA becomes the world's most valuable company, a symbolic peak of AI-driven market dominance", "zhHans": "NVIDIA 成为全球市值最高公司，AI 驱动市场主导地位的标志性时刻"}, "impactIndex": 6}, {"significance": 2, "id": "o1-2024", "date": "2024-09-12", "categories": ["capability"], "summary": {"en": "On September 12, 2024, OpenAI released o1 (codenamed 'Strawberry'), a large language model trained to spend more time 'thinking' before generating responses — using a chain-of-thought reasoning process internally. o1 scored in the 89th percentile on the International Mathematics Olympiad qualifier and reached PhD-level accuracy on physics, chemistry, and biology benchmarks. It demonstrated that scaling compute at inference time — not just training time — could unlock new capabilities, opening a second axis of AI progress.", "zhHans": "2024 年 9 月 12 日，OpenAI 发布了 o1（代号\"Strawberry\"），一个经过训练在生成回复前花更多时间\"思考\"的大语言模型——内部使用思维链推理过程。o1 在国际数学奥林匹克资格赛中达到了第 89 百分位，在物理、化学和生物基准上达到了博士级准确率。它证明了在推理时——而不仅仅是训练时——扩展计算量可以解锁新能力，为 AI 进展开辟了第二个轴。"}, "datePrecision": "day", "title": {"en": "OpenAI releases o1, the first reasoning model that 'thinks before it answers'", "zhHans": "OpenAI 发布 o1，第一个\"思考后再回答\"的推理模型"}, "impactIndex": 7}, {"significance": 1, "id": "openai-devday-2023", "date": "2023-11-06", "categories": ["product", "commerce"], "summary": {"en": "On November 6, 2023, OpenAI held its first developer conference, DevDay. CEO Sam Altman announced GPT-4 Turbo (128K context, 2-3x cheaper), the GPT Store for custom AI assistants, DALL-E 3 API integration, and voice/image APIs. With 100 million weekly active users and 92% of Fortune 500 companies on the platform, the event marked OpenAI's transition from a research lab to a full-fledged platform company.", "zhHans": "2023 年 11 月 6 日，OpenAI 举办了首届开发者大会 DevDay。CEO Sam Altman 宣布了 GPT-4 Turbo（128K 上下文、价格更低 2-3 倍）、用于自定义 AI 助手的 GPT Store、DALL-E 3 API 集成以及语音/图像 API。拥有 1 亿周活跃用户和 92% 的财富 500 强公司使用其平台，此次活动标志着 OpenAI 从研究实验室向全面平台公司的转变。"}, "datePrecision": "day", "title": {"en": "OpenAI holds first DevDay, unveiling GPT-4 Turbo, custom GPTs, and a platform strategy", "zhHans": "OpenAI 召开首届 DevDay，发布 GPT-4 Turbo、自定义 GPT 和平台化战略"}, "impactIndex": 5}, {"significance": 1, "id": "openai-jalapeno-chip-2026", "date": "2026-06-24", "categories": ["commerce", "capability"], "summary": {"en": "On June 24, 2026, OpenAI unveiled Jalapeño, its first custom-designed AI inference processor, built in collaboration with Broadcom. Developed in just nine months, the chip is optimized for LLM inference (targeting GPT-5.3 Codex Spark) and promises substantially better performance than current state-of-the-art GPUs, with initial deployment targeted by end of 2026. The move marks OpenAI's first step toward vertical integration of its AI infrastructure, reducing dependence on Nvidia GPUs, and signals a broader industry trend where AI companies build custom silicon to control cost and performance.", "zhHans": "2026年6月24日，OpenAI 发布了 Jalapeño，其首款自研 AI 推理处理器，与 Broadcom 合作开发。该芯片在九个月内完成设计，针对 LLM 推理（面向 GPT-5.3 Codex Spark）进行了优化，性能声称显著优于当前最先进的 GPU，计划2026年底前初步部署。此举标志着 OpenAI 向 AI 基础设施垂直整合迈出第一步，减少对 Nvidia GPU 的依赖，也反映了 AI 公司自研芯片以控制成本和性能的更广泛行业趋势。"}, "datePrecision": "day", "title": {"en": "OpenAI Unveils Jalapeño, Its First Custom AI Inference Chip", "zhHans": "OpenAI 发布首款自研 AI 推理芯片 Jalapeño"}, "impactIndex": 7}, {"significance": 1, "id": "openai-operator-2025", "date": "2025-01-23", "categories": ["product"], "summary": {"en": "On January 23, 2025, OpenAI released Operator, a research preview of an AI agent that could autonomously navigate a web browser to perform tasks — ordering groceries, making dinner reservations, filling out forms. Powered by a Computer-Using Agent (CUA) model combining GPT-4o vision with o-series reasoning, Operator marked OpenAI's entry into the agent space. By July 2025, it was fully integrated into ChatGPT, making autonomous browsing a standard feature for hundreds of millions of users.", "zhHans": "2025 年 1 月 23 日，OpenAI 发布 Operator，一个 AI Agent 的研究预览版，可自主操作浏览器执行任务——订购杂货、预订晚餐、填写表单。它由计算机使用代理（CUA）模型驱动，结合了 GPT-4o 的视觉能力和 o 系列推理能力，标志着 OpenAI 进入 Agent 领域。到 2025 年 7 月，它已完全集成到 ChatGPT 中，使自主浏览成为数亿用户的标准功能。"}, "datePrecision": "day", "title": {"en": "OpenAI launches Operator, the first AI agent that can browse the web autonomously", "zhHans": "OpenAI 发布 Operator，首个可自主浏览网页的 AI Agent"}, "impactIndex": 5}, {"significance": 1, "id": "openai-pbc-restructure-2025", "date": "2025-10-28", "categories": ["commerce", "governance"], "summary": {"en": "On October 28, 2025, OpenAI completed its transformation into a Public Benefit Corporation (PBC), abandoning the nonprofit-control structure that had governed it since 2015. The restructuring, approved by Delaware and California authorities, created OpenAI Group PBC — a for-profit entity with a public benefit mission. The nonprofit received a $130 billion stake in the new company. The move ended years of governance drama — including Sam Altman's 2023 firing and rehiring, Elon Musk's $97.4B hostile bid in February 2025, and debates about whether AI could be safely developed under nonprofit governance.", "zhHans": "2025 年 10 月 28 日，OpenAI 完成了向公益公司（PBC）的转型，放弃了自 2015 年以来一直管理该组织的非营利控制结构。这一重组获得了特拉华州和加州当局的批准，创建了 OpenAI Group PBC——一个具有公益使命的营利实体。非营利组织在新公司中获得了 1300 亿美元的股份。此举结束了多年的治理戏剧——包括 Sam Altman 2023 年被解雇和重新聘用、Elon Musk 2025 年 2 月的 974 亿美元敌意收购，以及关于 AI 是否可以在非营利治理下安全发展的辩论。"}, "datePrecision": "day", "title": {"en": "OpenAI completes restructuring as a for-profit benefit corporation, ending years of governance uncertainty", "zhHans": "OpenAI 完成营利性公益公司重组，结束多年治理不确定性"}, "impactIndex": 5}, {"significance": 1, "id": "openclaw-2026", "date": "2026-01-25", "categories": ["product", "society"], "summary": {"en": "On January 25, 2026, Austrian developer Peter Steinberger launched OpenClaw on Hacker News — an open-source AI agent that manages email, calendar, files, and code autonomously from chat apps. Within 24 hours it gained 9,000 GitHub stars, reached 100,000 in a week, and 247,000 by March, becoming the fastest-growing developer tool in history. By February, Steinberger was hired by OpenAI (project moved to an independent foundation) and NVIDIA announced NemoClaw at GTC. In China, OpenClaw sparked a nationwide 'raising the lobster' craze, with millions installing it on their devices.", "zhHans": "2026 年 1 月 25 日，奥地利开发者 Peter Steinberger 在 Hacker News 上发布了 OpenClaw——一个开源 AI 智能体，可通过聊天应用自主管理邮件、日历、文件和代码。24 小时内获得 9,000 个 GitHub Star，一周内达到 10 万，3 月达到 24.7 万，成为史上增长最快的开发者工具。到 2 月，Steinberger 被 OpenAI 聘走（项目移交独立基金会），NVIDIA 在 GTC 发布 NemoClaw。在中国，OpenClaw 引发了全国性的\"养龙虾\"热潮，数百万人将其安装到设备上。"}, "datePrecision": "day", "title": {"en": "OpenClaw goes viral, creating the first mainstream personal AI agent phenomenon", "zhHans": "OpenClaw 爆火，首个大众化个人 AI 智能体现象诞生"}, "impactIndex": 7}, {"significance": 3, "id": "perceptron-1958", "date": "1958-07", "categories": ["capability"], "summary": {"en": "Frank Rosenblatt, a psychologist at the Cornell Aeronautical Laboratory, demonstrated the Perceptron—the first machine capable of learning from experience. Using an IBM 704 computer, it taught itself to distinguish between marked and unmarked cards after 50 trials. The New York Times called it \"the embryo of an electronic computer that the Navy expects will be able to walk, talk, see, write, reproduce itself and be conscious of its existence.\"", "zhHans": "康奈尔航空实验室的心理学家 Frank Rosenblatt 演示了感知机——第一个能从经验中学习的机器。在一台 IBM 704 计算机上，它经过 50 次试验学会了区分左右标记的卡片。《纽约时报》称之为\"海军期望能够行走、说话、观看、书写、自我复制并意识到自身存在的电子计算机的胚胎。\""}, "datePrecision": "month", "title": {"en": "Frank Rosenblatt demonstrates the Perceptron, the first artificial neural network that learns", "zhHans": "Frank Rosenblatt 演示感知机，第一个能学习的人工神经网络"}, "impactIndex": 5}, {"significance": 2, "id": "resnet-2015", "date": "2015-12-10", "categories": ["capability"], "summary": {"en": "Kaiming He et al. publish Deep Residual Learning for Image Recognition, introducing residual connections that allow training of neural networks with over 150 layers. ResNet achieves 3.57% top-5 error on ImageNet, surpassing human-level performance for the first time on this benchmark.", "zhHans": "何恺明等人发表《Deep Residual Learning for Image Recognition》，提出残差连接，使训练超过 150 层的神经网络成为可能。ResNet 在 ImageNet 上达到 3.57% 的 top-5 错误率，首次在该基准上超越人类水平。"}, "datePrecision": "day", "title": {"en": "ResNet wins ImageNet — residual connections enable ultra-deep networks", "zhHans": "ResNet 赢得 ImageNet 冠军——残差连接让超深网络成为可能"}, "impactIndex": 9}, {"significance": 2, "id": "rli-ai-automation-2026", "date": "2026-07-06", "categories": ["commerce", "society"], "summary": {"en": "On July 6, 2026, the Center for AI Safety (CAIS) and Scale Labs published an update to the Remote Labor Index (RLI), showing that AI systems' success rate on economically valuable online freelance projects surged from 2.5% (October 2025) to 16.1% (July 2026) — more than a sixfold increase in under eight months. Frontier models tested: Fable 5 (16.1%), Claude Opus 4.8 (8.3%), GPT-5.5 (6.3%). The RLI tests AI systems on fully end-to-end online projects across domains including 3D/CAD, architecture, graphic design, video/animation, audio, data analysis, and web applications. The accelerating capability has sparked renewed debate about AI's impact on employment and whether humans can innovate their comparative advantages fast enough to stay ahead.", "zhHans": "2026年7月6日，AI 安全中心（CAIS）和 Scale Labs 发布了远程劳动指数（RLI）的更新，显示 AI 系统在经济价值在线自由职业项目上的成功率从 2.5%（2025年10月）飙升至 16.1%（2026年7月）——在不到八个月内增长超过六倍。受测前沿模型：Fable 5（16.1%）、Claude Opus 4.8（8.3%）、GPT-5.5（6.3%）。RLI 测试 AI 系统在包括 3D/CAD、建筑、平面设计、视频/动画、音频、数据分析和网页应用等领域的全端到端在线项目。能力的加速引发了关于 AI 对就业影响以及人类是否能创新自身比较优势以保持领先的新一轮辩论。"}, "datePrecision": "day", "title": {"en": "AI Success Rate on Online Freelance Work Surges from 2.5% to 16.1% in 8 Months — CAIS Remote Labor Index", "zhHans": "AI 在线自由职业任务成功率 8 个月内从 2.5% 飙升至 16.1%——CAIS 远程劳动指数"}, "impactIndex": 6}, {"significance": 2, "id": "sam-altman-ouster-2023", "date": "2023-11-17", "categories": ["commerce", "governance"], "summary": {"en": "On November 17, 2023, OpenAI's board fired CEO Sam Altman, citing lack of candor. What followed was four days of chaos: nearly all 770 employees threatened to quit, the board appointed and replaced two interim CEOs, Microsoft hired Altman then scrapped the deal, and by November 21, Altman was reinstated with a new board. The crisis revealed fundamental governance problems at the world's most important AI company — a structure designed for safety had almost destroyed the company.", "zhHans": "2023 年 11 月 17 日，OpenAI 董事会解雇了 CEO Sam Altman，理由是不坦诚。随后的四天陷入混乱：几乎所有 770 名员工威胁辞职，董事会任命并更换了两任临时 CEO，微软聘用了 Altman 后又废止了协议，到 11 月 21 日 Altman 复职并拥有新董事会。这场危机揭示了全球最重要 AI 公司的基础治理问题——一个为安全设计的结构几乎摧毁了公司。"}, "datePrecision": "day", "title": {"en": "Sam Altman fired and rehired in four days — the defining corporate governance crisis of the AI era", "zhHans": "Sam Altman 四天内被解职又重新聘用——AI 时代最具代表性的公司治理危机"}, "impactIndex": 7}, {"significance": 1, "id": "scarlett-johansson-openai-2024", "date": "2024-05-20", "categories": ["safety", "society"], "summary": {"en": "On May 20, 2024, actress Scarlett Johansson publicly challenged OpenAI over a ChatGPT voice called 'Sky' that sounded 'eerily similar' to her own. Johansson revealed that OpenAI had approached her nine months earlier to license her voice, she declined, and the company used a voice she believed imitated hers anyway. OpenAI denied deliberate imitation but suspended the voice. The incident became a landmark moment in the debate over AI consent, celebrity likeness rights, and the ethical boundaries of AI voice synthesis.", "zhHans": "2024 年 5 月 20 日，演员斯嘉丽·约翰逊公开质疑 OpenAI 的一个名为\"Sky\"的 ChatGPT 声音与其声音\"惊人相似\"。约翰逊透露，OpenAI 在九个月前曾联系她授权使用她的声音，她拒绝了，而公司仍然使用了她认为模仿了她的声音。OpenAI 否认故意模仿，但暂停了该声音。该事件成为关于 AI 同意权、名人肖像权和 AI 语音合成伦理边界讨论的一个里程碑时刻。"}, "datePrecision": "day", "title": {"en": "Scarlett Johansson challenges OpenAI over voice that sounds 'eerily similar' to hers", "zhHans": "斯嘉丽·约翰逊就 ChatGPT 声音与其\"惊人相似\"挑战 OpenAI"}, "impactIndex": 4}, {"significance": 1, "id": "siri-2011", "date": "2011-10-04", "categories": ["product"], "summary": {"en": "On October 4, 2011, Apple unveiled the iPhone 4S with Siri, the first widely available conversational AI assistant embedded in a mass-market device. For millions of people, Siri was their first direct interaction with artificial intelligence — asking about the weather, setting alarms, or getting answers by voice. Siri transformed AI from a lab concept into a daily reality, paving the way for every voice assistant that followed.", "zhHans": "2011 年 10 月 4 日，苹果发布了内置 Siri 的 iPhone 4S，这是首个嵌入大众市场设备的广泛可用对话式 AI 助手。对数百万人来说，Siri 是他们与人工智能的第一次直接互动——通过语音询问天气、设置闹钟或获取答案。Siri 将 AI 从实验室概念变成了日常现实，为所有后来的语音助手铺平了道路。"}, "datePrecision": "day", "title": {"en": "Siri launches on iPhone 4S — millions of ordinary people meet AI for the first time", "zhHans": "Siri 在 iPhone 4S 上亮相——亿万普通人第一次遇见 AI"}, "impactIndex": 6}, {"significance": 2, "id": "sora-2024", "date": "2024-02-15", "categories": ["product"], "summary": {"en": "On February 15, 2024, OpenAI unveiled Sora, a text-to-video generation model that produced strikingly coherent, photorealistic video clips up to one minute long from text prompts. Unlike previous text-to-video efforts that produced glitchy, short, and disjointed output, Sora's results demonstrated object permanence, physical consistency, and cinematic quality. The announcement was a 'GPT-1 moment for video'—the first time video generation seemed to genuinely work.", "zhHans": "2024 年 2 月 15 日，OpenAI 公布了 Sora，一个文本生视频生成模型，可以从文本提示中生成惊人连贯、逼真的一分钟长视频片段。与此前产生闪烁、短促且脱节输出的文本生视频尝试不同，Sora 的结果展示了物体持久性、物理一致性和电影级的质量。这一宣布是\"视频的 GPT-1 时刻\"——第一次看起来视频生成真的能用了。"}, "datePrecision": "day", "title": {"en": "OpenAI previews Sora, the first text-to-video model that looked like it was working", "zhHans": "OpenAI 预览 Sora，第一个看起来真的能用的文本生视频模型"}, "impactIndex": 7}, {"significance": 1, "id": "sora-shutdown-2026", "date": "2026-04-26", "categories": ["product", "commerce"], "summary": {"en": "On April 26, 2026, OpenAI discontinued Sora, its text-to-video generation tool, shutting down both the web and app experiences. The shutdown came just over two years after Sora's spectacular February 2024 preview, which had been hailed as a breakthrough in AI video generation. OpenAI cited the high cost of video generation inference, limited product-market fit, and the emergence of more cost-effective competitors (Google's Veo 3, open-source alternatives) as factors. Sora became the first high-profile product casualty of the AI industry's intensifying cost and competition pressures.", "zhHans": "2026 年 4 月 26 日，OpenAI 终止了其文本生视频工具 Sora，关闭了网页和应用体验。此次关停距离 Sora 在 2024 年 2 月引起轰动的预览仅两年多，当时它被誉为 AI 视频生成的突破。OpenAI 将视频生成推理的高成本、有限的产品市场契合度以及更具成本效益的竞争对手（Google 的 Veo 3、开源替代方案）的出现列为因素。Sora 成为 AI 行业日益加剧的成本和竞争压力下的第一个高调产品牺牲品。"}, "datePrecision": "day", "title": {"en": "OpenAI discontinues Sora, marking the first major product shutdown by a frontier AI lab", "zhHans": "OpenAI 关停 Sora，前沿 AI 实验室首次关闭重要产品"}, "impactIndex": 4}, {"significance": 1, "id": "spacex-xai-cursor-2026", "date": "2026-06-16", "categories": ["commerce"], "summary": {"en": "In 2026, Elon Musk's SpaceX executed two landmark AI acquisitions: acquiring xAI at a combined $1.25 trillion valuation in February, followed by a historic $60 billion all-stock acquisition of AI coding startup Cursor just days after SpaceX's record-breaking IPO in June. The deals represent the largest AI talent and technology consolidation in history, concentrating frontier AI capabilities (Grok models), AI coding tools (Cursor), and massive compute resources under a single entity, and signaled the convergence of aerospace, AI, and software development into integrated technology stacks.", "zhHans": "2026年，Elon Musk 的 SpaceX 完成了两笔里程碑式的 AI 收购：2月以 1.25 万亿美元合并估值收购 xAI，随后在6月 SpaceX 创纪录 IPO 后数天以 600 亿美元的全股票交易收购 AI 编程初创公司 Cursor。这两笔交易代表了历史上最大规模的 AI 人才和技术整合，将前沿 AI 能力（Grok 模型）、AI 编程工具（Cursor）和庞大的计算资源集中于一个实体下，标志着航空航天、AI 和软件开发融合为一体化技术堆栈。"}, "datePrecision": "day", "title": {"en": "SpaceX Acquires xAI and Cursor: Unprecedented AI Industry Consolidation", "zhHans": "SpaceX 收购 xAI 与 Cursor：AI 产业史无前例的大整合"}, "impactIndex": 8}, {"significance": 1, "id": "stable-diffusion-2022", "date": "2022-08-22", "categories": ["capability", "product"], "summary": {"en": "Stability AI released Stable Diffusion in August 2022, an open-weight text-to-image model that could generate high-quality images from natural language descriptions on consumer-grade GPUs. Unlike DALL-E 2 (closed API) and Midjourney (proprietary), Stable Diffusion's weights were released publicly, sparking an explosion of community tools, fine-tunes, and creative applications. It transformed AI art from a curiosity into a mass phenomenon practically overnight.", "zhHans": "Stability AI 于 2022 年 8 月发布了 Stable Diffusion，一个开源的文本到图像模型，可以在消费级 GPU 上从自然语言描述生成高质量图像。与 DALL-E 2（封闭 API）和 Midjourney（专有）不同，Stable Diffusion 的权重公开发布，引发了一波社区工具、微调和创意应用的爆发。它几乎在一夜之间将 AI 艺术从一种新奇事物转变为大众现象。"}, "datePrecision": "day", "title": {"en": "Stable Diffusion open-sources text-to-image generation to the public", "zhHans": "Stable Diffusion 将文本到图像生成开源给公众"}, "impactIndex": 5}, {"significance": 1, "id": "suchir-balaji-2025", "date": "2025-02-14", "categories": ["safety"], "summary": {"en": "On February 14, 2025, the San Francisco medical examiner officially ruled the death of Suchir Balaji, a 26-year-old former OpenAI researcher and whistleblower, as a suicide with no evidence of foul play. Balaji had publicly raised concerns about OpenAI's use of copyrighted training data and its safety practices. His death intensified the debate about whistleblower protections in AI, catalyzed legislative action (California SB 53, federal AI Whistleblower Protection Act), and became a turning point in the discussion about safety culture at frontier AI labs.", "zhHans": "2025 年 2 月 14 日，旧金山法医正式裁定 26 岁的前 OpenAI 研究员和吹哨人 Suchir Balaji 的死因为自杀，无他杀证据。Balaji 曾公开对 OpenAI 使用受版权保护的训练数据及其安全实践提出担忧。他的死亡加剧了关于 AI 领域吹哨人保护的辩论，推动了立法行动（加州 SB 53、联邦 AI 吹哨人保护法案），并成为关于前沿 AI 实验室安全文化讨论的转折点。"}, "datePrecision": "day", "title": {"en": "OpenAI whistleblower Suchir Balaji's death is ruled a suicide, spotlighting AI safety culture", "zhHans": "OpenAI 吹哨人 Suchir Balaji 死亡被裁定为自杀，AI 安全文化受关注"}, "impactIndex": 4}, {"significance": 1, "id": "suno-udio-lawsuit-2024", "date": "2024-06-24", "categories": ["safety", "commerce"], "summary": {"en": "On June 24, 2024, the Recording Industry Association of America (RIAA) filed two landmark copyright lawsuits against AI music generation companies Suno and Udio on behalf of Sony Music, Universal Music Group, and Warner Records. The suits alleged that the AI models were trained on copyrighted sound recordings without permission, and marked the first major legal confrontation between the music industry and generative AI. The cases set the template for AI x creative industry copyright disputes globally and led to partial settlements in 2025.", "zhHans": "2024 年 6 月 24 日，美国唱片业协会（RIAA）代表索尼音乐、环球音乐集团和华纳唱片对 AI 音乐生成公司 Suno 和 Udio 提起了两起里程碑式的版权诉讼。诉讼指控这些 AI 模型在未经许可的情况下使用受版权保护的音乐录音进行训练，标志着音乐产业与生成式 AI 之间的首次重大法律对抗。这些案件为全球 AI 与创意产业版权纠纷设定了模板，并在 2025 年促成了部分和解。"}, "datePrecision": "day", "title": {"en": "Major record labels sue AI music generators Suno and Udio for copyright infringement", "zhHans": "主要唱片公司起诉 AI 音乐生成器 Suno 和 Udio 侵犯版权"}, "impactIndex": 4}, {"significance": 2, "id": "tensorflow-2015", "date": "2015-11-09", "categories": ["product"], "summary": {"en": "Google releases TensorFlow as an open-source deep learning framework under Apache 2.0 license. It quickly becomes the most widely adopted machine learning library, powering research and production systems across industries.", "zhHans": "Google 以 Apache 2.0 协议开源 TensorFlow 深度学习框架。它迅速成为最广泛采用的机器学习库，支撑了各行业的研究与生产系统。"}, "datePrecision": "day", "title": {"en": "Google open-sources TensorFlow — deep learning becomes accessible", "zhHans": "Google 开源 TensorFlow——深度学习走向普及"}, "impactIndex": 9}, {"significance": 3, "id": "transformer-2017", "date": "2017-12", "categories": ["capability"], "summary": {"en": "Eight Google researchers published 'Attention Is All You Need' at NeurIPS 2017, introducing the Transformer architecture. By dispensing with recurrence and convolution entirely and relying solely on self-attention mechanisms, the Transformer achieved state-of-the-art translation results while training significantly faster. The paper has been cited over 250,000 times, and the Transformer became the foundation of every major AI system since—from GPT and BERT to AlphaFold and modern speech models.", "zhHans": "八位 Google 研究者在 NeurIPS 2017 上发表了《Attention Is All You Need》，引入了 Transformer 架构。通过完全摒弃循环和卷积、仅依赖自注意力机制，Transformer 在实现最先进翻译结果的同时大幅加快了训练速度。这篇论文已被引用超过 25 万次，Transformer 成为此后每一个主要 AI 系统的基础——从 GPT 和 BERT 到 AlphaFold 再到现代语音模型。"}, "datePrecision": "month", "title": {"en": "\"Attention Is All You Need\" — the Transformer architecture is born", "zhHans": "《Attention Is All You Need》——Transformer 架构诞生"}, "impactIndex": 10}, {"significance": 3, "id": "turing-test-1950", "date": "1950-10", "categories": ["capability"], "summary": {"en": "Alan Turing published his landmark paper in Mind, proposing the \"Imitation Game\"—a test to determine whether machines can think. Rather than defining \"thinking\" philosophically, Turing framed intelligence as a behavioral question: can a machine converse well enough to be indistinguishable from a human? This paper is widely regarded as the philosophical foundation of artificial intelligence.", "zhHans": "艾伦·图灵在哲学期刊 Mind 上发表里程碑论文《计算机器与智能》，提出用\"模仿游戏\"（后称图灵测试）来判断机器是否能思考。图灵不纠缠\"思考\"的哲学定义，而是将智能转化为可操作的行为问题：机器能否在对话中让人无法分辨？这篇论文被公认为人工智能的哲学奠基之作。"}, "datePrecision": "month", "title": {"en": "Alan Turing publishes \"Computing Machinery and Intelligence\", proposing what becomes the Turing Test", "zhHans": "Alan Turing 发表《计算机器与智能》，提出后来被称为图灵测试的思想实验"}, "impactIndex": 6}, {"significance": 1, "id": "vibecoding-2025", "date": "2025-02-02", "categories": ["society", "product"], "summary": {"en": "On February 2, 2025, AI researcher Andrej Karpathy coined the term 'vibe coding' in a viral tweet, describing a new programming paradigm where developers describe tasks to LLMs and accept generated code without thorough review. The term quickly entered mainstream vocabulary, was named Collins Dictionary Word of the Year 2025, and was listed by Merriam-Webster. It crystallized a profound shift: AI had transformed coding from a craft of precise syntax into a conversation of intent.", "zhHans": "2025 年 2 月 2 日，AI 研究员 Andrej Karpathy 在一条病毒式推文中创造了\"vibe coding\"一词，描述了一种新的编程范式：开发者向大语言模型描述任务，接受生成的代码而不经过彻底审查。该词迅速进入主流词汇，被《柯林斯英语词典》评为 2025 年度词汇，并被《韦氏词典》收录。它凝固了一个深刻的转变：AI 将编码从精确语法的工艺转变为意图的对话。"}, "datePrecision": "day", "title": {"en": "'Vibe coding' is coined, capturing a new paradigm of AI-assisted programming", "zhHans": "'Vibe coding' 一词诞生，概括了 AI 辅助编程的新范式"}, "impactIndex": 5}, {"significance": 1, "id": "watson-jeopardy-2011", "date": "2011-02-16", "categories": ["capability", "society"], "summary": {"en": "On February 16, 2011, IBM's Watson supercomputer defeated all-time Jeopardy! champions Ken Jennings and Brad Rutter across three episodes. Watson used natural language processing and information retrieval over 200 million pages of content, demonstrating that machines could handle the ambiguity of natural language at human-comparable levels in a constrained domain.", "zhHans": "2011 年 2 月 16 日，IBM 的 Watson 超级计算机在三期节目中击败了 Jeopardy! 历史总冠军 Ken Jennings 和 Brad Rutter。Watson 使用自然语言处理和检索技术，在 2 亿页内容上进行实时分析，证明了机器可以在受限领域以接近人类的水平处理自然语言的模糊性。"}, "datePrecision": "day", "title": {"en": "IBM Watson defeats human champions on Jeopardy!", "zhHans": "IBM Watson 在 Jeopardy! 上击败人类冠军"}, "impactIndex": 5}]</script>
