<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EpochArc · AI Milestones, Evidence, and Possible Directions</title>
  <meta name="description" content="EpochArc tracks AI milestones, organizes evidence, and maps possible directions in a structured bilingual timeline." />
  <meta name="theme-color" content="#f7f8fb" />
  <meta name="color-scheme" content="light dark" />
  <meta name="application-name" content="EpochArc" />
  <meta name="apple-mobile-web-app-title" content="EpochArc" />
  <link rel="canonical" href="https://epoch-arc.com/" />
  <meta property="og:title" content="EpochArc · AI Milestones, Evidence, and Possible Directions" />
  <meta property="og:description" content="A bilingual project for tracking AI milestones, organizing evidence, and mapping possible directions." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://epoch-arc.com/" />
  <meta property="og:site_name" content="EpochArc" />
  <meta property="og:locale" content="zh_CN" />
  <meta property="og:image" content="https://epoch-arc.com/og-image.svg" />
  <meta property="og:image:type" content="image/svg+xml" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="EpochArc · AI Milestones, Evidence, and Possible Directions" />
  <meta name="twitter:description" content="A bilingual project for tracking AI milestones, organizing evidence, and mapping possible directions." />
  <meta name="twitter:image" content="https://epoch-arc.com/og-image.svg" />
  <link rel="icon" href="assets/logo-icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/site.webmanifest" />
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "EpochArc",
      "alternateName": "EpochArc",
      "description": "A bilingual public timeline of AI milestones, evidence, and possible directions.",
      "inLanguage": ["zh-CN", "en"]
    }
  </script>
  <link rel="stylesheet" href="./src/css/main.css">
</head>
<body data-theme="light">

  <!-- Sticky Top Nav -->
  <header class="topnav" data-od-id="topnav">
    <div class="container topnav-inner">
      <div class="logo">
        <img class="brand-icon" src="assets/logo-icon.svg" alt="" aria-hidden="true">
        <span data-zh="EpochArc" data-en="EpochArc">EpochArc</span>
      </div>
      <div class="topnav-actions">
        <label class="language-picker" aria-label="Language">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path stroke-linecap="round" d="M3.6 9h16.8M3.6 15h16.8M12 3c2.2 2.4 3.3 5.4 3.3 9S14.2 18.6 12 21M12 3C9.8 5.4 8.7 8.4 8.7 12S9.8 18.6 12 21"></path>
          </svg>
          <select class="language-select" id="langSelect">
            <option value="en">EN</option>
            <option value="zh-Hans">中文</option>
          </select>
        </label>
        <button class="control-btn" id="themeToggle">
          <svg id="themeIcon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width: 14px; height: 14px;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"></path>
          </svg>
          <span id="themeText" data-zh="深色模式" data-en="Dark Mode">深色模式</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero container" data-od-id="hero">
    <h1 id="heroTitle" data-zh="What Comes Next?" data-en="What Comes Next?">What Comes Next?</h1>
  </section>

  <!-- Horizontal Future Signals Section -->
  <section class="container predictions-section" data-od-id="predictions">
    <div class="section-title" id="predTitle" data-zh="可能方向" data-en="Possible Directions">可能方向</div>
    <div class="predictions-grid" id="predictionsContainer">
      <!-- Future signal cards will be injected here -->
    </div>
  </section>

  <!-- Vertical Timeline Section -->
  <section class="container" data-od-id="timeline">
    <div class="section-title" id="timelineTitle" data-zh="策展时间轴" data-en="Curated Timeline">策展时间轴</div>
    
    <!-- Timeline Filters -->
    <div class="timeline-filter-bar">
      <label class="filter-field">
        <span class="filter-label ghost" aria-hidden="true">Search</span>
        <div class="search-input-wrapper">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          <input type="text" class="search-input" id="searchInput" placeholder="搜索事件..." data-zh-placeholder="搜索事件..." data-en-placeholder="Search events...">
        </div>
      </label>
      
      <div class="filter-groups">
        <label class="filter-field">
          <span class="filter-label" data-zh="重要度" data-en="Significance">重要度</span>
          <select class="filter-select" id="significanceFilter" aria-label="重要度筛选">
            <option value="all" data-zh="全部 L1-L3" data-en="All L1-L3">全部 L1-L3</option>
            <option value="3" data-zh="L3 转折点" data-en="L3 Turning Point">L3 转折点</option>
            <option value="2" data-zh="L2 关键" data-en="L2 Key">L2 关键</option>
            <option value="1" data-zh="L1 重要" data-en="L1 Important">L1 重要</option>
          </select>
        </label>
        <label class="filter-field">
          <span class="filter-label" data-zh="事件类型" data-en="Type">事件类型</span>
          <select class="filter-select" id="categoryFilter" aria-label="事件类型筛选">
            <option value="all" data-zh="全部类型" data-en="All Types">全部类型</option>
            <option value="capability" data-zh="能力突破" data-en="Capability">能力突破</option>
            <option value="product" data-zh="产品工具" data-en="Products">产品工具</option>
            <option value="commerce" data-zh="商业产业" data-en="Commerce">商业产业</option>
            <option value="governance" data-zh="治理监管" data-en="Governance">治理监管</option>
            <option value="safety" data-zh="安全伦理" data-en="Safety">安全伦理</option>
            <option value="society" data-zh="社会文化" data-en="Society">社会文化</option>
          </select>
        </label>
        <label class="filter-field">
          <span class="filter-label" data-zh="影响维度" data-en="Impact Dimension">影响维度</span>
          <select class="filter-select" id="impactFilter" aria-label="影响维度筛选">
            <option value="all" data-zh="全部维度" data-en="All Dimensions">全部维度</option>
            <option value="capability_leap" data-zh="能力跃迁" data-en="Capability Leap">能力跃迁</option>
            <option value="economic_disruption" data-zh="经济冲击" data-en="Economic Disruption">经济冲击</option>
            <option value="access_democratization" data-zh="普惠化" data-en="Access Democratization">普惠化</option>
            <option value="risk_creation" data-zh="风险制造" data-en="Risk Creation">风险制造</option>
            <option value="paradigm_shift" data-zh="认知转变" data-en="Paradigm Shift">认知转变</option>
          </select>
        </label>
        <label class="filter-field">
          <span class="filter-label" data-zh="共识度" data-en="Consensus">共识度</span>
          <select class="filter-select" id="consensusFilter" aria-label="解读共识筛选">
            <option value="all" data-zh="全部" data-en="All">全部</option>
            <option value="broad" data-zh="广泛共识" data-en="Broad Consensus">广泛共识</option>
            <option value="debated" data-zh="仍在讨论" data-en="Actively Debated">仍在讨论</option>
            <option value="emerging" data-zh="共识形成中" data-en="Emerging Consensus">共识形成中</option>
          </select>
        </label>
        <label class="filter-field">
          <span class="filter-label" data-zh="年份" data-en="Year">年份</span>
          <select class="filter-select" id="yearFilter" aria-label="年份筛选">
            <option value="all" data-zh="全部年份" data-en="All Years">全部年份</option>
          </select>
        </label>
        
        <!-- 动态清空所有筛选与搜索按钮 -->
        <div class="filter-reset-field" id="filterResetField">
          <button class="filter-reset-btn" id="filterResetBtn" aria-label="重置所有筛选" data-zh-title="重置所有筛选" data-en-title="Reset all filters" disabled>
            <svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Timeline List -->
    <div class="timeline-wrapper">
      <div class="timeline-line"></div>
      <div class="timeline-container" id="timelineContainer">
        <!-- Event items will be injected here -->
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="pagefoot" data-od-id="footer">
    <div class="container row-between">
      <span id="footCopyright" data-zh="© 2026 EpochArc · Curated by an independent maker" data-en="© 2026 EpochArc · Curated by an independent maker">© 2026 EpochArc · Curated by an independent maker</span>
      <nav class="footer-links" aria-label="Footer">
        <a href="methods.html"><span data-zh="方法与来源" data-en="Methodology">方法与来源</span></a>
      </nav>
    </div>
  </footer>

  <button id="backToTopBtn" class="back-to-top" aria-label="回到顶部" data-zh-title="回到顶部" data-en-title="Back to Top" title="回到顶部">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>

  <script type="application/json" id="fallback-forecasts-data">[]</script>
  <script type="application/json" id="fallback-events-data">[]</script>

  <script type="application/json" id="fallback-sources-data">[]</script>

  <script type="module" src="./src/js/main.js"></script>
  <div id="global-tooltip" class="global-tooltip"></div>
  <div id="cookie-notice" class="cookie-notice">
    <span class="cookie-notice-text" data-zh="本站使用匿名 Cookie 用于投票功能，不追踪个人数据。" data-en="This site uses an anonymous cookie for optional voting features. No personal data is tracked.">This site uses an anonymous cookie for optional voting features. No personal data is tracked.</span>
    <button class="cookie-notice-close" data-zh="知道了" data-en="Got it">Got it</button>
  </div>
</body>
</html>
