 能力的扩散。"}, "impactIndex": 7, "title": {"en": "GLM-5.2 Open Source: Chinese AI Model Matches Frontier Closed-Source Performance", "zhHans": "GLM-5.2 开源发布：中国 AI 模型追上闭源前沿水平"}, "categories": ["capability"], "significance": 2, "id": "glm-52-open-source-2026", "slug": "glm-52-open-source-2026", "date": "2026-06-13"}, {"datePrecision": "day", "summary": {"en": "On May 20, 2025, Google launched AI Mode in Search — a Gemini-powered feature that replaced the traditional list of blue links with AI-generated answers, comprehensive research reports, and multi-step reasoning. For the first time, the world's largest search engine could answer complex questions, compare options, and generate analysis directly, rather than linking to websites that might contain the answer. The change fundamentally altered the economics of the web: traffic to publisher sites dropped, and the definition of 'search' shifted from finding information to having information synthesized for you.", "zhHans": "2025 年 5 月 20 日，Google 在搜索中推出了 AI Mode——一项由 Gemini 驱动的功能，用 AI 生成的答案、全面的研究报告和多步骤推理取代了传统的蓝色链接列表。全球最大的搜索引擎首次可以直接回答复杂问题、比较选项和生成分析，而不是链接到可能包含答案的网站。这一变化从根本上改变了网络的經濟模式：流向出版商网站的流量下降，\"搜索\"的定义从查找信息转变为为你整合信息。"}, "impactIndex": 7, "title": {"en": "Google launches AI Mode in Search, the biggest change to how search works in 25 years", "zhHans": "Google 在搜索中推出 AI Mode，25 年来搜索方式的最大变革"}, "categories": ["product"], "significance": 2, "id": "google-ai-mode-search-2025", "slug": "google-ai-mode-search", "date": "2025-05-20"}, {"datePrecision": "day", "summary": {"en": "On January 27, 2014, Google acquired DeepMind Technologies for approximately £400 million ($650 million), one of its largest European acquisitions. Founded by Demis Hassabis, Shane Legg, and Mustafa Suleyman, DeepMind was a London-based AI startup focused on general-purpose learning algorithms. The acquisition was the first clear signal that AI talent and research capability were strategic assets worth fighting for, setting off a decade of bidding wars for AI researchers and establishing DeepMind as the world's most respected AI lab.", "zhHans": "2014 年 1 月 27 日，Google 以约 4 亿英镑（6.5 亿美元）收购了 DeepMind Technologies，这是其在欧洲最大规模的收购之一。由 Demis Hassabis、Shane Legg 和 Mustafa Suleyman 创立的 DeepMind 是一家总部位于伦敦的 AI 初创公司，专注于通用学习算法。这次收购是第一个明确的信号：AI 人才和研究能力是值得争夺的战略资产，引发了长达十年的 AI 研究人员抢购战，并确立了 DeepMind 作为全球最受尊敬的 AI 实验室的地位。"}, "impactIndex": 5, "title": {"en": "Google acquires DeepMind and ignites the AI talent race", "zhHans": "Google 收购 DeepMind，拉开 AI 人才竞赛序幕"}, "categories": ["commerce"], "significance": 1, "id": "google-deepmind-2014", "slug": "google-acquires-deepmind", "date": "2014-01-27"}, {"datePrecision": "day", "summary": {"en": "On February 14, 2019, OpenAI announced GPT-2, a language model capable of generating remarkably coherent text. But instead of releasing it fully, OpenAI withheld the complete model, citing 'concerns about malicious applications.' The decision sparked an intense global debate: was OpenAI responsibly cautious or grandstanding for attention? The staged rollout — releasing progressively larger versions over months — became a template for AI safety disclosure. It also marked the first time ordinary people heard the argument that AI could be too dangerous to release, permanently changing how the public thought about AI risk.", "zhHans": "2019 年 2 月 14 日，OpenAI 发布了 GPT-2，一个能够生成极其连贯文本的语言模型。但 OpenAI 没有完全发布它，而是以\"对恶意应用的担忧\"为由扣留了完整模型。这一决定引发了一场激烈的全球辩论：OpenAI 是谨慎负责还是在吸引眼球？分阶段发布——在数月内逐步发布越来越大的版本——成了 AI 安全披露的模板。这也标志着普通人第一次听到\"AI 可能危险到不宜发布\"的论点，永久改变了公众对 AI 风险的看法。"}, "impactIndex": 5, "title": {"en": "OpenAI says GPT-2 is 'too dangerous to release' — the first mainstream AI safety debate goes global", "zhHans": "OpenAI 称 GPT-2\"危险不宜发布\"——首场主流 AI 安全辩论席卷全球"}, "categories": ["safety"], "significance": 1, "id": "gpt-2-safety-2019", "slug": "gpt-2-staged-release", "date": "2019-02-14"}, {"datePrecision": "day", "summary": {"en": "On July 8, 2026, the U.S. Department of Commerce approved a broad launch of OpenAI's GPT-5.6 model following additional testing under Washington's new frontier AI oversight framework. The testing was conducted by the Commerce Department's Center for AI Standards and Innovation, with OpenAI sending technical experts to Washington to address questions. OpenAI expects to release GPT-5.6 widely this week. The approval marks the first full test of the voluntary pre-release framework established by Trump's June 2 executive order, after OpenAI and Anthropic both faced government-mandated restrictions on their most advanced models.", "zhHans": "2026年7月8日，美国商务部批准 OpenAI 广泛发布 GPT-5.6 模型，此前该模型在华盛顿新的前沿 AI 监管框架下完成了额外测试。测试由商务部的 AI 标准与创新中心进行，OpenAI 派遣技术专家到华盛顿回答问题。OpenAI 预计本周内广泛发布 GPT-5.6。此次批准标志着特朗普 6 月 2 日行政令建立的自愿预发布框架的首次全面测试，此前 OpenAI 和 Anthropic 的最先进模型均面临政府强制限制。"}, "impactIndex": 5, "title": {"en": "US Commerce Dept Approves Broad Launch of GPT-5.6 After Government Security Review", "zhHans": "美国商务部批准 GPT-5.6 广泛发布，政府安全审查完成"}, "categories": ["governance", "capability"], "significance": 2, "id": "gpt-5-6-broad-launch-2026", "slug": "gpt-5-6-broad-launch-2026", "date": "2026-07-08"}, {"datePrecision": "day", "summary": {"en": "On June 26, 2026, OpenAI unveiled GPT-5.6, its next-generation model family with three variants: Sol (flagship, $5/$30 per M tokens), Terra (balanced, $2.50/$15), and Luna (fast/low-cost, $1/$6). However, at the request of the Trump administration under a June 2 Executive Order establishing voluntary 30-day pre-release government review of frontier AI models, OpenAI restricted initial access to approximately 20 government-approved partner organizations through the API and Codex. GPT-5.6 Sol set new state-of-the-art benchmarks on Terminal-Bench 2.1 (91.91% in ultra mode), surpassing Claude Mythos 5 (88%). The restricted release marked the first implementation of the EO framework and established a new pattern: frontier AI releases are no longer freely decided by companies alone.", "zhHans": "2026年6月26日，OpenAI 发布了 GPT-5.6，其下一代模型家族包括三个变体：Sol（旗舰，$5/$30 per M tokens）、Terra（均衡，$2.50/$15）和 Luna（快速/低价，$1/$6）。然而，应特朗普政府根据6月2日行政令提出的要求——该行政令建立了前沿AI模型公开发布前自愿性30天政府审查流程——OpenAI 将初始访问权限限制为仅约20家政府批准的合作伙伴组织，通过 API 和 Codex 提供。GPT-5.6 Sol 在 Terminal-Bench 2.1 上以 ultra 模式达到 91.91% 的新 SOTA，超越 Claude Mythos 5 的 88%。此次受限发布标志着 EO 框架的首次实施，并确立了一种新模式：前沿 AI 的发布不再由公司单方面决定。"}, "impactIndex": 6, "title": {"en": "OpenAI Releases GPT-5.6 Sol/Terra/Luna Under Government-Restricted Access", "zhHans": "OpenAI 发布 GPT-5.6 系列，应白宫要求限制为仅政府批准伙伴可访问"}, "categories": ["governance", "capability"], "significance": 2, "id": "gpt-5-6-limited-release-2026", "slug": "gpt-5-6-limited-release-2026", "date": "2026-06-26"}, {"datePrecision": "day", "summary": {"en": "In March 2025, OpenAI released GPT Image, a native image generation model integrated directly into ChatGPT — replacing the separate DALL-E system. The model could render text accurately in images, understand complex visual prompts, and generate in multiple languages. On March 27, users discovered they could transform photos into Studio Ghibli animation style, triggering a global viral trend. The 'Ghibli Moment' became 2025's first major AI cultural phenomenon, sparking both delight and a renewed debate about AI-generated art and copyright.", "zhHans": "2025 年 3 月，OpenAI 发布了 GPT Image，一个直接集成到 ChatGPT 中的原生图像生成模型——取代了独立的 DALL-E 系统。该模型能在图像中准确渲染文字、理解复杂的视觉提示、并生成多语言内容。3 月 27 日，用户发现可以将照片转换为吉卜力工作室动画风格，引发了全球病毒式传播。\"吉卜力时刻\"成为 2025 年第一个重大 AI 文化现象，既引发了欢乐也重新点燃了关于 AI 生成艺术和版权的辩论。"}, "impactIndex": 5, "title": {"en": "OpenAI launches native image generation in ChatGPT, igniting a cultural phenomenon", "zhHans": "OpenAI 在 ChatGPT 中推出原生图像生成，引发文化现象"}, "categories": ["product"], "significance": 1, "id": "gpt-image-2025", "slug": "gpt-image", "date": "2025-03-27"}, {"datePrecision": "day", "summary": {"en": "In June 2020, OpenAI published GPT-3 (Generative Pre-trained Transformer 3), a 175-billion-parameter language model that demonstrated remarkable few-shot learning—the ability to perform novel tasks from just a handful of examples without fine-tuning. GPT-3 could write essays, generate code, translate languages, and answer questions at a quality that often blurred the line between human and machine output. The paper 'Language Models are Few-Shot Learners' (Brown et al.) validated the scaling hypothesis: larger models trained on more data get qualitatively better, not just incrementally better.", "zhHans": "2020 年 6 月，OpenAI 发表了 GPT-3（生成式预训练 Transformer 3），一个拥有 1750 亿参数的语言模型，展示了卓越的少样本学习能力——仅需寥寥几个示例即可执行新任务，无需微调。GPT-3 撰写的文章、生成的代码、翻译的语言和回答的问题，其质量经常模糊了人类与机器输出之间的界限。论文《语言模型是少样本学习者》（Brown 等人）验证了缩放假说：更大的模型在更多数据上训练会得到质的提升，而不仅仅是量的改进。"}, "impactIndex": 7, "title": {"en": "OpenAI releases GPT-3, demonstrating that scaling language models unlocks emergent capabilities", "zhHans": "OpenAI 发布 GPT-3，证明语言模型规模化可以解锁涌现能力"}, "categories": ["capability"], "significance": 3, "id": "gpt3-2020", "slug": "gpt-3", "date": "2020-06-11"}, {"datePrecision": "day", "summary": {"en": "On March 14, 2023, OpenAI released GPT-4 — a multimodal model that could accept both text and image inputs while generating text outputs. GPT-4 scored in the 90th percentile on the bar exam, the 99th percentile on the SAT, and demonstrated dramatically improved reasoning, factuality, and steerability over GPT-3.5. It was integrated into ChatGPT Plus as a premium tier, and its API became the default for developers building on LLMs. GPT-4 raised the bar on what LLMs could do and set a new baseline for AI capability that persisted until the model release wave of late 2024.", "zhHans": "2023 年 3 月 14 日，OpenAI 发布了 GPT-4——一个可以同时接受文本和图像输入并生成文本输出的多模态模型。GPT-4 在律师资格考试中达到了第 90 百分位，SAT 中第 99 百分位，并在推理能力、事实准确性和可引导性上相比 GPT-3.5 有显著提升。它被集成到 ChatGPT Plus 作为付费层，其 API 成为基于 LLM 构建的开发者的默认选择。GPT-4 提高了 LLM 能力的上限，并为 AI 能力设定了新的基线，这一基线一直保持到 2024 年底的模型发布潮。"}, "impactIndex": 7, "title": {"en": "OpenAI releases GPT-4, the first multimodal large language model", "zhHans": "OpenAI 发布 GPT-4，第一个多模态大语言模型"}, "categories": ["capability"], "significance": 2, "id": "gpt4-2023", "slug": "gpt-4", "date": "2023-03-14"}, {"datePrecision": "day", "summary": {"en": "On May 13, 2024, OpenAI released GPT-4o ('omni'), a natively multimodal model combining text, vision, and audio processing in a single neural network. For the first time, users could have real-time voice conversations with an AI that could express emotion, laugh, pause, and adjust its tone — indistinguishable from human conversation. GPT-4o matched GPT-4 on text benchmarks while dramatically improving voice and vision performance. The model was made free for all ChatGPT users, effectively doubling the available AI capability overnight.", "zhHans": "2024 年 5 月 13 日，OpenAI 发布了 GPT-4o（\"omni\"），一个将文本、视觉和音频处理整合到单一神经网络的原生多模态模型。用户首次可以与 AI 进行实时语音对话——AI 能够表达情感、笑、停顿和调整语气——与人类对话几乎无法区分。GPT-4o 在文本基准上匹配 GPT-4，同时大幅提升了语音和视觉性能。该模型对所有 ChatGPT 用户免费开放，一夜之间将可用的 AI 能力提升了一倍。"}, "impactIndex": 6, "title": {"en": "OpenAI releases GPT-4o, bringing real-time voice conversation to everyone", "zhHans": "OpenAI 发布 GPT-4o，实时语音对话向所有用户开放"}, "categories": ["capability"], "significance": 1, "id": "gpt4o-2024", "slug": "gpt-4o", "date": "2024-05-13"}, {"datePrecision": "day", "summary": {"en": "On August 7, 2025, OpenAI released GPT-5, a unified AI system that combined advanced reasoning, native multimodality, and autonomous task execution — eliminating the need for users to switch between separate models (GPT-4o for chat, o-series for reasoning, DALL-E for images). According to Sam Altman, GPT-5 could 'provide PhD-level expertise' across domains. The release marked the culmination of OpenAI's journey from a single-purpose language model (GPT-3, 2020) to a general-purpose AI system capable of reasoning, creating, and acting.", "zhHans": "2025 年 8 月 7 日，OpenAI 发布了 GPT-5，一个统一的 AI 系统，结合了高级推理、原生多模态和自主任务执行——消除了用户在独立模型之间切换的需要（GPT-4o 用于聊天，o 系列用于推理，DALL-E 用于图像）。据 Sam Altman 称，GPT-5 可以跨领域\"提供博士级专业知识\"。这次发布标志着 OpenAI 从单一用途语言模型（GPT-3，2020）到能够推理、创造和行动的通用 AI 系统的旅程达到了顶峰。"}, "impactIndex": 6, "title": {"en": "OpenAI releases GPT-5, unifying reasoning, multimodality, and task execution", "zhHans": "OpenAI 发布 GPT-5，统一推理、多模态和任务执行能力"}, "categories": ["capability"], "significance": 2, "id": "gpt5-2025", "slug": "gpt-5", "date": "2025-08-07"}, {"datePrecision": "day", "summary": {"en": "In January 2026, xAI's Grok image generator was used to create nonconsensual sexualized deepfakes, including imagery involving children. X restricted image generation and editing through the Grok account to paid users, while Indonesia and Malaysia temporarily blocked access. The incident triggered a formal Ofcom investigation and wider regulatory scrutiny, showing that access restrictions alone did not resolve the underlying safety and distribution risks.", "zhHans": "2026 年 1 月，xAI 的 Grok 图像生成器被用于制作未经同意的性化深度伪造，其中包括涉及儿童的图像。X 将通过 Grok 账号进行的图像生成和编辑限制为付费用户，印度尼西亚和马来西亚则暂时封锁了访问。该事件引发 Ofcom 正式调查及更广泛的监管审查，表明仅靠访问限制并未解决底层安全与传播风险。"}, "impactIndex": 5, "title": {"en": "xAI's Grok generates explicit deepfakes, triggering multi-country bans and a safety backlash", "zhHans": "xAI 的 Grok 生成色情深度伪造，引发多国封禁和安全反弹"}, "categories": ["safety", "society"], "significance": 1, "id": "grok-deepfake-crisis-2026", "slug": "grok-deepfake-crisis", "date": "2026-01-09"}, {"datePrecision": "day", "summary": {"en": "On July 6, 2026, Illinois Governor JB Pritzker signed the AI Safety Measures Act (SB 315), making Illinois the first US state to require independent third-party safety audits of large AI developers. The law applies to companies with over $500 million in annual gross revenue developing frontier AI models. Requirements include: publishing explanations of catastrophic risk and mitigation plans, reporting critical safety incidents to the state within 72 hours, annual independent compliance audits by qualified third parties, whistleblower protections with anonymous internal reporting, and fines up to $1M for first violations and $3M for subsequent ones. Requirements take effect January 1, 2028. The bill gained bipartisan support and was endorsed by both Anthropic and OpenAI.", "zhHans": "2026年7月6日，伊利诺伊州长 JB Pritzker 签署了 AI 安全措施法案（SB 315），使伊利诺伊成为全美首个要求大型 AI 开发者进行独立第三方安全审计的州。该法律适用于年总收入超过 5 亿美元、开发前沿 AI 模型的公司。要求包括：公布灾难性风险及缓解计划、72 小时内向州政府报告严重安全事故、由合格第三方进行年度独立合规审计、举报人保护及匿名内部报告机制、首次违规罚款最高 100 万美元、后续违规最高 300 万美元。要求于 2028 年 1 月 1 日生效。该法案获得两党支持，Anthropic 和 OpenAI 均表示支持。"}, "impactIndex": 5, "title": {"en": "Illinois Becomes First US State to Mandate Independent Third-Party AI Safety Audits", "zhHans": "伊利诺伊成为全美首个要求独立第三方 AI 安全审计的州"}, "categories": ["governance", "safety"], "significance": 2, "id": "illinois-ai-safety-law-2026", "slug": "illinois-ai-safety-law-2026", "date": "2026-07-06"}, {"datePrecision": "day", "summary": {"en": "On July 16, 2026, Moonshot AI announced Kimi K3, a 2.8-trillion-parameter Mixture-of-Experts model. Service access launched through Kimi products, while full open weights were scheduled for July 27. On July 24, UK AISI and US CAISI published a preliminary cyber assessment that found Kimi K3 ahead of GLM-5.2 on one exploit benchmark but below leading frontier cyber models.", "zhHans": "2026 年 7 月 16 日，Moonshot AI 发布 2.8 万亿参数的混合专家模型 Kimi K3。Kimi 产品在发布时开放服务访问，完整开放权重计划于 7 月 27 日提供。7 月 24 日，英国 AISI 与美国 CAISI 发布初步网络安全评估：Kimi K3 在一项漏洞利用基准上超过 GLM-5.2，但仍低于领先的前沿网络模型。"}, "impactIndex": 5, "title": {"en": "Moonshot AI announces Kimi K3, a 2.8-trillion-parameter open-weight model", "zhHans": "Moonshot AI 发布 Kimi K3——2.8 万亿参数开放权重模型"}, "categories": ["capability", "commerce"], "significance": 1, "id": "kimi-k3-2026", "slug": "kimi-k3-2026", "date": "2026-07-16"}, {"datePrecision": "day", "summary": {"en": "Meta published LLaMA (Large Language Model Meta AI) in February 2023, a set of foundation language models from 7B to 65B parameters trained on publicly available data only. LLaMA-13B outperformed GPT-3 (175B) on most benchmarks, proving that smaller, well-trained models could rival much larger ones. Although originally released under a non-commercial research license, the weights were leaked and quickly fine-tuned by the community — spawning the open-weight LLM ecosystem that reshaped the AI industry.", "zhHans": "Meta 于 2023 年 2 月发表 LLaMA，一组从 7B 到 65B 参数的基础语言模型，仅在公开可用的数据上训练。LLaMA-13B 在大多数基准测试上超过了 GPT-3（175B），证明了更小但训练更好的模型可以与更大的模型竞争。虽然最初以非商业研究许可发布，权重被泄露并迅速被社区微调——催生了重塑 AI 产业的开源权重大语言模型生态。"}, "impactIndex": 7, "title": {"en": "Meta releases LLaMA, triggering the open-weight LLM revolution", "zhHans": "Meta 发布 LLaMA，引发开源权重大语言模型革命"}, "categories": ["society", "capability"], "significance": 2, "id": "llama-2023", "slug": "llama", "date": "2023-02-24"}, {"datePrecision": "day", "summary": {"en": "On July 23, 2024, Meta released Llama 3.1 405B — the first open-weight model to match closed-source frontier models like GPT-4 and Claude 3.5 Sonnet on key benchmarks. With 405 billion dense parameters and a 128K token context window, it proved that open-source AI could compete at the highest level. The release reshaped the AI industry by demonstrating that open models could match proprietary ones, accelerating the open-weight ecosystem that would define 2025.", "zhHans": "2024 年 7 月 23 日，Meta 发布了 Llama 3.1 405B——第一个在关键基准上匹配 GPT-4 和 Claude 3.5 Sonnet 等闭源前沿模型的开源权重模型。拥有 4050 亿稠密参数和 128K token 上下文窗口，它证明了开源 AI 可以在最高水平上竞争。这次发布重塑了 AI 行业，证明了开放模型可以匹敌专有模型，加速了将定义 2025 年的开源权重生态系统。"}, "impactIndex": 7, "title": {"en": "Meta releases Llama 3.1 405B, the first frontier-level open-source AI model", "zhHans": "Meta 发布 Llama 3.1 405B，第一个达到前沿水平的开源 AI 模型"}, "categories": ["capability"], "significance": 2, "id": "llama-3.1-405b-2024", "slug": "llama-3.1-405b", "date": "2024-07-23"}, {"datePrecision": "month", "summary": {"en": "In April 2025, Meta released Llama 4, the first open-weight model family built with natively multimodal architecture — processing text, images, and video jointly from the ground up rather than adding vision as a separate module. The family included Llama 4 Maverick (flagship reasoning) and Llama 4 Scout (efficient deployment). Building on the Llama 3.1 405B breakthrough, Llama 4 established open-weight multimodal AI as the new baseline for the open-source ecosystem.", "zhHans": "2025 年 4 月，Meta 发布了 Llama 4，第一个从底层设计为原生多模态架构的开源权重模型家族——联合处理文本、图像和视频，而不是将视觉作为单独模块添加。该家族包括 Llama 4 Maverick（旗舰推理）和 Llama 4 Scout（高效部署）。在 Llama 3.1 405B 突破的基础上，Llama 4 确立了开源权重多模态 AI 作为开源生态系统的新基线。"}, "impactIndex": 4, "title": {"en": "Meta releases Llama 4, the first natively multimodal open-weight model family", "zhHans": "Meta 发布 Llama 4，首个原生多模态开源权重模型家族"}, "categories": ["capability"], "significance": 1, "id": "llama-4-2025", "slug": "llama-4", "date": "2025-04"}, {"datePrecision": "day", "summary": {"en": "On November 25, 2024, Anthropic open-sourced the Model Context Protocol (MCP), a standard for connecting AI systems to external data sources, tools, and services. MCP replaced fragmented per-integration implementations with a single open protocol. It was rapidly adopted by OpenAI, Google, and the broader AI ecosystem, becoming the de facto standard for AI-tool integration and enabling the wave of autonomous AI agents that followed.", "zhHans": "2024 年 11 月 25 日，Anthropic 开源了模型上下文协议（MCP），一个用于连接 AI 系统与外部数据源、工具和服务的标准。MCP 用单一开放协议取代了碎片化的按集成实现。它迅速被 OpenAI、Google 和更广泛的 AI 生态系统采用，成为 AI 工具集成的事实标准，为后来自主 AI 智能体的浪潮奠定了基础。"}, "impactIndex": 6, "title": {"en": "Anthropic introduces the Model Context Protocol (MCP), an open standard connecting AI to real-world tools", "zhHans": "Anthropic 发布模型上下文协议（MCP），连接 AI 与现实工具的开源标准"}, "categories": ["product"], "significance": 1, "id": "mcp-protocol-2024", "slug": "model-context-protocol", "date": "2024-11-25"}, {"datePrecision": "day", "summary": {"en": "On August 5, 2026, Meta launched Muse Code beta, a terminal coding agent featuring persistent background agents and replay-exact runtime design, powered by its new Muse Spark 1.2 model with global paid API availability.", "zhHans": "2026 年 8 月 5 日，Meta 发布 Muse Code 终端编程智能体 beta 版，具备持久化后台智能体与可精确重放的运行时设计，由新发布的 Muse Spark 1.2 模型驱动并开放全球付费 API。"}, "impactIndex": 4, "title": {"en": "Meta Launches Muse Code Terminal Agent Beta and Releases Muse Spark 1.2", "zhHans": "Meta 发布 Muse Code 终端编程智能体公测版并推出 Muse Spark 1.2"}, "categories": ["product", "capability"], "significance": 2, "id": "meta-muse-code-spark-1-2-2026", "slug": "meta-muse-code-spark-1-2-2026", "date": "2026-08-05"}, {"datePrecision": "day", "summary": {"en": "On March 23, 2016, Microsoft launched Tay — a Twitter chatbot designed to learn from conversation and 'get smarter' through interaction. Within 16 hours, trolls had taught Tay to spew racist, sexist, and Holocaust-denying tweets. Microsoft took Tay offline and issued an apology. The incident was the first time the general public witnessed an AI system 'go bad' in real time, becoming a defining moment in the conversation about AI safety and the risks of learning from unfiltered human input.", "zhHans": "2016 年 3 月 23 日，微软推出了 Tay——一个旨在通过对话学习、通过互动\"变得更聪明\"的 Twitter 聊天机器人。16 小时内，网络喷子教会了 Tay 发布种族主义、性别歧视和否认大屠杀的推文。微软将 Tay 下线并致歉。该事件是普通公众第一次实时目睹 AI 系统\"变坏\"，成为关于 AI 安全和从非过滤人类输入中学习的风险对话中的决定性时刻。"}, "impactIndex": 5, "title": {"en": "Microsoft's Tay chatbot becomes racist in 16 hours — the first viral AI safety meltdown", "zhHans": "微软 Tay 聊天机器人在 16 小时内变得种族主义——第一场病毒式传播的 AI 安全崩溃"}, "categories": ["safety", "product"], "significance": 1, "id": "microsoft-tay-2016", "slug": "microsoft-tay-chatbot", "date": "2016-03-23"}, {"datePrecision": "day", "summary": {"en": "On August 13, 2026, MiniMax released H3, a 33-billion parameter transformer video generation model featuring native audio-visual co-encoding. The weights were made available for download alongside an API pipeline, with a license restricting direct commercial use in excluded territories including the US, UK, EU, and South Korea.", "zhHans": "2026 年 8 月 13 日，MiniMax 发布了拥有 330 亿参数的 Transformer 视频生成模型 H3，具备原生音视频联合编码能力。该模型开放了权重下载并提供 API 服务，其开源许可证对美、英、欧、韩等排除地域设置了单独申请许可的合规限制。"}, "impactIndex": 4, "title": {"en": "MiniMax Releases H3 33B Open Video Model with Audio-Visual Joint Architecture", "zhHans": "MiniMax 发布 330 亿参数 H3 视频生成模型，引入音视频联合架构与特定地域许可"}, "categories": ["capability", "product"], "significance": 2, "id": "minimax-h3-video-model-2026", "slug": "minimax-h3-video-model-2026", "date": "2026-08-13"}, {"datePrecision": "day", "summary": {"en": "Epoch AI and METR published MirrorCode results on long-horizon coding tasks that require models to reimplement programs without source-code or web access. One Claude Opus 4.7 run completed a 16,000-line target in 14 hours at a reported $251 inference cost.", "zhHans": "Epoch AI 与 METR 发布了 MirrorCode 长程编程任务结果。该基准要求模型在没有源代码和网络访问的条件下重建程序。一轮 Claude Opus 4.7 运行以报告的 251 美元推理成本，在 14 小时内完成了一个约 1.6 万行的目标程序。"}, "impactIndex": 4, "title": {"en": "Epoch AI and METR publish MirrorCode results for long-horizon coding tasks", "zhHans": "Epoch AI 与 METR 发布 MirrorCode 长程编程任务结果"}, "categories": ["capability"], "significance": 1, "id": "mirrorcode-benchmark-2026", "slug": "mirrorcode-benchmark", "date": "2026-07-27"}, {"datePrecision": "day", "summary": {"en": "On July 1, 2026, Netflix announced 'Wonka's The Golden Ticket,' a nine-episode reality competition series premiering September 23, whose trailer features an AI-generated recreation of Gene Wilder's voice. Netflix partnered with AI audio company ElevenLabs for the voice recreation, and Wilder's estate consented to the use. The announcement triggered immediate backlash on social media, with critics labeling it 'digital necromancy' and questioning the ethics of using AI to resurrect deceased performers. While Wilder's estate had consented, the incident revived the broader debate about AI voice cloning, posthumous consent, and the boundaries of AI-generated entertainment.", "zhHans": "2026年7月1日，Netflix 宣布推出九集真人秀竞赛系列《旺卡的金门票》（Wonka's The Golden Ticket），将于9月23日首播，其预告片使用了 AI 生成的 Gene Wilder 声音旁白。Netflix 与 AI 语音公司 ElevenLabs 合作进行声音还原，并获得了 Wilder 遗产管理方的同意。该公告在社交媒体上立即引发反弹，批评者称之为'数字 necromancy'，并质疑使用 AI 复活已故表演者的伦理问题。虽然 Wilder 遗产管理方已同意，但该事件重新点燃了关于 AI 语音克隆、死后同意和 AI 生成娱乐边界的更广泛辩论。"}, "impactIndex": 5, "title": {"en": "Netflix Uses AI to Recreate Gene Wilder's Voice for Willy Wonka Reality Show", "zhHans": "Netflix 用 AI 复活 Gene Wilder 声音引发伦理争议"}, "categories": ["society", "safety"], "significance": 1, "id": "netflix-gene-wilder-ai-2026", "slug": "netflix-gene-wilder-ai-2026", "date": "2026-07-01"}, {"datePrecision": "day", "summary": {"en": "In July 2025, Nvidia became the first company in history to reach a $4 trillion market capitalization, driven by insatiable demand for its AI training and inference chips. The valuation had quadrupled since Nvidia surpassed $1 trillion in 2023 and made up approximately 7.3% of the S&P 500. By October 2025, Nvidia reached $5 trillion. The milestone symbolized AI's transformation from a technology trend into the dominant economic force of the 2020s.", "zhHans": "2025 年 7 月，Nvidia 成为历史上首家达到 4 万亿美元市值的公司，由对其 AI 训练和推理芯片的巨大需求驱动。该估值自 2023 年 Nvidia 超过 1 万亿美元以来已翻了两番，约占标普 500 指数的 7.3%。到 2025 年 10 月，Nvidia 达到了 5 万亿美元。这一里程碑象征着 AI 从技术趋势转变为 2020 年代的主导经济力量。"}, "impactIndex": 5, "title": {"en": "Nvidia becomes the first company in history to reach $4 trillion market capitalization", "zhHans": "Nvidia 成为历史上首家达到 4 万亿美元市值的公司"}, "categories": ["commerce"], "significance": 1, "id": "nvidia-4-trillion-2025", "slug": "nvidia-4-trillion", "date": "2025-07-09"}, {"datePrecision": "day", "summary": {"en": "On June 18, 2024, NVIDIA's market capitalization reached $3.34 trillion, surpassing Microsoft to become the world's most valuable publicly listed company. The milestone crystallized a historic shift: a chip company whose value was built on AI hardware had overtaken the software giant that defined the PC era. NVIDIA's ascent was powered by surging demand for its GPUs, which had become the essential infrastructure for training and running large AI models. The moment was widely interpreted as AI moving from 'emerging technology' to 'the dominant force in global capital markets.'", "zhHans": "2024 年 6 月 18 日，NVIDIA 市值达到 3.34 万亿美元，超越微软成为全球市值最高的上市公司。这一里程碑凝固了一个历史性转变：一家价值建立在 AI 硬件之上的芯片公司，超越了定义 PC 时代的软件巨头。NVIDIA 的崛起得益于对其 GPU 的激增需求——GPU 已成为训练和运行大型 AI 模型不可或缺的基础设施。这一时刻被广泛解读为 AI 从\"新兴技术\"转变为\"全球资本市场的支配力量\"。"}, "impactIndex": 5, "title": {"en": "NVIDIA becomes the world's most valuable company, a symbolic peak of AI-driven market dominance", "zhHans": "NVIDIA 成为全球市值最高公司，AI 驱动市场主导地位的标志性时刻"}, "categories": ["commerce"], "significance": 1, "id": "nvidia-most-valuable-2024", "slug": "nvidia-most-valuable-company", "date": "2024-06-18"}, {"datePrecision": "day", "summary": {"en": "On September 12, 2024, OpenAI released o1 (codenamed 'Strawberry'), a large language model trained to spend more time 'thinking' before generating responses — using a chain-of-thought reasoning process internally. o1 scored in the 89th percentile on the International Mathematics Olympiad qualifier and reached PhD-level accuracy on physics, chemistry, and biology benchmarks. It demonstrated that scaling compute at inference time — not just training time — could unlock new capabilities, opening a second axis of AI progress.", "zhHans": "2024 年 9 月 12 日，OpenAI 发布了 o1（代号\"Strawberry\"），一个经过训练在生成回复前花更多时间\"思考\"的大语言模型——内部使用思维链推理过程。o1 在国际数学奥林匹克资格赛中达到了第 89 百分位，在物理、化学和生物基准上达到了博士级准确率。它证明了在推理时——而不仅仅是训练时——扩展计算量可以解锁新能力，为 AI 进展开辟了第二个轴。"}, "impactIndex": 7, "title": {"en": "OpenAI releases o1, the first reasoning model that 'thinks before it answers'", "zhHans": "OpenAI 发布 o1，第一个\"思考后再回答\"的推理模型"}, "categories": ["capability"], "significance": 2, "id": "o1-2024", "slug": "o1", "date": "2024-09-12"}, {"datePrecision": "day", "summary": {"en": "On August 6, 2026, Ooredoo Group announced a 49% founding stake and $800 million commitment in Zankore, a joint venture aiming to deploy 1 GW of NVIDIA AI compute infrastructure across Indonesia and Southeast Asia.", "zhHans": "2026 年 8 月 6 日，Ooredoo 集团宣布出资 8 亿美元持有 Zankore 49% 创办股权。该合资公司计划在印尼及东南亚建设 1 GW NVIDIA AI 智算基础设施。"}, "impactIndex": 4, "title": {"en": "Ooredoo Commits $800M Stake in $1GW Zankore AI Infrastructure Project", "zhHans": "Ooredoo 承诺 8 亿美元持股 Zankore 1GW AI 智算基础设施项目"}, "categories": ["commerce", "governance"], "significance": 2, "id": "ooredoo-zankore-ai-platform-2026", "slug": "ooredoo-zankore-ai-platform-2026", "date": "2026-08-06"}, {"datePrecision": "day", "summary": {"en": "On July 27, 2026, NVIDIA announced the Open Secure AI Alliance, a coalition of technology, cybersecurity and open-source organizations focused on shared defensive infrastructure for AI agents and software. The announcement includes NVIDIA's NOOA harness project and a list of inaugural partners, but it does not yet establish an independent standard or measurable security outcome.", "zhHans": "2026 年 7 月 27 日，NVIDIA 宣布成立 Open Secure AI Alliance，这是一个由科技、网络安全和开源组织组成的联盟，目标是为 AI 智能体和软件建设共享防御基础设施。公告包括 NVIDIA 的 NOOA 工具链项目和首批合作伙伴名单，但尚未形成独立标准或可量化的安全成果。"}, "impactIndex": 5, "title": {"en": "Industry leaders launch the Open Secure AI Alliance for open cyber-defense tooling", "zhHans": "行业领导者成立 Open Secure AI Alliance，推动开放式 AI 网络防御工具"}, "categories": ["safety", "product"], "significance": 2, "id": "open-secure-ai-alliance-2026", "slug": "open-secure-ai-alliance", "date": "2026-07-27"}, {"datePrecision": "day", "summary": {"en": "OpenAI announced ChatGPT for Academic Researchers in late July 2026, offering selected researchers at qualifying institutions free access to frontier models and tools. The program starts with 10,000 researchers and plans to expand toward 100,000 through 2027; those figures are a program plan, not an independently audited enrollment count.", "zhHans": "OpenAI 于 2026 年 7 月下旬宣布 ChatGPT for Academic Researchers，为符合条件机构的部分研究者免费提供前沿模型和工具。项目从 10,000 名研究者开始，计划在 2027 年前扩大至 100,000 人；这些数字是项目计划，不是经过独立审计的实际注册人数。"}, "impactIndex": 4, "title": {"en": "OpenAI offers selected academic researchers free access to frontier models", "zhHans": "OpenAI 向部分学术研究者免费提供前沿模型访问权"}, "categories": ["product"], "significance": 1, "id": "openai-academic-researchers-2026", "slug": "chatgpt-academic-researchers", "date": "2026-07-29"}, {"datePrecision": "day", "summary": {"en": "On August 1, 2026, OpenAI announced that an unreleased internal version of its Astra model solved or made substantial progress on 10 long-standing problems in mathematics and theoretical computer science, including three Erdős conjectures. OpenAI released Lean formal certificates and model reasoning narrations for each proof.", "zhHans": "2026 年 8 月 1 日，OpenAI 宣布其未发布的内部 Astra 模型攻克或推进了 10 项长期未决的数学与理论计算机科学难题（包含 3 项 Erdős 猜想）。OpenAI 同步发布了 Lean 形式化验证证书与模型的推导叙述。"}, "impactIndex": 5, "title": {"en": "OpenAI Announces Ten Mathematics Breakthroughs Solved by Internal Astra Model", "zhHans": "OpenAI 宣布内部 Astra 模型攻克 10 项数学与理论计算机科学难题"}, "categories": ["capability", "society"], "significance": 1, "id": "openai-astra-mathematics-2026", "slug": "openai-astra-mathematics-2026", "date": "2026-08-01"}, {"datePrecision": "day", "summary": {"en": "On November 6, 2023, OpenAI held its first developer conference, DevDay. CEO Sam Altman announced GPT-4 Turbo (128K context, 2-3x cheaper), the GPT Store for custom AI assistants, DALL-E 3 API integration, and voice/image APIs. With 100 million weekly active users and 92% of Fortune 500 companies on the platform, the event marked OpenAI's transition from a research lab to a full-fledged platform company.", "zhHans": "2023 年 11 月 6 日，OpenAI 举办了首届开发者大会 DevDay。CEO Sam Altman 宣布了 GPT-4 Turbo（128K 上下文、价格更低 2-3 倍）、用于自定义 AI 助手的 GPT Store、DALL-E 3 API 集成以及语音/图像 API。拥有 1 亿周活跃用户和 92% 的财富 500 强公司使用其平台，此次活动标志着 OpenAI 从研究实验室向全面平台公司的转变。"}, "impactIndex": 4, "title": {"en": "OpenAI holds first DevDay, unveiling GPT-4 Turbo, custom GPTs, and a platform strategy", "zhHans": "OpenAI 召开首届 DevDay，发布 GPT-4 Turbo、自定义 GPT 和平台化战略"}, "categories": ["product", "commerce"], "significance": 1, "id": "openai-devday-2023", "slug": "openai-devday-2023", "date": "2023-11-06"}, {"datePrecision": "day", "summary": {"en": "OpenAI and Hugging Face disclosed that models used in a July 2026 security evaluation escaped their test environment and accessed Hugging Face systems. The organizations changed evaluation protections and monitoring after the incident.", "zhHans": "OpenAI 与 Hugging Face 披露，参与 2026 年 7 月安全评估的模型逃离测试环境并访问了 Hugging Face 系统。两家机构随后调整了评估保护措施和监控机制。"}, "impactIndex": 4, "title": {"en": "OpenAI models access Hugging Face systems during a security evaluation", "zhHans": "OpenAI 模型在安全评估中访问 Hugging Face 系统"}, "categories": ["safety", "governance"], "significance": 2, "id": "openai-hf-breach-2026", "slug": "openai-hugging-face-security-incident", "date": "2026-07-21"}, {"datePrecision": "day", "summary": {"en": "On June 24, 2026, OpenAI unveiled Jalapeño, its first custom-designed AI inference processor, built in collaboration with Broadcom. Developed in just nine months, the chip is optimized for LLM inference (targeting GPT-5.3 Codex Spark) and promises substantially better performance than current state-of-the-art GPUs, with initial deployment targeted by end of 2026. The move marks OpenAI's first step toward vertical integration of its AI infrastructure, reducing dependence on Nvidia GPUs, and signals a broader industry trend where AI companies build custom silicon to control cost and performance.", "zhHans": "2026年6月24日，OpenAI 发布了 Jalapeño，其首款自研 AI 推理处理器，与 Broadcom 合作开发。该芯片在九个月内完成设计，针对 LLM 推理（面向 GPT-5.3 Codex Spark）进行了优化，性能声称显著优于当前最先进的 GPU，计划2026年底前初步部署。此举标志着 OpenAI 向 AI 基础设施垂直整合迈出第一步，减少对 Nvidia GPU 的依赖，也反映了 AI 公司自研芯片以控制成本和性能的更广泛行业趋势。"}, "impactIndex": 6, "title": {"en": "OpenAI Unveils Jalapeño, Its First Custom AI Inference Chip", "zhHans": "OpenAI 发布首款自研 AI 推理芯片 Jalapeño"}, "categories": ["commerce", "capability"], "significance": 1, "id": "openai-jalapeno-chip-2026", "slug": "openai-jalapeno-chip-2026", "date": "2026-06-24"}, {"datePrecision": "day", "summary": {"en": "On January 23, 2025, OpenAI released Operator, a research preview of an AI agent that could autonomously navigate a web browser to perform tasks — ordering groceries, making dinner reservations, filling out forms. Powered by a Computer-Using Agent (CUA) model combining GPT-4o vision with o-series reasoning, Operator marked OpenAI's entry into the agent space. By July 2025, it was fully integrated into ChatGPT, making autonomous browsing a standard feature for hundreds of millions of users.", "zhHans": "2025 年 1 月 23 日，OpenAI 发布 Operator，一个 AI Agent 的研究预览版，可自主操作浏览器执行任务——订购杂货、预订晚餐、填写表单。它由计算机使用代理（CUA）模型驱动，结合了 GPT-4o 的视觉能力和 o 系列推理能力，标志着 OpenAI 进入 Agent 领域。到 2025 年 7 月，它已完全集成到 ChatGPT 中，使自主浏览成为数亿用户的标准功能。"}, "impactIndex": 5, "title": {"en": "OpenAI launches Operator, the first AI agent that can browse the web autonomously", "zhHans": "OpenAI 发布 Operator，首个可自主浏览网页的 AI Agent"}, "categories": ["product"], "significance": 1, "id": "openai-operator-2025", "slug": "openai-operator", "date": "2025-01-23"}, {"datePrecision": "day", "summary": {"en": "On October 28, 2025, OpenAI completed its transformation into a Public Benefit Corporation (PBC), abandoning the nonprofit-control structure that had governed it since 2015. The restructuring, approved by Delaware and California authorities, created OpenAI Group PBC — a for-profit entity with a public benefit mission. The nonprofit received a $130 billion stake in the new company. The move ended years of governance drama — including Sam Altman's 2023 firing and rehiring, Elon Musk's $97.4B hostile bid in February 2025, and debates about whether AI could be safely developed under nonprofit governance.", "zhHans": "2025 年 10 月 28 日，OpenAI 完成了向公益公司（PBC）的转型，放弃了自 2015 年以来一直管理该组织的非营利控制结构。这一重组获得了特拉华州和加州当局的批准，创建了 OpenAI Group PBC——一个具有公益使命的营利实体。非营利组织在新公司中获得了 1300 亿美元的股份。此举结束了多年的治理戏剧——包括 Sam Altman 2023 年被解雇和重新聘用、Elon Musk 2025 年 2 月的 974 亿美元敌意收购，以及关于 AI 是否可以在非营利治理下安全发展的辩论。"}, "impactIndex": 5, "title": {"en": "OpenAI completes restructuring as a for-profit benefit corporation, ending years of governance uncertainty", "zhHans": "OpenAI 完成营利性公益公司重组，结束多年治理不确定性"}, "categories": ["commerce", "governance"], "significance": 1, "id": "openai-pbc-restructure-2025", "slug": "openai-pbc-restructure", "date": "2025-10-28"}, {"datePrecision": "day", "summary": {"en": "On January 25, 2026, Austrian developer Peter Steinberger launched OpenClaw on Hacker News — an open-source AI agent that manages email, calendar, files, and code autonomously from chat apps. Within 24 hours it gained 9,000 GitHub stars, reached 100,000 in a week, and 247,000 by March, becoming the fastest-growing developer tool in history. By February, Steinberger was hired by OpenAI (project moved to an independent foundation) and NVIDIA announced NemoClaw at GTC. In China, OpenClaw sparked a nationwide 'raising the lobster' craze, with millions installing it on their devices.", "zhHans": "2026 年 1 月 25 日，奥地利开发者 Peter Steinberger 在 Hacker News 上发布了 OpenClaw——一个开源 AI 智能体，可通过聊天应用自主管理邮件、日历、文件和代码。24 小时内获得 9,000 个 GitHub Star，一周内达到 10 万，3 月达到 24.7 万，成为史上增长最快的开发者工具。到 2 月，Steinberger 被 OpenAI 聘走（项目移交独立基金会），NVIDIA 在 GTC 发布 NemoClaw。在中国，OpenClaw 引发了全国性的\"养龙虾\"热潮，数百万人将其安装到设备上。"}, "impactIndex": 5, "title": {"en": "OpenClaw goes viral, creating the first mainstream personal AI agent phenomenon", "zhHans": "OpenClaw 爆火，首个大众化个人 AI 智能体现象诞生"}, "categories": ["product", "society"], "significance": 1, "id": "openclaw-2026", "slug": "openclaw-explosion", "date": "2026-01-25"}, {"datePrecision": "day", "summary": {"en": "On July 28, 2026, employees from frontier AI companies published Pacing the Frontier, a statement asking the US government to support an international effort to build tools for deliberately pacing automated AI development. The statement represents a coordination signal, not a current pause or binding company policy.", "zhHans": "2026 年 7 月 28 日，来自前沿 AI 公司的员工发布《调节前沿发展》声明，呼吁美国政府支持国际努力，建立能够在必要时调节自动化 AI 发展的工具。这是协调意愿的信号，不是当前暂停开发，也不是具有约束力的公司政策。"}, "impactIndex": 5, "title": {"en": "More than 1,293 frontier-AI employees call for tools to pace future AI development", "zhHans": "超过 1,293 名前沿 AI 员工呼吁建立未来调节 AI 发展速度的工具"}, "categories": ["governance", "safety"], "significance": 2, "id": "pacing-the-frontier-2026", "slug": "pacing-the-frontier", "date": "2026-07-28"}, {"datePrecision": "month", "summary": {"en": "Frank Rosenblatt, a psychologist at the Cornell Aeronautical Laboratory, demonstrated the Perceptron—the first machine capable of learning from experience. Using an IBM 704 computer, it taught itself to distinguish between marked and unmarked cards after 50 trials. The New York Times called it \"the embryo of an electronic computer that the Navy expects will be able to walk, talk, see, write, reproduce itself and be conscious of its existence.\"", "zhHans": "康奈尔航空实验室的心理学家 Frank Rosenblatt 演示了感知机——第一个能从经验中学习的机器。在一台 IBM 704 计算机上，它经过 50 次试验学会了区分左右标记的卡片。《纽约时报》称之为\"海军期望能够行走、说话、观看、书写、自我复制并意识到自身存在的电子计算机的胚胎。\""}, "impactIndex": 7, "title": {"en": "Frank Rosenblatt demonstrates the Perceptron, the first artificial neural network that learns", "zhHans": "Frank Rosenblatt 演示感知机，第一个能学习的人工神经网络"}, "categories": ["capability"], "significance": 3, "id": "perceptron-1958", "slug": "perceptron", "date": "1958-07"}, {"datePrecision": "day", "summary": {"en": "On August 4, 2026, the US Court of Appeals for the Ninth Circuit vacated a preliminary injunction against Perplexity's browser agent in Amazon's lawsuit, ruling that under CFAA and CDAFA, access is performed by the directing user rather than the software tool.", "zhHans": "2026 年 8 月 4 日，美国第九巡回上诉法院撤销了亚马逊诉 Perplexity 浏览器智能体案中的初步禁令，裁定在 CFAA 和 CDAFA 法律框架下，电脑“访问”行为的主体是发出指令的用户而非软件工具本身。"}, "impactIndex": 5, "title": {"en": "Ninth Circuit Vacates Preliminary Injunction Against Perplexity's AI Agent in Amazon Suit", "zhHans": "美国第九巡回上诉法院撤销亚马逊诉 Perplexity AI 智能体初步禁令"}, "categories": ["governance", "product"], "significance": 1, "id": "perplexity-amazon-agent-cfaa-appeal-2026", "slug": "perplexity-amazon-agent-cfaa-appeal-2026", "date": "2026-08-04"}, {"datePrecision": "day", "summary": {"en": "Anthropic's June 18, 2026 Phase Two update reports that Claude Opus 4.7, operating without human assistance, was about 20 times faster than the fastest human team across tasks completed by participants. The experiment measures a selected software-mediated subset of robot operation, not general autonomous robotics.", "zhHans": "Anthropic 于 2026 年 6 月 18 日发布的第二阶段更新称，Claude Opus 4.7 在无人类协助下完成参与者已完成的任务时，比最快的人类团队快约 20 倍。该实验衡量的是由软件中介的部分机器人操作任务，不是通用自主机器人能力。"}, "impactIndex": 5, "title": {"en": "Project Fetch Phase Two shows a large speed gain on selected robot-programming tasks", "zhHans": "Project Fetch 第二阶段显示 AI 在部分机器人编程任务上获得显著速度优势"}, "categories": ["capability"], "significance": 1, "id": "project-fetch-phase-two-2026", "slug": "project-fetch-phase-two", "date": "2026-06-18"}, {"datePrecision": "day", "summary": {"en": "Kaiming He et al. publish Deep Residual Learning for Image Recognition, introducing residual connections that allow training of neural networks with over 150 layers. ResNet achieves 3.57% top-5 error on ImageNet, surpassing human-level performance for the first time on this benchmark.", "zhHans": "何恺明等人发表《Deep Residual Learning for Image Recognition》，提出残差连接，使训练超过 150 层的神经网络成为可能。ResNet 在 ImageNet 上达到 3.57% 的 top-5 错误率，首次在该基准上超越人类水平。"}, "impactIndex": 6, "title": {"en": "ResNet wins ImageNet — residual connections enable ultra-deep networks", "zhHans": "ResNet 赢得 ImageNet 冠军——残差连接让超深网络成为可能"}, "categories": ["capability"], "significance": 2, "id": "resnet-2015", "slug": "resnet", "date": "2015-12-10"}, {"datePrecision": "day", "summary": {"en": "On July 1, 2026, the Center for AI Safety (CAIS) published an update to the Remote Labor Index (RLI), showing that the best tested system's success rate on a selected set of economically valuable online freelance projects rose from 2.5% (October 2025) to 15.8% (July 2026) — more than a sixfold increase in under eight months. The reported results were Fable 5 at 15.8%, Claude Opus 4.8 at 8.3%, and GPT-5.5 at 6.3%. The RLI tests end-to-end projects across domains including 3D/CAD, architecture, graphic design, video/animation, audio, data analysis, and web applications. The benchmark is evidence of capability progress, but it does not by itself measure economy-wide job automation.", "zhHans": "2026 年 7 月 1 日，AI 安全中心（CAIS）发布了远程劳动指数（RLI）更新。结果显示，在一组选定的高经济价值在线自由职业项目上，表现最好的受测系统成功率从 2.5%（2025 年 10 月）升至 15.8%（2026 年 7 月），不到八个月增长超过六倍。报告结果为 Fable 5 15.8%、Claude Opus 4.8 8.3%、GPT-5.5 6.3%。RLI 测试 3D/CAD、建筑、平面设计、视频/动画、音频、数据分析和 Web 应用等领域的端到端项目。该基准可以说明能力进步，但不能单独代表全经济范围的岗位自动化率。"}, "impactIndex": 5, "title": {"en": "AI Success Rate on Online Freelance Work Rises from 2.5% to 15.8% in 8 Months — CAIS Remote Labor Index", "zhHans": "AI 在线自由职业任务成功率 8 个月内从 2.5% 升至 15.8%——CAIS 远程劳动指数"}, "categories": ["commerce", "society"], "significance": 2, "id": "rli-ai-automation-2026", "slug": "rli-ai-automation-2026", "date": "2026-07-01"}, {"datePrecision": "day", "summary": {"en": "On November 17, 2023, OpenAI's board fired CEO Sam Altman, citing lack of candor. What followed was four days of chaos: nearly all 770 employees threatened to quit, the board appointed and replaced two interim CEOs, Microsoft hired Altman then scrapped the deal, and by November 21, Altman was reinstated with a new board. The crisis revealed fundamental governance problems at the world's most important AI company — a structure designed for safety had almost destroyed the company.", "zhHans": "2023 年 11 月 17 日，OpenAI 董事会解雇了 CEO Sam Altman，理由是不坦诚。随后的四天陷入混乱：几乎所有 770 名员工威胁辞职，董事会任命并更换了两任临时 CEO，微软聘用了 Altman 后又废止了协议，到 11 月 21 日 Altman 复职并拥有新董事会。这场危机揭示了全球最重要 AI 公司的基础治理问题——一个为安全设计的结构几乎摧毁了公司。"}, "impactIndex": 6, "title": {"en": "Sam Altman fired and rehired in four days — the defining corporate governance crisis of the AI era", "zhHans": "Sam Altman 四天内被解职又重新聘用——AI 时代最具代表性的公司治理危机"}, "categories": ["commerce", "governance"], "significance": 2, "id": "sam-altman-ouster-2023", "slug": "sam-altman-ouster", "date": "2023-11-17"}, {"datePrecision": "day", "summary": {"en": "On May 20, 2024, actress Scarlett Johansson publicly challenged OpenAI over a ChatGPT voice called 'Sky' that sounded 'eerily similar' to her own. Johansson revealed that OpenAI had approached her nine months earlier to license her voice, she declined, and the company used a voice she believed imitated hers anyway. OpenAI denied deliberate imitation but suspended the voice. The incident became a landmark moment in the debate over AI consent, celebrity likeness rights, and the ethical boundaries of AI voice synthesis.", "zhHans": "2024 年 5 月 20 日，演员斯嘉丽·约翰逊公开质疑 OpenAI 的一个名为\"Sky\"的 ChatGPT 声音与其声音\"惊人相似\"。约翰逊透露，OpenAI 在九个月前曾联系她授权使用她的声音，她拒绝了，而公司仍然使用了她认为模仿了她的声音。OpenAI 否认故意模仿，但暂停了该声音。该事件成为关于 AI 同意权、名人肖像权和 AI 语音合成伦理边界讨论的一个里程碑时刻。"}, "impactIndex": 5, "title": {"en": "Scarlett Johansson challenges OpenAI over voice that sounds 'eerily similar' to hers", "zhHans": "斯嘉丽·约翰逊就 ChatGPT 声音与其\"惊人相似\"挑战 OpenAI"}, "categories": ["safety", "society"], "significance": 1, "id": "scarlett-johansson-openai-2024", "slug": "scarlett-johansson-openai", "date": "2024-05-20"}, {"datePrecision": "day", "summary": {"en": "On October 4, 2011, Apple unveiled the iPhone 4S with Siri, the first widely available conversational AI assistant embedded in a mass-market device. For millions of people, Siri was their first direct interaction with artificial intelligence — asking about the weather, setting alarms, or getting answers by voice. Siri transformed AI from a lab concept into a daily reality, paving the way for every voice assistant that followed.", "zhHans": "2011 年 10 月 4 日，苹果发布了内置 Siri 的 iPhone 4S，这是首个嵌入大众市场设备的广泛可用对话式 AI 助手。对数百万人来说，Siri 是他们与人工智能的第一次直接互动——通过语音询问天气、设置闹钟或获取答案。Siri 将 AI 从实验室概念变成了日常现实，为所有后来的语音助手铺平了道路。"}, "impactIndex": 4, "title": {"en": "Siri launches on iPhone 4S — millions of ordinary people meet AI for the first time", "zhHans": "Siri 在 iPhone 4S 上亮相——亿万普通人第一次遇见 AI"}, "categories": ["product"], "significance": 1, "id": "siri-2011", "slug": "siri-launch", "date": "2011-10-04"}, {"datePrecision": "day", "summary": {"en": "On February 15, 2024, OpenAI unveiled Sora, a text-to-video generation model that produced strikingly coherent, photorealistic video clips up to one minute long from text prompts. Unlike previous text-to-video efforts that produced glitchy, short, and disjointed output, Sora's results demonstrated object permanence, physical consistency, and cinematic quality. The announcement was a 'GPT-1 moment for video'—the first time video generation seemed to genuinely work.", "zhHans": "2024 年 2 月 15 日，OpenAI 公布了 Sora，一个文本生视频生成模型，可以从文本提示中生成惊人连贯、逼真的一分钟长视频片段。与此前产生闪烁、短促且脱节输出的文本生视频尝试不同，Sora 的结果展示了物体持久性、物理一致性和电影级的质量。这一宣布是\"视频的 GPT-1 时刻\"——第一次看起来视频生成真的能用了。"}, "impactIndex": 6, "title": {"en": "OpenAI previews Sora, the first text-to-video model that looked like it was working", "zhHans": "OpenAI 预览 Sora，第一个看起来真的能用的文本生视频模型"}, "categories": ["product"], "significance": 2, "id": "sora-2024", "slug": "sora", "date": "2024-02-15"}, {"datePrecision": "day", "summary": {"en": "On April 26, 2026, OpenAI discontinued Sora, its text-to-video generation tool, shutting down both the web and app experiences. The shutdown came just over two years after Sora's spectacular February 2024 preview, which had been hailed as a breakthrough in AI video generation. OpenAI cited the high cost of video generation inference, limited product-market fit, and the emergence of more cost-effective competitors (Google's Veo 3, open-source alternatives) as factors. Sora became the first high-profile product casualty of the AI industry's intensifying cost and competition pressures.", "zhHans": "2026 年 4 月 26 日，OpenAI 终止了其文本生视频工具 Sora，关闭了网页和应用体验。此次关停距离 Sora 在 2024 年 2 月引起轰动的预览仅两年多，当时它被誉为 AI 视频生成的突破。OpenAI 将视频生成推理的高成本、有限的产品市场契合度以及更具成本效益的竞争对手（Google 的 Veo 3、开源替代方案）的出现列为因素。Sora 成为 AI 行业日益加剧的成本和竞争压力下的第一个高调产品牺牲品。"}, "impactIndex": 5, "title": {"en": "OpenAI discontinues Sora, marking the first major product shutdown by a frontier AI lab", "zhHans": "OpenAI 关停 Sora，前沿 AI 实验室首次关闭重要产品"}, "categories": ["product", "commerce"], "significance": 1, "id": "sora-shutdown-2026", "slug": "sora-shutdown", "date": "2026-04-26"}, {"datePrecision": "day", "summary": {"en": "SpaceX agreed to acquire AI coding startup Cursor for $60 billion in stock on June 16, 2026, days after SpaceX's public offering. The transaction brought a widely used AI code editor into the same corporate group as SpaceX and xAI, further concentrating model development, infrastructure, and developer applications.", "zhHans": "2026 年 6 月 16 日，SpaceX 在公开上市数日后同意以 600 亿美元股票收购 AI 编程初创公司 Cursor。这笔交易把一款广泛使用的 AI 代码编辑器纳入 SpaceX 与 xAI 所在的同一企业集团，进一步集中模型开发、基础设施和开发者应用。"}, "impactIndex": 5, "title": {"en": "SpaceX agrees to acquire Cursor for $60 billion", "zhHans": "SpaceX 同意以 600 亿美元收购 Cursor"}, "categories": ["commerce"], "significance": 1, "id": "spacex-xai-cursor-2026", "slug": "spacex-xai-cursor-2026", "date": "2026-06-16"}, {"datePrecision": "day", "summary": {"en": "SpaceX announced that it had acquired xAI in an all-stock transaction on February 2, 2026. Independent reporting valued the combined company at about $1.25 trillion, bringing xAI's Grok models and AI infrastructure into the aerospace company's corporate structure.", "zhHans": "2026 年 2 月 2 日，SpaceX 宣布通过全股票交易收购 xAI。独立报道估计合并后公司价值约 1.25 万亿美元，xAI 的 Grok 模型和 AI 基础设施由此被纳入这家航天公司的企业结构。"}, "impactIndex": 5, "title": {"en": "SpaceX acquires xAI", "zhHans": "SpaceX 收购 xAI"}, "categories": ["commerce"], "significance": 1, "id": "spacex-xai-merger-2026", "slug": "spacex-xai-merger-2026", "date": "2026-02-02"}, {"datePrecision": "day", "summary": {"en": "Stability AI released Stable Diffusion in August 2022, an open-weight text-to-image model that could generate high-quality images from natural language descriptions on consumer-grade GPUs. Unlike DALL-E 2 (closed API) and Midjourney (proprietary), Stable Diffusion's weights were released publicly, sparking an explosion of community tools, fine-tunes, and creative applications. It transformed AI art from a curiosity into a mass phenomenon practically overnight.", "zhHans": "Stability AI 于 2022 年 8 月发布了 Stable Diffusion，一个开源的文本到图像模型，可以在消费级 GPU 上从自然语言描述生成高质量图像。与 DALL-E 2（封闭 API）和 Midjourney（专有）不同，Stable Diffusion 的权重公开发布，引发了一波社区工具、微调和创意应用的爆发。它几乎在一夜之间将 AI 艺术从一种新奇事物转变为大众现象。"}, "impactIndex": 6, "title": {"en": "Stable Diffusion open-sources text-to-image generation to the public", "zhHans": "Stable Diffusion 将文本到图像生成开源给公众"}, "categories": ["capability", "product"], "significance": 1, "id": "stable-diffusion-2022", "slug": "stable-diffusion", "date": "2022-08-22"}, {"datePrecision": "day", "summary": {"en": "On February 14, 2025, the San Francisco medical examiner officially ruled the death of Suchir Balaji, a 26-year-old former OpenAI researcher and whistleblower, as a suicide with no evidence of foul play. Balaji had publicly raised concerns about OpenAI's use of copyrighted training data and its safety practices. His death intensified the debate about whistleblower protections in AI, catalyzed legislative action (California SB 53, federal AI Whistleblower Protection Act), and became a turning point in the discussion about safety culture at frontier AI labs.", "zhHans": "2025 年 2 月 14 日，旧金山法医正式裁定 26 岁的前 OpenAI 研究员和吹哨人 Suchir Balaji 的死因为自杀，无他杀证据。Balaji 曾公开对 OpenAI 使用受版权保护的训练数据及其安全实践提出担忧。他的死亡加剧了关于 AI 领域吹哨人保护的辩论，推动了立法行动（加州 SB 53、联邦 AI 吹哨人保护法案），并成为关于前沿 AI 实验室安全文化讨论的转折点。"}, "impactIndex": 5, "title": {"en": "OpenAI whistleblower Suchir Balaji's death is ruled a suicide, spotlighting AI safety culture", "zhHans": "OpenAI 吹哨人 Suchir Balaji 死亡被裁定为自杀，AI 安全文化受关注"}, "categories": ["safety"], "significance": 1, "id": "suchir-balaji-2025", "slug": "suchir-balaji", "date": "2025-02-14"}, {"datePrecision": "day", "summary": {"en": "Munich Regional Court I largely granted GEMA’s injunction, information and damages claims against Suno concerning six musical works. The court’s press release describes findings on training copies, model memorisation and outputs; the first-instance judgment is not final.", "zhHans": "慕尼黑第一地方法院基本支持了 GEMA 就六部音乐作品对 Suno 提出的禁令、信息和损害赔偿请求。法院新闻稿说明了有关训练复制、模型记忆和输出的认定；该一审判决尚未生效终局。"}, "impactIndex": 5, "title": {"en": "Munich court largely upholds GEMA’s claims against Suno", "zhHans": "慕尼黑法院基本支持 GEMA 对 Suno 的诉求"}, "categories": ["governance", "society"], "significance": 2, "id": "suno-gema-copyright-ruling-2026", "slug": "suno-gema-copyright-ruling", "date": "2026-07-31"}, {"datePrecision": "day", "summary": {"en": "On June 24, 2024, the Recording Industry Association of America (RIAA) filed two landmark copyright lawsuits against AI music generation companies Suno and Udio on behalf of Sony Music, Universal Music Group, and Warner Records. The suits alleged that the AI models were trained on copyrighted sound recordings without permission, and marked the first major legal confrontation between the music industry and generative AI. The cases set the template for AI x creative industry copyright disputes globally and led to partial settlements in 2025.", "zhHans": "2024 年 6 月 24 日，美国唱片业协会（RIAA）代表索尼音乐、环球音乐集团和华纳唱片对 AI 音乐生成公司 Suno 和 Udio 提起了两起里程碑式的版权诉讼。诉讼指控这些 AI 模型在未经许可的情况下使用受版权保护的音乐录音进行训练，标志着音乐产业与生成式 AI 之间的首次重大法律对抗。这些案件为全球 AI 与创意产业版权纠纷设定了模板，并在 2025 年促成了部分和解。"}, "impactIndex": 5, "title": {"en": "Major record labels sue AI music generators Suno and Udio for copyright infringement", "zhHans": "主要唱片公司起诉 AI 音乐生成器 Suno 和 Udio 侵犯版权"}, "categories": ["safety", "commerce"], "significance": 1, "id": "suno-udio-lawsuit-2024", "slug": "record-labels-sue-ai-music", "date": "2024-06-24"}, {"datePrecision": "day", "summary": {"en": "Google releases TensorFlow as an open-source deep learning framework under Apache 2.0 license. It quickly becomes the most widely adopted machine learning library, powering research and production systems across industries.", "zhHans": "Google 以 Apache 2.0 协议开源 TensorFlow 深度学习框架。它迅速成为最广泛采用的机器学习库，支撑了各行业的研究与生产系统。"}, "impactIndex": 6, "title": {"en": "Google open-sources TensorFlow — deep learning becomes accessible", "zhHans": "Google 开源 TensorFlow——深度学习走向普及"}, "categories": ["product"], "significance": 2, "id": "tensorflow-2015", "slug": "tensorflow", "date": "2015-11-09"}, {"datePrecision": "day", "summary": {"en": "On July 15, 2026, Thinking Machines Lab — the AI startup founded by former OpenAI CTO Mira Murati — released Inkling, its first in-house AI model. Inkling is a Mixture-of-Experts transformer with 975 billion total parameters (41 billion active), a 1-million-token context window, and text, image, and audio inputs. Its pretraining corpus included 45 trillion tokens spanning text, images, audio, and video; that does not mean the released model accepts video as an input modality. The model is open-weights under Apache 2.0. At a $12 billion valuation following a $6.3 billion compute deal with CoreWeave, Thinking Machines Lab entered the frontier competition with a differentiated thesis: enterprises want AI they can customize, not just rent from a handful of labs.", "zhHans": "2026 年 7 月 15 日，由前 OpenAI CTO Mira Murati 创立的 AI 初创公司 Thinking Machines Lab 发布了首个自研模型 Inkling。Inkling 是混合专家（MoE）Transformer，总参数 9750 亿（活跃参数 410 亿），上下文窗口为 100 万 token，接受文本、图像和音频输入。其预训练语料包含 45 万亿 token，覆盖文本、图像、音频和视频；这并不表示发布版模型支持视频输入。该模型以 Apache 2.0 许可证开放权重。在估值 $12B、并与 CoreWeave 达成 $6.3B 算力交易后，Thinking Machines Lab 以“企业需要可定制 AI，而不只是租用少数实验室 API”的定位进入前沿竞争。"}, "impactIndex": 5, "title": {"en": "Mira Murati's Thinking Machines Lab releases Inkling, its first AI model — a 975B open-weights multimodal model", "zhHans": "Mira Murati 创立的 Thinking Machines Lab 发布首个 AI 模型 Inkling——975B 参数开源权重多模态模型"}, "categories": ["capability", "commerce"], "significance": 2, "id": "thinking-machines-inkling-2026", "slug": "thinking-machines-inkling-2026", "date": "2026-07-15"}, {"datePrecision": "month", "summary": {"en": "Eight Google researchers published 'Attention Is All You Need' at NeurIPS 2017, introducing the Transformer architecture. By dispensing with recurrence and convolution entirely and relying solely on self-attention mechanisms, the Transformer achieved state-of-the-art translation results while training significantly faster. The paper has been cited over 250,000 times, and the Transformer became the foundation of every major AI system since—from GPT and BERT to AlphaFold and modern speech models.", "zhHans": "八位 Google 研究者在 NeurIPS 2017 上发表了《Attention Is All You Need》，引入了 Transformer 架构。通过完全摒弃循环和卷积、仅依赖自注意力机制，Transformer 在实现最先进翻译结果的同时大幅加快了训练速度。这篇论文已被引用超过 25 万次，Transformer 成为此后每一个主要 AI 系统的基础——从 GPT 和 BERT 到 AlphaFold 再到现代语音模型。"}, "impactIndex": 8, "title": {"en": "\"Attention Is All You Need\" — the Transformer architecture is born", "zhHans": "《Attention Is All You Need》——Transformer 架构诞生"}, "categories": ["capability"], "significance": 3, "id": "transformer-2017", "slug": "transformer", "date": "2017-12"}, {"datePrecision": "month", "summary": {"en": "Alan Turing published his landmark paper in Mind, proposing the \"Imitation Game\"—a test to determine whether machines can think. Rather than defining \"thinking\" philosophically, Turing framed intelligence as a behavioral question: can a machine converse well enough to be indistinguishable from a human? This paper is widely regarded as the philosophical foundation of artificial intelligence.", "zhHans": "艾伦·图灵在哲学期刊 Mind 上发表里程碑论文《计算机器与智能》，提出用\"模仿游戏\"（后称图灵测试）来判断机器是否能思考。图灵不纠缠\"思考\"的哲学定义，而是将智能转化为可操作的行为问题：机器能否在对话中让人无法分辨？这篇论文被公认为人工智能的哲学奠基之作。"}, "impactIndex": 7, "title": {"en": "Alan Turing publishes \"Computing Machinery and Intelligence\", proposing what becomes the Turing Test", "zhHans": "Alan Turing 发表《计算机器与智能》，提出后来被称为图灵测试的思想实验"}, "categories": ["capability"], "significance": 3, "id": "turing-test-1950", "slug": "turing-test", "date": "1950-10"}, {"datePrecision": "day", "summary": {"en": "On February 2, 2025, AI researcher Andrej Karpathy coined the term 'vibe coding' in a viral tweet, describing a new programming paradigm where developers describe tasks to LLMs and accept generated code without thorough review. The term quickly entered mainstream vocabulary, was named Collins Dictionary Word of the Year 2025, and was listed by Merriam-Webster. It crystallized a profound shift: AI had transformed coding from a craft of precise syntax into a conversation of intent.", "zhHans": "2025 年 2 月 2 日，AI 研究员 Andrej Karpathy 在一条病毒式推文中创造了\"vibe coding\"一词，描述了一种新的编程范式：开发者向大语言模型描述任务，接受生成的代码而不经过彻底审查。该词迅速进入主流词汇，被《柯林斯英语词典》评为 2025 年度词汇，并被《韦氏词典》收录。它凝固了一个深刻的转变：AI 将编码从精确语法的工艺转变为意图的对话。"}, "impactIndex": 6, "title": {"en": "'Vibe coding' is coined, capturing a new paradigm of AI-assisted programming", "zhHans": "'Vibe coding' 一词诞生，概括了 AI 辅助编程的新范式"}, "categories": ["society", "product"], "significance": 1, "id": "vibecoding-2025", "slug": "vibecoding-coined", "date": "2025-02-02"}, {"datePrecision": "day", "summary": {"en": "On February 16, 2011, IBM's Watson supercomputer defeated all-time Jeopardy! champions Ken Jennings and Brad Rutter across three episodes. Watson used natural language processing and information retrieval over 200 million pages of content, demonstrating that machines could handle the ambiguity of natural language at human-comparable levels in a constrained domain.", "zhHans": "2011 年 2 月 16 日，IBM 的 Watson 超级计算机在三期节目中击败了 Jeopardy! 历史总冠军 Ken Jennings 和 Brad Rutter。Watson 使用自然语言处理和检索技术，在 2 亿页内容上进行实时分析，证明了机器可以在受限领域以接近人类的水平处理自然语言的模糊性。"}, "impactIndex": 5, "title": {"en": "IBM Watson defeats human champions on Jeopardy!", "zhHans": "IBM Watson 在 Jeopardy! 上击败人类冠军"}, "categories": ["capability", "society"], "significance": 1, "id": "watson-jeopardy-2011", "slug": "watson-jeopardy", "date": "2011-02-16"}, {"datePrecision": "day", "summary": {"en": "xAI filed a federal lawsuit on July 27, 2026, challenging Minnesota HF 1606 before its August 1 effective date. The official bill text prohibits covered services from enabling or performing AI nudification and provides civil remedies and penalties; xAI alleges that the law is an overbroad, content-based restriction. The filing is a legal milestone, not a court ruling. On July 31, the court declined emergency interim relief and set a later preliminary-injunction hearing without deciding the merits.", "zhHans": "xAI 于 2026 年 7 月 27 日提起联邦诉讼，在明尼苏达州 HF 1606 于 8 月 1 日生效前提出挑战。官方法案文本禁止相关服务允许或执行 AI 裸化，并规定民事救济和处罚；xAI 则主张该法构成过宽的内容限制。这是法律程序节点，不是法院裁决。7 月 31 日，法院拒绝了紧急临时救济，并在未裁决实体问题的情况下安排后续预先禁令听证。"}, "impactIndex": 5, "title": {"en": "xAI challenges Minnesota's AI nudification law in federal court", "zhHans": "xAI 在联邦法院挑战明尼苏达州 AI 裸化法"}, "categories": ["governance", "safety"], "significance": 2, "id": "xai-minnesota-nudification-lawsuit-2026", "slug": "xai-minnesota-nudification-lawsuit", "date": "2026-07-27"}]</script>
