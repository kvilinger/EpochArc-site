      "inLanguage": ["zh-CN", "en"]

  </script>
  <style>
    /* ─── Modern Minimal Theme Variables ───────────────────────────────── */
    :root {
      /* Light Mode Palette (Codified Brand Spec) */
      --bg:            oklch(98.5% 0.003 240);
      --surface:       oklch(100% 0 0);
      --surface-hover: oklch(97% 0.004 240);
      --fg:            oklch(15% 0.015 250);
      --muted:         oklch(52% 0.012 250);
      --border:        oklch(90.5% 0.006 250);
      --accent:        oklch(58% 0.18 255); /* Electric Blue-Cyan */
      --highlight:     oklch(62% 0.22 25);  /* Vibrant Red/Coral for focus outline */
      
      /* Inactive Filter Buttons (Codified Brand Spec) */
      --btn-inactive-bg:     oklch(97.2% 0.004 250);
      --btn-inactive-border: oklch(89.5% 0.006 250);
      
      /* Category Colors (Tailored Light Mode) */
      --color-capability:  oklch(51% 0.2 290);  /* Purple/Indigo */
      --color-product:     oklch(52% 0.2 25);   /* Coral Red */
      --color-commerce:    oklch(48% 0.18 200);  /* Teal */
      --color-governance:  oklch(55% 0.18 85);   /* Amber */
      --color-safety:      oklch(48% 0.2 140);   /* Green */
      --color-society:     oklch(53% 0.2 55);    /* Orange */

      --accent-soft: color-mix(in oklch, var(--accent) 10%, transparent);
      --fg-soft:     color-mix(in oklch, var(--fg) 5%, transparent);

      /* Fonts (Codified Brand Spec) */
      --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', sans-serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'PingFang SC', sans-serif;
      --font-mono:    'JetBrains Mono', 'IBM Plex Mono', Menlo, monospace;

      /* Scales */
      --fs-h1: clamp(36px, 5.5vw, 64px);
      --fs-h2: clamp(24px, 3.5vw, 36px);
      --fs-h3: 20px;
      --fs-lead: 18px;
      --fs-body: 15px;
      --fs-meta: 13px;

      /* Spacing */
      --gap-xs: 8px;
      --gap-sm: 12px;
      --gap-md: 20px;
      --gap-lg: 32px;
      --gap-xl: 56px;
      --container: 960px; /* Locked to EpochArc content width */
      --gutter: 24px;

      /* Radius */
      --radius: 8px;
      --radius-lg: 12px;
      --radius-pill: 999px;

      /* Motion */
      --transition-smooth: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Dark Mode Overrides */
    [data-theme="dark"] {
      --bg:            oklch(12% 0.008 250);
      --surface:       oklch(16% 0.01 250);
      --surface-hover: oklch(19% 0.012 250);
      --fg:            oklch(93% 0.005 250);
      --muted:         oklch(60% 0.008 250);
      --border:        oklch(22% 0.008 250);
      --accent:        oklch(64% 0.16 250);
      
      --btn-inactive-bg:     oklch(19% 0.01 250);
      --btn-inactive-border: oklch(25% 0.012 250);

      /* Category Colors (Tailored Dark Mode) */
      --color-foundation: oklch(70% 0.16 260);
      --color-apps:       oklch(72% 0.16 140);
      --color-hardware:   oklch(74% 0.16 45);
      --color-embodied:   oklch(70% 0.18 310);
      --color-social:     oklch(72% 0.14 200);

      /* Distinct Specific Category Colors */
      --color-capability:  oklch(71% 0.17 290); /* Purple/Indigo */
      --color-product:     oklch(74% 0.16 25);   /* Coral Red */
      --color-commerce:    oklch(72% 0.14 200);  /* Teal */
      --color-governance:  oklch(75% 0.14 85);   /* Amber */
      --color-safety:      oklch(72% 0.16 140);  /* Green */
      --color-society:     oklch(75% 0.16 55);   /* Orange */
      
      --accent-soft: color-mix(in oklch, var(--accent) 15%, transparent);
      --fg-soft:     color-mix(in oklch, var(--fg) 8%, transparent);
    }

    /* ─── Reset & Base ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.5;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      transition: background var(--transition-smooth), color var(--transition-smooth);
      padding-bottom: var(--gap-xl);
    }
    img, svg { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; background: none; border: none; padding: 0; color: inherit; }
    p { text-wrap: pretty; margin: 0; }
    h1, h2, h3, h4 { text-wrap: balance; margin: 0; font-weight: 700; letter-spacing: -0.02em; }

    /* ─── Layout primitives ─────────────────────────────────────────── */
    .container {
      max-width: var(--container);
      margin-inline: auto;
      padding-inline: var(--gutter);
    }
    .stack { display: flex; flex-direction: column; }
    .stack > * + * { margin-top: var(--gap-md); }
    .row { display: flex; align-items: center; gap: var(--gap-md); }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--gap-md); }

    /* ─── Topbar Navigation ──────────────────────────────────────────── */
    .topnav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: color-mix(in oklch, var(--bg) 85%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      transition: background var(--transition-smooth), border-color var(--transition-smooth);
    }
    .topnav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }
    .topnav .logo {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.03em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .topnav .logo svg {
      width: 24px;
      height: 24px;
      color: var(--accent);
    }
    .brand-icon {
      width: 26px;
      height: 26px;
      border-radius: 7px;
    }
    .topnav-actions {
      display: flex;
      align-items: center;
      gap: var(--gap-sm);
    }
    .control-btn {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: var(--fs-meta);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition-smooth);
      background: var(--surface);
    }
    .control-btn:hover {
      border-color: var(--fg);
      background: var(--surface-hover);
    }
    .language-picker {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .language-picker svg {
      position: absolute;
      left: 10px;
      width: 15px;
      height: 15px;
      color: var(--muted);
      pointer-events: none;
    }
    .language-select {
      min-height: 32px;
      min-width: 104px;
      padding: 5px 30px 5px 32px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--fg);
      font-size: var(--fs-meta);
      font-weight: 600;
      appearance: none;
      transition: var(--transition-smooth);
      background-image:
        linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position:
        calc(100% - 16px) 14px,
        calc(100% - 11px) 14px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    .language-select:hover,
    .language-select:focus {
      outline: none;
      border-color: var(--fg);
      background-color: var(--surface-hover);
    }

    /* ─── Hero Section ──────────────────────────────────────────────── */
    .hero {
      padding-top: clamp(28px, 6vw, 56px);
      padding-bottom: clamp(16px, 3vw, 28px);
      text-align: center;
    }
    .hero h1 {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: 1.05;
      margin-bottom: 0;
    }
    .hero .lead {
      display: none;
    }

    /* ─── Horizontal Predictions Row ────────────────────────────────── */
    .predictions-section {
      padding-block: var(--gap-md);
      margin-bottom: var(--gap-lg);
    }
    .section-title {
      font-size: 13px;
      font-family: var(--font-mono);
      letter-spacing: 0.01em;
      color: var(--muted);
      margin-bottom: var(--gap-md);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .predictions-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      align-items: stretch;
    }
    .predictions-grid.compact-mode {
      grid-auto-rows: 1fr;
    }
    @media (max-width: 900px) {
      .predictions-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 550px) {
      .predictions-grid {
        grid-template-columns: 1fr;
      }
    }
    .predict-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      transition: border-color 0.24s ease, box-shadow 0.24s ease, background 0.24s ease;
      position: relative;
      overflow: hidden;
    }
    .predict-card.compact {
      min-height: 224px;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      cursor: pointer;
    }
    .predict-card.compact:hover {
      border-color: color-mix(in oklch, var(--fg) 28%, var(--border));
      box-shadow: 0 18px 42px rgba(15, 23, 42, 0.06);
    }
    .predict-card.is-expanded {
      grid-column: 1 / -1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      align-items: start;
      cursor: default;
      border-color: color-mix(in oklch, var(--fg) 42%, var(--border));
      box-shadow: 0 18px 52px rgba(15, 23, 42, 0.08);
      padding: 18px 20px 18px;
      isolation: isolate;
    }
    .predict-card.selected {
      border-color: color-mix(in oklch, var(--accent) 58%, var(--border));
      background:
        linear-gradient(180deg, color-mix(in oklch, var(--accent) 8%, transparent), transparent 42%),
        var(--surface);
      box-shadow:
        0 0 0 1px color-mix(in oklch, var(--accent) 18%, transparent),
        0 18px 52px rgba(15, 23, 42, 0.08);
    }
    .predict-main {
      min-width: 0;
      display: grid;
      gap: 14px;
      align-content: start;
    }
    .predict-card.compact .predict-main {
      min-height: 100%;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .predict-card.is-expanded .predict-main {
      min-height: auto;
      grid-template-rows: auto;
      padding-right: 0;
      gap: 10px;
    }
    .predict-header {
      margin-bottom: 0;
      min-width: 0;
      display: grid;
      gap: 6px;
      align-content: start;
    }
    .predict-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      min-height: 16px;
    }
    .predict-card.compact .predict-meta {
      margin-bottom: 10px;
      align-items: flex-start;
    }
    .signal-count {
      display: inline-flex;
      align-items: center;
      color: var(--accent);
      font-weight: 700;
    }
    .forecast-status {
      color: var(--muted);
    }
    .predict-header .expected-year {
      font-family: var(--font-mono);
      font-size: var(--fs-meta);
      color: var(--muted);
      font-weight: 600;
      display: none;
      margin-bottom: 4px;
    }
    .predict-header h3 {
      font-size: 17px;
      line-height: 1.25;
      font-weight: 700;
      margin: 0;
      min-width: 0;
    }
    .predict-card.compact .predict-header h3 {
      min-height: calc(1.25em * 2);
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }
    .predict-header p {
      font-size: var(--fs-meta);
      color: var(--muted);
      line-height: 1.48;
      margin: 0;
      min-width: 0;
    }
    .predict-card.compact .predict-header p {
      min-height: calc(1.48em * 4);
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 4;
      overflow: hidden;
    }
    .predict-card.is-expanded .predict-header p {
      max-width: 72ch;
      display: block;
      overflow: visible;
    }
    .predict-expanded-topline {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
    }
    .predict-expanded-title {
      min-width: 0;
      display: grid;
      gap: 2px;
    }
    .predict-expanded-controls {
      display: inline-flex;
      align-items: center;
      justify-self: end;
      gap: 14px;
      flex-wrap: wrap;
    }
    .forecast-selection-badge {
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: none;
      box-shadow: none;
      backdrop-filter: none;
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      justify-content: flex-end;
      text-align: right;
      white-space: nowrap;
    }
    .predict-card.compact .forecast-selection-badge {
      min-width: 0;
      padding: 0;
    }
    body[data-theme="dark"] .forecast-selection-badge {
      background: none;
      box-shadow: none;
    }
    .forecast-selection-count {
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1;
      font-weight: 700;
      color: var(--fg);
    }
    .predict-card.compact .forecast-selection-count {
      font-size: 12px;
    }
    .forecast-selection-label {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0;
      text-transform: none;
    }
    .predict-card.compact .forecast-selection-label {
      font-size: 11px;
    }
    .predict-intro {
      margin: 0;
      font-size: 13px;
      line-height: 1.45;
      color: var(--fg);
      max-width: 78ch;
    }
    .predict-action-row {
      display: flex;
      gap: 0;
      align-items: center;
      justify-content: center;
      padding-top: 8px;
      border-top: 1px solid color-mix(in oklch, var(--fg) 8%, var(--border));
    }
    .predict-card.compact .predict-action-row {
      margin-top: auto;
    }
    .forecast-action {
      min-height: 40px;
      min-width: 126px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: var(--transition-smooth);
      background: var(--surface);
      cursor: pointer;
    }
    .predict-card.compact .forecast-action {
      width: 100%;
      min-width: 0;
    }
    .forecast-action:hover {
      border-color: var(--fg);
      background: var(--fg-soft);
    }
    .forecast-action.primary {
      background: var(--fg);
      border-color: var(--fg);
      color: var(--bg);
    }
    .forecast-action.primary:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .forecast-choice-button {
      min-height: auto;
      padding: 0 0 2px;
      border: 0;
      border-bottom: 1px solid color-mix(in oklch, var(--accent) 46%, var(--border));
      border-radius: 0;
      background: none;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      cursor: pointer;
      transition: var(--transition-smooth);
    }
    .forecast-choice-button:hover {
      background: none;
      border-color: var(--accent);
      color: var(--accent);
    }
    .forecast-choice-button.secondary {
      background: none;
      color: var(--muted);
      border-bottom-color: color-mix(in oklch, var(--fg) 14%, var(--border));
    }
    .forecast-choice-button.secondary:hover {
      background: none;
      border-bottom-color: var(--fg);
      color: var(--fg);
    }
    .forecast-toggle {
      width: auto;
      min-height: auto;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: none;
      color: var(--fg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition-smooth);
      line-height: 0;
    }
    .forecast-toggle:hover {
      background: none;
      color: var(--accent);
    }
    body[data-theme="dark"] .forecast-toggle {
      background: none;
    }
    .forecast-chevron {
      width: 14px;
      height: 14px;
      display: inline-block;
      flex: 0 0 auto;
    }
    .forecast-chevron.up {
      transform: rotate(180deg);
    }
    .prediction-details {
      display: none;
    }
    .predict-expanded-content {
      min-width: 0;
      display: grid;
      gap: 10px;
      align-content: start;
      min-height: auto;
    }
    .predict-card.is-expanded .prediction-details {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      align-items: start;
      padding: 10px 14px;
      border: 1px solid color-mix(in oklch, var(--fg) 10%, var(--border));
      border-radius: calc(var(--radius-lg) - 2px);
      background:
        linear-gradient(180deg, color-mix(in oklch, var(--surface-hover) 74%, transparent), transparent),
        color-mix(in oklch, var(--surface) 92%, var(--surface-hover));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.32), 0 12px 28px rgba(15, 23, 42, 0.05);
      position: relative;
      z-index: 1;
    }
    body[data-theme="dark"] .predict-card.is-expanded .prediction-details {
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 16px 34px rgba(2, 6, 23, 0.24);
    }
    .detail-stack {
      min-width: 0;
      display: grid;
      gap: 10px;
    }
    .detail-block {
      min-width: 0;
      display: grid;
      align-content: start;
      gap: 8px;
      padding-left: 0;
      border-left: 0;
    }
    .detail-label {
      display: none;
    }
    .detail-text {
      margin: 0;
      font-size: var(--fs-meta);
      line-height: 1.42;
      color: var(--fg);
      min-width: 0;
    }
    .predict-card.is-expanded .detail-text {
      display: block;
      overflow: visible;
    }
    .support-column {
      min-width: 0;
      display: grid;
      gap: 10px;
      align-content: start;
    }
    .support-matrix {
      min-width: 0;
      display: grid;
      gap: 0;
    }
    .support-row-list {
      display: grid;
      gap: 0;
    }
    .support-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      align-items: start;
      padding: 8px 0;
      border-top: 1px solid color-mix(in oklch, var(--fg) 8%, var(--border));
    }
    .support-row:first-child {
      padding-top: 0;
      border-top: 0;
    }
    .support-card-list {
      display: grid;
      gap: 10px;
    }
    .support-card {
      min-width: 0;
      display: grid;
      gap: 4px;
      padding: 0;
    }
    .support-card-copy {
      margin: 0;
      font-size: 12px;
      line-height: 1.4;
      color: var(--fg);
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 1;
      overflow: hidden;
    }
    .support-links-cell {
      min-width: 0;
      max-width: 100%;
      display: block;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }
    .support-links-cell::-webkit-scrollbar {
      display: none;
    }
    .signal-links-stack {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      align-items: center;
      white-space: nowrap;
      width: max-content;
    }
    .signal-list {
      display: grid;
      gap: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .signal-item {
      display: grid;
      gap: 7px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      line-height: 1.45;
    }
    .signal-item:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }
    .signal-item-label {
      font-weight: 650;
      color: var(--fg);
      font-size: 13px;
      line-height: 1.38;
    }
    .signal-item-summary {
      display: none;
    }
    .signal-event-links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .signal-event-link {
      display: inline-flex;
      align-items: center;
      max-width: none;
      padding: 4px 7px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: color-mix(in oklch, var(--surface-hover) 80%, var(--surface));
      color: var(--muted);
      font-size: 10px;
      cursor: pointer;
      transition: var(--transition-smooth);
    }
    .signal-source-link {
      text-decoration: none;
      background: color-mix(in oklch, var(--surface) 88%, var(--surface-hover));
    }
    .signal-event-more {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: color-mix(in oklch, var(--surface-hover) 74%, var(--surface));
      color: var(--muted);
      font-size: 11px;
      font-family: var(--font-mono);
    }
    .signal-event-link:hover {
      border-color: color-mix(in oklch, var(--fg) 26%, var(--border));
      color: var(--fg);
      background: var(--surface-hover);
    }
    .detail-list {
      margin: 0;
      padding-left: 16px;
      display: grid;
      gap: 6px;
      color: var(--fg);
      font-size: var(--fs-meta);
      line-height: 1.42;
    }
    .predict-expanded-toolbar {
      display: flex;
      justify-content: center;
      padding: 0;
      padding-top: 8px;
      border-top: 1px solid color-mix(in oklch, var(--fg) 8%, var(--border));
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
      position: static;
      z-index: auto;
    }
    .predict-collapse-button {
      width: auto;
      min-height: auto;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: none;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition-smooth);
    }
    .predict-collapse-button:hover {
      background: none;
      color: var(--fg);
    }
    body[data-theme="dark"] .predict-collapse-button {
      background: none;
    }
    .direction-entry {
      grid-column: 1 / -1;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      padding: 12px 16px;
      display: grid;
      gap: 12px;
    }
    .direction-entry-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
    }
    .direction-entry-title {
      font-size: 14px;
      font-weight: 700;
    }
    .direction-entry-sub {
      margin-top: 2px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }
    .direction-list {
      display: none;
      border-top: 1px solid var(--border);
    }
    .direction-entry.open .direction-list {
      display: block;
    }
    .direction-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .direction-row:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }
    .direction-row-title {
      color: var(--fg);
      font-weight: 650;
      font-size: 14px;
    }
    .direction-row-meta {
      margin-top: 3px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 11px;
    }
    .direction-entry .forecast-action,
    .predict-expanded-toolbar .forecast-action {
      flex: 0 0 132px;
    }
    @media (max-width: 900px) {
      .predict-card.is-expanded {
        grid-column: 1 / -1;
      }
      .support-row {
        gap: 8px;
        align-items: start;
      }
      .predict-expanded-topline {
        grid-template-columns: 1fr;
      }
      .predict-expanded-controls {
        justify-content: flex-start;
      }
      .forecast-selection-badge {
        justify-content: flex-start;
        text-align: left;
      }
      .support-links-cell {
        min-width: 0;
        max-width: 100%;
      }
    }
    @media (max-width: 550px) {
      .predict-action-row {
        align-items: center;
        flex-direction: row;
      }
      .direction-entry .forecast-action {
        width: 100%;
        min-width: 0;
        flex-basis: auto;
      }
      .predict-card.is-expanded {
        padding: 18px 16px 18px;
      }
      .predict-card.is-expanded .prediction-details {
        padding: 10px 12px;
      }
      .direction-entry-head,
      .direction-row {
        grid-template-columns: 1fr;
        align-items: stretch;
      }
      .predict-expanded-controls {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }
    }

    /* ─── Timeline Filter Controls ──────────────────────────────────── */
    .timeline-filter-bar {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding-block: 6px 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: var(--gap-lg);
      flex-wrap: nowrap;
      width: 100%;
    }
    .search-input-wrapper {
      position: relative;
      width: 100%;
    }
    .search-input-wrapper svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--muted);
      pointer-events: none;
      transition: color 0.2s ease;
    }
    .search-input {
      width: 100%;
      min-height: 36px;
      padding: 7px 12px 7px 32px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      background: var(--btn-inactive-bg);
      color: var(--fg);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, padding 0.35s cubic-bezier(0.16, 1, 0.3, 1), background 0.2s ease;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--fg);
      box-shadow: 0 0 0 2px var(--fg-soft);
    }
    .filter-groups {
      display: flex;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }
    .filter-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    
    /* 搜索框的外层容器及动态展开过渡 */
    .timeline-filter-bar > .filter-field:first-child {
      width: 36px;
      flex-shrink: 0;
      transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .timeline-filter-bar > .filter-field:first-child.is-expanded {
      width: 220px;
    }
    
    /* 未展开时的输入框样式，隐藏文字和占位符以避开溢出 */
    .timeline-filter-bar > .filter-field:first-child:not(.is-expanded) .search-input {
      padding-left: 32px;
      padding-right: 0;
      color: transparent;
      caret-color: transparent;
      cursor: pointer;
    }
    .timeline-filter-bar > .filter-field:first-child:not(.is-expanded) .search-input::placeholder {
      color: transparent;
    }
    
    .filter-groups > .filter-field {
      flex: 1;
      min-width: 0;
    }
    .filter-label {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      min-height: 14px;
    }
    .filter-label.ghost {
      opacity: 0;
      user-select: none;
      pointer-events: none;
    }
    .filter-select {
      min-height: 36px;
      padding: 6px 20px 6px 8px;
      background: var(--btn-inactive-bg);
      border: 1px solid var(--btn-inactive-border);
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 500;
      color: var(--fg);
      transition: var(--transition-smooth);
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position:
        calc(100% - 13px) 16px,
        calc(100% - 8px) 16px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    .filter-select:hover {
      background: var(--surface-hover);
      border-color: var(--muted);
    }
    .filter-select:focus {
      outline: none;
      border-color: var(--fg);
      box-shadow: 0 0 0 2px var(--fg-soft);
    }
    
    /* 重置按钮外层容器 - 常驻固定大小 */
    .filter-reset-field {
      align-self: flex-end;
      height: 36px;
      width: 36px;
      flex: 0 0 36px;
      display: flex;
      margin-left: 2px;
    }
    
    .filter-reset-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      border: 1px solid var(--btn-inactive-border);
      border-radius: var(--radius);
      background: var(--btn-inactive-bg);
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease, opacity 0.2s ease;
    }
    .filter-reset-btn svg {
      width: 16px;
      height: 16px;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    /* 悬停活跃状态（非 disabled 时有效） */
    .filter-reset-btn:not(:disabled):hover {
      background: var(--surface-hover);
      border-color: var(--muted);
      color: var(--fg);
    }
    .filter-reset-btn:not(:disabled):hover svg {
      transform: rotate(-180deg);
    }
    .filter-reset-btn:focus {
      outline: none;
      border-color: var(--fg);
      box-shadow: 0 0 0 2px var(--fg-soft);
    }
    
    /* 禁用状态（无活跃过滤器时） */
    .filter-reset-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      pointer-events: none;
    }
    
    /* 移动端与平板响应式覆盖 */
    @media (max-width: 900px) {
      .timeline-filter-bar {
        flex-wrap: wrap;
      }
      .timeline-filter-bar > .filter-field:first-child {
        width: 100% !important;
      }
      .timeline-filter-bar > .filter-field:first-child .search-input {
        padding-left: 32px !important;
        padding-right: 12px !important;
        color: var(--fg) !important;
        caret-color: auto !important;
        cursor: text !important;
      }
      .timeline-filter-bar > .filter-field:first-child .search-input::placeholder {
        color: var(--muted) !important;
      }
      .filter-groups {
        width: 100%;
        flex-wrap: wrap;
      }
      .filter-groups > .filter-field {
        flex: 1 1 calc(33.33% - 8px);
        min-width: 120px;
      }
    }
    @media (max-width: 500px) {
      .filter-groups > .filter-field {
        flex: 1 1 calc(50% - 6px);
      }
    }

    /* ─── Vertical Timeline ─────────────────────────────────────────── */
    .timeline-wrapper {
      position: relative;
      --timeline-axis-col: 64px;
      padding-left: 28px;
    }
    .timeline-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 8px; /* Mathematically center-aligned on mobile */
      width: 2px;
      background: var(--border);
      z-index: 1;
      transition: var(--transition-smooth);
    }
    @media (min-width: 651px) {
      .timeline-wrapper {
        padding-left: 0;
      }
      .timeline-line {
        left: calc(4ch + (var(--timeline-axis-col) / 2));
        transform: translateX(-50%);
      }
    }
    .timeline-container {
      display: flex;
      flex-direction: column;
      gap: var(--gap-lg);
      overflow-anchor: none;
    }
    .timeline-item {
      position: relative;
      display: grid;
      grid-template-columns: 4ch var(--timeline-axis-col) minmax(0, 1fr);
      gap: 0;
      align-items: stretch;
      z-index: 2;
      overflow-anchor: none;
    }
    @media (max-width: 650px) {
      .timeline-item {
        grid-template-columns: 24px minmax(0, 1fr);
        gap: var(--gap-xs);
      }
    }
    .timeline-date-col {
      font-family: var(--font-mono);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 2px;
      min-height: 38px;
      padding-right: 0;
      text-align: left;
    }
    .timeline-year {
      font-size: 14px;
      line-height: 1.2;
      font-weight: 800;
      color: var(--fg);
    }
    .timeline-subdate {
      font-size: 11px;
      line-height: 1.2;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    @media (max-width: 650px) {
      .timeline-date-col {
        grid-column: 2;
        grid-row: 1;
        align-items: flex-start;
        padding-left: 18px;
        padding-right: 0;
        text-align: left;
      }
    }
    .timeline-dot {
      grid-column: 2;
      align-self: center;
      justify-self: center;
      position: relative;
      z-index: 3;
      width: var(--dot-size, 10px);
      height: var(--dot-size, 10px);
      border-radius: 50%;
      background: var(--bg);
      border: var(--dot-border, 2px) solid var(--border);
      transition: var(--transition-smooth);
    }
    @media (max-width: 650px) {
      .timeline-dot {
        grid-column: 1;
        grid-row: 2;
        align-self: start;
        margin-top: 10px;
      }
    }
    
    /* Interactive glowing nodes based on category of item */
    .timeline-item[data-category="capability"]:hover .timeline-dot { border-color: var(--color-capability); background: var(--color-capability); }
    .timeline-item[data-category="product"]:hover .timeline-dot { border-color: var(--color-product); background: var(--color-product); }
    .timeline-item[data-category="commerce"]:hover .timeline-dot { border-color: var(--color-commerce); background: var(--color-commerce); }
    .timeline-item[data-category="governance"]:hover .timeline-dot { border-color: var(--color-governance); background: var(--color-governance); }
    .timeline-item[data-category="safety"]:hover .timeline-dot { border-color: var(--color-safety); background: var(--color-safety); }
    .timeline-item[data-category="society"]:hover .timeline-dot { border-color: var(--color-society); background: var(--color-society); }

    /* Node Level 3: Critical Node (Full Card Highlight) */
    .timeline-card-l3 {
      background: var(--surface);
      border: 1px solid var(--fg);
      border-radius: var(--radius-lg);
      padding: var(--gap-md);
      box-shadow: 0 4px 20px var(--fg-soft);
      cursor: pointer;
      transition: var(--transition-smooth);
      position: relative;
    }
    .timeline-card-l3:focus-visible,
    .timeline-card-l2:focus-visible,
    .timeline-card-l1:focus-visible {
      outline: 2px solid var(--highlight);
      outline-offset: 3px;
    }
    .timeline-card-l3:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px var(--fg-soft);
    }
    .timeline-dot.level-3 {
      --dot-size: 12px;
      --dot-border: 3px;
      border-color: var(--fg);
    }

    /* Node Level 2: Major Node (Standard Card) */
    .timeline-card-l2 {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--gap-md);
      cursor: pointer;
      transition: var(--transition-smooth);
      position: relative;
    }
    .timeline-card-l2:hover {
      transform: translateY(-2px);
      border-color: var(--fg);
    }
    .timeline-dot.level-2 {
      --dot-size: 10px;
      --dot-border: 2px;
    }
    
    /* Node Level 1: Minor Node (Compact Record) */
    .timeline-card-l1 {
      background: color-mix(in oklch, var(--surface) 72%, var(--bg));
      border: 1px solid color-mix(in oklch, var(--border) 84%, transparent);
      border-radius: var(--radius-lg);
      padding: 12px var(--gap-md);
      cursor: pointer;
      transition: var(--transition-smooth);
      position: relative;
    }
    .timeline-card-l1-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--gap-sm);
    }
    .timeline-card-l1:hover {
      border-color: var(--muted);
      background: var(--surface);
    }
    .timeline-dot.level-1 {
      --dot-size: 8px;
      --dot-border: 2px;
    }

    .timeline-entry {
      position: relative;
      grid-column: 3;
      min-width: 0;
    }
    @media (max-width: 650px) {
      .timeline-entry {
        grid-column: 2;
        grid-row: 2;
      }
    }
    .timeline-card-l3.expanded,
    .timeline-card-l2.expanded {
      border-color: color-mix(in oklch, var(--accent) 36%, var(--border));
      box-shadow: none;
      background:
        linear-gradient(90deg, color-mix(in oklch, var(--accent) 7%, transparent), transparent 34%),
        var(--surface);
    }
    .timeline-card-l3.expanded::before,
    .timeline-card-l2.expanded::before {
      content: '';
      position: absolute;
      inset: 14px auto 14px 0;
      width: 3px;
      border-radius: var(--radius-pill);
      background: var(--accent);
    }
    .timeline-card-l1.expanded {
      color: var(--fg);
      border-color: color-mix(in oklch, var(--accent) 36%, var(--border));
      background: linear-gradient(90deg, color-mix(in oklch, var(--accent) 6%, transparent), transparent 42%);
    }
    .timeline-card-l1.expanded::before {
      content: '';
      position: absolute;
      inset: 12px auto 12px 0;
      width: 3px;
      border-radius: var(--radius-pill);
      background: var(--accent);
    }
    .timeline-card-l3.expanded,
    .timeline-card-l2.expanded,
    .timeline-card-l1.expanded {
      padding-bottom: var(--gap-md);
    }

    /* Card Content Details */
    .card-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--muted);
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .card-meta span {
      display: inline-flex;
      align-items: center;
    }
    .timeline-node-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 16px;
    }
    .timeline-node-main {
      min-width: 0;
      flex: 1;
    }
    .timeline-node-main .card-meta {
      margin-bottom: 8px;
    }
    .timeline-node-side {
      min-width: max-content;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: space-between;
      align-self: stretch;
      gap: 14px;
      padding-top: 1px;
      text-align: right;
    }
    .timeline-node-meta {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.45;
      white-space: nowrap;
    }
    .timeline-node-level {
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.1;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .timeline-node-impact {
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.1;
      color: var(--fg);
      white-space: nowrap;
    }
    .timeline-node-consensus {
      font-size: 12px;
      line-height: 1.3;
      color: var(--muted);
      white-space: nowrap;
    }
    .timeline-card-indicator {
      position: relative;
      width: 24px;
      height: 24px;
      pointer-events: none;
      transition: var(--transition-smooth);
    }
    .timeline-card-indicator::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 47%;
      width: 8px;
      height: 8px;
      border-right: 1.7px solid var(--muted);
      border-bottom: 1.7px solid var(--muted);
      transform: translate(-50%, -50%) rotate(45deg);
      transition: var(--transition-smooth);
    }
    .timeline-card-l3.expanded .timeline-card-indicator,
    .timeline-card-l2.expanded .timeline-card-indicator,
    .timeline-card-l1.expanded .timeline-card-indicator {
      opacity: 1;
      transform: none;
    }
    .timeline-card-l3.expanded .timeline-card-indicator::before,
    .timeline-card-l2.expanded .timeline-card-indicator::before,
    .timeline-card-l1.expanded .timeline-card-indicator::before {
      top: 55%;
      border-color: var(--muted);
      transform: translate(-50%, -50%) rotate(225deg);
    }
    .category-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      display: inline-flex;
      align-items: center;
      transition: var(--transition-smooth);
    }
    .category-badge.capability {
      background: color-mix(in oklch, var(--color-capability) 12%, transparent);
      color: var(--color-capability);
    }
    .category-badge.product {
      background: color-mix(in oklch, var(--color-product) 12%, transparent);
      color: var(--color-product);
    }
    .category-badge.commerce {
      background: color-mix(in oklch, var(--color-commerce) 12%, transparent);
      color: var(--color-commerce);
    }
    .category-badge.governance {
      background: color-mix(in oklch, var(--color-governance) 12%, transparent);
      color: var(--color-governance);
    }
    .category-badge.safety {
      background: color-mix(in oklch, var(--color-safety) 12%, transparent);
      color: var(--color-safety);
    }
    .category-badge.society {
      background: color-mix(in oklch, var(--color-society) 12%, transparent);
      color: var(--color-society);
    }

    /* Secondary category badge */
    .category-badge.secondary {
      font-size: 11px;
      padding: 1px 8px;
      opacity: 0.75;
      border: 1px dashed color-mix(in oklch, currentColor 30%, transparent);
    }

    .score-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .score-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }
    .card-content h3 {
      font-size: 18px;
      margin-bottom: 6px;
    }
    .card-content p.summary {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.45;
    }
    .timeline-card-l1 .timeline-node-head {
      align-items: center;
    }
    .timeline-card-l1 .card-content h3 {
      font-size: 14px;
      line-height: 1.35;
      margin-bottom: 0;
    }
    @media (max-width: 650px) {
      .timeline-node-head,
      .timeline-card-l1 .timeline-node-head {
        grid-template-columns: 1fr;
      }
      .timeline-node-side {
        min-width: max-content;
        width: auto;
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-end;
        text-align: left;
        gap: 14px;
      }
      .timeline-node-meta {
        white-space: nowrap;
        text-align: left;
      }
    }

    .timeline-details {
      margin-top: var(--gap-sm);
      padding-top: var(--gap-sm);
      border-top: 1px solid var(--border);
      cursor: default;
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      overflow: hidden;
      transform: translateY(-4px);
      transition:
        grid-template-rows 0.34s cubic-bezier(0.16, 1, 0.3, 1),
        opacity 0.22s ease,
        transform 0.34s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .timeline-card-l3.expanded .timeline-details,
    .timeline-card-l2.expanded .timeline-details,
    .timeline-card-l1.expanded .timeline-details {
      grid-template-rows: 1fr;
      opacity: 1;
      transform: translateY(0);
    }
    .timeline-details-inner {
      min-height: 0;
      overflow: hidden;
    }
    .details-collapse {
      width: 100%;
      margin-top: var(--gap-lg);
      padding: 12px 14px 2px;
      border: 0;
      border-top: 1px solid color-mix(in oklch, var(--border) 82%, transparent);
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      transition: var(--transition-smooth);
      cursor: pointer;
    }
    .details-collapse:hover {
      color: var(--fg);
      background: transparent;
    }
    .details-collapse:focus-visible {
      outline: 2px solid var(--highlight);
      outline-offset: 2px;
    }
    .details-collapse::after {
      content: '';
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-left: 8px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: translateY(2px) rotate(225deg);
    }
    .detail-section {
      display: flex;
      flex-direction: column;
      gap: var(--gap-sm);
    }
    .detail-section + .detail-section {
      margin-top: var(--gap-md);
      padding-top: var(--gap-md);
      border-top: 1px solid var(--border);
    }
    .detail-title {
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--muted);
      letter-spacing: 0.01em;
    }
    .evidence-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--border);
    }
    .evidence-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      padding: 12px;
      background: color-mix(in oklch, var(--surface) 92%, var(--bg));
    }
    .evidence-item .label {
      color: var(--muted);
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .evidence-item .val {
      color: var(--fg);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
    }
    @media (max-width: 760px) {
      .evidence-summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    .impact-list,
    .source-list,
    .tag-list {
      display: grid;
      gap: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .impact-item {
      padding: var(--gap-sm) 0;
      border-top: 1px solid var(--border);
    }
    .impact-item:first-child {
      border-top: 0;
      padding-top: 0;
    }
    .impact-head,
    .source-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--gap-sm);
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .impact-name,
    .source-title {
      font-weight: 700;
      font-size: 13px;
    }
    .source-title-link {
      color: var(--fg);
      text-decoration: underline;
      text-decoration-color: color-mix(in oklch, var(--fg) 24%, transparent);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      transition: var(--transition-smooth);
    }
    .source-title-link:hover {
      text-decoration-color: var(--fg);
    }
    .source-title-link:focus-visible {
      outline: 2px solid var(--highlight);
      outline-offset: 3px;
      border-radius: 4px;
    }
    .impact-score {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent);
    }
    .source-kind {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      background: color-mix(in oklch, var(--bg) 66%, var(--surface));
      color: var(--muted);
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
    }
    .impact-description,
    .source-meta {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }
    .source-card {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: var(--gap-sm);
      padding: 14px 0;
      border-top: 1px solid color-mix(in oklch, var(--border) 86%, transparent);
    }
    .source-card:first-child {
      border-top: 0;
      padding-top: 0;
    }
    .source-index {
      width: 26px;
      height: 26px;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 11px;
      background: color-mix(in oklch, var(--bg) 70%, var(--surface));
    }
    .source-body {
      min-width: 0;
    }
    .source-quote {
      margin-top: 8px;
      padding: 8px 10px;
      border-left: 2px solid var(--accent);
      background: color-mix(in oklch, var(--accent) 5%, transparent);
      color: var(--fg);
      font-size: 13px;
      line-height: 1.55;
    }
    .source-status {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--muted);
      font-family: var(--font-mono);
    }
    .source-chip {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      background: var(--surface);
      color: var(--muted);
    }
    .tag-list {
      display: flex;
      flex-wrap: wrap;
    }
    .tag-list li {
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      color: var(--muted);
      font-size: 12px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--gap-md);
      padding-block: var(--gap-md);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .field-grid.cols-4 {
      grid-template-columns: repeat(4, 1fr);
    }
    @media (max-width: 550px) {
      .field-grid.cols-4 {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    .field-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field-item .label {
      font-size: 12px;
      color: var(--muted);
      font-family: var(--font-body);
    }
    .field-item .val {
      font-size: 14px;
      font-weight: 600;
    }
    .field-item .val.text-success {
      color: var(--color-apps);
    }
    .gauge-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .gauge-bar {
      flex: 1;
      height: 8px;
      background: var(--border);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }
    .gauge-fill {
      height: 100%;
      background: var(--accent);
      border-radius: var(--radius-pill);
    }
    .gauge-val {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
    }

    /* Curator Commentary Callout Box */
    .curator-commentary {
      margin-top: var(--gap-sm);
      padding: var(--gap-md);
      background: var(--bg);
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--radius) var(--radius) 0;
      transition: background var(--transition-smooth);
    }
    .commentary-label {
      display: block;
      font-size: 11px;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .commentary-text {
      font-size: 14px;
      color: var(--fg);
      line-height: 1.6;
      margin: 0;
    }

    .source-link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 18px;
      border: 1px solid var(--fg);
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      transition: var(--transition-smooth);
      margin-top: var(--gap-md);
    }
    .source-link-btn:hover {
      background: var(--fg);
      color: var(--bg);
    }
    @media (prefers-reduced-motion: reduce) {
      .timeline-details,
      .timeline-card-indicator,
      .details-collapse,
      .timeline-card-l3,
      .timeline-card-l2,
      .timeline-card-l1 {
        transition: none;
      }
    }
    @media (prefers-reduced-motion: no-preference) {
      .timeline-details-inner {
        animation: revealDetails 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      }
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 0.24s;
        animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
      }
    }
    @keyframes revealDetails {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .status-panel {
      padding: var(--gap-md);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      color: var(--muted);
      text-align: center;
    }
    .status-panel strong {
      display: block;
      color: var(--fg);
      margin-bottom: 6px;
    }
    .status-link {
      color: var(--fg);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ─── Footer ────────────────────────────────────────────────────── */
    .pagefoot {
      padding-block: var(--gap-xl);
      border-top: 1px solid var(--border);
      margin-top: var(--gap-xl);
      color: var(--muted);
      font-size: var(--fs-meta);
      transition: border-color var(--transition-smooth);
    }
    .footer-links {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .footer-links a {
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    @media (max-width: 680px) {
      .pagefoot .row-between {
        align-items: flex-start;
      }
      .footer-links {
        justify-content: flex-start;
      }
    }

    /* Global Tooltip Styling */
    .global-tooltip {
      position: absolute;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 11px;
      line-height: 1.5;
      width: 290px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15);
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.15s ease, transform 0.15s ease;
      transform: translateY(4px);
      white-space: normal;
    }
    .global-tooltip.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .info-trigger {
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
      cursor: help;
    }

    /* ─── Cookie Notice ──────────────────────────────────────────── */
    .cookie-notice {
      position: fixed;
      bottom: -100px;
      left: 0;
      right: 0;
      z-index: 999;
      background: color-mix(in oklch, var(--surface) 92%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: bottom 0.3s ease;
    }
    .cookie-notice.show {
      bottom: 0;
    }
    .cookie-notice-text {
      font-size: 14px;
      color: var(--c-text-secondary);
      max-width: 600px;
    }
    .cookie-notice-close {
      flex-shrink: 0;
      padding: 6px 16px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--fg);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    .cookie-notice-close:hover {
      background: var(--border);
    }
    @media (max-width: 600px) {
      .cookie-notice {
        flex-direction: column;
        text-align: center;
        padding: 12px;
        gap: 10px;
      }
    }

    /* ─── Back to Top Button ─────────────────────────────────────────── */
    .back-to-top {
      position: fixed;
      bottom: 24px;
      /* 宽屏下定位在内容区域（960px）外侧右边 24px 处（半宽 480px + 间距 24px + 自身宽度 44px = 548px） */
      /* 窄屏下自动回缩到距离屏幕右侧 20px 处 */
      right: max(20px, calc(50% - 548px));
      width: 44px;
      height: 44px;
      border-radius: var(--radius-pill);
      background: color-mix(in oklch, var(--surface) 80%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(16px);
      transition: 
        opacity var(--transition-smooth), 
        transform var(--transition-smooth), 
        background var(--transition-smooth), 
        border-color var(--transition-smooth),
        box-shadow var(--transition-smooth);
      z-index: 90;
    }

    [data-theme="dark"] .back-to-top {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .back-to-top.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .back-to-top:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
    }

    .back-to-top:active {
      transform: translateY(-1px);
    }

    .back-to-top svg {
      width: 20px;
      height: 20px;
      stroke: var(--fg);
      transition: stroke var(--transition-smooth), transform var(--transition-smooth);
    }

    .back-to-top:hover svg {
      stroke: var(--accent);
      transform: translateY(-2px);
    }
  </style>
</head>
