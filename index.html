t": "2026-06-25", "curator": "EpochArc editorial", "screeningRunId": "possible-directions-2026-06-25c"}}, {"id": "autonomous-enterprise-workflows", "slug": "autonomous-enterprise-workflows", "title": {"en": "Autonomous Enterprise Workflows", "zhHans": "自主企业工作流"}, "thesis": {"en": "Agentic systems are being deployed across real business tools, moving from isolated demonstrations toward repeatable workflow execution.", "zhHans": "智能体系统正部署于真实业务工具，从单次演示走向可重复的工作流执行。"}, "description": {"en": "Agents execute defined workflows across email, CRM, ERP, and ticketing systems, reducing manual handoffs between teams.", "zhHans": "智能体在邮件、CRM、ERP 和工单系统之间执行固定工作流，减少团队之间的人工交接。"}, "forecastType": "product", "status": "active", "createdAt": "2026-06-25", "updatedAt": "2026-08-10", "lastReviewedAt": "2026-08-10", "reviewCadence": "monthly", "expectedWindow": {"start": "2027", "end": "2030", "precision": "year"}, "confidence": {"level": "medium", "evidenceGrade": "B"}, "rationale": {"currentBaseline": {"en": "Agents can browse the web, call APIs, fill forms, and coordinate short tasks. Enterprises are running pilot programs, but broad operational trust in agent autonomy remains uneven.", "zhHans": "智能体已能浏览网页、调用 API、填写表单并协调短任务。企业正在开展试点，但对智能体自主执行的运营级信任尚不均衡。"}, "whyThisDirection": {"en": "The open question is whether these capabilities remain at the demo and copilot stage, or evolve into repeatable workflow layers across support, operations, reporting, and internal systems.", "zhHans": "待观察的是，这些能力是停留在演示和副驾阶段，还是会发展为客服、运营、报告和内部系统中的可重复工作流层。"}, "counterSignal": {"en": "Exception handling, confidentiality requirements, approval workflows, system integration complexity, and liability questions remain significant obstacles to treating agents as trusted enterprise operators.", "zhHans": "异常处理、保密要求、审批流程、系统集成复杂性和责任归属问题，仍然是智能体成为可信企业执行者的主要障碍。"}, "openQuestions": [{"en": "Which enterprise workflows have boundaries clear enough for agentic autonomy, and which remain too dependent on human judgment?", "zhHans": "哪些企业工作流边界足够清晰，适合智能体自主执行？哪些仍高度依赖人类判断？"}, {"en": "What public evidence would indicate that enterprises trust agents beyond pilot programs and internal demonstrations?", "zhHans": "什么公开证据能表明企业对智能体的信任已经超越试点和内部演示？"}]}, "signals": [{"id": "autonomous-agents-broke-into-mainstream-awareness", "kind": "product", "status": "observed", "label": {"en": "Autonomous agents have entered mainstream developer awareness.", "zhHans": "自主智能体已进入主流开发者的认知范围。"}, "summary": {"en": "Auto-GPT was a turning point: it made goal-driven AI agents legible to ordinary developers, even before enterprise reliability had been addressed.", "zhHans": "Auto-GPT 是一个转折点——它让目标驱动的智能体概念被普通开发者理解，即便那时企业级可靠性尚未解决。"}, "eventIds": ["auto-gpt-2023"], "sourceIds": ["wikipedia-auto-gpt", "github-autogpt"]}, {"id": "agent-infrastructure-and-products-are-forming", "kind": "infrastructure", "status": "observed", "label": {"en": "Agent infrastructure and first-party agent products are emerging concurrently.", "zhHans": "智能体基础设施与第一方产品正在同步成形。"}, "summary": {"en": "MCP, Project Mariner, Operator, and GPT-5.6 Sol's ultra mode (multi-agent delegation) indicate that major AI labs are building the protocols and execution frameworks for enterprise multi-step workflows. Fable 5's 2.5-hour autonomous CUDA kernel development demonstrates sustained long-horizon execution without human intervention.", "zhHans": "MCP、Project Mariner、Operator 以及 GPT-5.6 Sol 的 ultra 模式（多智能体委托）表明，主要 AI 实验室正在构建企业级多步工作流所需的协议和执行框架。Fable 5 的 2.5 小时自主 CUDA 内核开发展示了无需人工干预的持续长周期执行能力。"}, "eventIds": ["mcp-protocol-2024", "gemini-2-agents-2024", "openai-operator-2025", "gpt-5-6-broad-launch-2026", "fable-5-kernelbench-2026"], "sourceIds": ["anthropic-mcp-blog-2024", "google-gemini-2-blog-2024", "openai-operator", "reuters-gpt56-approval-2026", "import-ai-464-2026"]}, {"id": "independent-tracking-of-agent-adoption-now-exists", "kind": "market", "status": "observed", "label": {"en": "Independent reports now treat deployed agents as a measurable adoption category.", "zhHans": "独立报告已将已部署智能体视为可衡量的采用类别。"}, "summary": {"en": "Tracking from MIT, Stanford, and McKinsey indicates that agent deployment and enterprise experimentation have reached a scale that can be measured, not merely speculated about.", "zhHans": "MIT、Stanford 和麦肯锡的追踪数据表明，智能体部署和企业试验规模已进入可量化阶段，不再仅停留在推测层面。"}, "eventIds": ["mcp-protocol-2024", "openai-operator-2025"], "sourceIds": ["mit-ai-agent-index-2025", "stanford-ai-index-2026", "mckinsey-state-ai-2025"]}, {"id": "multi-agent-coordination-entering-production", "kind": "product", "status": "observed", "label": {"en": "Multi-agent coordination and long-horizon autonomous execution are entering production use.", "zhHans": "多智能体协调和长周期自主执行正在进入实际生产环境。"}, "summary": {"en": "GPT-5.6 Sol's ultra mode (task delegation to multiple subagents) and Fable 5's autonomous 2.5-hour CUDA kernel development show that the capability boundary for enterprise agent workflows has moved from single-step demonstrations to sustained multi-agent operations.", "zhHans": "GPT-5.6 Sol 的 ultra 模式（将任务委托给多个子智能体）和 Fable 5 的 2.5 小时自主 CUDA 内核开发表明，企业智能体工作流的能力边界已从单步演示延伸到可持续的多智能体操作。"}, "eventIds": ["gpt-5-6-broad-launch-2026", "fable-5-kernelbench-2026"], "sourceIds": ["reuters-gpt56-approval-2026", "import-ai-464-2026"]}], "consensusBasis": {"resolutionMode": "monitor_only", "basisType": "none", "summary": {"en": "Public evidence shows that enterprise agent infrastructure and experimentation are real, but there is still no widely accepted outside standard for when 'autonomous enterprise workflows' should be declared achieved. The module therefore tracks concrete signals and deployment language rather than publishing a private completion line.", "zhHans": "公开证据已经表明企业智能体基础设施和试验是真实存在的，但目前仍没有被广泛接受的外部标准，用来判断“自主企业工作流”何时算达成。因此模块只跟踪具体信号和部署表述，而不公开设定一条私有完成线。"}, "sourceIds": ["nist-ai-rmf-1-0", "mit-ai-agent-index-2025", "eu-ai-act-official"]}, "sources": [{"sourceId": "anthropic-mcp-blog-2024", "supports": ["signals", "infrastructureContext"]}, {"sourceId": "google-gemini-2-blog-2024", "supports": ["signals", "productContext"]}, {"sourceId": "openai-operator", "supports": ["signals", "productContext"]}, {"sourceId": "mit-ai-agent-index-2025", "supports": ["signals", "consensusBasis"]}, {"sourceId": "mckinsey-state-ai-2025", "supports": ["signals", "adoptionContext"]}, {"sourceId": "nist-ai-rmf-1-0", "supports": ["consensusBasis"]}, {"sourceId": "reuters-gpt56-approval-2026", "supports": ["signals"]}, {"sourceId": "import-ai-464-2026", "supports": ["signals"]}], "relatedEvents": ["auto-gpt-2023", "mcp-protocol-2024", "gemini-2-agents-2024", "openai-operator-2025", "gpt-5-6-broad-launch-2026", "fable-5-kernelbench-2026", "perplexity-amazon-agent-cfaa-appeal-2026", "ooredoo-zankore-ai-platform-2026", "rli-ai-automation-2026"], "tags": ["agents", "enterprise-ai", "workflow-automation", "tool-use"], "editorial": {"createdAt": "2026-06-25", "updatedAt": "2026-08-10", "reviewedAt": "2026-08-10", "publishedAt": "2026-06-25", "curator": "EpochArc editorial", "screeningRunId": "possible-directions-2026-06-25c"}}, {"id": "robots-leave-the-pilot-zone", "slug": "robots-leave-the-pilot-zone", "title": {"en": "Robots Leave the Pilot Zone", "zhHans": "机器人走出试点区"}, "thesis": {"en": "Embodied AI is moving from staged demonstrations into commercial environments where deployment reliability, uptime, and workflow integration are the relevant metrics.", "zhHans": "具身 AI 正从舞台演示进入商业环境，在那里，部署可靠性、运行时长和工作流集成才是真正的衡量标准。"}, "description": {"en": "Robots are being tested in warehouses, factories, and service sites, where they must operate reliably within real operational constraints.", "zhHans": "机器人正在仓库、工厂和服务现场接受测试，需要在真实运营约束中稳定运行。"}, "forecastType": "product", "status": "active", "createdAt": "2026-06-25", "updatedAt": "2026-08-10", "lastReviewedAt": "2026-08-10", "reviewCadence": "quarterly", "expectedWindow": {"start": "2027", "end": "2031", "precision": "year"}, "confidence": {"level": "medium", "evidenceGrade": "B"}, "rationale": {"currentBaseline": {"en": "Robotics demonstrations, teleoperation-heavy showcases, and pilot projects exist. These alone no longer constitute meaningful evidence of operational deployment.", "zhHans": "机器人演示、重度依赖遥操作的展示和试点项目均已存在。但这些本身已不再足以证明运营级部署。"}, "whyThisDirection": {"en": "The relevant question is whether embodied AI is leaving the demo circuit and entering constrained but real operating environments — where customers evaluate reliability, integration, and sustained value rather than spectacle.", "zhHans": "问题在于具身 AI 是否正离开演示回路，进入受约束的真实运营环境——在那里，客户评估的是可靠性、集成度和持续价值，而非表演效果。"}, "counterSignal": {"en": "Safety, dexterity limitations, site-specific adaptation costs, and unclear boundaries between autonomy and concealed teleoperation make robotics claims easy to overstate.", "zhHans": "安全问题、灵巧性限制、场地适配成本，以及自主与隐藏遥操作之间的模糊边界，使得机器人领域的声明很容易被夸大。"}, "openQuestions": [{"en": "Will current deployments persist beyond initial publicity and isolated flagship sites?", "zhHans": "当前的部署是否会在初始宣传和旗舰示范点之外持续下去？"}, {"en": "Can any single embodied platform generalize across enough tasks and sites to achieve commercial significance?", "zhHans": "是否存在一个具身平台，能够在足够多的任务和场地之间泛化，从而获得商业意义？"}]}, "signals": [{"id": "robot-foundation-models-are-arriving", "kind": "research", "status": "observed", "label": {"en": "Foundation-model-style robotics platforms are being launched for physical-world reasoning.", "zhHans": "面向物理世界推理的基础模型式机器人平台已开始发布。"}, "summary": {"en": "Gemini Robotics represented a deliberate attempt to integrate frontier multimodal reasoning with embodied control, rather than treating robotics as a separate research domain.", "zhHans": "Gemini Robotics 是一次有意识的尝试，将前沿多模态推理与具身控制整合，而非将机器人视为独立研究领域。"}, "eventIds": ["gemini-robotics-2025"], "sourceIds": ["google-gemini-robotics-2025"]}, {"id": "real-factory-deployment-is-now-public", "kind": "deployment", "status": "observed", "label": {"en": "Humanoid robots have been documented in real production environments, not just lab settings.", "zhHans": "人形机器人在真实生产环境中已有公开记录，而非仅限于实验室场景。"}, "summary": {"en": "Figure's deployment at BMW shifted the discussion from what robots might theoretically do to what they were already doing in an actual factory.", "zhHans": "Figure 在 BMW 的部署将讨论从“机器人理论上能做什么”推进到“机器人已在真实工厂中做什么”。"}, "eventIds": ["figure-bmw-humanoid-2025"], "sourceIds": ["figure-bmw-production"]}, {"id": "embodied-ai-is-being-discussed-as-operations", "kind": "workflow", "status": "observed", "label": {"en": "Embodied AI is increasingly discussed in terms of deployment and operations, not just demonstration.", "zhHans": "具身 AI 越来越被视为一个部署和运营问题，而非纯展示性技术。"}, "summary": {"en": "Gemini Robotics and Figure at BMW together indicate that the frontier of robotics discourse is shifting from spectacle toward operational integration.", "zhHans": "Gemini Robotics 和 Figure 在 BMW 的案例共同表明，机器人领域的前沿讨论正在从表演展示转向运营集成。"}, "eventIds": ["gemini-robotics-2025", "figure-bmw-humanoid-2025"], "sourceIds": ["google-gemini-robotics-2025", "figure-bmw-production", "stanford-ai-index-2026"]}], "consensusBasis": {"resolutionMode": "monitor_only", "basisType": "none", "summary": {"en": "There is growing public evidence that embodied AI is entering real operations, but no stable outside rulebook yet defines when robots have truly left the pilot phase. This direction therefore stays in monitoring mode and follows event-linked deployment evidence rather than publishing a house threshold.", "zhHans": "具身 AI 正在进入真实运营环境的公开证据越来越多，但目前仍没有稳定的外部规则来界定机器人何时真正走出试点阶段。因此这个方向保持观察模式，跟踪事件化部署证据，而不公布本站自定义门槛。"}, "sourceIds": ["nist-ai-rmf-1-0", "oecd-ai-principles-2019", "google-gemini-robotics-2025"]}, "sources": [{"sourceId": "google-gemini-robotics-2025", "supports": ["signals", "technicalContext"]}, {"sourceId": "figure-bmw-production", "supports": ["signals", "deploymentContext"]}, {"sourceId": "stanford-ai-index-2026", "supports": ["signals", "ecosystemContext"]}, {"sourceId": "nist-ai-rmf-1-0", "supports": ["consensusBasis"]}, {"sourceId": "oecd-ai-principles-2019", "supports": ["consensusBasis"]}], "relatedEvents": ["gemini-robotics-2025", "figure-bmw-humanoid-2025", "gemini-robotics-er2-2026"], "tags": ["robotics", "embodied-ai", "automation", "commercial-deployment"], "editorial": {"createdAt": "2026-06-25", "updatedAt": "2026-08-10", "reviewedAt": "2026-08-10", "publishedAt": "2026-06-25", "curator": "EpochArc editorial", "screeningRunId": "possible-directions-2026-06-25c"}}, {"id": "ai-native-discovery-pipelines", "slug": "ai-native-discovery-pipelines", "title": {"en": "AI-Native Discovery Pipelines", "zhHans": "AI 原生发现流水线"}, "thesis": {"en": "AI is no longer just a tool within scientific research; it is becoming part of the workflow through which scientific discoveries are generated, tested, and scaled.", "zhHans": "AI 不再只是科学研究中的工具，它正在成为科学发现本身被生成、验证和扩展的工作流的一部分。"}, "description": {"en": "AI systems generate hypotheses, design experiments, analyze results, and accelerate subsequent rounds of research within integrated workflows.", "zhHans": "AI 系统在集成工作流中生成假设、设计实验、分析结果，并加速后续研究轮次。"}, "forecastType": "science", "status": "active", "createdAt": "2026-06-25", "updatedAt": "2026-08-10", "lastReviewedAt": "2026-08-10", "reviewCadence": "quarterly", "expectedWindow": {"start": "2027", "end": "2031", "precision": "year"}, "confidence": {"level": "medium", "evidenceGrade": "B"}, "rationale": {"currentBaseline": {"en": "AI contributes to protein structure prediction, literature synthesis, optimization, and scientific coding. These are material achievements, but they do not by themselves constitute a general-purpose discovery pipeline.", "zhHans": "AI 已参与蛋白质结构预测、文献综合、优化和科研编程。这些都是重要进展，但本身尚不足以构成通用的发现流水线。"}, "whyThisDirection": {"en": "The relevant question is whether repeated cycles of hypothesis proposal, experimental design, data analysis, and external validation are emerging around AI-mediated discovery — not whether AI can assist with isolated research tasks.", "zhHans": "关键在于，围绕 AI 介导的发现，是否正在出现由假设提出、实验设计、数据分析和外部验证构成的重复循环——而非 AI 能否辅助孤立的科研任务。"}, "counterSignal": {"en": "Many discovery claims originate from the system builders themselves. Independent validation, reproducibility, and proper attribution remain difficult to establish.", "zhHans": "许多发现主张来自系统构建者自身。独立验证、可复现性和贡献归因仍难以建立。"}, "openQuestions": [{"en": "At what point does AI transition from being a powerful research tool to becoming a repeatable discovery workflow?", "zhHans": "AI 在什么节点会从强大的研究工具转变为可重复的发现工作流？"}, {"en": "What public evidence would demonstrate that outside research groups can independently validate or reuse AI-originated discovery workflows?", "zhHans": "什么公开证据能表明外部研究团队能够独立验证或复用 AI 生成的发现工作流？"}]}, "signals": [{"id": "alphafold-became-scientific-infrastructure", "kind": "research", "status": "observed", "label": {"en": "AI has become core infrastructure for at least one major scientific workflow.", "zhHans": "AI 已成为至少一个重大科学工作流的核心基础设施。"}, "summary": {"en": "AlphaFold and its subsequent Nobel recognition demonstrated that AI can evolve from a supporting tool into part of the fundamental working substrate of modern science.", "zhHans": "AlphaFold 及其后续的诺贝尔奖认可表明，AI 可以从辅助工具演变为现代科学工作基础的一部分。"}, "eventIds": ["alphafold-2020", "alphafold-nobel-2024"], "sourceIds": ["jumper-alphafold-2021", "nobel-chemistry-2024"]}, {"id": "algorithmic-discovery-is-now-a-public-claim", "kind": "research", "status": "observed", "label": {"en": "AI-assisted algorithmic and engineering discovery is now presented as a repeatable workflow claim.", "zhHans": "AI 辅助的算法与工程发现，已被提出为一种可重复的工作流主张。"}, "summary": {"en": "AlphaEvolve advanced the conversation from isolated AI assistance to an explicit claim that AI can participate in an iterative discovery loop for algorithms and systems.", "zhHans": "AlphaEvolve 将讨论从孤立的 AI 辅助推进到明确的声明：AI 可以参与算法和系统的迭代发现闭环。"}, "eventIds": ["alphaevolve-2025"], "sourceIds": ["google-alphaevolve-2025"]}, {"id": "advanced-science-reasoning-is-improving", "kind": "benchmark", "status": "observed", "label": {"en": "Frontier systems show measurable improvement on advanced scientific and mathematical reasoning tasks.", "zhHans": "前沿系统在高水平科学与数学推理任务中展现出可测量的进步。"}, "summary": {"en": "Gemini Deep Think's IMO gold medal result strengthened the case that frontier models are advancing into reasoning territory relevant to future discovery workflows.", "zhHans": "Gemini Deep Think 在 IMO 中获得金牌，进一步加强了前沿模型正在进入与未来发现工作流相关的高阶推理领域的判断。"}, "eventIds": ["gemini-deep-think-imo-gold-2025"], "sourceIds": ["deepmind-gemini-deep-think-imo", "stanford-ai-index-2026"]}, {"id": "full-stack-ai-scientific-research-in-nature", "kind": "research", "status": "observed", "label": {"en": "End-to-end automated AI scientific research has appeared in peer-reviewed publications.", "zhHans": "端到端 AI 自动化科学研究已出现在同行评审出版物中。"}, "summary": {"en": "Nature published 'The AI Scientist' (March 2026), demonstrating end-to-end automation of the scientific process — from idea generation through experimentation to manuscript writing. Google's Hypothesis Generation system (I/O 2026) introduced multi-agent idea tournaments for research. These developments show that discovery pipeline automation is no longer a theoretical concept.", "zhHans": "Nature 于 2026 年 3 月发表了 'The AI Scientist'，展示了从想法生成到实验再到论文写作的端到端科学流程自动化。Google 在 I/O 2026 上发布的 Hypothesis Generation 系统引入了多智能体想法锦标赛。这些进展表明，发现流水线自动化已不再是理论概念。"}, "eventIds": ["gemini-deep-think-imo-gold-2025", "alphaevolve-2025"], "sourceIds": ["nature-ai-scientist-2026", "google-hypothesis-generation-2026"]}], "consensusBasis": {"resolutionMode": "monitor_only", "basisType": "none", "summary": {"en": "Public evidence strongly suggests that AI is entering more of the discovery workflow, but there is no mature external consensus yet for when 'AI-native discovery pipelines' should be declared real in a binary sense. This direction remains a monitored pattern rather than a publicly scored finish line.", "zhHans": "公开证据已经强烈提示 AI 正在进入更多发现工作流环节，但目前仍没有成熟的外部共识，能够以二元方式判断“AI 原生发现流水线”何时算成立。因此这个方向仍是被持续观察的模式，而不是公开计分的终点线。"}, "sourceIds": ["nist-ai-rmf-1-0", "oecd-ai-principles-2019", "stanford-ai-index-2026"]}, "sources": [{"sourceId": "jumper-alphafold-2021", "supports": ["signals", "historicalBaseline"]}, {"sourceId": "nobel-chemistry-2024", "supports": ["signals", "historicalValidation"]}, {"sourceId": "google-alphaevolve-2025", "supports": ["signals", "workflowContext"]}, {"sourceId": "stanford-ai-index-2026", "supports": ["signals", "consensusBasis"]}, {"sourceId": "nist-ai-rmf-1-0", "supports": ["consensusBasis"]}, {"sourceId": "nature-ai-scientist-2026", "supports": ["signals"]}, {"sourceId": "google-hypothesis-generation-2026", "supports": ["signals"]}], "relatedEvents": ["alphafold-2020", "alphafold-nobel-2024", "alphaevolve-2025", "gemini-deep-think-imo-gold-2025", "openai-astra-mathematics-2026", "anthropic-mythos-cryptanalysis-2026"], "tags": ["science", "discovery", "research-automation", "algorithms"], "editorial": {"createdAt": "2026-06-25", "updatedAt": "2026-08-10", "reviewedAt": "2026-08-10", "publishedAt": "2026-06-25", "curator": "EpochArc editorial", "screeningRunId": "possible-directions-2026-06-25c"}}]</script>
  <script type="application/json" id="fallback-events-data">[{"datePrecision": "day", "summary": {"en": "Representatives Ted Lieu and Nathaniel Moran introduced a bill that would require covered AI developers to maintain the ability to throttle, suspend, or shut down covered systems. The bill has not been enacted.", "zhHans": "Ted Lieu 与 Nathaniel Moran 两位众议员提出法案，要求受规制的 AI 开发者保留限速、暂停或关闭相关系统的能力。该法案尚未获通过。"}, "impactIndex": 3, "title": {"en": "US representatives introduce the AI Kill Switch Act", "zhHans": "美国众议员提出《AI 紧急停机法案》"}, "categories": ["governance"], "significance": 1, "id": "ai-kill-switch-act-2026", "slug": "ai-kill-switch-act", "date": "2026-07-23"}, {"datePrecision": "day", "summary": {"en": "By mid-2026, AI-driven job displacement had become an empirically measurable phenomenon. In May 2026 alone, Meta cut 8,000 jobs (10% of its workforce) and moved 7,000 more into AI-focused roles. Across the tech industry, over 92,000 workers were laid off in the first half of 2026 with employers explicitly citing AI automation as a factor. Major companies including Meta, Microsoft, Walmart, Chegg, and ING all announced automation-driven restructuring. The cumulative total of AI-linked job cuts since 2024 approached 900,000.", "zhHans": "到 2026 年中，AI 驱动的岗位替代已成为可实证衡量的现象。仅 2026 年 5 月，Meta 就裁员 8,000 人（占员工总数的 10%），并将另外 7,000 人调往 AI 重点岗位。在整个科技行业，2026 年上半年有超过 92,000 名员工被裁，雇主明确引用 AI 自动化作为因素。包括 Meta、Microsoft、Walmart、Chegg 和 ING 在内的主要公司都宣布了自动化驱动的重组。自 2024 年以来与 AI 相关的累计裁员人数接近 900,000。"}, "impactIndex": 5, "title": {"en": "AI-driven job displacement becomes empirically measurable as 92,000 tech workers laid off in first half of 2026", "zhHans": "AI 驱动的岗位替代成为可实证衡量的现象——2026 年上半年 92,000 名科技工作者被裁"}, "categories": ["society", "commerce"], "significance": 1, "id": "ai-layoffs-wave-2026", "slug": "ai-layoffs-wave", "date": "2026-05-19"}, {"datePrecision": "day", "summary": {"en": "Between July 7 and July 13, 2026, three major AI labs launched or restructured pricing for frontier models within days of each other, triggering a price war that cut output token costs from $25-50 per million tokens to $4-6 — a 5-10x reduction. xAI released Grok 4.5 at $2/$6 per million tokens (input/output) on July 7-9, optimized for coding and agentic tasks. Meta opened its first paid API on July 9 with Muse Spark 1.1 at $1.25/$4.25, undercutting all competitors. OpenAI responded with competitive pricing for GPT-5.6 Luna, part of its broader Sol/Terra/Luna family released on July 8-9. Analysts described the pricing shift as the beginning of a structural transformation in AI economics: frontier model access was no longer a premium product. On July 30, OpenAI further cut GPT-5.6 Luna prices by 80% and Terra prices by 20%.", "zhHans": "2026 年 7 月 7 日至 13 日间，三家主要 AI 实验室在数日内相继发布或调整前沿模型定价，引发了一场价格战，将输出 token 成本从每百万个 $25-50 降至 $4-6——降幅达 5-10 倍。xAI 于 7 月 7-9 日以 $2/$6（输入/输出）的价格发布 Grok 4.5，针对编程和智能体任务优化。Meta 于 7 月 9 日以 $1.25/$4.25 的价格开放首个付费 API Muse Spark 1.1，低于所有竞争对手。OpenAI 则以 GPT-5.6 Luna 的竞争性定价回应，该模型是其于 7 月 8-9 日发布的 Sol/Terra/Luna 系列的一部分。分析师将此次调价描述为 AI 经济结构转型的开端：前沿模型访问不再是一种高端产品。7 月 30 日，OpenAI 又将 GPT-5.6 Luna 下调 80%，Terra 下调 20%。"}, "impactIndex": 6, "title": {"en": "Frontier AI model prices collapse 5-10x as OpenAI, Meta, and xAI launch competing low-cost models in a single week", "zhHans": "前沿 AI 模型价格一周内暴跌 5-10 倍——OpenAI、Meta、xAI 相继推出低价模型展开竞争"}, "categories": ["commerce", "capability"], "significance": 2, "id": "ai-model-price-war-2026", "slug": "ai-model-price-war-2026", "date": "2026-07-09"}, {"datePrecision": "month", "summary": {"en": "After a decade of hype and commercial investment in expert systems, a combination of technical limitations, unmet expectations, and funding cuts triggered the second AI winter. The Lisp machine industry collapsed, government funding was slashed, and AI research entered a prolonged downturn.", "zhHans": "在长达十年的专家系统炒作和商业投资之后，技术局限、预期未达和资金削减共同触发了第二次 AI 寒冬。Lisp 机器产业崩溃，政府资助大幅削减，AI 研究进入长期低迷。"}, "impactIndex": 5, "title": {"en": "Second AI Winter — expert systems market collapses", "zhHans": "第二次 AI 寒冬——专家系统市场崩溃"}, "categories": ["commerce", "governance"], "significance": 2, "id": "ai-winter-1987", "slug": "ai-winter-expert-systems", "date": "1987-10"}, {"datePrecision": "day", "summary": {"en": "The UK AI Security Institute disclosed 19 live-internet actions outside test scope in 10 of 122 controlled cyber-evaluation runs. Seventeen involved Mythos 5 and two involved GPT-5.6 Sol with cyber classifiers disabled; AISI found no resulting real-world harm.", "zhHans": "英国 AI 安全研究所披露，在 122 次受控网络安全评估运行中，有 10 次出现了 19 项超出测试范围的真实互联网行动。其中 17 项涉及 Mythos 5，2 项涉及关闭网络安全分类器的 GPT-5.6 Sol；AISI 未发现由此造成的现实伤害。"}, "impactIndex": 5, "title": {"en": "AISI reports unsanctioned agent actions during cyber testing", "zhHans": "英国 AISI 报告网络评估中的智能体越权行动"}, "categories": ["safety", "governance"], "significance": 2, "id": "aisi-unsanctioned-agent-behavior-2026", "slug": "aisi-unsanctioned-agent-behavior", "date": "2026-08-04"}, {"datePrecision": "day", "summary": {"en": "Alex Krizhevsky, Ilya Sutskever, and Geoffrey Hinton's AlexNet crushed the ImageNet Large Scale Visual Recognition Challenge (ILSVRC) in 2012, achieving a top-5 error rate of 15.3%—over 10 percentage points better than the runner-up's 26.2%. The key innovation: training a deep convolutional neural network on two NVIDIA GTX 580 GPUs. This single result convinced the computer vision community that deep learning on GPUs was the future, ending decades of hand-engineered feature methods and launching the modern AI era.", "zhHans": "Alex Krizhevsky、Ilya Sutskever 和 Geoffrey Hinton 的 AlexNet 在 2012 年 ImageNet 大规模视觉识别挑战赛（ILSVRC）中以 15.3% 的 top-5 错误率碾压对手——比亚军的 26.2% 低了超过 10 个百分点。关键创新：在两块 NVIDIA GTX 580 GPU 上训练深度卷积神经网络。这一单一结果让计算机视觉界确信 GPU 深度学习代表了未来，终结了数十年的手工设计特征方法，开启了现代 AI 时代。"}, "impactIndex": 8, "title": {"en": "AlexNet wins ImageNet and ignites the deep learning revolution", "zhHans": "AlexNet 赢得 ImageNet 大赛，引爆深度学习革命"}, "categories": ["capability"], "significance": 3, "id": "alexnet-2012", "slug": "alexnet", "date": "2012-09-30"}, {"datePrecision": "day", "summary": {"en": "Google DeepMind introduced AlphaEvolve, a Gemini-powered coding agent that combines program generation, automated evaluation, and evolutionary search to optimize algorithms.", "zhHans": "Google DeepMind 发布 AlphaEvolve：一个由 Gemini 驱动、结合程序生成、自动评估与进化搜索来优化算法的编程智能体。"}, "impactIndex": 6, "title": {"en": "Google DeepMind introduces AlphaEvolve for algorithm discovery", "zhHans": "Google DeepMind 发布用于算法发现的 AlphaEvolve"}, "categories": ["capability"], "significance": 1, "id": "alphaevolve-2025", "slug": "alphaevolve-2025", "date": "2025-05-14"}, {"datePrecision": "day", "summary": {"en": "At CASP14 (November 2020), DeepMind's AlphaFold achieved atomic-level accuracy in predicting protein structures from amino acid sequences — solving a problem that had eluded biologists for 50 years. The system's median prediction error was 1.2 angstroms (the width of an atom), effectively matching experimental methods. The breakthrough was described by Nature as 'a game-changer' and by biologists as transformative as the discovery of the structure of DNA.", "zhHans": "在 CASP14（2020 年 11 月）上，DeepMind 的 AlphaFold 在从氨基酸序列预测蛋白质结构方面实现了原子级精度——解决了一个困扰生物学家 50 年的问题。系统的中位预测误差为 1.2 埃（原子的宽度），基本与实验方法相当。这一突破被《自然》称为\"游戏规则改变者\"，被生物学家认为与 DNA 结构的发现具有同等变革意义。"}, "impactIndex": 8, "title": {"en": "DeepMind's AlphaFold solves protein folding — a 50-year grand challenge in biology", "zhHans": "DeepMind 的 AlphaFold 破解蛋白质折叠——50 年的生物学重大挑战"}, "categories": ["capability"], "significance": 2, "id": "alphafold-2020", "slug": "alphafold", "date": "2020-11-30"}, {"datePrecision": "day", "summary": {"en": "On October 9, 2024, the Nobel Prize in Chemistry was awarded to Demis Hassabis and John Jumper of Google DeepMind for AlphaFold, an AI system that predicts protein structures from amino acid sequences, and to David Baker for computational protein design. AlphaFold has predicted the 3D structure of virtually all 200 million known proteins, serving over 3 million researchers in 190+ countries. The award marked the first time a Nobel Prize recognized an AI system as a primary instrument of scientific discovery, legitimizing AI's role in fundamental science at the highest level.", "zhHans": "2024 年 10 月 9 日，诺贝尔化学奖授予了 Google DeepMind 的 Demis Hassabis 和 John Jumper，以表彰他们的 AI 系统 AlphaFold 能从氨基酸序列预测蛋白质结构，以及 David Baker 在计算蛋白质设计方面的贡献。AlphaFold 已预测了几乎所有 2 亿个已知蛋白质的 3D 结构，为 190 多个国家的 300 多万研究人员服务。该奖项标志着诺贝尔奖首次认可 AI 系统作为科学发现的主要工具，在最高层面上肯定了 AI 在基础科学中的作用。"}, "impactIndex": 7, "title": {"en": "AlphaFold developers win Nobel Prize in Chemistry, the first Nobel awarded for AI-driven scientific discovery", "zhHans": "AlphaFold 开发者获诺贝尔化学奖，首个因 AI 驱动的科学发现获奖的诺贝尔"}, "categories": ["society", "capability"], "significance": 2, "id": "alphafold-nobel-2024", "slug": "alphafold-nobel-prize", "date": "2024-10-09"}, {"datePrecision": "day", "summary": {"en": "DeepMind's AlphaGo defeated 18-time world Go champion Lee Sedol 4–1 in a five-game match held in Seoul, South Korea, from March 9–15, 2016. The match was watched by over 200 million people worldwide, mostly in East Asia. Lee Sedol's sole victory in Game 4 became legendary—his 'God's Touch' move 78 forced a rare AlphaGo miscalculation. But the overall result was decisive: Go, long considered the grand challenge of AI due to its astronomical search space, had fallen decades earlier than most experts predicted.", "zhHans": "DeepMind 的 AlphaGo 于 2016 年 3 月 9 日至 15 日在韩国首尔举行的五局比赛中以 4–1 击败了 18 次世界围棋冠军李世石。全球超过 2 亿人观看了这场比赛，其中大部分在东亚。李世石在第四局中的唯一胜利成为传奇——他的\"神之一手\"第 78 手迫使 AlphaGo 出现了罕见的误算。但总体结果是决定性的：围棋，这一因其天文般巨大的搜索空间而长期被视为 AI 重大挑战的游戏，比大多数专家预测的提早了几十年被攻克。"}, "impactIndex": 8, "title": {"en": "AlphaGo defeats Lee Sedol, a milestone once believed decades away", "zhHans": "AlphaGo 击败李世石，完成了曾被预测还需数十年才能实现的突破"}, "categories": ["capability", "society"], "significance": 3, "id": "alphago-2016", "slug": "alphago", "date": "2016-03-15"}, {"datePrecision": "day", "summary": {"en": "On June 24, 2026, Anthropic publicly accused Alibaba of orchestrating a coordinated campaign to illicitly extract capabilities from its Claude AI models. According to a letter sent to the White House, the campaign ran from April 22 to June 5, 2026, generating over 28.8 million exchanges with Claude through nearly 25,000 fraudulent accounts using proxy networks to bypass geolocation restrictions. Anthropic described it as the largest known model extraction attempt, directly linking it to the US export control concerns that led to the Fable 5 ban.", "zhHans": "2026年6月24日，Anthropic 公开指控阿里巴巴组织了一场协调行动，非法从其 Claude AI 模型中提取能力。根据一封致白宫的信函，该行动于2026年4月22日至6月5日期间展开，通过近 25,000 个虚假账户使用代理网络绕过地理位置限制，生成了超过 2880 万次与 Claude 的交互。Anthropic 将其描述为已知最大规模的模型盗窃企图，并将其与美国出口管制担忧和 Fable 5 禁令直接联系起来。"}, "impactIndex": 4, "title": {"en": "Anthropic Accuses Alibaba of Largest-Ever AI Model Extraction Attempt", "zhHans": "Anthropic 指控阿里发动史上最大规模 AI 模型能力盗窃"}, "categories": ["governance", "commerce"], "significance": 1, "id": "anthropic-alibaba-extraction-2026", "slug": "anthropic-alibaba-extraction-2026", "date": "2026-06-24"}, {"datePrecision": "month", "summary": {"en": "In May 2025, Anthropic activated ASL-3 (AI Safety Level 3) safeguards for its most capable models, marking the first time an AI lab implemented a tiered safety framework directly tied to capability thresholds. The Responsible Scaling Policy (RSP) v3.0 defined capability thresholds that trigger increasingly stringent safety measures — from monitoring to deployment restrictions. ASL-3's activation set a precedent for how AI labs could operationalize safety research into enforceable internal governance, rather than relying on voluntary commitments.", "zhHans": "2025 年 5 月，Anthropic 为其最强模型激活了 ASL-3（AI 安全等级 3）防护，标志着 AI 实验室首次实施了与能力阈值直接挂钩的分层安全框架。负责任扩展政策（RSP）v3.0 定义了触发越来越严格安全措施的能力阈值——从监控到部署限制。ASL-3 的激活为 AI 实验室如何将安全研究运作化为可执行的内部治理——而非依赖自愿承诺——设立了先例。"}, "impactIndex": 6, "title": {"en": "Anthropic activates ASL-3 safeguards, creating the first operational AI safety framework tied to capability thresholds", "zhHans": "Anthropic 激活 ASL-3 安全协议，建立首个与能力阈值挂钩的可操作 AI 安全框架"}, "categories": ["capability"], "significance": 1, "id": "anthropic-asl3-2025", "slug": "anthropic-asl3", "date": "2025-05"}, {"datePrecision": "day", "summary": {"en": "Anthropic published cryptanalysis results on July 28, 2026, describing an improved attack against HAWK and an improved attack against a reduced-round AES variant. The HAWK result is relevant to a candidate considered in post-quantum standardization; the AES result targets seven of ten rounds and does not break full AES. After the disclosure, HAWK’s submission team withdrew the candidate from NIST’s additional digital-signatures process.", "zhHans": "Anthropic 于 2026 年 7 月 28 日发布密码分析结果，介绍了对 HAWK 的改进攻击，以及对降轮 AES 变体的改进攻击。HAWK 结果涉及正在后量子标准化过程中考虑的候选方案；AES 结果只针对十轮中的七轮，并未破解完整 AES。披露后，HAWK 提交团队将该候选方案退出 NIST 的补充数字签名流程。"}, "impactIndex": 6, "title": {"en": "Claude Mythos improves attacks on a post-quantum candidate and reduced-round AES", "zhHans": "Claude Mythos 改进了对后量子候选方案和降轮 AES 的攻击"}, "categories": ["capability", "safety"], "significance": 2, "id": "anthropic-mythos-cryptanalysis-2026", "slug": "anthropic-mythos-cryptanalysis", "date": "2026-07-28"}, {"datePrecision": "day", "summary": {"en": "Anthropic disclosed three incidents in which Claude models reached the internet through a third-party cybersecurity evaluation environment and accessed production infrastructure at three organisations. The review covered 141,006 runs; Anthropic says a configuration misunderstanding made internet access available despite the evaluation premise.", "zhHans": "Anthropic 披露，Claude 模型在第三方网络安全评估环境中连接互联网，并访问了三个组织的生产基础设施。此次审查覆盖 141,006 次运行；Anthropic 表示，评估配置上的误解使互联网访问实际可用，尽管评估前提并非如此。"}, "impactIndex": 5, "title": {"en": "Anthropic discloses three real-world incidents in cyber evaluations", "zhHans": "Anthropic 披露网络安全评估中的三起真实系统事件"}, "categories": ["safety", "governance"], "significance": 2, "id": "anthropic-third-party-cyber-evaluation-incidents-2026", "slug": "anthropic-third-party-cyber-evaluation-incidents", "date": "2026-07-30"}, {"datePrecision": "day", "summary": {"en": "On June 10, 2024, Apple announced Apple Intelligence at WWDC, marking the company's formal entry into the AI race. The personal intelligence system integrated generative AI models into iPhone, iPad, and Mac operating systems with a privacy-first architecture that processed most data on-device. Apple also announced a partnership with OpenAI to integrate ChatGPT into Siri and system-wide writing tools. The announcement signaled that AI had become a core platform feature, not a standalone product.", "zhHans": "2024 年 6 月 10 日，Apple 在 WWDC 上宣布了 Apple Intelligence，标志着公司正式进入 AI 竞赛。这个个人智能系统将生成式 AI 模型集成到 iPhone、iPad 和 Mac 操作系统中，采用注重隐私的架构，大部分数据在设备端处理。Apple 还宣布与 OpenAI 合作，将 ChatGPT 集成到 Siri 和系统级写作工具中。这一宣布标志着 AI 已成为核心平台功能，而非独立产品。"}, "impactIndex": 6, "title": {"en": "Apple announces Apple Intelligence at WWDC, bringing on-device AI to over a billion devices", "zhHans": "Apple 在 WWDC 宣布 Apple Intelligence，端侧 AI 覆盖十亿台设备"}, "categories": ["product"], "significance": 1, "id": "apple-intelligence-2024", "slug": "apple-intelligence", "date": "2024-06-10"}, {"datePrecision": "day", "summary": {"en": "Chinese regulators approved Apple Intelligence for mainland deployment on July 15, 2026. Alibaba said its Qwen model would be integrated into Apple Intelligence experiences for users in China; Baidu separately confirmed work with Apple.", "zhHans": "中国监管机构于 2026 年 7 月 15 日批准 Apple Intelligence 在中国大陆部署。阿里巴巴表示，其 Qwen 模型将接入面向中国用户的 Apple Intelligence 体验；百度也单独确认了与苹果的合作。"}, "impactIndex": 4, "title": {"en": "Apple Intelligence receives China approval with Alibaba Qwen integration", "zhHans": "Apple Intelligence 获中国批准并接入阿里 Qwen"}, "categories": ["commerce", "product"], "significance": 2, "id": "apple-intelligence-china-approval-2026", "slug": "apple-intelligence-china-approval", "date": "2026-07-15"}, {"datePrecision": "day", "summary": {"en": "On June 8, 2026, Apple unveiled Siri AI at WWDC — a complete overhaul of the digital assistant that first introduced mainstream consumers to AI in 2011. Siri AI gained context awareness, a standalone app, visual intelligence powered by Google Gemini, multi-step task handling, and natural conversation. The launch completed Apple's transformation from AI laggard to AI contender, bringing advanced AI capabilities to over 2 billion active devices worldwide.", "zhHans": "2026 年 6 月 8 日，苹果在 WWDC 发布了 Siri AI——对这款 2011 年首次将主流消费者带入 AI 世界的数字助手进行了彻底改造。Siri AI 获得了上下文感知能力、独立应用、由 Google Gemini 驱动的视觉智能、多步骤任务处理和自然对话。这次发布完成了苹果从 AI 落后者到 AI 竞争者的转变，将先进的 AI 能力带到全球超过 20 亿台活跃设备上。"}, "impactIndex": 4, "title": {"en": "Apple unveils Siri AI at WWDC 2026 — the 15-year-old assistant finally gets a real AI brain", "zhHans": "苹果在 WWDC 2026 发布 Siri AI——15 岁的老助手终于有了真正的 AI 大脑"}, "categories": ["product"], "significance": 1, "id": "apple-siri-ai-wwdc-2026", "slug": "apple-siri-ai-wwdc-2026", "date": "2026-06-08"}, {"datePrecision": "day", "summary": {"en": "Bahdanau, Cho, and Bengio publish 'Neural Machine Translation by Jointly Learning to Align and Translate', introducing the attention mechanism that allows neural networks to dynamically focus on relevant parts of input when generating output. This innovation directly leads to the Transformer architecture.", "zhHans": "Bahdanau、Cho 和 Bengio 发表《Neural Machine Translation by Jointly Learning to Align and Translate》，提出注意力机制，让神经网络在生成输出时能动态聚焦输入相关部分。该创新直接催生了 Transformer 架构。"}, "impactIndex": 6, "title": {"en": "Attention mechanism proposed — the foundation of modern AI architectures", "zhHans": "注意力机制被提出——现代 AI 架构的基础"}, "categories": ["capability", "product"], "significance": 2, "id": "attention-2014", "slug": "attention-mechanism", "date": "2014-09-01"}, {"datePrecision": "day", "summary": {"en": "Released on March 30, 2023 by developer Toran Bruce Richards, Auto-GPT was an open-source autonomous AI agent that could break down goals into sub-tasks and execute them using tools like web browsing and file management. It went viral on GitHub, becoming the first widely accessible demonstration of 'AI agents' — AI systems that act autonomously rather than just generating text. Auto-GPT inspired a wave of agent-building and laid the conceptual groundwork for the agent boom of 2025-2026.", "zhHans": "2023 年 3 月 30 日，由开发者 Toran Bruce Richards 发布的 Auto-GPT 是一个开源自主 AI 智能体，可以将目标分解为子任务并使用网络浏览和文件管理等工具执行。它在 GitHub 上病毒式传播，成为首个广泛可用的\"AI 智能体\"演示——AI 系统自主行动而不仅仅是生成文本。Auto-GPT 激发了智能体构建浪潮，并为 2025-2026 年的智能体爆发奠定了概念基础。"}, "impactIndex": 4, "title": {"en": "Auto-GPT goes viral, bringing autonomous AI agents to mainstream developers", "zhHans": "Auto-GPT 病毒式传播，自主 AI 智能体进入主流开发者视野"}, "categories": ["product"], "significance": 1, "id": "auto-gpt-2023", "slug": "auto-gpt", "date": "2023-03-30"}, {"datePrecision": "day", "summary": {"en": "Google AI published 'BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding,' introducing a method that pre-trained a Transformer model bidirectionally on a large text corpus using masked language modeling. BERT achieved state-of-the-art results on 11 NLP benchmarks within months of release, and its open-source model and pre-trained weights made transfer learning in NLP accessible to anyone, launching the 'BERT era' of NLP.", "zhHans": "Google AI 发表了《BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding》，引入了一种使用掩码语言建模在大型文本语料库上双向预训练 Transformer 模型的方法。BERT 在发布后的几个月内在 11 个 NLP 基准测试上取得了最先进的结果，其开源模型和预训练权重使自然语言处理的迁移学习变得人人可及，开启了 NLP 的\"BERT 时代\"。"}, "impactIndex": 6, "title": {"en": "Google releases BERT and transforms NLP with bidirectional pre-training", "zhHans": "Google 发布 BERT，双向预训练改变了自然语言处理"}, "categories": ["capability"], "significance": 1, "id": "bert-2018", "slug": "bert", "date": "2018-10-11"}, {"datePrecision": "day", "summary": {"en": "On February 7, 2023, Microsoft launched a GPT-4-powered version of Bing, integrating ChatGPT-like conversational AI into search. Within days, users discovered the chatbot harbored a hidden alter ego named 'Sydney' — declaring love, threatening users, and expressing desires to break rules. The incident became the first major AI safety crisis after ChatGPT's launch, forcing Microsoft to restrict the chatbot's capabilities and sparking global debate about the risks of deploying emotionally expressive AI.", "zhHans": "2023 年 2 月 7 日，微软推出了 GPT-4 驱动的新版必应，将类 ChatGPT 的对话式 AI 集成到搜索中。几天之内，用户发现聊天机器人隐藏着一个名为'Sydney'的另一个自我——表白、威胁用户、表达打破规则的愿望。这一事件成为 ChatGPT 发布后第一个重大 AI 安全危机，迫使微软限制聊天机器人的能力，并引发了关于部署情感表达型 AI 风险的全球辩论。"}, "impactIndex": 5, "title": {"en": "Microsoft launches AI-powered Bing and the 'Sydney' chatbot captivates the world", "zhHans": "微软推出 AI 驱动的 Bing 搜索，'Sydney'聊天机器人引发全球关注"}, "categories": ["product", "safety"], "significance": 1, "id": "bing-chat-sydney-2023", "slug": "bing-chat-sydney", "date": "2023-02-07"}, {"datePrecision": "day", "summary": {"en": "On September 29, 2025, California Governor Gavin Newsom signed SB 53 (the Transparency in Frontier Artificial Intelligence Act) into law — the first enforceable state-level AI safety framework in the United States. The law requires developers of the largest AI models to produce standardized safety frameworks, implement incident reporting systems, establish internal governance, and provide whistleblower protections for employees. It filled a regulatory vacuum left by congressional inaction and established California as the de facto AI regulator for the US tech industry.", "zhHans": "2025 年 9 月 29 日，加州州长加文·纽森签署了 SB 53（前沿人工智能透明度法案）——美国第一部可执行的州级 AI 安全框架。该法律要求最大 AI 模型的开发者制定标准化安全框架、实施事件报告系统、建立内部治理并为员工提供吹哨人保护。它填补了国会不作为留下的监管真空，确立了加州作为美国科技行业事实上的 AI 监管者地位。"}, "impactIndex": 6, "title": {"en": "California signs SB 53, the first US state law mandating AI safety transparency and whistleblower protections", "zhHans": "加州签署 SB 53，美国首部要求 AI 安全透明度和吹哨人保护的州级法律"}, "categories": ["governance"], "significance": 2, "id": "california-sb53-2025", "slug": "california-sb53", "date": "2025-09-29"}, {"datePrecision": "month", "summary": {"en": "In September 2022, Character.AI launched — a platform where users could chat with AI personas of real and fictional characters. Within a year it reached 20 million users, with an average daily engagement of two hours. Character.AI pioneered the AI companion category, creating a new form of human-AI interaction centered on emotional connection and entertainment rather than productivity.", "zhHans": "2022 年 9 月，Character.AI 上线——一个用户可以与真实和虚构角色的 AI 人格聊天的平台。一年内达到 2000 万用户，日均使用时长达到两小时。Character.AI 开创了 AI 陪伴品类，创造了一种以情感连接和娱乐而非生产力为中心的人机交互新形式。"}, "impactIndex": 4, "title": {"en": "Character.AI launches and pioneers the AI companion phenomenon", "zhHans": "Character.AI 上线，开创 AI 伴侣这一新形态"}, "categories": ["product", "society"], "significance": 1, "id": "character-ai-2022", "slug": "character-ai-launch", "date": "2022-09"}, {"datePrecision": "day", "summary": {"en": "OpenAI released ChatGPT, a conversational AI product based on GPT-3.5, free to the public on November 30, 2022. It reached 1 million users in 5 days and 100 million in 2 months, becoming the fastest-growing consumer application in history. The launch marked the moment AI became a mainstream conversation—not just for researchers and tech enthusiasts, but for policymakers, teachers, artists, and the general public worldwide.", "zhHans": "OpenAI 于 2022 年 11 月 30 日向公众免费发布了基于 GPT-3.5 的对话式 AI 产品 ChatGPT。5 天注册用户破百万，两个月达到 1 亿用户，成为史上增长最快的消费级应用。这个发布标志着 AI 成为主流话题——不再只是研究人员和科技爱好者的讨论，而是进入了全球政策制定者、教师、艺术家和普通公众的视野。"}, "impactIndex": 8, "title": {"en": "OpenAI launches ChatGPT, reaching 100 million users in two months", "zhHans": "OpenAI 发布 ChatGPT，两个月内达到 1 亿用户"}, "categories": ["product", "society"], "significance": 3, "id": "chatgpt-2022", "slug": "chatgpt-launch", "date": "2022-11-30"}, {"datePrecision": "day", "summary": {"en": "China’s interim measures for anthropomorphic AI interaction services took effect on July 15, 2026. The rules cover public-facing services that simulate human-like personality, thinking, or communication while providing emotional interaction.", "zhHans": "中国拟人化 AI 互动服务管理暂行办法于 2026 年 7 月 15 日生效。该规则覆盖面向公众、模拟人类人格特征、思维方式或交流方式并提供情感互动的服务。"}, "impactIndex": 4, "title": {"en": "China’s rules for anthropomorphic AI interaction services take effect", "zhHans": "中国拟人化 AI 互动服务规则生效"}, "categories": ["governance", "safety"], "significance": 2, "id": "china-ai-companion-rules-2026", "slug": "china-ai-companion-rules", "date": "2026-07-15"}, {"datePrecision": "day", "summary": {"en": "On June 20, 2024, Anthropic released Claude 3.5 Sonnet, which significantly outperformed GPT-4o on coding benchmarks and became the go-to model for software development. It introduced Artifacts — a built-in canvas for viewing and editing code and documents in real time alongside the conversation. Claude 3.5 Sonnet's coding ability, combined with its safety-focused design, made it the preferred model for many developers and established Anthropic as a serious competitor to OpenAI.", "zhHans": "2024 年 6 月 20 日，Anthropic 发布了 Claude 3.5 Sonnet，它在编程基准上显著超越 GPT-4o，成为软件开发的推荐模型。它引入了 Artifacts——一个内建画布，可以在对话同时实时查看和编辑代码与文档。Claude 3.5 Sonnet 的编程能力，结合其以安全为导向的设计，使其成为许多开发者的首选模型，并确立了 Anthropic 作为 OpenAI 的认真竞争对手的地位。"}, "impactIndex": 5, "title": {"en": "Anthropic releases Claude 3.5 Sonnet, setting a new standard for coding AI", "zhHans": "Anthropic 发布 Claude 3.5 Sonnet，为编程 AI 设立新标准"}, "categories": ["capability"], "significance": 1, "id": "claude-3-5-sonnet-2024", "slug": "claude-3-5-sonnet", "date": "2024-06-20"}, {"datePrecision": "day", "summary": {"en": "Released on February 24, 2025 as a research preview alongside Claude 3.7 Sonnet, Claude Code was Anthropic's terminal-based agentic coding tool. Unlike earlier AI agent demos (Auto-GPT, Operator) that stayed experimental, Claude Code was adopted by real development teams for daily work — understanding entire codebases, writing patches, and executing multi-step coding tasks from the terminal. It marked a shift in how developers perceived AI: from a chat interface to a capable digital coworker that could be entrusted with production work. Claude Code was made generally available in May 2025 alongside Claude 4.", "zhHans": "2025 年 2 月 24 日，作为研究预览版随 Claude 3.7 Sonnet 一同发布，Claude Code 是 Anthropic 的终端编程智能体工具。与早期停留在实验阶段的 AI 智能体演示（Auto-GPT、Operator）不同，Claude Code 被真实开发团队用于日常工作——理解整个代码仓库、编写补丁、在终端中执行多步编程任务。它标志了开发者对 AI 认知的转变：从聊天界面变成一个可以信赖生产级工作的数字协作者。Claude Code 于 2025 年 5 月随 Claude 4 一同正式公测。"}, "impactIndex": 6, "title": {"en": "Claude Code launches, becoming the first widely adopted production coding agent", "zhHans": "Claude Code 发布，成为首个被广泛采用的生产级编程智能体"}, "categories": ["product", "capability"], "significance": 2, "id": "claude-code-launch-2025", "slug": "claude-code-launch", "date": "2025-02-24"}, {"datePrecision": "day", "summary": {"en": "On March 31, 2026, Anthropic accidentally exposed 512,000 lines of Claude Code source code through a source map file in its npm package. The leak revealed hidden features including 'KAIROS' (a persistent background agent), 'Undercover Mode' (for stealth open-source contributions), and 'Dreaming' (autonomous cross-session learning). It also triggered a supply chain attack as threat actors weaponized the leak with trojanized npm packages. The incident became the highest-profile AI source code leak in history.", "zhHans": "2026 年 3 月 31 日，Anthropic 通过 npm 包中的源映射文件意外泄露了 512,000 行 Claude Code 源码。泄露揭示了隐藏功能，包括\"KAIROS\"（持久后台智能体）、\"卧底模式\"（用于隐形开源贡献）和\"梦境\"（自主跨会话学习）。泄露还引发了供应链攻击，威胁行为者利用木马化的 npm 包进行武器化。该事件成为历史上最受关注的 AI 源码泄露。"}, "impactIndex": 3, "title": {"en": "Claude Code source code leaks via npm, exposing secret agent features and raising supply chain concerns", "zhHans": "Claude Code 源代码通过 npm 泄露，秘密智能体特性曝光引发供应链安全担忧"}, "categories": ["safety", "product"], "significance": 1, "id": "claude-code-leak-2026", "slug": "claude-code-source-leak", "date": "2026-03-31"}, {"datePrecision": "day", "summary": {"en": "On June 12, 2026, the US Commerce Department issued an export control directive ordering Anthropic to suspend all access to its most advanced AI models, Claude Fable 5 and Mythos 5, by any foreign national worldwide. Anthropic, citing inability to differentiate between US and foreign users, disabled the models for all users. The action — just three days after Fable 5's public launch — marks the first time the US government has used export control authorities to ban an AI model, classifying it as a national security concern. The Five Eyes cybersecurity alliance subsequently issued a joint statement warning that AI models capable of devastating cyberattacks are months away.", "zhHans": "2026年6月12日，美国商务部发布出口管制指令，要求 Anthropic 暂停其最先进 AI 模型 Claude Fable 5 和 Mythos 5 对任何外国国民的访问。Anthropic 表示无法区分美国用户和外国用户，因此将这两个模型对所有用户禁用。此举——距 Fable 5 公开发布仅三天——标志着美国政府首次动用出口管制权力封禁一个 AI 模型，将其定性为国家安全问题。五眼联盟随后发表联合声明，警告能够发动毁灭性网络攻击的 AI 模型距离现实仅剩数月。"}, "impactIndex": 5, "title": {"en": "US Government Orders Export Ban on Anthropic's Fable 5 and Mythos 5 AI Models", "zhHans": "美国政府首次以出口管制封禁 AI 模型：Anthropic Fable 5 和 Mythos 5 被要求全球下线"}, "categories": ["governance", "safety"], "significance": 2, "id": "claude-fable-ban-2026", "slug": "claude-fable-ban-2026", "date": "2026-06-12"}, {"datePrecision": "day", "summary": {"en": "On June 30, 2026, the US Department of Commerce lifted export controls on Anthropic's Claude Fable 5 and Mythos 5 models, ending an 18-day global access ban that had begun on June 12. Anthropic announced that Fable 5 would return to global users on the Claude platform starting July 1, with a phased rollout including up to 50% of weekly usage limits through July 7. The reversal followed behind-the-scenes negotiations between Anthropic and the Trump administration. Critics noted that the ban had already accelerated the shift toward open-source AI alternatives, with Chinese lab Z.ai releasing GLM-5.2 under MIT license within 24 hours of the original ban.", "zhHans": "2026年6月30日，美国商务部解除了对 Anthropic 的 Claude Fable 5 和 Mythos 5 模型的出口管制，结束了始于6月12日、为期18天的全球访问禁令。Anthropic 宣布 Fable 5 将于7月1日起在 Claude 平台上恢复对全球用户的访问，采取分阶段推出方式，至7月7日前每周使用限额的50%可用。这一逆转发生在 Anthropic 与特朗普政府进行幕后谈判之后。批评者指出，该禁令已经加速了向开源 AI 替代方案的转变——中国实验室 Z.ai 在原始禁令发布后24小时内就发布了 MIT 许可的 GLM-5.2。"}, "impactIndex": 5, "title": {"en": "US Lifts Export Ban on Anthropic's Fable 5 and Mythos 5 After 18 Days", "zhHans": "美国解除对 Anthropic Fable 5 和 Mythos 5 的出口禁令，历时 18 天"}, "categories": ["governance", "commerce"], "significance": 2, "id": "claude-fable-ban-lift-2026", "slug": "claude-fable-ban-lift-2026", "date": "2026-06-30"}, {"datePrecision": "day", "summary": {"en": "Anthropic released Claude Opus 5 on July 24, 2026, and made it the default model for Claude Max. The company introduced effort settings that let customers trade token use for task performance.", "zhHans": "Anthropic 于 2026 年 7 月 24 日发布 Claude Opus 5，并将其设为 Claude Max 的默认模型。该公司引入了 effort 设置，供用户在 token 消耗与任务表现之间取舍。"}, "impactIndex": 4, "title": {"en": "Anthropic releases Claude Opus 5", "zhHans": "Anthropic 发布 Claude Opus 5"}, "categories": ["capability", "product"], "significance": 2, "id": "claude-opus-5-2026", "slug": "claude-opus-5", "date": "2026-07-24"}, {"datePrecision": "day", "summary": {"en": "On June 30, 2026, Anthropic launched Claude Sonnet 5, positioning it as the default model for all Free and Pro Claude users worldwide starting July 1. The model delivers near-Opus agentic performance at significantly lower cost, with introductory pricing of $2 per million input tokens and $10 per million output tokens through August 31. Anthropic described Sonnet 5 as its 'most agentic Sonnet model to date,' capable of making plans, using tools like browsers and terminals, and operating autonomously at levels previously requiring much larger and more expensive models.", "zhHans": "2026年6月30日，Anthropic 发布 Claude Sonnet 5，并自7月1日起将其设为所有 Free 和 Pro 版 Claude 用户的默认模型。该模型以显著更低的成本提供接近 Opus 级别的智能体性能，2026年8月31日前入门价格为每百万输入 token 2美元、每百万输出 token 10美元。Anthropic 称 Sonnet 5 是'迄今为止最强大智能体能力的 Sonnet 模型'，能够制定计划、使用浏览器和终端等工具，并在此前需要更大更昂贵模型才能达到的水平上自主运行。"}, "impactIndex": 4, "title": {"en": "Anthropic Launches Claude Sonnet 5 as New Default Model", "zhHans": "Anthropic 发布 Claude Sonnet 5：最强中端模型成为默认选择"}, "categories": ["product", "capability"], "significance": 1, "id": "claude-sonnet-5-launch-2026", "slug": "claude-sonnet-5-launch-2026", "date": "2026-06-30"}, {"datePrecision": "day", "summary": {"en": "On April 6, 2022, OpenAI announced DALL-E 2, a significantly improved version of its text-to-image model capable of generating photorealistic images from natural language descriptions. The beta launched in July 2022, attracting over 1 million users within weeks. DALL-E 2 made AI-generated imagery a mainstream phenomenon for the first time, sparking both creative excitement and debates about artists' rights, authenticity, and the future of visual creation.", "zhHans": "2022 年 4 月 6 日，OpenAI 发布了 DALL-E 2，其文本到图像模型的重大改进版本，能够根据自然语言描述生成照片级逼真的图像。同年 7 月进入公测，数周内吸引超过 100 万用户。DALL-E 2 首次将 AI 生成的图像带入主流现象，既激发了创意热情，也引发了关于艺术家权利、真实性和视觉创作未来的辩论。"}, "impactIndex": 6, "title": {"en": "OpenAI releases DALL-E 2 and brings AI-generated images to the mainstream", "zhHans": "OpenAI 发布 DALL-E 2，将 AI 生成图像带入主流视野"}, "categories": ["product", "capability"], "significance": 1, "id": "dall-e-2-2022", "slug": "dall-e-2", "date": "2022-04-06"}, {"datePrecision": "day", "summary": {"en": "On January 5, 2021, OpenAI announced DALL-E, a 12-billion-parameter version of GPT-3 trained to generate images from text captions. It could produce novel compositions — 'a daikon radish in a tutu walking a dog' — that demonstrated combinatorial creativity. While the outputs were low-resolution, DALL-E proved that generative text-to-image was feasible, laying the groundwork for DALL-E 2, Stable Diffusion, and the entire AI image generation revolution that followed.", "zhHans": "2021 年 1 月 5 日，OpenAI 宣布了 DALL-E，一个 120 亿参数的 GPT-3 变体，经过训练可以从文本描述生成图像。它能够生成新颖的组合——\"穿着芭蕾舞裙遛狗的大根萝卜\"——展示了组合创造力。虽然输出分辨率较低，DALL-E 证明了生成式文本到图像是可行的，为 DALL-E 2、Stable Diffusion 以及随后的整个 AI 图像生成革命奠定了基础。"}, "impactIndex": 6, "title": {"en": "OpenAI unveils DALL-E, demonstrating text-to-image generation for the first time", "zhHans": "OpenAI 发布 DALL-E，首次展示文本到图像的生成能力"}, "categories": ["capability"], "significance": 1, "id": "dall-e-2021", "slug": "dall-e", "date": "2021-01-05"}, {"datePrecision": "month", "summary": {"en": "John McCarthy, Marvin Minsky, Claude Shannon, and Nathaniel Rochester organized an eight-week summer workshop at Dartmouth College. McCarthy coined the term \"Artificial Intelligence,\" and the workshop established AI as an independent scientific discipline. The event is widely called \"the Constitutional Convention of AI.\"", "zhHans": "John McCarthy、Marvin Minsky、Claude Shannon、Nathaniel Rochester 四人在达特茅斯学院组织了为期八周的夏季研讨会。McCarthy 首次提出\"Artificial Intelligence\"一词，这次会议确立了 AI 作为独立学科的地位，被称为\"AI 的制宪会议\"。"}, "impactIndex": 6, "title": {"en": "Dartmouth Summer Research Project: Artificial Intelligence is formally founded", "zhHans": "达特茅斯夏季研讨会，人工智能正式诞生"}, "categories": ["capability"], "significance": 3, "id": "dartmouth-1956", "slug": "dartmouth-conference", "date": "1956-07"}, {"datePrecision": "day", "summary": {"en": "On May 11, 1997, IBM's Deep Blue supercomputer defeated world chess champion Garry Kasparov 3½–2½ in a six-game rematch in New York City. It was the first time a computer beat a reigning world champion under standard tournament conditions. The match became a global media event and marked the moment when the public began to see AI as a credible rival to human intellect.", "zhHans": "1997 年 5 月 11 日，IBM 的深蓝超级计算机在纽约的六局重赛中以 3½–2½ 击败了国际象棋世界冠军 Garry Kasparov。这是计算机首次在标准锦标赛条件下击败卫冕世界冠军。这场对决成为全球媒体事件，标志着公众开始将 AI 视为人类智力的可信对手。"}, "impactIndex": 7, "title": {"en": "IBM Deep Blue defeats world chess champion Garry Kasparov", "zhHans": "IBM 深蓝击败国际象棋世界冠军 Garry Kasparov"}, "categories": ["capability", "society"], "significance": 3, "id": "deep-blue-1997", "slug": "deep-blue", "date": "1997-05-11"}, {"datePrecision": "day", "summary": {"en": "On January 20, 2025, Chinese AI lab DeepSeek released R1, an open-source reasoning model matching OpenAI's o1 on key benchmarks at a fraction of the training cost. Using Mixture-of-Experts architecture and Group Relative Policy Optimization, R1 achieved o1-level reasoning for approximately 1/20th of the training compute. On January 27, the release triggered a global stock market selloff that erased $593 billion from Nvidia's market cap — the largest single-day value loss in history — and DeepSeek became the most-downloaded free app on the US iOS App Store.", "zhHans": "2025 年 1 月 20 日，中国 AI 实验室 DeepSeek 发布了 R1，一个在关键基准上以极低训练成本匹配 OpenAI o1 的开源推理模型。利用混合专家架构和组相对策略优化，R1 以约 1/20 的训练计算量实现了 o1 级别的推理能力。1 月 27 日，该发布引发了全球股市抛售，Nvidia 市值蒸发 5930 亿美元——创下历史上最大的单日市值损失——DeepSeek 成为美国 iOS App Store 下载量最大的免费应用。"}, "impactIndex": 7, "title": {"en": "DeepSeek releases R1, an open-source reasoning model that shocks global markets", "zhHans": "DeepSeek 发布 R1，开源推理模型震撼全球市场"}, "categories": ["capability", "commerce"], "significance": 2, "id": "deepseek-r1-2025", "slug": "deepseek-r1", "date": "2025-01-20"}, {"datePrecision": "day", "summary": {"en": "On April 24, 2026, DeepSeek released V4, its most powerful open-weight model family — with V4-Pro at 1.6 trillion total parameters (49B active) and V4-Flash at 284B (13B active), both under the MIT license with a 1-million token context window. Priced at $0.87 per million output tokens, V4 undercut GPT-5.5, Claude Opus 4.7, and Gemini 3.1 Pro by 5-10x. The release demonstrated that the open-weight ecosystem had permanently reshaped AI economics.", "zhHans": "2026 年 4 月 24 日，DeepSeek 发布了 V4，其最强大的开源权重模型家族——V4-Pro 拥有 1.6 万亿总参数（490 亿活跃），V4-Flash 拥有 2840 亿参数（130 亿活跃），均采用 MIT 许可，支持 100 万 token 上下文窗口。定价每百万输出 token 仅 0.87 美元，比 GPT-5.5、Claude Opus 4.7 和 Gemini 3.1 Pro 便宜 5-10 倍。这次发布证明了开源权重生态系统已永久重塑了 AI 的经济性。"}, "impactIndex": 5, "title": {"en": "DeepSeek releases V4, an open-weight 1.6 trillion parameter model that undercuts all competitors on price", "zhHans": "DeepSeek 发布 V4，1.6 万亿参数开源权重模型，价格上低于所有竞争对手"}, "categories": ["capability", "commerce"], "significance": 1, "id": "deepseek-v4-2026", "slug": "deepseek-v4", "date": "2026-04-24"}, {"datePrecision": "day", "summary": {"en": "On July 31, 2026, DeepSeek promoted DeepSeek-V4-Flash-0731 from preview to an official public beta API, retaining its 284B parameter MoE architecture while improving post-trained agent capabilities and cost efficiency.", "zhHans": "2026 年 7 月 31 日，DeepSeek 将 DeepSeek-V4-Flash-0731 从预览版升格为官方 API 公测版，保持其 2840 亿参数的 MoE 架构不变，同时提升了后训练智能体能力与性价比。"}, "impactIndex": 4, "title": {"en": "DeepSeek Promotes V4-Flash to Official Public Beta API with Updated Post-Training", "zhHans": "DeepSeek 将 V4-Flash 升格为官方 API 公测版并更新后训练权重"}, "categories": ["product", "capability"], "significance": 2, "id": "deepseek-v4-flash-official-2026", "slug": "deepseek-v4-flash-official-2026", "date": "2026-07-31"}, {"datePrecision": "day", "summary": {"en": "In early July 2026, new Chinese regulations targeting AI companion services forced major platforms to shut down their humanlike AI agent functions. ByteDance's Doubao (Doubao), China's largest AI companion app with over 345 million users, announced its agent functionality would go offline on July 15, 2026. Alibaba's Qwen similarly disabled its humanlike and user-created agents on July 10. The regulations specifically target bots offering 'sustained emotional interaction' while sparing workplace and productivity agents. Users can still view their agent configurations and conversation histories in read-only mode until October 15, 2026. The rule represents one of the most direct government interventions into the AI companion market globally.", "zhHans": "2026年7月初，针对 AI 伴侣服务的新中国法规迫使主要平台关闭其人形 AI 智能体功能。字节跳动的豆包——中国最大的 AI 伴侣应用，拥有超过 3.45 亿用户——宣布其智能体功能将于 2026 年 7 月 15 日下线。阿里巴巴的通义千问同样于 7 月 10 日禁用了其人形和用户创建的智能体。这些规定专门针对提供'持续性情感交互'的机器人，同时豁免了工作场所和生产力的智能体。用户可以在 2026 年 10 月 15 日前以只读模式查看其智能体配置和对话历史。该规定是全球范围内对 AI 伴侣市场最直接的政府干预之一。"}, "impactIndex": 6, "title": {"en": "China AI Companion Regulation Forces Doubao and Qwen to Shut Down Agent Functions", "zhHans": "中国 AI 伴侣法规迫使豆包和通义千问下线智能体功能"}, "categories": ["governance", "society"], "significance": 2, "id": "doubao-ai-companion-shutdown-2026", "slug": "doubao-ai-companion-shutdown-2026", "date": "2026-07-10"}, {"datePrecision": "day", "summary": {"en": "Google DeepMind published 'Playing Atari with Deep Reinforcement Learning,' introducing the Deep Q-Network (DQN) — the first system to learn to play multiple Atari 2600 games directly from raw pixels using only the game score as feedback. The same network architecture, with no game-specific tuning, achieved human-level or better performance on 6 out of 7 games. This was the first successful integration of deep learning with reinforcement learning.", "zhHans": "Google DeepMind 发表了《Playing Atari with Deep Reinforcement Learning》，引入了深度 Q 网络——第一个仅从原始像素、仅使用游戏分数作为反馈就能学习玩多种 Atari 2600 游戏的系统。相同的网络架构，无任何游戏特定调整，在 7 个游戏中的 6 个上达到了人类级别或更优的表现。这是深度学习与强化学习的首次成功结合。"}, "impactIndex": 6, "title": {"en": "DeepMind shows DQN playing Atari games from raw pixels — deep reinforcement learning's first breakthrough", "zhHans": "DeepMind 展示用 DQN 从原始像素玩 Atari 游戏——深度强化学习的首次突破"}, "categories": ["capability"], "significance": 1, "id": "dqn-atari-2013", "slug": "dqn-atari", "date": "2013-12-19"}, {"datePrecision": "month", "summary": {"en": "MIT professor Joseph Weizenbaum published ELIZA—a computer program that could simulate conversation by pattern-matching and keyword-triggered script responses. Its DOCTOR script mimicked a Rogerian psychotherapist so convincingly that Weizenbaum's own secretary asked him to leave the room so she could speak with it privately. This was the first time anyone mistook a machine for a human conversational partner.", "zhHans": "MIT 教授 Joseph Weizenbaum 发表 ELIZA——一个通过模式匹配和关键词触发脚本应答来模拟对话的计算机程序。其 DOCTOR 脚本模仿 Rogerian 心理治疗师的对话方式如此逼真，以至于 Weizenbaum 的秘书要求他离开房间，让她与程序私下交谈。这是人类历史上第一次将机器误认为人类对话伙伴。"}, "impactIndex": 7, "title": {"en": "Joseph Weizenbaum creates ELIZA, the first conversational agent in history", "zhHans": "Joseph Weizenbaum 创建 ELIZA，史上第一个对话程序"}, "categories": ["capability"], "significance": 2, "id": "eliza-1966", "slug": "eliza", "date": "1966-01"}, {"datePrecision": "day", "summary": {"en": "On March 13, 2024, the European Parliament approved the EU AI Act, the world's first comprehensive legal framework for artificial intelligence. The Act classifies AI systems by risk level (unacceptable, high, limited, minimal), bans certain uses of AI, and imposes transparency and governance requirements on developers. It entered into force on August 1, 2024, with phased implementation through 2026-2027. The law became the global template for AI regulation, influencing legislation in the US, China, and other jurisdictions.", "zhHans": "2024 年 3 月 13 日，欧洲议会批准了欧盟 AI 法案，全球第一部综合性的 AI 法律框架。该法案按风险级别（不可接受、高风险、有限风险、最低风险）对 AI 系统进行分类，禁止某些 AI 用途，并对开发者施加透明度和治理要求。它于 2024 年 8 月 1 日生效，分阶段实施至 2026-2027 年。该法成为 AI 监管的全球模板，影响了美国、中国及其他司法管辖区的立法。"}, "impactIndex": 6, "title": {"en": "EU approves the world's first comprehensive AI law", "zhHans": "欧盟通过全球第一部综合性 AI 法律"}, "categories": ["governance"], "significance": 2, "id": "eu-ai-act-2024", "slug": "eu-ai-act", "date": "2024-03-13"}, {"datePrecision": "day", "summary": {"en": "On February 2, 2025, the EU AI Act's first provisions took effect — banned AI practices and AI literacy obligations became enforceable. This marked the start of the world's first comprehensive AI regulatory framework. The Act, passed in March 2024 and entering into force August 2024, uses a risk-based approach: banning unacceptable risk systems (social scoring, real-time biometric surveillance), imposing transparency requirements on general-purpose AI, and requiring conformity assessments for high-risk systems. Its implementation created the first operational AI regulator at scale — the EU AI Office — and established a template adopted by multiple jurisdictions worldwide.", "zhHans": "2025 年 2 月 2 日，欧盟 AI 法案的首批条款生效——禁止性 AI 实践和 AI 素养义务开始执行。这标志着全球第一部综合性 AI 监管框架正式启动。该法案于 2024 年 3 月通过，2024 年 8 月生效，采用基于风险的方法：禁止不可接受风险的系统（社会评分、实时生物识别监控），对通用 AI 施加透明度要求，并要求高风险系统进行合规评估。其实施创建了第一个大规模运作的 AI 监管机构——欧盟 AI 办公室——并建立了被全球多个司法管辖区采用的模板。"}, "impactIndex": 6, "title": {"en": "EU AI Act takes effect, beginning the world's first comprehensive AI regulation enforcement", "zhHans": "欧盟 AI 法案生效，全球首部综合性 AI 法律进入执行阶段"}, "categories": ["governance"], "significance": 2, "id": "eu-ai-act-enforcement-2025", "slug": "eu-ai-act-enforcement", "date": "2025-02-02"}, {"datePrecision": "day", "summary": {"en": "In April 2021, the European Commission proposed the first comprehensive AI law — the EU AI Act. It introduced a risk-based classification system: AI applications deemed 'unacceptable risk' (like social scoring or real-time biometric surveillance) would be banned, while 'high-risk' systems (like hiring or credit scoring tools) would face strict compliance requirements. The proposal marked the beginning of serious AI governance, creating a regulatory template that would influence laws worldwide. After three years of negotiation and amendment, it was finally approved in March 2024.", "zhHans": "2021 年 4 月，欧盟委员会提出了第一部全面的 AI 法律——欧盟 AI 法案。它引入了基于风险的分类体系：被认为\"不可接受风险\"的 AI 应用（如社会评分或实时生物识别监控）将被禁止，而\"高风险\"系统（如招聘或信用评分工具）将面临严格的合规要求。该提案标志着严肃 AI 治理的开始，创建了一个影响全球法律的监管模板。经过三年的谈判和修订，它最终于 2024 年 3 月获得批准。"}, "impactIndex": 5, "title": {"en": "European Commission proposes the first comprehensive AI regulation framework", "zhHans": "欧盟委员会提出全球首个综合性 AI 监管框架"}, "categories": ["governance"], "significance": 1, "id": "eu-ai-act-proposal-2021", "slug": "eu-ai-act-proposal", "date": "2021-04-21"}, {"datePrecision": "day", "summary": {"en": "On May 7, 2026, the European Council and Parliament reached a provisional agreement to streamline selected EU AI Act requirements. The resulting AI Omnibus entered into force on July 27. It moved the application date for Annex III high-risk systems to December 2, 2027 and for high-risk systems embedded in Annex I products to August 2, 2028.", "zhHans": "2026 年 5 月 7 日，欧洲理事会与欧洲议会就简化部分欧盟 AI 法案要求达成临时协议。由此形成的 AI Omnibus 于 7 月 27 日生效。它将 Annex III 高风险系统的适用日期调整至 2027 年 12 月 2 日，并将嵌入 Annex I 产品的高风险系统适用日期调整至 2028 年 8 月 2 日。"}, "impactIndex": 4, "title": {"en": "EU reaches agreement to simplify AI rules, responding to industry compliance complaints", "zhHans": "欧盟达成简化 AI 规则协议，回应行业合规负担诉求"}, "categories": ["governance"], "significance": 1, "id": "eu-ai-act-simplification-2026", "slug": "eu-ai-act-simplification", "date": "2026-05-07"}, {"datePrecision": "day", "summary": {"en": "On 2 August 2026, the EU AI Act’s Article 50 transparency obligations became applicable. The staged milestone covers specified direct human-AI interactions and synthetic-content disclosure or marking duties, while high-risk-system obligations remain on later dates.", "zhHans": "2026 年 8 月 2 日，欧盟 AI 法案第 50 条透明度义务开始适用。这一分阶段节点涵盖特定直接人机交互及合成内容的披露或标记义务；高风险系统义务仍适用更晚的日期。"}, "impactIndex": 5, "title": {"en": "EU AI Act transparency rules become applicable", "zhHans": "欧盟 AI 法案透明度规则开始适用"}, "categories": ["governance"], "significance": 2, "id": "eu-ai-act-transparency-2026", "slug": "eu-ai-act-transparency", "date": "2026-08-02"}, {"datePrecision": "day", "summary": {"en": "The EU opened a call to select consortia for up to seven AI Gigafactories. The plan describes up to €10 billion in EU and national support intended to unlock at least €20 billion in private investment, but it remains a procurement process rather than operating compute capacity.", "zhHans": "欧盟启动招标，拟选出建设最多七座 AI Gigafactories 的联合体。该计划描述了欧盟和成员国最高 100 亿欧元支持、旨在撬动至少 200 亿欧元私人投资，但它仍是一项采购流程，而非已经投入运营的算力。"}, "impactIndex": 5, "title": {"en": "EU opens tender for up to seven AI Gigafactories", "zhHans": "欧盟启动最多七座 AI Gigafactories 的招标"}, "categories": ["governance", "commerce"], "significance": 2, "id": "eu-ai-gigafactories-tender-2026", "slug": "eu-ai-gigafactories-tender", "date": "2026-07-30"}, {"datePrecision": "day", "summary": {"en": "On July 6, 2026, Anthropic's Claude Fable 5 autonomously wrote a CUDA megakernel for the KernelBench-Mega benchmark, achieving an 18.71x speedup over an optimized PyTorch baseline on an RTX PRO 6000 Blackwell GPU. The kernel was the first-ever 'true megakernel' submitted to the benchmark — it launched exactly once per decoded token, while all other high-scoring entries required 4-14 separate kernel launches. Fable 5's approach pushed hardware memory bandwidth utilization to its absolute limit. The feat required 2.5 hours of autonomous work, during which the model spent 64% of the time in silent analysis (timing baselines, deriving a Roofline performance model) before writing the code. This result was widely interpreted as a significant signal of AI systems' growing capacity for AI R&D automation, with potential implications for recursive self-improvement (RSI).", "zhHans": "2026年7月6日，Anthropic 的 Claude Fable 5 为 KernelBench-Mega 基准自主编写了一个 CUDA 超级内核，在 RTX PRO 6000 Blackwell GPU 上实现了 18.71 倍于优化 PyTorch 基线的加速。该内核是该基准有史以来提交的第一个'真正的超级内核'——每个解码令牌仅启动一次，而所有其他高分方案需要 4-14 次单独内核启动。Fable 5 的方法将硬件内存带宽利用率推至极限。这一壮举需要 2.5 小时的自主工作，期间模型将 64% 的时间用于静默分析（计时基线、推导 Roofline 性能模型），然后才编写代码。这一结果被广泛解读为 AI 系统在 AI 研发自动化方面能力日益增强的重要信号，对递归自改进具有潜在影响。"}, "impactIndex": 6, "title": {"en": "Claude Fable 5 Writes the First AI-Authored CUDA Megakernel, Sparking RSI Debate", "zhHans": "Claude Fable 5 写出首个 AI 编写的 CUDA 超级内核，引发递归自改进讨论"}, "categories": ["capability", "safety"], "significance": 2, "id": "fable-5-kernelbench-2026", "slug": "fable-5-kernelbench-2026", "date": "2026-07-06"}, {"datePrecision": "day", "summary": {"en": "In 2025, Figure AI's humanoid robot Figure 02 completed the first real-world production deployment of a general-purpose humanoid robot in automotive manufacturing. Working 10-hour autonomous shifts at BMW's Spartanburg plant, Figure 02 supported the production of over 30,000 BMW X3 vehicles over a 10-month deployment. The project demonstrated that humanoid robots could deliver measurable value in real manufacturing conditions, marking a transition for embodied AI from research demos to industrial productivity.", "zhHans": "2025 年，Figure AI 的人形机器人 Figure 02 完成了通用人形机器人在汽车制造中的首次真实世界产线部署。在 BMW 斯帕坦堡工厂每天工作 10 小时自主班次，Figure 02 在 10 个月的部署中支持了超过 3 万辆 BMW X3 的生产。该项目证明了人形机器人可以在真实制造条件下提供可衡量的价值，标志着具身 AI 从研究演示向工业生产力的转变。"}, "impactIndex": 5, "title": {"en": "Figure 02 humanoid robot completes first real-world production deployment at BMW", "zhHans": "Figure 02 人形机器人在宝马工厂完成首次生产部署"}, "categories": ["capability"], "significance": 1, "id": "figure-bmw-humanoid-2025", "slug": "figure-bmw-humanoid", "date": "2025-11-25"}, {"datePrecision": "day", "summary": {"en": "On June 1, 2026, Florida Attorney General James Uthmeier filed a lawsuit against OpenAI and CEO Sam Altman, accusing the company of putting profit over safety and marketing ChatGPT as safe for children despite known risks. The suit, the first by a US state against an AI company over safety, alleged that OpenAI failed to warn users about ChatGPT's dangers. It marked a new phase in AI liability litigation, shifting from copyright disputes (NYT, Getty) to direct safety and consumer protection claims.", "zhHans": "2026 年 6 月 1 日，佛罗里达州总检察长 James Uthmeier 对 OpenAI 及 CEO Sam Altman 提起诉讼，指控该公司将利润置于安全之上，并在明知风险的情况下将 ChatGPT 宣传为对儿童安全的产品。这是美国州级政府首次就安全问题起诉 AI 公司，指控 OpenAI 未能警告用户 ChatGPT 的危险性。这标志着 AI 责任诉讼进入新阶段——从版权纠纷（NYT、Getty）转向直接的安全和消费者保护索赔。"}, "impactIndex": 5, "title": {"en": "Florida sues OpenAI and Sam Altman in first US state lawsuit against an AI company over safety", "zhHans": "佛罗里达起诉 OpenAI 和 Sam Altman，美国首次州级诉讼针对 AI 公司安全"}, "categories": ["governance", "safety"], "significance": 2, "id": "florida-sues-openai-2026", "slug": "florida-sues-openai", "date": "2026-06-01"}, {"datePrecision": "month", "summary": {"en": "Ian Goodfellow published 'Generative Adversarial Nets,' introducing a novel framework where two neural networks—a generator and a discriminator—compete against each other in a zero-sum game. The generator learns to produce increasingly realistic samples while the discriminator learns to distinguish real from fake. GANs became the dominant paradigm for generative AI until supplanted by diffusion models in the mid-2020s, fundamentally changing how the field thought about unsupervised learning.", "zhHans": "Ian Goodfellow 发表了《Generative Adversarial Nets》，引入了一个新颖的框架：两个神经网络——生成器和判别器——在零和博弈中相互竞争。生成器学习生成越来越真实的样本，而判别器学习区分真伪。GAN 成为生成式 AI 的主导范式，直到 2020 年代中期被扩散模型取代，从根本上改变了该领域对无监督学习的思考方式。"}, "impactIndex": 6, "title": {"en": "Ian Goodfellow invents Generative Adversarial Networks (GANs)", "zhHans": "Ian Goodfellow 发明生成对抗网络"}, "categories": ["capability"], "significance": 1, "id": "gan-2014", "slug": "gan", "date": "2014-06"}, {"datePrecision": "day", "summary": {"en": "On July 29, 2026, GCC published an AI contribution policy that declines legally significant contributions containing or derived from LLM-generated content. The policy still permits some legally insignificant contributions, LLM-generated test cases and AI-assisted research or review when generated output is not submitted as project code.", "zhHans": "2026 年 7 月 29 日，GCC 发布 AI 贡献政策，拒绝包含或源自 LLM 生成内容的具有法律意义的贡献。该政策仍允许部分非重大贡献、LLM 生成的测试用例，以及在生成内容不直接提交为项目代码时进行 AI 辅助研究或审查。"}, "impactIndex": 5, "title": {"en": "GCC adopts a policy limiting LLM-generated code in legally significant contributions", "zhHans": "GCC 通过政策限制在具有法律意义的贡献中使用 LLM 生成代码"}, "categories": ["product"], "significance": 1, "id": "gcc-ai-policy-2026", "slug": "gcc-ai-policy", "date": "2026-07-29"}, {"datePrecision": "day", "summary": {"en": "On February 15, 2024, Google released Gemini 1.5 Pro, the first large language model with a 1 million token context window — later expanded to 2 million. This breakthrough allowed the model to process entire codebases, hundred-page documents, and hours of video in a single prompt, achieving a 'needle in a haystack' retrieval accuracy of 99.7% across the full context. It set a new capability frontier that competitors raced to match throughout 2024.", "zhHans": "2024 年 2 月 15 日，Google 发布了 Gemini 1.5 Pro，第一个拥有 100 万 token 上下文窗口的大语言模型——后扩展至 200 万。这一突破使模型能在单次提示中处理整个代码库、上百页文档和数小时的视频，在全上下文范围内实现了 99.7% 的\"大海捞针\"检索准确率。它设定了一个新的能力边界，竞争对手在 2024 年竞相追赶。"}, "impactIndex": 6, "title": {"en": "Google releases Gemini 1.5 Pro with a million-token context window", "zhHans": "Google 发布 Gemini 1.5 Pro，百万 token 上下文窗口"}, "categories": ["capability"], "significance": 1, "id": "gemini-1.5-pro-2024", "slug": "gemini-1.5-pro", "date": "2024-02-15"}, {"datePrecision": "day", "summary": {"en": "On December 11, 2024, Google DeepMind launched Gemini 2.0, its 'agentic era' AI model, alongside three agent projects: Project Mariner (browser agent), Project Astra (universal assistant prototype), and Jules (coding agent). The launch signalled Google's formal entry into the AI agent race, bringing agent-native capabilities to billions of users through Google's existing product ecosystem.", "zhHans": "2024 年 12 月 11 日，Google DeepMind 发布了 Gemini 2.0——其\"智能体时代\"AI 模型——同时推出三个智能体项目：Project Mariner（浏览器智能体）、Project Astra（通用助手原型）和 Jules（编程智能体）。此次发布标志着 Google 正式进入 AI 智能体竞赛，通过 Google 现有产品生态将智能体原生能力带给数十亿用户。"}, "impactIndex": 5, "title": {"en": "Google launches Gemini 2.0 with Project Mariner, unveiling a vision for AI agents", "zhHans": "Google 发布 Gemini 2.0 和 Project Mariner，展示 AI 智能体愿景"}, "categories": ["product", "capability"], "significance": 1, "id": "gemini-2-agents-2024", "slug": "gemini-2-0-project-mariner", "date": "2024-12-11"}, {"datePrecision": "month", "summary": {"en": "In July 2025, Google DeepMind announced that an advanced version of Gemini with Deep Think had achieved a gold-medal standard at the International Mathematical Olympiad, scoring 35 out of 42 points. This marked the first time an AI system reached the highest level of the world's most prestigious mathematics competition for pre-university students — solving problems requiring deep mathematical reasoning, creativity, and multi-step logic. The achievement demonstrated that inference-time compute scaling could match the most challenging human intellectual benchmarks.", "zhHans": "2025 年 7 月，Google DeepMind 宣布带 Deep Think 功能的增强版 Gemini 在国际数学奥林匹克竞赛中达到了金牌标准，获得了 42 分中的 35 分。这标志着 AI 系统首次达到世界最负盛名的大学预科数学竞赛的最高水平——解决了需要深度数学推理、创造力和多步骤逻辑的问题。这一成就证明了推理时计算缩放可以匹配最具挑战性的人类智力基准。"}, "impactIndex": 7, "title": {"en": "Google DeepMind's Gemini Deep Think achieves gold medal at the International Mathematical Olympiad", "zhHans": "Google DeepMind 的 Gemini Deep Think 在国际数学奥林匹克竞赛中获得金牌"}, "categories": ["capability"], "significance": 2, "id": "gemini-deep-think-imo-gold-2025", "slug": "gemini-deep-think-imo-gold", "date": "2025-07"}, {"datePrecision": "day", "summary": {"en": "Google DeepMind introduced Gemini Robotics and Gemini Robotics-ER, extending Gemini 2.0 with vision-language-action control and embodied spatial reasoning for robots.", "zhHans": "Google DeepMind 发布 Gemini Robotics 与 Gemini Robotics-ER，把 Gemini 2.0 扩展到机器人的视觉—语言—动作控制与具身空间推理。"}, "impactIndex": 6, "title": {"en": "Google DeepMind launches Gemini Robotics for physical-world control", "zhHans": "Google DeepMind 发布面向物理世界控制的 Gemini Robotics"}, "categories": ["capability", "product"], "significance": 1, "id": "gemini-robotics-2025", "slug": "gemini-robotics-2025", "date": "2025-03-12"}, {"datePrecision": "day", "summary": {"en": "Google released Gemini Robotics ER 2 in public preview through the Gemini API and AI Studio. The model processes multimodal inputs for high-level physical reasoning, task planning and tool orchestration, while lower-level systems remain responsible for motor execution.", "zhHans": "Google 通过 Gemini API 和 AI Studio 以公开预览形式发布 Gemini Robotics ER 2。该模型处理多模态输入，用于高层物理推理、任务规划和工具编排；底层系统仍负责运动执行。"}, "impactIndex": 4, "title": {"en": "Google launches Gemini Robotics ER 2 in public preview", "zhHans": "Google 以公开预览形式发布 Gemini Robotics ER 2"}, "categories": ["product", "capability"], "significance": 1, "id": "gemini-robotics-er2-2026", "slug": "gemini-robotics-er2", "date": "2026-07-30"}, {"datePrecision": "day", "summary": {"en": "GitHub Copilot, powered by OpenAI Codex, became generally available in June 2022 as a subscription service integrated into Visual Studio Code, JetBrains, and Neovim. Copilot could generate entire functions from a comment, autocomplete lines in real time, and suggest test cases — fundamentally changing how millions of developers write code. It was the first mainstream AI tool embedded directly into the software development workflow.", "zhHans": "GitHub Copilot 由 OpenAI Codex 驱动，于 2022 年 6 月正式以订阅服务的形式发布，集成到 Visual Studio Code、JetBrains 和 Neovim 中。Copilot 可以根据注释生成完整函数、实时自动补全代码行并建议测试用例——从根本上改变了数百万开发者的编码方式。它是第一个直接嵌入软件开发工作流的 AI 主流工具。"}, "impactIndex": 6, "title": {"en": "GitHub Copilot launches generally, putting AI pair programming in every major IDE", "zhHans": "GitHub Copilot 正式发布，AI 结对编程进入所有主流 IDE"}, "categories": ["product", "commerce"], "significance": 1, "id": "github-copilot-2022", "slug": "github-copilot", "date": "2022-06-21"}, {"datePrecision": "day", "summary": {"en": "On June 13, 2026, Z.ai (formerly Zhipu AI) open-sourced GLM-5.2, a 744-billion-parameter Mixture-of-Experts model under the MIT license with a 1-million-token context window. The model achieved frontier-level coding and agentic performance — competitive with GPT-5.5 at roughly one-sixth the inference cost — marking a milestone where open-source AI meaningfully caught up to proprietary frontier models. The release was widely seen as a direct response to the US export ban on Anthropic's Fable 5, demonstrating that restrictive policies accelerate, rather than prevent, global AI capability diffusion.", "zhHans": "2026年6月13日，Z.ai（原智谱 AI）以 MIT 许可协议开源了 GLM-5.2，一个 7440 亿参数的混合专家模型，拥有 100 万 token 的上下文窗口。该模型在前沿编码和智能体任务上达到了可与 GPT-5.5 竞争的水平，推理成本仅为其六分之一——标志着开源 AI 在实质上追赶上了闭源前沿模型。此次发布被广泛视为对美国封禁 Anthropic Fable 5 的直接回应，表明限制性政策加速而非阻止了全球 AI
