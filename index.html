<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EpochArc · AI Milestones, Signals, and Forecasts</title>
  <meta name="description" content="EpochArc tracks AI milestones, organizes signals, and maps forward-looking forecasts in a structured bilingual timeline." />
  <meta name="theme-color" content="#f7f8fb" />
  <meta name="color-scheme" content="light dark" />
  <meta name="application-name" content="EpochArc" />
  <meta name="apple-mobile-web-app-title" content="EpochArc" />
  <meta property="og:title" content="EpochArc · AI Milestones, Signals, and Forecasts" />
  <meta property="og:description" content="A bilingual project for tracking AI milestones, organizing signals, and mapping forward-looking forecasts." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="EpochArc" />
  <meta property="og:locale" content="zh_CN" />
  <meta property="og:image" content="/og-image.svg" />
  <meta property="og:image:type" content="image/svg+xml" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="EpochArc · AI Milestones, Signals, and Forecasts" />
  <meta name="twitter:description" content="A bilingual project for tracking AI milestones, organizing signals, and mapping forward-looking forecasts." />
  <meta name="twitter:image" content="/og-image.svg" />
  <link rel="icon" href="assets/logo-icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/site.webmanifest" />
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "EpochArc",
      "alternateName": "EpochArc",
      "description": "A bilingual public timeline of AI milestones, signals, and forward-looking forecasts.",
      "inLanguage": ["zh-CN", "en"]
    }
  </script>
  <style>
    /* ─── Modern Minimal Theme Variables ───────────────────────────────── */
    :root {
      /* Light Mode Palette (Codified Brand Spec) */
      --bg:            oklch(98.5% 0.003 240);
      --surface:       oklch(100% 0 0);
      --surface-hover: oklch(97% 0.004 240);
      --fg:            oklch(15% 0.015 250);
      --muted:         oklch(52% 0.012 250);
      --border:        oklch(90.5% 0.006 250);
      --accent:        oklch(58% 0.18 255); /* Electric Blue-Cyan */
      --highlight:     oklch(62% 0.22 25);  /* Vibrant Red/Coral for focus outline */
      
      /* Inactive Filter Buttons (Codified Brand Spec) */
      --btn-inactive-bg:     oklch(97.2% 0.004 250);
      --btn-inactive-border: oklch(89.5% 0.006 250);
      
      /* Category Colors (Tailored Light Mode) */
      --color-foundation: oklch(50% 0.2 260); /* Blue */
      --color-apps:       oklch(48% 0.2 140); /* Green */
      --color-hardware:   oklch(52% 0.2 45);  /* Coral */
      --color-embodied:   oklch(48% 0.22 310); /* Magenta */
      --color-social:     oklch(48% 0.18 200); /* Teal */

      --accent-soft: color-mix(in oklch, var(--accent) 10%, transparent);
      --fg-soft:     color-mix(in oklch, var(--fg) 5%, transparent);

      /* Fonts (Codified Brand Spec) */
      --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', sans-serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'PingFang SC', sans-serif;
      --font-mono:    'JetBrains Mono', 'IBM Plex Mono', Menlo, monospace;

      /* Scales */
      --fs-h1: clamp(36px, 5.5vw, 64px);
      --fs-h2: clamp(24px, 3.5vw, 36px);
      --fs-h3: 20px;
      --fs-lead: 18px;
      --fs-body: 15px;
      --fs-meta: 13px;

      /* Spacing */
      --gap-xs: 8px;
      --gap-sm: 12px;
      --gap-md: 20px;
      --gap-lg: 32px;
      --gap-xl: 56px;
      --container: 960px; /* Locked to EpochArc content width */
      --gutter: 24px;

      /* Radius */
      --radius: 8px;
      --radius-lg: 12px;
      --radius-pill: 999px;

      /* Motion */
      --transition-smooth: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Dark Mode Overrides */
    [data-theme="dark"] {
      --bg:            oklch(12% 0.008 250);
      --surface:       oklch(16% 0.01 250);
      --surface-hover: oklch(19% 0.012 250);
      --fg:            oklch(93% 0.005 250);
      --muted:         oklch(60% 0.008 250);
      --border:        oklch(22% 0.008 250);
      --accent:        oklch(64% 0.16 250);
      
      --btn-inactive-bg:     oklch(19% 0.01 250);
      --btn-inactive-border: oklch(25% 0.012 250);

      /* Category Colors (Tailored Dark Mode) */
      --color-foundation: oklch(70% 0.16 260);
      --color-apps:       oklch(72% 0.16 140);
      --color-hardware:   oklch(74% 0.16 45);
      --color-embodied:   oklch(70% 0.18 310);
      --color-social:     oklch(72% 0.14 200);
      
      --accent-soft: color-mix(in oklch, var(--accent) 15%, transparent);
      --fg-soft:     color-mix(in oklch, var(--fg) 8%, transparent);
    }

    /* ─── Reset & Base ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.5;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      transition: background var(--transition-smooth), color var(--transition-smooth);
      padding-bottom: var(--gap-xl);
    }
    img, svg { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; background: none; border: none; padding: 0; color: inherit; }
    p { text-wrap: pretty; margin: 0; }
    h1, h2, h3, h4 { text-wrap: balance; margin: 0; font-weight: 700; letter-spacing: -0.02em; }

    /* ─── Layout primitives ─────────────────────────────────────────── */
    .container {
      max-width: var(--container);
      margin-inline: auto;
      padding-inline: var(--gutter);
    }
    .stack { display: flex; flex-direction: column; }
    .stack > * + * { margin-top: var(--gap-md); }
    .row { display: flex; align-items: center; gap: var(--gap-md); }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--gap-md); }

    /* ─── Topbar Navigation ──────────────────────────────────────────── */
    .topnav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: color-mix(in oklch, var(--bg) 85%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      transition: background var(--transition-smooth), border-color var(--transition-smooth);
    }
    .topnav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }
    .topnav .logo {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.03em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .topnav .logo svg {
      width: 24px;
      height: 24px;
      color: var(--accent);
    }
    .brand-icon {
      width: 26px;
      height: 26px;
      border-radius: 7px;
    }
    .topnav-actions {
      display: flex;
      align-items: center;
      gap: var(--gap-sm);
    }
    .control-btn {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: var(--fs-meta);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition-smooth);
      background: var(--surface);
    }
    .control-btn:hover {
      border-color: var(--fg);
      background: var(--surface-hover);
    }
    .language-picker {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .language-picker svg {
      position: absolute;
      left: 10px;
      width: 15px;
      height: 15px;
      color: var(--muted);
      pointer-events: none;
    }
    .language-select {
      min-height: 32px;
      min-width: 104px;
      padding: 5px 30px 5px 32px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--fg);
      font-size: var(--fs-meta);
      font-weight: 600;
      appearance: none;
      transition: var(--transition-smooth);
      background-image:
        linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position:
        calc(100% - 16px) 14px,
        calc(100% - 11px) 14px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    .language-select:hover,
    .language-select:focus {
      outline: none;
      border-color: var(--fg);
      background-color: var(--surface-hover);
    }

    /* ─── Hero Section ──────────────────────────────────────────────── */
    .hero {
      padding-top: clamp(28px, 6vw, 56px);
      padding-bottom: clamp(16px, 3vw, 28px);
      text-align: center;
    }
    .hero h1 {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: 1.05;
      margin-bottom: 0;
    }
    .hero .lead {
      display: none;
    }

    /* ─── Horizontal Predictions Row ────────────────────────────────── */
    .predictions-section {
      padding-block: var(--gap-md);
      margin-bottom: var(--gap-lg);
    }
    .section-title {
      font-size: 13px;
      font-family: var(--font-mono);
      letter-spacing: 0.01em;
      color: var(--muted);
      margin-bottom: var(--gap-md);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .predictions-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--gap-md);
    }
    @media (max-width: 900px) {
      .predictions-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 550px) {
      .predictions-grid {
        grid-template-columns: 1fr;
      }
    }
    .predict-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--gap-md);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: var(--transition-smooth);
      position: relative;
      overflow: hidden;
    }
    .predict-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--border);
      transition: var(--transition-smooth);
    }
    .predict-card.voted::before {
      background: var(--accent);
    }
    .predict-header {
      margin-bottom: var(--gap-sm);
    }
    .predict-header .expected-year {
      font-family: var(--font-mono);
      font-size: var(--fs-meta);
      color: var(--muted);
      font-weight: 600;
      display: none;
      margin-bottom: 4px;
    }
    .predict-header h3 {
      font-size: 16px;
      line-height: 1.25;
      font-weight: 700;
      margin: 0 0 6px;
    }
    .predict-header p {
      font-size: var(--fs-meta);
      color: var(--muted);
      line-height: 1.4;
    }
    .vote-area {
      margin-top: var(--gap-md);
    }
    .vote-btn {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: var(--transition-smooth);
      background: var(--surface);
    }
    .vote-btn:hover {
      border-color: var(--fg);
      background: var(--fg-soft);
    }
    .predict-card.voted .vote-btn {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }
    .vote-bar-container {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: var(--radius-pill);
      margin-top: var(--gap-xs);
      overflow: hidden;
    }
    .vote-bar {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .vote-stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ─── Timeline Filter Controls ──────────────────────────────────── */
    .timeline-filter-bar {
      display: grid;
      grid-template-columns: minmax(220px, 1.35fr) repeat(4, minmax(118px, 0.9fr));
      align-items: end;
      gap: 10px;
      padding-block: 6px 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: var(--gap-lg);
    }
    .search-input-wrapper {
      position: relative;
      width: 100%;
    }
    .search-input-wrapper svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--muted);
    }
    .search-input {
      width: 100%;
      min-height: 36px;
      padding: 7px 12px 7px 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      background: var(--btn-inactive-bg);
      color: var(--fg);
      transition: var(--transition-smooth);
    }
    .search-input:focus {
      outline: none;
      border-color: var(--fg);
      box-shadow: 0 0 0 2px var(--fg-soft);
    }
    .filter-groups {
      display: contents;
    }
    .filter-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .filter-label {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      min-height: 14px;
    }
    .filter-label.ghost {
      opacity: 0;
      user-select: none;
      pointer-events: none;
    }
    .filter-select {
      min-height: 36px;
      padding: 6px 30px 6px 10px;
      background: var(--btn-inactive-bg);
      border: 1px solid var(--btn-inactive-border);
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 500;
      color: var(--fg);
      transition: var(--transition-smooth);
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position:
        calc(100% - 17px) 16px,
        calc(100% - 12px) 16px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    .filter-select:hover {
      background: var(--surface-hover);
      border-color: var(--muted);
    }
    .filter-select:focus {
      outline: none;
      border-color: var(--fg);
      box-shadow: 0 0 0 2px var(--fg-soft);
    }
    @media (max-width: 900px) {
      .timeline-filter-bar {
        grid-template-columns: minmax(220px, 1fr) repeat(2, minmax(140px, 1fr));
      }
      .timeline-filter-bar .filter-field:first-child {
        grid-column: 1 / -1;
      }
    }
    @media (max-width: 720px) {
      .timeline-filter-bar {
        grid-template-columns: 1fr;
      }
    }

    /* ─── Vertical Timeline ─────────────────────────────────────────── */
    .timeline-wrapper {
      position: relative;
      --timeline-axis-col: 64px;
      padding-left: 28px;
    }
    .timeline-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 8px; /* Mathematically center-aligned on mobile */
      width: 2px;
      background: var(--border);
      z-index: 1;
      transition: var(--transition-smooth);
    }
    @media (min-width: 651px) {
      .timeline-wrapper {
        padding-left: 0;
      }
      .timeline-line {
        left: calc(4ch + (var(--timeline-axis-col) / 2));
        transform: translateX(-50%);
      }
    }
    .timeline-container {
      display: flex;
      flex-direction: column;
      gap: var(--gap-lg);
    }
    .timeline-item {
      position: relative;
      display: grid;
      grid-template-columns: 4ch var(--timeline-axis-col) minmax(0, 1fr);
      gap: 0;
      align-items: stretch;
      z-index: 2;
    }
    @media (max-width: 650px) {
      .timeline-item {
        grid-template-columns: 24px minmax(0, 1fr);
        gap: var(--gap-xs);
      }
    }
    .timeline-date-col {
      font-family: var(--font-mono);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 2px;
      min-height: 38px;
      padding-right: 0;
      text-align: left;
    }
    .timeline-year {
      font-size: 14px;
      line-height: 1.2;
      font-weight: 800;
      color: var(--fg);
    }
    .timeline-subdate {
      font-size: 11px;
      line-height: 1.2;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    @media (max-width: 650px) {
      .timeline-date-col {
        grid-column: 2;
        grid-row: 1;
        align-items: flex-start;
        padding-left: 18px;
        padding-right: 0;
        text-align: left;
      }
    }
    .timeline-dot {
      grid-column: 2;
      align-self: center;
      justify-self: center;
      position: relative;
      z-index: 3;
      width: var(--dot-size, 10px);
      height: var(--dot-size, 10px);
      border-radius: 50%;
      background: var(--bg);
      border: var(--dot-border, 2px) solid var(--border);
      transition: var(--transition-smooth);
    }
    @media (max-width: 650px) {
      .timeline-dot {
        grid-column: 1;
        grid-row: 2;
        align-self: start;
        margin-top: 10px;
      }
    }
    
    /* Interactive glowing nodes based on category of item */
    .timeline-item[data-category="foundation"]:hover .timeline-dot { border-color: var(--color-foundation); background: var(--color-foundation); }
    .timeline-item[data-category="apps"]:hover .timeline-dot { border-color: var(--color-apps); background: var(--color-apps); }
    .timeline-item[data-category="hardware"]:hover .timeline-dot { border-color: var(--color-hardware); background: var(--color-hardware); }
    .timeline-item[data-category="embodied"]:hover .timeline-dot { border-color: var(--color-embodied); background: var(--color-embodied); }
    .timeline-item[data-category="social"]:hover .timeline-dot { border-color: var(--color-social); background: var(--color-social); }
    .timeline-item[data-category="model"]:hover .timeline-dot,
    .timeline-item[data-category="capability"]:hover .timeline-dot,
    .timeline-item[data-category="research"]:hover .timeline-dot { border-color: var(--color-foundation); background: var(--color-foundation); }
    .timeline-item[data-category="product"]:hover .timeline-dot,
    .timeline-item[data-category="open_source"]:hover .timeline-dot { border-color: var(--color-apps); background: var(--color-apps); }
    .timeline-item[data-category="regulation"]:hover .timeline-dot,
    .timeline-item[data-category="safety"]:hover .timeline-dot { border-color: var(--color-hardware); background: var(--color-hardware); }

    /* Node Level 3: Critical Node (Full Card Highlight) */
    .timeline-card-l3 {
      background: var(--surface);
      border: 1px solid var(--fg);
      border-radius: var(--radius-lg);
      padding: var(--gap-md);
      box-shadow: 0 4px 20px var(--fg-soft);
      cursor: pointer;
      transition: var(--transition-smooth);
      position: relative;
    }
    .timeline-card-l3:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px var(--fg-soft);
    }
    .timeline-dot.level-3 {
      --dot-size: 12px;
      --dot-border: 3px;
      border-color: var(--fg);
    }

    /* Node Level 2: Major Node (Standard Card) */
    .timeline-card-l2 {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--gap-md);
      cursor: pointer;
      transition: var(--transition-smooth);
      position: relative;
    }
    .timeline-card-l2:hover {
      transform: translateY(-2px);
      border-color: var(--fg);
    }
    .timeline-dot.level-2 {
      --dot-size: 10px;
      --dot-border: 2px;
    }
    
    /* Node Level 1: Minor Node (Compact Record) */
    .timeline-card-l1 {
      background: color-mix(in oklch, var(--surface) 72%, var(--bg));
      border: 1px solid color-mix(in oklch, var(--border) 84%, transparent);
      border-radius: var(--radius-lg);
      padding: 12px var(--gap-md);
      cursor: pointer;
      transition: var(--transition-smooth);
      position: relative;
    }
    .timeline-card-l1-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--gap-sm);
    }
    .timeline-card-l1:hover {
      border-color: var(--muted);
      background: var(--surface);
    }
    .timeline-dot.level-1 {
      --dot-size: 8px;
      --dot-border: 2px;
    }

    .timeline-entry {
      position: relative;
      grid-column: 3;
      min-width: 0;
    }
    @media (max-width: 650px) {
      .timeline-entry {
        grid-column: 2;
        grid-row: 2;
      }
    }
    .timeline-card-l3.expanded,
    .timeline-card-l2.expanded {
      border-color: color-mix(in oklch, var(--accent) 36%, var(--border));
      box-shadow: none;
      background:
        linear-gradient(90deg, color-mix(in oklch, var(--accent) 7%, transparent), transparent 34%),
        var(--surface);
    }
    .timeline-card-l3.expanded::before,
    .timeline-card-l2.expanded::before {
      content: '';
      position: absolute;

    };

    const consensusLabels = {
      broad: { zh: '广泛共识', en: 'Broad Consensus' },
      debated: { zh: '存在争议', en: 'Debated' },
      emerging: { zh: '新兴判断', en: 'Emerging' }
    };
    const sourceTypeLabels = {
      primary: { zh: '原始资料', en: 'Primary' },
      analysis: { zh: '分析资料', en: 'Analysis' }
    };

    async function loadJson(url) {
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) {
        throw new Error(`${url}: ${response.status}`);
      }
      return response.json();
    }

    function readFallbackJson(id) {
      const node = document.getElementById(id);
      if (!node) return null;
      return JSON.parse(node.textContent);
    }

    function loadFallbackData(error) {
      const predictionData = readFallbackJson('fallback-forecasts-data');
      const eventData = readFallbackJson('fallback-events-data');
      const sourceData = readFallbackJson('fallback-sources-data');
      if (!predictionData || !eventData || !sourceData) {
        throw error;
      }
      forecasts = predictionData;
      aiEvents = eventData;
      sourcesById = new Map(sourceData.map((source) => [source.id, source]));
      state.dataStatus = 'ready';
      state.dataError = '';
    }

    async function loadSiteData() {
      state.dataStatus = 'loading';
      state.dataError = '';
      renderPredictions();
      renderTimeline();

      try {
        const [forecastData, eventData, sourceData] = await Promise.all([
          loadJson('data/forecasts.json'),
          loadJson('data/events.json'),
          loadJson('data/sources.json')
        ]);
        forecasts = forecastData;
        aiEvents = eventData;
        sourcesById = new Map(sourceData.map((source) => [source.id, source]));
        state.dataStatus = 'ready';
      } catch (error) {
        try {
          loadFallbackData(error);
        } catch (fallbackError) {
          state.dataStatus = 'error';
          state.dataError = String(fallbackError.message || fallbackError);
        }
      }

      renderPredictions();
      renderTimeline();
    }

    const elements = {
      langSelect: document.getElementById('langSelect'),
      themeToggle: document.getElementById('themeToggle'),
      themeIcon: document.getElementById('themeIcon'),
      themeText: document.getElementById('themeText'),
      predictionsContainer: document.getElementById('predictionsContainer'),
      timelineContainer: document.getElementById('timelineContainer'),
      searchInput: document.getElementById('searchInput'),
      significanceFilter: document.getElementById('significanceFilter'),
      categoryFilter: document.getElementById('categoryFilter'),
      impactFilter: document.getElementById('impactFilter'),
      consensusFilter: document.getElementById('consensusFilter'),
    };

    /* ─── Language Switcher Logic ───────────────────────────────────── */
    function updateLocale() {
      document.documentElement.lang = LANGUAGES[state.lang]?.html || 'en';
      if (elements.langSelect) {
        elements.langSelect.value = state.lang;
      }
      
      // Update all elements with data-zh / data-en
      document.querySelectorAll('[data-zh]').forEach(el => {
        const translated = el.getAttribute(`data-${state.lang}`);
        el.innerText = translated || (isChineseContent() ? el.getAttribute('data-zh') : el.getAttribute('data-en'));
      });

      // Update placeholders
      document.querySelectorAll('[data-zh-placeholder]').forEach(el => {
        const translated = el.getAttribute(`data-${state.lang}-placeholder`);
        el.setAttribute('placeholder', translated || (isChineseContent() ? el.getAttribute('data-zh-placeholder') : el.getAttribute('data-en-placeholder')));
      });

      renderPredictions();
      renderTimeline();
      updateThemeLabels();
    }

    elements.langSelect.addEventListener('change', (event) => {
      state.lang = normalizeLang(event.target.value);
      localStorage.setItem('od-lang', state.lang);
      updateLocale();
    });

    /* ─── Theme Switcher Logic ──────────────────────────────────────── */
    function updateTheme() {
      document.body.setAttribute('data-theme', state.theme);
      updateThemeLabels();
      
      // Update icon dynamically
      if (state.theme === 'dark') {
        elements.themeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707m12.728 6.364A9 9 0 115.636 5.636m12.728 12.728A9 9 0 015.636 5.636"></path>`;
      } else {
        elements.themeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"></path>`;
      }
    }

    elements.themeToggle.addEventListener('click', () => {
      state.theme = state.theme === 'light' ? 'dark' : 'light';
      localStorage.setItem('od-theme', state.theme);
      updateTheme();
    });

    function updateThemeLabels() {
      elements.themeText.innerText = state.theme === 'light' ? text('darkMode') : text('lightMode');
    }

    function renderStatus(container, title, body, linkText) {
      container.innerHTML = `
        <div class="status-panel">
          <strong>${title}</strong>
          <span>${body}</span>
          ${linkText ? `<div style="margin-top: 8px;"><a class="status-link" href="methods.html">${linkText}</a></div>` : ''}
        </div>
      `;
    }

    /* ─── Predictions Voting Logic ──────────────────────────────────── */
    function renderPredictions() {
      if (state.dataStatus === 'loading') {
        renderStatus(
          elements.predictionsContainer,
          text('loadingPredictions'),
          text('loadingPredictionsBody')
        );
        return;
      }

      if (state.dataStatus === 'error') {
        renderStatus(
          elements.predictionsContainer,
          text('predictionsError'),
          text('predictionsErrorBody'),
          text('openMethodology')
        );
        return;
      }

      elements.predictionsContainer.innerHTML = '';
      const totalVotes = Object.values(state.votes).reduce((a, b) => a + b, 0);

      forecasts.forEach(p => {
        const itemVotes = state.votes[p.id] || 0;
        const percentage = totalVotes > 0 ? Math.round((itemVotes / totalVotes) * 100) : 0;
        const userHasVoted = state.hasVoted[p.id];
        const cardClass = userHasVoted ? 'predict-card voted' : 'predict-card';
        const buttonText = userHasVoted ? text('voted') : text('vote');
        const copy = localizedRecord(p);

        const card = document.createElement('div');
        card.className = cardClass;
        card.innerHTML = `
          <div class="predict-header">
            <h3>${copy.title}</h3>
            <p>${copy.desc}</p>
          </div>
          <div class="vote-area">
            <button class="vote-btn" onclick="vote('${p.id}')">
              <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width: 13px; height: 13px;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5"></path>
              </svg>
              <span>${buttonText}</span>
            </button>
            <div class="vote-bar-container">
              <div class="vote-bar" style="width: ${percentage}%"></div>
            </div>
            <div class="vote-stat">
              <span>${itemVotes} ${text('votes')}</span>
              <span>${percentage}%</span>
            </div>
          </div>
        `;
        elements.predictionsContainer.appendChild(card);
      });
    }

    window.vote = function(id) {
      if (state.hasVoted[id]) {
        state.votes[id] -= 1;
        delete state.hasVoted[id];
      } else {
        state.votes[id] += 1;
        state.hasVoted[id] = true;
      }
      localStorage.setItem('od-votes-v2', JSON.stringify(state.votes));
      localStorage.setItem('od-has-voted', JSON.stringify(state.hasVoted));
      renderPredictions();
    };

    /* ─── Curated Timeline Rendering ────────────────────────────────── */
    function renderTimeline() {
      if (state.dataStatus === 'loading') {
        renderStatus(
          elements.timelineContainer,
          text('loadingTimeline'),
          text('loadingTimelineBody')
        );
        return;
      }

      if (state.dataStatus === 'error') {
        renderStatus(
          elements.timelineContainer,
          text('timelineError'),
          text('timelineErrorBody'),
          text('openMethodology')
        );
        return;
      }

      elements.timelineContainer.innerHTML = '';
      
      const filteredEvents = aiEvents
        .slice()
        .sort((a, b) => b.date.localeCompare(a.date))
        .filter(e => {
        if (state.filters.significance !== 'all' && e.significance !== parseInt(state.filters.significance)) {
          return false;
        }
        if (state.filters.category !== 'all' && e.category !== state.filters.category) {
          return false;
        }
        if (state.filters.impactDimension !== 'all' && !e.impacts.some(impact => impact.dimension === state.filters.impactDimension)) {
          return false;
        }
        if (state.filters.consensusLevel !== 'all' && e.consensusLevel !== state.filters.consensusLevel) {
          return false;
        }
        if (state.searchQuery) {
          const query = state.searchQuery.toLowerCase();
          const copy = localizedRecord(e);
          const matchesTitle = copy.title.toLowerCase().includes(query);
          const matchesCategory = labelFor(categoryLabels[e.category]).toLowerCase().includes(query);
          const matchesSummary = copy.summary.toLowerCase().includes(query);
          const matchesTags = e.tags.some(tag => tag.toLowerCase().includes(query));
          return matchesTitle || matchesCategory || matchesSummary || matchesTags;
        }
        return true;
      });

      filteredEvents.forEach(e => {
        const item = document.createElement('div');
        item.className = `timeline-item sig-${e.significance}`;
        item.setAttribute('data-category', e.category);
        item.id = `item-${e.id}`;
        
        let nodeHTML = '';
        const copy = localizedRecord(e);
        const catClass = e.category || 'research';
        const categoryName = labelFor(categoryLabels[e.category]);
        const consensusName = labelFor(consensusLabels[e.consensusLevel]);
        const dateHTML = renderTimelineDate(e);
        const detailsHTML = state.activeEventId === e.id ? renderEventDetails(e) : '';
        const expandedClass = state.activeEventId === e.id ? ' expanded' : '';
        const metricsHTML = renderNodeMetrics(e, consensusName);

        if (e.significance === 3) {
          // Critical Node Layout
          nodeHTML = `
            <div class="timeline-date-col">
              ${dateHTML}
            </div>
            <div class="timeline-dot level-3"></div>
            <div class="timeline-entry">
              <div class="timeline-card-l3${expandedClass}" role="button" tabindex="0" onclick="openDetails('${e.id}')">
                <div class="timeline-node-head">
                  <div class="timeline-node-main">
                    <div class="card-meta">
                      <span class="category-badge ${catClass}">${categoryName}</span>
                    </div>
                    <div class="card-content">
                      <h3>${copy.title}</h3>
                      <p class="summary">${copy.summary}</p>
                    </div>
                  </div>
                  ${metricsHTML}
                </div>
                ${detailsHTML}
              </div>
            </div>
          `;
        } else if (e.significance === 2) {
          // Major Node Layout
          nodeHTML = `
            <div class="timeline-date-col">
              ${dateHTML}
            </div>
            <div class="timeline-dot level-2"></div>
            <div class="timeline-entry">
              <div class="timeline-card-l2${expandedClass}" role="button" tabindex="0" onclick="openDetails('${e.id}')">
                <div class="timeline-node-head">
                  <div class="timeline-node-main">
                    <div class="card-meta">
                      <span class="category-badge ${catClass}">${categoryName}</span>
                    </div>
                    <div class="card-content">
                      <h3>${copy.title}</h3>
                      <p class="summary">${copy.summary}</p>
                    </div>
                  </div>
                  ${metricsHTML}
                </div>
                ${detailsHTML}
              </div>
            </div>
          `;
        } else {
          // Minor Record Layout
          nodeHTML = `
            <div class="timeline-date-col">
              ${dateHTML}
            </div>
            <div class="timeline-dot level-1"></div>
            <div class="timeline-entry">
              <div class="timeline-card-l1${expandedClass}" role="button" tabindex="0" onclick="openDetails('${e.id}')">
                <div class="timeline-node-head">
                  <div class="timeline-node-main">
                    <div class="card-meta">
                      <span class="category-badge ${catClass}">${categoryName}</span>
                    </div>
                    <div class="card-content">
                      <h3>${copy.title}</h3>
                    </div>
                  </div>
                  ${metricsHTML}
                </div>
                ${detailsHTML}
              </div>
            </div>
          `;
        }
        
        item.innerHTML = nodeHTML;
        elements.timelineContainer.appendChild(item);
      });

      if (filteredEvents.length === 0) {
        const noResult = document.createElement('div');
        noResult.style.padding = '40px 0';
        noResult.style.textAlign = 'center';
        noResult.style.color = 'var(--muted)';
        noResult.innerText = text('noResults');
        elements.timelineContainer.appendChild(noResult);
      }
    }

    function renderTimelineDate(e) {
      const raw = String(e.date || '');
      const parts = raw.split('-');
      const year = parts[0] || raw;
      let subdate = '';

      if (e.datePrecision === 'day' && parts.length >= 3) {
        subdate = isChineseContent()
          ? `${Number(parts[1])}月${Number(parts[2])}日`
          : new Date(`${parts[0]}-${parts[1]}-${parts[2]}T00:00:00`).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      } else if (e.datePrecision === 'month' && parts.length >= 2) {
        subdate = isChineseContent()
          ? `${Number(parts[1])}月`
          : new Date(`${parts[0]}-${parts[1]}-01T00:00:00`).toLocaleDateString('en-US', { month: 'short' });
      }

      return `
        <span class="timeline-year">${year}</span>
        ${subdate ? `<span class="timeline-subdate">${subdate}</span>` : ''}
      `;
    }

    function renderNodeMetrics(e, consensusName) {
      const impactLabel = text('impactScore');
      return `
        <div class="timeline-node-side">
          <span class="timeline-node-level">L${e.significance}</span>
          <span class="timeline-node-impact">${impactLabel} ${e.impactIndex}/10</span>
          <span class="timeline-node-consensus">${consensusName}</span>
        </div>
      `;
    }

    function renderEventDetails(e) {
      const copy = localizedRecord(e);
      const eventSources = (e.sources || []).map((sourceRef) => ({
        ref: sourceRef,
        source: sourcesById.get(sourceRef.sourceId) || { id: sourceRef.sourceId, title: sourceRef.sourceId, type: 'unknown', url: '' }
      }));

      const sourceItems = eventSources.map(({ ref, source }, index) => `
        <li class="source-card">
          <span class="source-index">[${index + 1}]</span>
          <div class="source-body">
            <div class="source-row">
              <span class="source-title">${source.title}</span>
              <span class="impact-score">${labelFor(sourceTypeLabels[source.type]) || source.type}</span>
            </div>
            <p class="source-meta">${source.url || (isChineseContent() ? '当前记录的是来源指向。推荐后续补 DOI、原始页面链接、存档链接和抓取时间。' : 'This currently stores the citation pointer. Next step: add DOI, canonical URL, archive URL, and capture timestamp.')}</p>
            ${ref.quote ? `<div class="source-quote">${ref.quote}</div>` : ''}
            <div class="source-status">
              <span class="source-chip">${isChineseContent() ? '引用已记录' : 'Citation logged'}</span>
              <span class="source-chip">${source.url ? (isChineseContent() ? '原文可访问' : 'Live source') : (isChineseContent() ? '待补原文链接' : 'URL pending')}</span>
              <span>${isChineseContent() ? '建议保留本地摘录或网页快照，避免原始页面失效。' : 'Preserve a local excerpt or web snapshot to guard against link rot.'}</span>
            </div>
          </div>
        </li>
      `).join('');

      const impactItems = e.impacts.map(impact => `
        <li class="impact-item">
          <div class="impact-head">
            <span class="impact-name">${labelFor(impactLabels[impact.dimension])}</span>
            <span class="impact-score">${impact.severity > 0 ? '+' : ''}${impact.severity} · ${labelFor(timeframeLabels[impact.timeframe])}</span>
          </div>
          <p class="impact-description">${localizedText(impact.description)}</p>
          <p class="impact-description">${text('affected')}: ${impact.affectedGroups.join(isChineseContent() ? '、' : ', ')}</p>
        </li>
      `).join('');

      return `
        <div class="timeline-details">
          <div class="detail-section">
            <span class="detail-title">${isChineseContent() ? '事件摘要' : 'Event Summary'}</span>
            <p class="commentary-text">${copy.description}</p>
          </div>
          <div class="detail-section">
            <span class="detail-title">${isChineseContent() ? '影响评估' : 'Impact Assessment'}</span>
            <ul class="impact-list">${impactItems}</ul>
          </div>
          <div class="detail-section">
            <span class="detail-title">${isChineseContent() ? '可信度与来源' : 'Consensus And Sources'}</span>
            <div class="field-grid" style="padding: 0; border: 0;">
              <div class="field-item">
                <span class="label">${isChineseContent() ? '重要度' : 'Significance'}</span>
                <span class="val">L${e.significance}</span>
              </div>
              <div class="field-item">
                <span class="label">${isChineseContent() ? '可信度' : 'Consensus'}</span>
                <span class="val">${labelFor(consensusLabels[e.consensusLevel])}</span>
              </div>
              <div class="field-item">
                <span class="label">${isChineseContent() ? '是否有争议' : 'Controversy'}</span>
                <span class="val">${e.controversy ? (isChineseContent() ? '是' : 'Yes') : (isChineseContent() ? '否' : 'No')}</span>
              </div>
              <div class="field-item">
                <span class="label">${isChineseContent() ? '日期精度' : 'Date Precision'}</span>
                <span class="val">${e.datePrecision}</span>
              </div>
            </div>
            <ul class="source-list">${sourceItems}</ul>
          </div>
          <div class="detail-section">
            <span class="detail-title">${isChineseContent() ? '标签' : 'Tags'}</span>
            <ul class="tag-list">${e.tags.map(tag => `<li>${tag}</li>`).join('')}</ul>
          </div>
        </div>
      `;
    }

    /* ─── Interactive Inline Details ────────────────────────────────── */
    window.openDetails = function(id, shouldPushState = true) {
      const e = aiEvents.find(item => item.id === id);
      if (!e) return;

      state.activeEventId = state.activeEventId === id && shouldPushState ? null : id;
      renderTimeline();
      
      if (shouldPushState) {
        history.pushState(null, '', state.activeEventId ? `?event=${e.id}` : window.location.pathname);
      }
    };

    window.closeDetails = function(shouldPushState = true) {
      state.activeEventId = null;
      renderTimeline();
      if (shouldPushState) {
        history.pushState(null, '', window.location.pathname);
      }
    };

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDetails(true);
    });

    /* ─── Browser Back-button (History) Integration ─────────────────── */
    window.addEventListener('popstate', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const eventId = urlParams.get('event');
      if (eventId) {
        openDetails(eventId, false);
      } else {
        closeDetails(false);
      }
    });

    /* ─── Search and Filtering ──────────────────────────────────────── */
    elements.searchInput.addEventListener('input', (e) => {
      state.searchQuery = e.target.value;
      renderTimeline();
    });

    elements.timelineContainer.addEventListener('keydown', (e) => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('[role="button"]')) {
        e.preventDefault();
        const item = e.target.closest('.timeline-item');
        if (item) openDetails(item.id.replace('item-', ''));
      }
    });

    elements.significanceFilter.addEventListener('change', (e) => {
      state.filters.significance = e.target.value;
      renderTimeline();
    });
    elements.categoryFilter.addEventListener('change', (e) => {
      state.filters.category = e.target.value;
      renderTimeline();
    });
    elements.impactFilter.addEventListener('change', (e) => {
      state.filters.impactDimension = e.target.value;
      renderTimeline();
    });
    elements.consensusFilter.addEventListener('change', (e) => {
      state.filters.consensusLevel = e.target.value;
      renderTimeline();
    });

    /* ─── Initialization ────────────────────────────────────────────── */
    async function init() {
      // Check query param for initial page load
      const urlParams = new URLSearchParams(window.location.search);
      const eventId = urlParams.get('event');
      
      // Update UI languages & themes
      updateLocale();
      updateTheme();
      await loadSiteData();
      
      if (eventId && state.dataStatus === 'ready') {
        setTimeout(() => openDetails(eventId, false), 300);
      }
    }

    init();
  </script>
</body>
</html>
