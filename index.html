"transformer-published-2017", "transformer-universal-impact"], "quote": "We propose a new simple network architecture, the Transformer, based solely on attention mechanisms, dispensing with recurrence and convolutions entirely."}, {"sourceId": "wikipedia-transformer", "supports": ["transformer-universal-impact"], "quote": "As of 2026, the paper has been cited more than 250,000 times, placing it among the top ten most-cited papers of the 21st century."}, {"sourceId": "techspot-transformers", "supports": [], "quote": "Meet Transformers: The Google Breakthrough that Rewrote AI's Roadmap."}], "relatedEvents": ["alexnet-2012", "gpt3-2020", "chatgpt-2022"], "relatedForecasts": [], "editorial": {"createdAt": "2026-06-24", "updatedAt": "2026-06-24", "reviewedAt": "2026-06-24", "publishedAt": "2026-06-24", "curator": "gang", "changeLog": [{"date": "2026-06-24", "changeType": "created", "summary": "Initial v2 entry for the Transformer architecture."}]}, "categories": ["capability"]}, {"id": "turing-test-1950", "slug": "turing-test", "title": {"en": "Alan Turing publishes \"Computing Machinery and Intelligence\", proposing what becomes the Turing Test", "zhHans": "Alan Turing 发表《计算机器与智能》，提出后来被称为图灵测试的思想实验"}, "searchSummary": {"en": "Alan Turing’s 1950 paper proposed the Imitation Game — the first test for machine intelligence. How a simple question started the field of AI.", "zhHans": "艾伦·图灵 1950 年论文提出了「模仿游戏」——第一个机器智能测试。了解一个简单问题如何开创了整个 AI 领域。"}, "summary": {"en": "Alan Turing published his landmark paper in Mind, proposing the \"Imitation Game\"—a test to determine whether machines can think. Rather than defining \"thinking\" philosophically, Turing framed intelligence as a behavioral question: can a machine converse well enough to be indistinguishable from a human? This paper is widely regarded as the philosophical foundation of artificial intelligence.", "zhHans": "艾伦·图灵在哲学期刊 Mind 上发表里程碑论文《计算机器与智能》，提出用\"模仿游戏\"（后称图灵测试）来判断机器是否能思考。图灵不纠缠\"思考\"的哲学定义，而是将智能转化为可操作的行为问题：机器能否在对话中让人无法分辨？这篇论文被公认为人工智能的哲学奠基之作。"}, "narrative": {"en": "Turing's 28-page paper appeared in the October 1950 issue of Mind. It opens with a deceptively simple question: \"Can machines think?\" Turing immediately sets this aside as \"too meaningless to deserve discussion\" and replaces it with a concrete, testable alternative—the Imitation Game. In this game, a human interrogator converses with two hidden participants (one human, one machine) and tries to identify which is which. If the machine can fool the interrogator as often as a human can, Turing argued, we have no good reason to deny it is thinking. The paper also anticipated and refuted nine major objections to machine intelligence—from theological arguments to the \"mathematical objection\" based on Gödel's incompleteness theorems. Remarkably, Turing predicted that by the year 2000, computers with 10^9 bits of storage would be able to play the imitation game well enough that an average interrogator would have no more than a 70% chance of correct identification after five minutes of questioning. While his timeline was too optimistic, the core paradigm he established—judging intelligence by performance rather than by internal mechanism—has shaped all subsequent AI research. The paper has since become one of the most cited and referenced philosophical works ever published, influencing not only computer science but also epistemology, cognitive science, and the philosophy of mind.", "zhHans": "图灵的 28 页论文发表于 1950 年 10 月号的 Mind。开篇以一个看似简单的问题切入：\"机器能思考吗？\"图灵随即将其搁置，认为这个问题\"太过无意义不值得讨论\"，转而提出一个具体的、可检验的替代方案——模仿游戏。游戏中，一个人类审问者与两个隐藏的参与者（一个人类、一个机器）通过文本对话交流，试图判断谁是谁。如果机器能像人类一样频繁地骗过审问者，图灵认为我们没有理由否认它在思考。论文还预见并反驳了对机器智能的九种主要反对意见——从神学论证到基于哥德尔不完备定理的\"数学反对\"。图灵惊人地预测：到 2000 年，拥有 10^9 位存储容量的计算机将能玩好模仿游戏，让普通审问者在五分钟提问后正确识别的概率不超过 70%。虽然时间线过于乐观，但他建立的核心范式——通过表现而非内部机制来判断智能——塑造了此后所有 AI 研究。这篇论文已成为有史以来被引用和讨论最多的哲学文献之一，不仅影响计算机科学，也影响认识论、认知科学和心灵哲学。"}, "date": "1950-10", "datePrecision": "month", "displayDate": {"en": "October 1950", "zhHans": "1950年10月"}, "status": "published", "significance": 3, "impactIndex": 6, "consensusLevel": "broad", "controversy": true, "impacts": [{"dimension": "paradigm_shift", "severity": 3, "direction": "positive", "description": {"en": "Transformed the question of machine intelligence from abstract philosophy into an operational, testable framework. The behavioral criterion replaced essentialist debates about what \"thinking\" means, defining the fundamental research question for 70+ years of AI.", "zhHans": "将机器智能的问题从抽象哲学转变为可操作的、可检验的框架。行为标准取代了关于\"思考\"本质的本质主义辩论，定义了此后 70 余年 AI 研究的基本问题方向。"}, "affectedGroups": ["AI researchers", "philosophers", "cognitive scientists"], "timeframe": "long", "evidenceGrade": "A", "sourceIds": ["turing-1950-paper", "ieee-turing-test-75-2025", "sep-turing-test"]}, {"dimension": "capability_leap", "severity": 2, "direction": "positive", "description": {"en": "Established natural language dialogue as the benchmark for machine intelligence, a standard that remains central to NLP research and has directly influenced the design goals of modern language models from ELIZA to GPT-4.", "zhHans": "确立了自然语言对话作为机器智能的基准，这一标准至今仍是 NLP 研究的核心目标，并直接影响从 ELIZA 到 GPT-4 的现代语言模型的设计方向。"}, "affectedGroups": ["NLP researchers", "AI engineers"], "timeframe": "long", "evidenceGrade": "A", "sourceIds": ["turing-1950-paper", "ieee-spectrum-70-years-ai-2026"]}, {"dimension": "risk_creation", "severity": -1, "direction": "negative", "description": {"en": "The behavioral criterion alone proved insufficient: John Searle's Chinese Room Argument (1980) demonstrated that passing the Turing Test does not guarantee genuine understanding or consciousness. This created an enduring philosophical debate about whether behavioral tests can adequately measure intelligence, with implications for AI safety and ethics.", "zhHans": "仅靠行为标准被证明不足：John Searle 的中文屋论证（1980）表明通过图灵测试不保证真正的理解或意识。这创造了关于行为测试是否能充分衡量智能的持久哲学辩论，对 AI 安全和伦理产生深远影响。"}, "affectedGroups": ["philosophers", "AI safety researchers", "ethicists"], "timeframe": "long", "evidenceGrade": "A", "sourceIds": ["sep-chinese-room", "searle-1980-minds-brains"]}], "claims": [{"id": "turing-published-1950", "text": {"en": "Alan Turing published \"Computing Machinery and Intelligence\" in the October 1950 issue of Mind, volume 49, pages 433-460.", "zhHans": "艾伦·图灵于 1950 年 10 月在 Mind 杂志第 49 卷发表《计算机器与智能》，第 433-460 页。"}, "claimType": "fact", "evidenceGrade": "A", "sourceIds": ["turing-1950-paper"]}, {"id": "turing-behavioral-shift", "text": {"en": "Turing's paper shifted the question of machine intelligence from philosophical definitions of \"thinking\" to a behavioral, falsifiable test—a framework that all subsequent AI research follows.", "zhHans": "图灵的论文将机器智能问题从\"思考\"的哲学定义转向行为性的、可证伪的测试——这一框架被此后所有 AI 研究所遵循。"}, "claimType": "impact", "evidenceGrade": "A", "sourceIds": ["ieee-turing-test-75-2025", "ieee-spectrum-70-years-ai-2026"]}, {"id": "chinese-room-limitation", "text": {"en": "John Searle's Chinese Room Argument (1980) demonstrated that passing a behavioral test does not prove genuine understanding, exposing a fundamental limitation in the Turing Test as a measure of intelligence.", "zhHans": "John Searle 的中文屋论证（1980）表明通过行为测试不能证明真正的理解，揭示了图灵测试作为智能衡量标准的根本局限。"}, "claimType": "limitation", "evidenceGrade": "A", "sourceIds": ["sep-chinese-room", "searle-1980-minds-brains"]}], "sources": [{"sourceId": "turing-1950-paper", "supports": ["turing-published-1950"], "quote": "I propose to consider the question, 'Can machines think?'"}, {"sourceId": "ieee-turing-test-75-2025", "supports": ["turing-behavioral-shift"], "quote": "The Turing test became a cornerstone in the philosophy and science of artificial intelligence."}, {"sourceId": "ieee-spectrum-70-years-ai-2026", "supports": ["turing-behavioral-shift"], "quote": "The test remains an influential concept in AI and the philosophy of intelligence."}, {"sourceId": "sep-turing-test", "supports": ["turing-behavioral-shift"], "quote": null}, {"sourceId": "sep-chinese-room", "supports": ["chinese-room-limitation"], "quote": "The Chinese Room Argument holds that a computer executing a program cannot have a mind, understanding, or consciousness."}, {"sourceId": "searle-1980-minds-brains", "supports": ["chinese-room-limitation"], "quote": null}], "relatedEvents": ["dartmouth-1956", "eliza-1966"], "relatedForecasts": ["agi-2027-2029"], "editorial": {"createdAt": "2026-06-24", "updatedAt": "2026-06-24", "reviewedAt": "2026-06-24", "publishedAt": "2026-06-24", "curator": "gang", "changeLog": [{"date": "2026-06-24", "changeType": "created", "summary": "Initial v2 entry for Turing's 1950 paper."}]}, "categories": ["capability"]}, {"id": "vibecoding-2025", "slug": "vibecoding-coined", "title": {"en": "'Vibe coding' is coined, capturing a new paradigm of AI-assisted programming", "zhHans": "'Vibe coding' 一词诞生，概括了 AI 辅助编程的新范式"}, "searchSummary": {"en": "‘Vibe coding’ — coined by Andrej Karpathy in 2025 — captured the new paradigm where AI does the coding and humans guide with natural language. The term that defined a shift.", "zhHans": "「Vibe coding」一词由 Andrej Karpathy 在 2025 年提出，概括了 AI 代写代码、人类用自然语言引导的新编程范式。这个定义了时代转变的词。"}, "summary": {"en": "On February 2, 2025, AI researcher Andrej Karpathy coined the term 'vibe coding' in a viral tweet, describing a new programming paradigm where developers describe tasks to LLMs and accept generated code without thorough review. The term quickly entered mainstream vocabulary, was named Collins Dictionary Word of the Year 2025, and was listed by Merriam-Webster. It crystallized a profound shift: AI had transformed coding from a craft of precise syntax into a conversation of intent.", "zhHans": "2025 年 2 月 2 日，AI 研究员 Andrej Karpathy 在一条病毒式推文中创造了\"vibe coding\"一词，描述了一种新的编程范式：开发者向大语言模型描述任务，接受生成的代码而不经过彻底审查。该词迅速进入主流词汇，被《柯林斯英语词典》评为 2025 年度词汇，并被《韦氏词典》收录。它凝固了一个深刻的转变：AI 将编码从精确语法的工艺转变为意图的对话。"}, "narrative": {"en": "On February 2, 2025, Andrej Karpathy — co-founder of OpenAI and former AI lead at Tesla — posted a tweet that gave a name to a phenomenon millions of developers were already experiencing: 'There's a new kind of coding I call \"vibe coding,\" where you fully give in to the vibes, embrace exponentials, and forget that the code even exists.' He described how with tools like Cursor Composer and SuperWhisper, he barely touched the keyboard: 'I \"Accept All\" always, I don't read the diffs anymore. When I get error messages I just copy paste them in with no comment, usually that fixes it.' The tweet went viral instantly. Within days, 'vibe coding' was being discussed in developer communities, tech media, and mainstream publications. The New York Times ran experiments with it. Simon Willison offered a nuanced counterpoint: 'If an LLM wrote every line of your code, but you've reviewed, tested, and understood it all, that's not vibe coding... that's using an LLM as a typing assistant.' The term captured a real shift in software engineering practice. It wasn't just a meme — it described an emerging reality where AI coding tools (GitHub Copilot, Cursor, Claude Code, Codex) had become so capable that many developers were producing working software without fully understanding the generated code. By year's end, vibe coding was named Collins Dictionary Word of the Year 2025 and listed by Merriam-Webster as a 'slang & trending' term. The concept resonated because it wasn't about technology alone — it was about a cultural reckoning with what it means to 'code' when the machines write the code and humans guide the intent. It joined 'prompt engineering' and 'hallucination' as the linguistic artifacts of the AI era.", "zhHans": "2025 年 2 月 2 日，OpenAI 联合创始人、前特斯拉 AI 负责人 Andrej Karpathy 发了一条推文，为数百万开发者已经在经历的现象命了名：\"有一种新的编程方式，我叫它'vibe coding'，你完全沉浸在氛围中，拥抱指数级增长，忘记代码的存在。\"他描述了使用 Cursor Composer 和 SuperWhisper 等工具时，他几乎不碰键盘：\"我永远选'全部接受'，不再读 diff 了。报错了我直接复制粘贴不加注释，通常就能修好。\"该推文立即病毒式传播。几天之内，\"vibe coding\"就在开发者社区、科技媒体和主流出版物中被广泛讨论。《纽约时报》做了实验。Simon Willison 提出了一个微妙的观点：\"如果 LLM 写了你的每一行代码，但你审查、测试并理解了它们，那对我来说不是 vibe coding——那是把 LLM 当打字助手。\"这个词捕捉到了软件工程实践中的真实转变。它不仅仅是一个梗——它描述了一个正在出现的现实：AI 编程工具（GitHub Copilot、Cursor、Claude Code、Codex）已经变得如此强大，许多开发者在不完全理解所生成代码的情况下生产着可工作软件。到年底，vibe coding 被《柯林斯英语词典》评为 2025 年度词汇，并被《韦氏词典》列为\"俚语与趋势\"词。这个概念之所以引起共鸣，因为它不仅关乎技术——它是关于当机器写代码、人类引导意图时，\"编程\"意味着什么的文化清算。它加入了\"提示工程\"和\"幻觉\"的行列，成为 AI 时代的语言制品。"}, "date": "2025-02-02", "datePrecision": "day", "displayDate": {"en": "February 2, 2025", "zhHans": "2025年2月2日"}, "categories": ["society", "product"], "status": "published", "significance": 1, "impactIndex": 5, "consensusLevel": "broad", "controversy": true, "impacts": [{"dimension": "paradigm_shift", "severity": 2, "direction": "positive", "description": {"en": "Gave language to a profound shift in programming practice. Named Collins Word of the Year 2025 and listed by Merriam-Webster. Crystallized the transformation of software engineering from precise syntax manipulation to intent-driven AI collaboration.", "zhHans": "为编程实践中的深刻变革赋予了语言。被《柯林斯英语词典》评为 2025 年度词汇，被《韦氏词典》收录。凝固了软件工程从精确语法操作向意图驱动的 AI 协作的转变。"}, "affectedGroups": ["software developers", "students", "AI companies", "general public"], "timeframe": "long", "evidenceGrade": "A", "sourceIds": ["wikipedia-vibe-coding"]}], "claims": [{"id": "vibecoding-coined-fact", "text": {"en": "Andrej Karpathy coined the term 'vibe coding' in a tweet on February 2, 2025. The term was named Collins Dictionary Word of the Year 2025 and listed by Merriam-Webster.", "zhHans": "Andrej Karpathy 于 2025 年 2 月 2 日在推文中创造了'vibe coding'一词。该术语被《柯林斯英语词典》评为 2025 年度词汇，并被《韦氏词典》收录。"}, "claimType": "fact", "evidenceGrade": "A", "sourceIds": ["wikipedia-vibe-coding"]}], "sources": [{"sourceId": "wikipedia-vibe-coding", "supports": ["vibecoding-coined-fact"], "quote": "The term was coined in February 2025 by computer scientist Andrej Karpathy. It was named the Collins English Dictionary Word of the Year for 2025."}, {"sourceId": "karpathy-vibe-coding-tweet", "supports": [], "quote": "There's a new kind of coding I call 'vibe coding'."}], "relatedEvents": ["chatgpt-2022", "github-copilot-2022"], "relatedForecasts": [], "editorial": {"createdAt": "2026-06-24", "updatedAt": "2026-06-24", "reviewedAt": "2026-06-24", "publishedAt": "2026-06-24", "curator": "gang", "changeLog": [{"date": "2026-06-24", "changeType": "created", "summary": "Added vibe coding — Collins Word of the Year 2025, conceptual shift in programming."}]}}, {"id": "watson-jeopardy-2011", "slug": "watson-jeopardy", "title": {"en": "IBM Watson defeats human champions on Jeopardy!", "zhHans": "IBM Watson 在 Jeopardy! 上击败人类冠军"}, "searchSummary": {"en": "IBM Watson defeats Jeopardy! champions Ken Jennings and Brad Rutter in 2011. How a question-answering AI system proved machines could understand natural language.", "zhHans": "IBM Watson 于 2011 年在《危险边缘》中击败人类冠军。一个问答 AI 系统证明了机器可以理解自然语言。"}, "summary": {"en": "On February 16, 2011, IBM's Watson supercomputer defeated all-time Jeopardy! champions Ken Jennings and Brad Rutter across three episodes. Watson used natural language processing and information retrieval over 200 million pages of content, demonstrating that machines could handle the ambiguity of natural language at human-comparable levels in a constrained domain.", "zhHans": "2011 年 2 月 16 日，IBM 的 Watson 超级计算机在三期节目中击败了 Jeopardy! 历史总冠军 Ken Jennings 和 Brad Rutter。Watson 使用自然语言处理和检索技术，在 2 亿页内容上进行实时分析，证明了机器可以在受限领域以接近人类的水平处理自然语言的模糊性。"}, "narrative": {"en": "Jeopardy! is significantly harder for computers than chess. The clues require parsing puns, wordplay, indirect references, and cultural knowledge across an unbounded range of topics. Watson, developed by IBM Research under David Ferrucci, ran on 90 IBM Power 750 servers (2,880 processor cores) and was never connected to the internet during the match. It processed natural language questions in seconds, ranked its confidence across millions of possible answers, and triggered a physical buzzer mechanism to compete with the speed of human reflexes. The match was broadcast over three nights (February 14-16, 2011) and watched by millions. Watson won with $77,147, with Jennings at $24,000 and Rutter at $21,600. One memorable moment: Watson answered in a category about 'U.S. Cities' with 'What is Toronto?'—demonstrating the system's limitations in understanding geographic context. IBM pledged never to use Watson for weaponry and instead commercialized it for healthcare (tumor diagnosis), financial services, and customer service. However, Watson Health failed to deliver on its promises and was shut down in 2022, becoming a cautionary tale about overhyping AI capabilities. Despite the limited commercial outcome, the Jeopardy! victory served as a bridge between Deep Blue's narrow symbolic strength and the deep learning breakthroughs that followed.", "zhHans": "Jeopardy! 对计算机而言比国际象棋困难得多。线索需要解析双关语、文字游戏、间接引用以及跨无限主题的文化知识。Watson 由 IBM 研究院 David Ferrucci 领导开发，运行在 90 台 IBM Power 750 服务器（2,880 个处理器核心）上，比赛期间从未接入互联网。它在几秒钟内处理自然语言问题，对数百万个可能答案进行置信度排序，并触动物理蜂鸣器机制以与人类反应速度竞争。比赛在三晚（2011 年 2 月 14-16 日）播出，数百万人观看。Watson 以 $77,147 获胜，Jennings $24,000，Rutter $21,600。一个令人难忘的时刻：Watson 在一个关于\"美国城市\"的类别中回答了\"多伦多是什么？\"——展示了系统在地理上下文理解方面的局限。IBM 承诺绝不为武器用途使用 Watson，而是将其商业化用于医疗（肿瘤诊断）、金融服务和客户服务。然而，Watson Health 未能兑现其承诺，于 2022 年关停，成为过度炒作 AI 能力的警示故事。尽管商业成果有限，Jeopardy! 的胜利仍然架起了深蓝的窄域符号方法到后续深度学习突破之间的桥梁。"}, "date": "2011-02-16", "datePrecision": "day", "displayDate": {"en": "February 16, 2011", "zhHans": "2011年2月16日"}, "status": "published", "significance": 1, "impactIndex": 5, "consensusLevel": "broad", "controversy": false, "impacts": [{"dimension": "capability_leap", "severity": 1, "direction": "positive", "description": {"en": "Demonstrated that NLP + information retrieval could parse natural language ambiguity in a competitive real-time setting. However, the approach (hand-engineered features, massive compute, no real learning) proved to be a dead end compared to deep learning alternatives that emerged shortly after.", "zhHans": "证明了自然语言处理与信息检索结合可以在竞争性的实时环境中解析自然语言的模糊性。然而，其方法（手工设计特征、大规模计算、没有真正的学习能力）被随后出现的深度学习替代方案证明是死胡同。"}, "affectedGroups": ["NLP researchers", "IBM", "computer scientists"], "timeframe": "medium", "evidenceGrade": "A", "sourceIds": ["ibm-watson-jeopardy", "axios-watson-2021"]}, {"dimension": "paradigm_shift", "severity": 1, "direction": "positive", "description": {"en": "Publicly demonstrated that machines could compete with humans on general knowledge quizzes involving natural language understanding. Shifted public perception from 'AI can play chess' to 'AI can answer any question.'", "zhHans": "公开展示了机器可以在涉及自然语言理解的一般知识问答中与人类竞争。将公众认知从\"AI 能下国际象棋\"推进到\"AI 能回答任何问题\"。"}, "affectedGroups": ["general public", "media", "business leaders"], "timeframe": "short", "evidenceGrade": "A", "sourceIds": ["ibm-watson-jeopardy"]}], "claims": [{"id": "watson-defeats-jennings-rutter", "text": {"en": "IBM Watson defeated Jeopardy! champions Ken Jennings and Brad Rutter across three episodes broadcast February 14-16, 2011, winning $77,147.", "zhHans": "IBM Watson 在 2011 年 2 月 14-16 日播出的三期节目中击败了 Jeopardy! 冠军 Ken Jennings 和 Brad Rutter，赢得 $77,147。"}, "claimType": "fact", "evidenceGrade": "A", "sourceIds": ["ibm-watson-jeopardy"]}, {"id": "watson-health-legacy", "text": {"en": "Watson was commercialized for healthcare, financial services, and customer service, but Watson Health was shut down in 2022 after failing to meet expectations.", "zhHans": "Watson 被商业化用于医疗、金融服务和客户服务，但 Watson Health 在未能达到预期后于 2022 年关停。"}, "claimType": "impact", "evidenceGrade": "A", "sourceIds": ["axios-watson-2021"]}], "sources": [{"sourceId": "ibm-watson-jeopardy", "supports": ["watson-defeats-jennings-rutter", "watson-health-legacy"], "quote": "Watson defeated the two most celebrated champions in Jeopardy! history—Ken Jennings and Brad Rutter—in a three-day event."}, {"sourceId": "axios-watson-2021", "supports": ["watson-health-legacy"], "quote": "IBM has spent years trying to make its Watson technology a business success. The results have been mixed."}], "relatedEvents": ["deep-blue-1997", "alexnet-2012"], "relatedForecasts": [], "editorial": {"createdAt": "2026-06-24", "updatedAt": "2026-06-24", "reviewedAt": "2026-06-24", "publishedAt": "2026-06-24", "curator": "gang", "changeLog": [{"date": "2026-06-24", "changeType": "created", "summary": "Initial v2 entry for Watson Jeopardy! victory."}]}, "categories": ["capability", "society"]}]</script>
