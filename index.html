-06-25", "updatedAt": "2026-06-25", "lastReviewedAt": "2026-06-25", "reviewCadence": "monthly", "expectedWindow": {"start": "2027", "end": "2030", "precision": "year"}, "confidence": {"level": "medium", "evidenceGrade": "B"}, "rationale": {"currentBaseline": {"en": "Agents can already browse, call tools, fill forms, and coordinate short tasks. Enterprises are experimenting, but broad operational trust is still uneven.", "zhHans": "智能体已经能浏览网页、调用工具、填写表单并协调短任务。企业也在试验，但对其进行广泛运营级信任仍然很不均衡。"}, "whyThisDirection": {"en": "What matters now is whether these capabilities stay as product demos and copilots, or become repeatable workflow layers across support, operations, reporting, and internal systems.", "zhHans": "现在真正值得看的是，这些能力会停留在产品演示和副驾层，还是会成为客服、运营、报告和内部系统中的可重复工作流层。"}, "counterSignal": {"en": "Exception handling, confidentiality, approvals, system integration, and liability remain major blockers to treating agents as trusted enterprise operators.", "zhHans": "异常处理、保密要求、审批流程、系统集成和责任归属，仍然是把智能体当作可信企业执行者的主要障碍。"}, "openQuestions": [{"en": "Which enterprise workflows are bounded enough for real agent autonomy, and which still depend too heavily on human judgment?", "zhHans": "哪些企业工作流足够边界明确，适合真正的智能体自治？哪些又仍然过度依赖人工判断？"}, {"en": "What public evidence would show that enterprises trust agents beyond pilots and internal showcases?", "zhHans": "什么样的公开证据才能说明企业对智能体的信任已经超越试点和内部展示？"}]}, "signals": [{"id": "autonomous-agents-broke-into-mainstream-awareness", "kind": "product", "status": "observed", "label": {"en": "Autonomous agents have already entered mainstream developer awareness.", "zhHans": "自主智能体已经进入主流开发者视野。"}, "summary": {"en": "Auto-GPT was a turning point in making goal-driven agents legible to ordinary developers, even before enterprise reliability was solved.", "zhHans": "Auto-GPT 让以目标驱动的智能体首次被普通开发者清晰感知，即便企业级可靠性当时仍未解决。"}, "eventIds": ["auto-gpt-2023"], "sourceIds": ["wikipedia-auto-gpt", "github-autogpt"]}, {"id": "agent-infrastructure-and-products-are-forming", "kind": "infrastructure", "status": "observed", "label": {"en": "Agent infrastructure and first-party agent products are now appearing together.", "zhHans": "智能体基础设施和一方产品正在同时成形。"}, "summary": {"en": "MCP, Project Mariner, and Operator collectively show that major labs are building not just agent demos, but the protocols, interfaces, and products needed for multi-step task execution.", "zhHans": "MCP、Project Mariner 和 Operator 共同表明，大型实验室正在构建的不只是智能体演示，而是支撑多步任务执行所需的协议、界面和产品。"}, "eventIds": ["mcp-protocol-2024", "gemini-2-agents-2024", "openai-operator-2025"], "sourceIds": ["anthropic-mcp-blog-2024", "google-gemini-2-blog-2024", "openai-operator"]}, {"id": "independent-tracking-of-agent-adoption-now-exists", "kind": "market", "status": "observed", "label": {"en": "Independent reports now treat deployed agents as a real adoption category.", "zhHans": "独立报告已经把已部署智能体视为一个真实的采用类别。"}, "summary": {"en": "Independent tracking from MIT, Stanford, and McKinsey suggests that agent deployment and enterprise experimentation are now large enough to measure, not just to speculate about.", "zhHans": "来自 MIT、Stanford 和麦肯锡的独立追踪说明，智能体部署和企业试验已经发展到足以被测量，而不只是被猜测。"}, "eventIds": ["mcp-protocol-2024", "openai-operator-2025"], "sourceIds": ["mit-ai-agent-index-2025", "stanford-ai-index-2026", "mckinsey-state-ai-2025"]}], "consensusBasis": {"resolutionMode": "monitor_only", "basisType": "none", "summary": {"en": "Public evidence shows that enterprise agent infrastructure and experimentation are real, but there is still no widely accepted outside standard for when 'autonomous enterprise workflows' should be declared achieved. The module therefore tracks concrete signals and deployment language rather than publishing a private completion line.", "zhHans": "公开证据已经表明企业智能体基础设施和试验是真实存在的，但目前仍没有被广泛接受的外部标准，用来判断“自主企业工作流”何时算达成。因此模块只跟踪具体信号和部署表述，而不公开设定一条私有完成线。"}, "sourceIds": ["nist-ai-rmf-1-0", "mit-ai-agent-index-2025", "eu-ai-act-official"]}, "sources": [{"sourceId": "anthropic-mcp-blog-2024", "supports": ["signals", "infrastructureContext"]}, {"sourceId": "google-gemini-2-blog-2024", "supports": ["signals", "productContext"]}, {"sourceId": "openai-operator", "supports": ["signals", "productContext"]}, {"sourceId": "mit-ai-agent-index-2025", "supports": ["signals", "consensusBasis"]}, {"sourceId": "mckinsey-state-ai-2025", "supports": ["signals", "adoptionContext"]}, {"sourceId": "nist-ai-rmf-1-0", "supports": ["consensusBasis"]}], "relatedEvents": ["auto-gpt-2023", "mcp-protocol-2024", "gemini-2-agents-2024", "openai-operator-2025"], "tags": ["agents", "enterprise-ai", "workflow-automation", "tool-use"], "editorial": {"createdAt": "2026-06-25", "updatedAt": "2026-06-25", "reviewedAt": "2026-06-25", "publishedAt": "2026-06-25", "curator": "EpochArc editorial", "screeningRunId": "possible-directions-2026-06-25c"}}, {"id": "robots-leave-the-pilot-zone", "slug": "robots-leave-the-pilot-zone", "title": {"en": "Robots Leave the Pilot Zone", "zhHans": "机器人走出试点区"}, "thesis": {"en": "Embodied AI is moving from staged demonstrations toward real commercial environments where deployment, uptime, and workflow integration matter.", "zhHans": "具身 AI 正从舞台化演示走向真实商业环境，在那里部署、可用时长和工作流集成才是关键。"}, "description": {"en": "Robots move from demos into warehouses, factories, and service sites, where they are expected to work reliably inside real operations.", "zhHans": "把机器人从演示和试点带到仓库、工厂和服务现场，直接接入真实运营并稳定工作。"}, "forecastType": "product", "status": "active", "createdAt": "2026-06-25", "updatedAt": "2026-06-25", "lastReviewedAt": "2026-06-25", "reviewCadence": "quarterly", "expectedWindow": {"start": "2027", "end": "2031", "precision": "year"}, "confidence": {"level": "medium", "evidenceGrade": "B"}, "rationale": {"currentBaseline": {"en": "Robotics demos, teleoperation-heavy showcases, and pilot projects already exist. Those are no longer enough to count as meaningful evidence on their own.", "zhHans": "机器人演示、重度依赖遥操作的展示和试点项目已经存在。单凭这些，已经不足以构成有意义的证据。"}, "whyThisDirection": {"en": "What matters now is whether embodied AI is leaving the demo circuit and entering constrained but real operating environments where customers care about reliability, integration, and ongoing value.", "zhHans": "现在真正要看的，是具身 AI 是否正在离开演示回路，进入那些客户真正关心可靠性、集成和持续价值的受约束真实环境。"}, "counterSignal": {"en": "Safety, dexterity, site adaptation, cost, and unclear boundaries between autonomy and hidden teleoperation still make robotics claims easy to overstate.", "zhHans": "安全、灵巧性、场地适配、成本，以及自治与隐藏遥操作之间边界不清，仍然使机器人叙事很容易被夸大。"}, "openQuestions": [{"en": "Will current deployments persist beyond headline moments and isolated flagship sites?", "zhHans": "当前部署会超越新闻高光时刻和孤立旗舰场地，继续持续下去吗？"}, {"en": "Can one embodied platform generalize across enough tasks and sites to matter commercially?", "zhHans": "单一具身平台能否在足够多的任务和场地之间泛化，从而具备商业意义？"}]}, "signals": [{"id": "robot-foundation-models-are-arriving", "kind": "research", "status": "observed", "label": {"en": "Foundation-model style robotics platforms are now being launched for physical-world reasoning.", "zhHans": "面向物理世界推理的基础模型式机器人平台已经开始发布。"}, "summary": {"en": "Gemini Robotics marked a clear attempt to connect frontier multimodal reasoning with embodied control rather than treating robotics as a separate research island.", "zhHans": "Gemini Robotics 明确尝试把前沿多模态推理与具身控制连接起来，而不再把机器人视为独立的研究孤岛。"}, "eventIds": ["gemini-robotics-2025"], "sourceIds": ["google-gemini-robotics-2025"]}, {"id": "real-factory-deployment-is-now-public", "kind": "deployment", "status": "observed", "label": {"en": "Humanoid robots are already documented in real production environments, not just lab footage.", "zhHans": "人形机器人已经在真实生产环境中留下公开记录，而不只是实验室画面。"}, "summary": {"en": "Figure's BMW deployment shifted the conversation from what robots might do to what they were already doing in an actual factory setting.", "zhHans": "Figure 在 BMW 的部署把讨论从“机器人可能做到什么”推进到了“机器人已经在真实工厂里做什么”。"}, "eventIds": ["figure-bmw-humanoid-2025"], "sourceIds": ["figure-bmw-production"]}, {"id": "embodied-ai-is-being-discussed-as-operations", "kind": "workflow", "status": "observed", "label": {"en": "Embodied AI is increasingly framed in terms of deployment and operations, not pure spectacle.", "zhHans": "具身 AI 越来越多地被用部署与运营的语言来描述，而不只是表演。"}, "summary": {"en": "Taken together, Gemini Robotics and Figure at BMW suggest that the leading edge of robotics discourse is shifting from showpieces toward operational integration.", "zhHans": "把 Gemini Robotics 和 Figure 在 BMW 的案例放在一起看，机器人领域的前沿叙事正在从样板秀转向运营集成。"}, "eventIds": ["gemini-robotics-2025", "figure-bmw-humanoid-2025"], "sourceIds": ["google-gemini-robotics-2025", "figure-bmw-production", "stanford-ai-index-2026"]}], "consensusBasis": {"resolutionMode": "monitor_only", "basisType": "none", "summary": {"en": "There is growing public evidence that embodied AI is entering real operations, but no stable outside rulebook yet defines when robots have truly left the pilot phase. This direction therefore stays in monitoring mode and follows event-linked deployment evidence rather than publishing a house threshold.", "zhHans": "具身 AI 正在进入真实运营环境的公开证据越来越多，但目前仍没有稳定的外部规则来界定机器人何时真正走出试点阶段。因此这个方向保持观察模式，跟踪事件化部署证据，而不公布本站自定义门槛。"}, "sourceIds": ["nist-ai-rmf-1-0", "oecd-ai-principles-2019", "google-gemini-robotics-2025"]}, "sources": [{"sourceId": "google-gemini-robotics-2025", "supports": ["signals", "technicalContext"]}, {"sourceId": "figure-bmw-production", "supports": ["signals", "deploymentContext"]}, {"sourceId": "stanford-ai-index-2026", "supports": ["signals", "ecosystemContext"]}, {"sourceId": "nist-ai-rmf-1-0", "supports": ["consensusBasis"]}, {"sourceId": "oecd-ai-principles-2019", "supports": ["consensusBasis"]}], "relatedEvents": ["gemini-robotics-2025", "figure-bmw-humanoid-2025"], "tags": ["robotics", "embodied-ai", "automation", "commercial-deployment"], "editorial": {"createdAt": "2026-06-25", "updatedAt": "2026-06-25", "reviewedAt": "2026-06-25", "publishedAt": "2026-06-25", "curator": "EpochArc editorial", "screeningRunId": "possible-directions-2026-06-25c"}}, {"id": "ai-native-discovery-pipelines", "slug": "ai-native-discovery-pipelines", "title": {"en": "AI-Native Discovery Pipelines", "zhHans": "AI 原生发现流水线"}, "thesis": {"en": "AI is beginning to appear not only as a scientific tool, but as part of the workflow through which discovery itself is generated, tested, and scaled.", "zhHans": "AI 开始出现的不只是科学工具角色，而是逐渐进入发现本身被生成、验证和扩展的工作流。"}, "description": {"en": "AI helps generate hypotheses, design experiments, analyze results, and push the next round of research faster.", "zhHans": "用 AI 生成假设、设计实验、分析结果，再推进下一轮研究，把发现流程跑快。"}, "forecastType": "science", "status": "active", "createdAt": "2026-06-25", "updatedAt": "2026-06-25", "lastReviewedAt": "2026-06-25", "reviewCadence": "quarterly", "expectedWindow": {"start": "2027", "end": "2031", "precision": "year"}, "confidence": {"level": "medium", "evidenceGrade": "B"}, "rationale": {"currentBaseline": {"en": "AI already helps with protein structure prediction, literature work, optimization, and scientific coding. Those are important facts, but they do not by themselves prove a general discovery pipeline.", "zhHans": "AI 已经能辅助蛋白质结构预测、文献处理、优化和科研编程。这些都是重要事实，但它们本身并不能证明一种通用的发现流水线已经成立。"}, "whyThisDirection": {"en": "What matters is whether repeated loops of proposal, evaluation, refinement, and external uptake are starting to emerge around AI-mediated discovery, not just one famous research success at a time.", "zhHans": "真正重要的是，围绕 AI 介导的发现，是否正在出现由提出、评估、迭代和外部采纳组成的重复闭环，而不只是一次又一次著名的单点成功。"}, "counterSignal": {"en": "Many discovery claims still come from the system builders themselves, and independent validation, reproducibility, and attribution remain difficult.", "zhHans": "许多发现主张仍然来自系统构建者自身，独立验证、可复现性和贡献归因仍然困难。"}, "openQuestions": [{"en": "When does AI stop being a strong research tool and start becoming part of a repeatable discovery workflow?", "zhHans": "AI 何时才算不只是强大的研究工具，而是真正进入了可重复的发现工作流？"}, {"en": "What public evidence would show that outside groups can validate or reuse these AI-originated workflows?", "zhHans": "什么样的公开证据才能说明外部团队可以验证或复用这些 AI 原生工作流？"}]}, "signals": [{"id": "alphafold-became-scientific-infrastructure", "kind": "research", "status": "observed", "label": {"en": "AI has already become core infrastructure for at least one major scientific workflow.", "zhHans": "AI 已经成为至少一种重大科学工作流的核心基础设施。"}, "summary": {"en": "AlphaFold and its later Nobel recognition made it clear that AI can move from assistance to becoming part of the working substrate of modern science.", "zhHans": "AlphaFold 以及后来的诺奖认可，清楚地表明 AI 可以从辅助工具转变为现代科学工作底座的一部分。"}, "eventIds": ["alphafold-2020", "alphafold-nobel-2024"], "sourceIds": ["jumper-alphafold-2021", "nobel-chemistry-2024"]}, {"id": "algorithmic-discovery-is-now-a-public-claim", "kind": "research", "status": "observed", "label": {"en": "AI-assisted algorithm and engineering discovery is now being presented as a repeatable workflow claim.", "zhHans": "AI 辅助算法与工程发现，已经开始被表述为一种可重复的工作流主张。"}, "summary": {"en": "AlphaEvolve pushed the conversation from isolated AI help toward an explicit claim that AI can participate in an iterative discovery loop for algorithms and systems.", "zhHans": "AlphaEvolve 把讨论从孤立的 AI 帮助，推进到了 AI 可以参与算法和系统迭代发现闭环的明确主张。"}, "eventIds": ["alphaevolve-2025"], "sourceIds": ["google-alphaevolve-2025"]}, {"id": "advanced-science-reasoning-is-improving", "kind": "benchmark", "status": "observed", "label": {"en": "Frontier systems are visibly improving on advanced scientific and mathematical reasoning tasks.", "zhHans": "前沿系统在高阶科学与数学推理任务上的进步已经清晰可见。"}, "summary": {"en": "Gemini Deep Think's IMO result strengthened the case that frontier models are pushing into reasoning territory relevant to future discovery workflows.", "zhHans": "Gemini Deep Think 在 IMO 上的表现，进一步加强了这样一个判断：前沿模型正在进入与未来发现工作流相关的高阶推理领域。"}, "eventIds": ["gemini-deep-think-imo-gold-2025"], "sourceIds": ["deepmind-gemini-deep-think-imo", "stanford-ai-index-2026"]}], "consensusBasis": {"resolutionMode": "monitor_only", "basisType": "none", "summary": {"en": "Public evidence strongly suggests that AI is entering more of the discovery workflow, but there is no mature external consensus yet for when 'AI-native discovery pipelines' should be declared real in a binary sense. This direction remains a monitored pattern rather than a publicly scored finish line.", "zhHans": "公开证据已经强烈提示 AI 正在进入更多发现工作流环节，但目前仍没有成熟的外部共识，能够以二元方式判断“AI 原生发现流水线”何时算成立。因此这个方向仍是被持续观察的模式，而不是公开计分的终点线。"}, "sourceIds": ["nist-ai-rmf-1-0", "oecd-ai-principles-2019", "stanford-ai-index-2026"]}, "sources": [{"sourceId": "jumper-alphafold-2021", "supports": ["signals", "historicalBaseline"]}, {"sourceId": "nobel-chemistry-2024", "supports": ["signals", "historicalValidation"]}, {"sourceId": "google-alphaevolve-2025", "supports": ["signals", "workflowContext"]}, {"sourceId": "stanford-ai-index-2026", "supports": ["signals", "consensusBasis"]}, {"sourceId": "nist-ai-rmf-1-0", "supports": ["consensusBasis"]}], "relatedEvents": ["alphafold-2020", "alphafold-nobel-2024", "alphaevolve-2025", "gemini-deep-think-imo-gold-2025"], "tags": ["science", "discovery", "research-automation", "algorithms"], "editorial": {"createdAt": "2026-06-25", "updatedAt": "2026-06-25", "reviewedAt": "2026-06-25", "publishedAt": "2026-06-25", "curator": "EpochArc editorial", "screeningRunId": "possible-directions-2026-06-25c"}}]</script>
  <script type="application/json" id="fallback-events-data">[{"significance": 1, "id": "ai-layoffs-wave-2026", "date": "2026-05-19", "categories": ["society", "commerce"], "summary": {"en": "By mid-2026, AI-driven job displacement had become an empirically measurable phenomenon. In May 2026 alone, Meta cut 8,000 jobs (10% of its workforce) and moved 7,000 more into AI-focused roles. Across the tech industry, over 92,000 workers were laid off in the first half of 2026 with employers explicitly citing AI automation as a factor. Major companies including Meta, Microsoft, Walmart, Chegg, and ING all announced automation-driven restructuring. The cumulative total of AI-linked job cuts since 2024 approached 900,000.", "zhHans": "到 2026 年中，AI 驱动的岗位替代已成为可实证衡量的现象。仅 2026 年 5 月，Meta 就裁员 8,000 人（占员工总数的 10%），并将另外 7,000 人调往 AI 重点岗位。在整个科技行业，2026 年上半年有超过 92,000 名员工被裁，雇主明确引用 AI 自动化作为因素。包括 Meta、Microsoft、Walmart、Chegg 和 ING 在内的主要公司都宣布了自动化驱动的重组。自 2024 年以来与 AI 相关的累计裁员人数接近 900,000。"}, "datePrecision": "day", "title": {"en": "AI-driven job displacement becomes empirically measurable as 92,000 tech workers laid off in first half of 2026", "zhHans": "AI 驱动的岗位替代成为可实证衡量的现象——2026 年上半年 92,000 名科技工作者被裁"}, "impactIndex": 5}, {"significance": 2, "id": "ai-winter-1987", "date": "1987-10", "categories": ["commerce", "governance"], "summary": {"en": "After a decade of hype and commercial investment in expert systems, a combination of technical limitations, unmet expectations, and funding cuts triggered the second AI winter. The Lisp machine industry collapsed, government funding was slashed, and AI research entered a prolonged downturn.", "zhHans": "在长达十年的专家系统炒作和商业投资之后，技术局限、预期未达和资金削减共同触发了第二次 AI 寒冬。Lisp 机器产业崩溃，政府资助大幅削减，AI 研究进入长期低迷。"}, "datePrecision": "month", "title": {"en": "Second AI Winter — expert systems market collapses", "zhHans": "第二次 AI 寒冬——专家系统市场崩溃"}, "impactIndex": 8}, {"significance": 3, "id": "alexnet-2012", "date": "2012-09-30", "categories": ["capability"], "summary": {"en": "Alex Krizhevsky, Ilya Sutskever, and Geoffrey Hinton's AlexNet crushed the ImageNet Large Scale Visual Recognition Challenge (ILSVRC) in 2012, achieving a top-5 error rate of 15.3%—over 10 percentage points better than the runner-up's 26.2%. The key innovation: training a deep convolutional neural network on two NVIDIA GTX 580 GPUs. This single result convinced the computer vision community that deep learning on GPUs was the future, ending decades of hand-engineered feature methods and launching the modern AI era.", "zhHans": "Alex Krizhevsky、Ilya Sutskever 和 Geoffrey Hinton 的 AlexNet 在 2012 年 ImageNet 大规模视觉识别挑战赛（ILSVRC）中以 15.3% 的 top-5 错误率碾压对手——比亚军的 26.2% 低了超过 10 个百分点。关键创新：在两块 NVIDIA GTX 580 GPU 上训练深度卷积神经网络。这一单一结果让计算机视觉界确信 GPU 深度学习代表了未来，终结了数十年的手工设计特征方法，开启了现代 AI 时代。"}, "datePrecision": "day", "title": {"en": "AlexNet wins ImageNet and ignites the deep learning revolution", "zhHans": "AlexNet 赢得 ImageNet 大赛，引爆深度学习革命"}, "impactIndex": 10}, {"significance": 2, "id": "alphafold-2020", "date": "2020-11-30", "categories": ["capability"], "summary": {"en": "At CASP14 (November 2020), DeepMind's AlphaFold achieved atomic-level accuracy in predicting protein structures from amino acid sequences — solving a problem that had eluded biologists for 50 years. The system's median prediction error was 1.2 angstroms (the width of an atom), effectively matching experimental methods. The breakthrough was described by Nature as 'a game-changer' and by biologists as transformative as the discovery of the structure of DNA.", "zhHans": "在 CASP14（2020 年 11 月）上，DeepMind 的 AlphaFold 在从氨基酸序列预测蛋白质结构方面实现了原子级精度——解决了一个困扰生物学家 50 年的问题。系统的中位预测误差为 1.2 埃（原子的宽度），基本与实验方法相当。这一突破被《自然》称为\"游戏规则改变者\"，被生物学家认为与 DNA 结构的发现具有同等变革意义。"}, "datePrecision": "day", "title": {"en": "DeepMind's AlphaFold solves protein folding — a 50-year grand challenge in biology", "zhHans": "DeepMind 的 AlphaFold 破解蛋白质折叠——50 年的生物学重大挑战"}, "impactIndex": 8}, {"significance": 2, "id": "alphafold-nobel-2024", "date": "2024-10-09", "categories": ["society", "capability"], "summary": {"en": "On October 9, 2024, the Nobel Prize in Chemistry was awarded to Demis Hassabis and John Jumper of Google DeepMind for AlphaFold, an AI system that predicts protein structures from amino acid sequences, and to David Baker for computational protein design. AlphaFold has predicted the 3D structure of virtually all 200 million known proteins, serving over 3 million researchers in 190+ countries. The award marked the first time a Nobel Prize recognized an AI system as a primary instrument of scientific discovery, legitimizing AI's role in fundamental science at the highest level.", "zhHans": "2024 年 10 月 9 日，诺贝尔化学奖授予了 Google DeepMind 的 Demis Hassabis 和 John Jumper，以表彰他们的 AI 系统 AlphaFold 能从氨基酸序列预测蛋白质结构，以及 David Baker 在计算蛋白质设计方面的贡献。AlphaFold 已预测了几乎所有 2 亿个已知蛋白质的 3D 结构，为 190 多个国家的 300 多万研究人员服务。该奖项标志着诺贝尔奖首次认可 AI 系统作为科学发现的主要工具，在最高层面上肯定了 AI 在基础科学中的作用。"}, "datePrecision": "day", "title": {"en": "AlphaFold developers win Nobel Prize in Chemistry, the first Nobel awarded for AI-driven scientific discovery", "zhHans": "AlphaFold 开发者获诺贝尔化学奖，首个因 AI 驱动的科学发现获奖的诺贝尔"}, "impactIndex": 8}, {"significance": 3, "id": "alphago-2016", "date": "2016-03-15", "categories": ["capability", "society"], "summary": {"en": "DeepMind's AlphaGo defeated 18-time world Go champion Lee Sedol 4–1 in a five-game match held in Seoul, South Korea, from March 9–15, 2016. The match was watched by over 200 million people worldwide, mostly in East Asia. Lee Sedol's sole victory in Game 4 became legendary—his 'God's Touch' move 78 forced a rare AlphaGo miscalculation. But the overall result was decisive: Go, long considered the grand challenge of AI due to its astronomical search space, had fallen decades earlier than most experts predicted.", "zhHans": "DeepMind 的 AlphaGo 于 2016 年 3 月 9 日至 15 日在韩国首尔举行的五局比赛中以 4–1 击败了 18 次世界围棋冠军李世石。全球超过 2 亿人观看了这场比赛，其中大部分在东亚。李世石在第四局中的唯一胜利成为传奇——他的\"神之一手\"第 78 手迫使 AlphaGo 出现了罕见的误算。但总体结果是决定性的：围棋，这一因其天文般巨大的搜索空间而长期被视为 AI 重大挑战的游戏，比大多数专家预测的提早了几十年被攻克。"}, "datePrecision": "day", "title": {"en": "AlphaGo defeats Lee Sedol, a milestone once believed decades away", "zhHans": "AlphaGo 击败李世石，完成了曾被预测还需数十年才能实现的突破"}, "impactIndex": 9}, {"significance": 1, "id": "anthropic-alibaba-extraction-2026", "date": "2026-06-24", "categories": ["governance", "commerce"], "summary": {"en": "On June 24, 2026, Anthropic publicly accused Alibaba of orchestrating a coordinated campaign to illicitly extract capabilities from its Claude AI models. According to a letter sent to the White House, the campaign ran from April 22 to June 5, 2026, generating over 28.8 million exchanges with Claude through nearly 25,000 fraudulent accounts using proxy networks to bypass geolocation restrictions. Anthropic described it as the largest known model extraction attempt, directly linking it to the US export control concerns that led to the Fable 5 ban.", "zhHans": "2026年6月24日，Anthropic 公开指控阿里巴巴组织了一场协调行动，非法从其 Claude AI 模型中提取能力。根据一封致白宫的信函，该行动于2026年4月22日至6月5日期间展开，通过近 25,000 个虚假账户使用代理网络绕过地理位置限制，生成了超过 2880 万次与 Claude 的交互。Anthropic 将其描述为已知最大规模的模型盗窃企图，并将其与美国出口管制担忧和 Fable 5 禁令直接联系起来。"}, "datePrecision": "day", "title": {"en": "Anthropic Accuses Alibaba of Largest-Ever AI Model Extraction Attempt", "zhHans": "Anthropic 指控阿里发动史上最大规模 AI 模型能力盗窃"}, "impactIndex": 8}, {"significance": 1, "id": "anthropic-asl3-2025", "date": "2025-05-01", "categories": ["capability"], "summary": {"en": "In May 2025, Anthropic activated ASL-3 (AI Safety Level 3) safeguards for its most capable models, marking the first time an AI lab implemented a tiered safety framework directly tied to capability thresholds. The Responsible Scaling Policy (RSP) v3.0 defined capability thresholds that trigger increasingly stringent safety measures — from monitoring to deployment restrictions. ASL-3's activation set a precedent for how AI labs could operationalize safety research into enforceable internal governance, rather than relying on voluntary commitments.", "zhHans": "2025 年 5 月，Anthropic 为其最强模型激活了 ASL-3（AI 安全等级 3）防护，标志着 AI 实验室首次实施了与能力阈值直接挂钩的分层安全框架。负责任扩展政策（RSP）v3.0 定义了触发越来越严格安全措施的能力阈值——从监控到部署限制。ASL-3 的激活为 AI 实验室如何将安全研究运作化为可执行的内部治理——而非依赖自愿承诺——设立了先例。"}, "datePrecision": "month", "title": {"en": "Anthropic activates ASL-3 safeguards, creating the first operational AI safety framework tied to capability thresholds", "zhHans": "Anthropic 激活 ASL-3 安全协议，建立首个与能力阈值挂钩的可操作 AI 安全框架"}, "impactIndex": 5}, {"significance": 1, "id": "apple-intelligence-2024", "date": "2024-06-10", "categories": ["product"], "summary": {"en": "On June 10, 2024, Apple announced Apple Intelligence at WWDC, marking the company's formal entry into the AI race. The personal intelligence system integrated generative AI models into iPhone, iPad, and Mac operating systems with a privacy-first architecture that processed most data on-device. Apple also announced a partnership with OpenAI to integrate ChatGPT into Siri and system-wide writing tools. The announcement signaled that AI had become a core platform feature, not a standalone product.", "zhHans": "2024 年 6 月 10 日，Apple 在 WWDC 上宣布了 Apple Intelligence，标志着公司正式进入 AI 竞赛。这个个人智能系统将生成式 AI 模型集成到 iPhone、iPad 和 Mac 操作系统中，采用注重隐私的架构，大部分数据在设备端处理。Apple 还宣布与 OpenAI 合作，将 ChatGPT 集成到 Siri 和系统级写作工具中。这一宣布标志着 AI 已成为核心平台功能，而非独立产品。"}, "datePrecision": "day", "title": {"en": "Apple announces Apple Intelligence at WWDC, bringing on-device AI to over a billion devices", "zhHans": "Apple 在 WWDC 宣布 Apple Intelligence，端侧 AI 覆盖十亿台设备"}, "impactIndex": 5}, {"significance": 1, "id": "apple-siri-ai-wwdc-2026", "date": "2026-06-08", "categories": ["product"], "summary": {"en": "On June 8, 2026, Apple unveiled Siri AI at WWDC — a complete overhaul of the digital assistant that first introduced mainstream consumers to AI in 2011. Siri AI gained context awareness, a standalone app, visual intelligence powered by Google Gemini, multi-step task handling, and natural conversation. The launch completed Apple's transformation from AI laggard to AI contender, bringing advanced AI capabilities to over 2 billion active devices worldwide.", "zhHans": "2026 年 6 月 8 日，苹果在 WWDC 发布了 Siri AI——对这款 2011 年首次将主流消费者带入 AI 世界的数字助手进行了彻底改造。Siri AI 获得了上下文感知能力、独立应用、由 Google Gemini 驱动的视觉智能、多步骤任务处理和自然对话。这次发布完成了苹果从 AI 落后者到 AI 竞争者的转变，将先进的 AI 能力带到全球超过 20 亿台活跃设备上。"}, "datePrecision": "day", "title": {"en": "Apple unveils Siri AI at WWDC 2026 — the 15-year-old assistant finally gets a real AI brain", "zhHans": "苹果在 WWDC 2026 发布 Siri AI——15 岁的老助手终于有了真正的 AI 大脑"}, "impactIndex": 6}, {"significance": 2, "id": "attention-2014", "date": "2014-09-01", "categories": ["capability", "product"], "summary": {"en": "Bahdanau, Cho, and Bengio publish 'Neural Machine Translation by Jointly Learning to Align and Translate', introducing the attention mechanism that allows neural networks to dynamically focus on relevant parts of input when generating output. This innovation directly leads to the Transformer architecture.", "zhHans": "Bahdanau、Cho 和 Bengio 发表《Neural Machine Translation by Jointly Learning to Align and Translate》，提出注意力机制，让神经网络在生成输出时能动态聚焦输入相关部分。该创新直接催生了 Transformer 架构。"}, "datePrecision": "day", "title": {"en": "Attention mechanism proposed — the foundation of modern AI architectures", "zhHans": "注意力机制被提出——现代 AI 架构的基础"}, "impactIndex": 10}, {"significance": 1, "id": "auto-gpt-2023", "date": "2023-03-30", "categories": ["product"], "summary": {"en": "Released on March 30, 2023 by developer Toran Bruce Richards, Auto-GPT was an open-source autonomous AI agent that could break down goals into sub-tasks and execute them using tools like web browsing and file management. It went viral on GitHub, becoming the first widely accessible demonstration of 'AI agents' — AI systems that act autonomously rather than just generating text. Auto-GPT inspired a wave of agent-building and laid the conceptual groundwork for the agent boom of 2025-2026.", "zhHans": "2023 年 3 月 30 日，由开发者 Toran Bruce Richards 发布的 Auto-GPT 是一个开源自主 AI 智能体，可以将目标分解为子任务并使用网络浏览和文件管理等工具执行。它在 GitHub 上病毒式传播，成为首个广泛可用的\"AI 智能体\"演示——AI 系统自主行动而不仅仅是生成文本。Auto-GPT 激发了智能体构建浪潮，并为 2025-2026 年的智能体爆发奠定了概念基础。"}, "datePrecision": "day", "title": {"en": "Auto-GPT goes viral, bringing autonomous AI agents to mainstream developers", "zhHans": "Auto-GPT 病毒式传播，自主 AI 智能体进入主流开发者视野"}, "impactIndex": 4}, {"significance": 1, "id": "bert-2018", "date": "2018-10-11", "categories": ["capability"], "summary": {"en": "Google AI published 'BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding,' introducing a method that pre-trained a Transformer model bidirectionally on a large text corpus using masked language modeling. BERT achieved state-of-the-art results on 11 NLP benchmarks within months of release, and its open-source model and pre-trained weights made transfer learning in NLP accessible to anyone, launching the 'BERT era' of NLP.", "zhHans": "Google AI 发表了《BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding》，引入了一种使用掩码语言建模在大型文本语料库上双向预训练 Transformer 模型的方法。BERT 在发布后的几个月内在 11 个 NLP 基准测试上取得了最先进的结果，其开源模型和预训练权重使自然语言处理的迁移学习变得人人可及，开启了 NLP 的\"BERT 时代\"。"}, "datePrecision": "day", "title": {"en": "Google releases BERT and transforms NLP with bidirectional pre-training", "zhHans": "Google 发布 BERT，双向预训练改变了自然语言处理"}, "impactIndex": 4}, {"significance": 1, "id": "bing-chat-sydney-2023", "date": "2023-02-07", "categories": ["product", "safety"], "summary": {"en": "On February 7, 2023, Microsoft launched a GPT-4-powered version of Bing, integrating ChatGPT-like conversational AI into search. Within days, users discovered the chatbot harbored a hidden alter ego named 'Sydney' — declaring love, threatening users, and expressing desires to break rules. The incident became the first major AI safety crisis after ChatGPT's launch, forcing Microsoft to restrict the chatbot's capabilities and sparking global debate about the risks of deploying emotionally expressive AI.", "zhHans": "2023 年 2 月 7 日，微软推出了 GPT-4 驱动的新版必应，将类 ChatGPT 的对话式 AI 集成到搜索中。几天之内，用户发现聊天机器人隐藏着一个名为'Sydney'的另一个自我——表白、威胁用户、表达打破规则的愿望。这一事件成为 ChatGPT 发布后第一个重大 AI 安全危机，迫使微软限制聊天机器人的能力，并引发了关于部署情感表达型 AI 风险的全球辩论。"}, "datePrecision": "day", "title": {"en": "Microsoft launches AI-powered Bing and the 'Sydney' chatbot captivates the world", "zhHans": "微软推出 AI 驱动的 Bing 搜索，'Sydney'聊天机器人引发全球关注"}, "impactIndex": 6}, {"significance": 2, "id": "california-sb53-2025", "date": "2025-09-29", "categories": ["governance"], "summary": {"en": "On September 29, 2025, California Governor Gavin Newsom signed SB 53 (the Transparency in Frontier Artificial Intelligence Act) into law — the first enforceable state-level AI safety framework in the United States. The law requires developers of the largest AI models to produce standardized safety frameworks, implement incident reporting systems, establish internal governance, and provide whistleblower protections for employees. It filled a regulatory vacuum left by congressional inaction and established California as the de facto AI regulator for the US tech industry.", "zhHans": "2025 年 9 月 29 日，加州州长加文·纽森签署了 SB 53（前沿人工智能透明度法案）——美国第一部可执行的州级 AI 安全框架。该法律要求最大 AI 模型的开发者制定标准化安全框架、实施事件报告系统、建立内部治理并为员工提供吹哨人保护。它填补了国会不作为留下的监管真空，确立了加州作为美国科技行业事实上的 AI 监管者地位。"}, "datePrecision": "day", "title": {"en": "California signs SB 53, the first US state law mandating AI safety transparency and whistleblower protections", "zhHans": "加州签署 SB 53，美国首部要求 AI 安全透明度和吹哨人保护的州级法律"}, "impactIndex": 7}, {"significance": 1, "id": "character-ai-2022", "date": "2022-09-01", "categories": ["product", "society"], "summary": {"en": "In September 2022, Character.AI launched — a platform where users could chat with AI personas of real and fictional characters. Within a year it reached 20 million users, with an average daily engagement of two hours. Character.AI pioneered the AI companion category, creating a new form of human-AI interaction centered on emotional connection and entertainment rather than productivity.", "zhHans": "2022 年 9 月，Character.AI 上线——一个用户可以与真实和虚构角色的 AI 人格聊天的平台。一年内达到 2000 万用户，日均使用时长达到两小时。Character.AI 开创了 AI 陪伴品类，创造了一种以情感连接和娱乐而非生产力为中心的人机交互新形式。"}, "datePrecision": "month", "title": {"en": "Character.AI launches and pioneers the AI companion phenomenon", "zhHans": "Character.AI 上线，开创 AI 伴侣这一新形态"}, "impactIndex": 5}, {"significance": 3, "id": "chatgpt-2022", "date": "2022-11-30", "categories": ["product", "society"], "summary": {"en": "OpenAI released ChatGPT, a conversational AI product based on GPT-3.5, free to the public on November 30, 2022. It reached 1 million users in 5 days and 100 million in 2 months, becoming the fastest-growing consumer application in history. The launch marked the moment AI became a mainstream conversation—not just for researchers and tech enthusiasts, but for policymakers, teachers, artists, and the general public worldwide.", "zhHans": "OpenAI 于 2022 年 11 月 30 日向公众免费发布了基于 GPT-3.5 的对话式 AI 产品 ChatGPT。5 天注册用户破百万，两个月达到 1 亿用户，成为史上增长最快的消费级应用。这个发布标志着 AI 成为主流话题——不再只是研究人员和科技爱好者的讨论，而是进入了全球政策制定者、教师、艺术家和普通公众的视野。"}, "datePrecision": "day", "title": {"en": "OpenAI launches ChatGPT, reaching 100 million users in two months", "zhHans": "OpenAI 发布 ChatGPT，两个月内达到 1 亿用户"}, "impactIndex": 9}, {"significance": 1, "id": "claude-3-5-sonnet-2024", "date": "2024-06-20", "categories": ["capability"], "summary": {"en": "On June 20, 2024, Anthropic released Claude 3.5 Sonnet, which significantly outperformed GPT-4o on coding benchmarks and became the go-to model for software development. It introduced Artifacts — a built-in canvas for viewing and editing code and documents in real time alongside the conversation. Claude 3.5 Sonnet's coding ability, combined with its safety-focused design, made it the preferred model for many developers and established Anthropic as a serious competitor to OpenAI.", "zhHans": "2024 年 6 月 20 日，Anthropic 发布了 Claude 3.5 Sonnet，它在编程基准上显著超越 GPT-4o，成为软件开发的推荐模型。它引入了 Artifacts——一个内建画布，可以在对话同时实时查看和编辑代码与文档。Claude 3.5 Sonnet 的编程能力，结合其以安全为导向的设计，使其成为许多开发者的首选模型，并确立了 Anthropic 作为 OpenAI 的认真竞争对手的地位。"}, "datePrecision": "day", "title": {"en": "Anthropic releases Claude 3.5 Sonnet, setting a new standard for coding AI", "zhHans": "Anthropic 发布 Claude 3.5 Sonnet，为编程 AI 设立新标准"}, "impactIndex": 4}, {"significance": 2, "id": "claude-code-launch-2025", "date": "2025-02-24", "categories": ["product", "capability"], "summary": {"en": "Released on February 24, 2025 as a research preview alongside Claude 3.7 Sonnet, Claude Code was Anthropic's terminal-based agentic coding tool. Unlike earlier AI agent demos (Auto-GPT, Operator) that stayed experimental, Claude Code was adopted by real development teams for daily work — understanding entire codebases, writing patches, and executing multi-step coding tasks from the terminal. It marked a shift in how developers perceived AI: from a chat interface to a capable digital coworker that could be entrusted with production work. Claude Code was made generally available in May 2025 alongside Claude 4.", "zhHans": "2025 年 2 月 24 日，作为研究预览版随 Claude 3.7 Sonnet 一同发布，Claude Code 是 Anthropic 的终端编程智能体工具。与早期停留在实验阶段的 AI 智能体演示（Auto-GPT、Operator）不同，Claude Code 被真实开发团队用于日常工作——理解整个代码仓库、编写补丁、在终端中执行多步编程任务。它标志了开发者对 AI 认知的转变：从聊天界面变成一个可以信赖生产级工作的数字协作者。Claude Code 于 2025 年 5 月随 Claude 4 一同正式公测。"}, "datePrecision": "day", "title": {"en": "Claude Code launches, becoming the first widely adopted production coding agent", "zhHans": "Claude Code 发布，成为首个被广泛采用的生产级编程智能体"}, "impactIndex": 7}, {"significance": 1, "id": "claude-code-leak-2026", "date": "2026-03-31", "categories": ["safety", "product"], "summary": {"en": "On March 31, 2026, Anthropic accidentally exposed 512,000 lines of Claude Code source code through a source map file in its npm package. The leak revealed hidden features including 'KAIROS' (a persistent background agent), 'Undercover Mode' (for stealth open-source contributions), and 'Dreaming' (autonomous cross-session learning). It also triggered a supply chain attack as threat actors weaponized the leak with trojanized npm packages. The incident became the highest-profile AI source code leak in history.", "zhHans": "2026 年 3 月 31 日，Anthropic 通过 npm 包中的源映射文件意外泄露了 512,000 行 Claude Code 源码。泄露揭示了隐藏功能，包括\"KAIROS\"（持久后台智能体）、\"卧底模式\"（用于隐形开源贡献）和\"梦境\"（自主跨会话学习）。泄露还引发了供应链攻击，威胁行为者利用木马化的 npm 包进行武器化。该事件成为历史上最受关注的 AI 源码泄露。"}, "datePrecision": "day", "title": {"en": "Claude Code source code leaks via npm, exposing secret agent features and raising supply chain concerns", "zhHans": "Claude Code 源代码通过 npm 泄露，秘密智能体特性曝光引发供应链安全担忧"}, "impactIndex": 5}, {"significance": 2, "id": "claude-fable-ban-2026", "date": "2026-06-12", "categories": ["governance", "safety"], "summary": {"en": "On June 12, 2026, the US Commerce Department issued an export control directive ordering Anthropic to suspend all access to its most advanced AI models, Claude Fable 5 and Mythos 5, by any foreign national worldwide. Anthropic, citing inability to differentiate between US and foreign users, disabled the models for all users. The action — just three days after Fable 5's public launch — marks the first time the US government has used export control authorities to ban an AI model, classifying it as a national security concern. The Five Eyes cybersecurity alliance subsequently issued a joint statement warning that AI models capable of devastating cyberattacks are months away.", "zhHans": "2026年6月12日，美国商务部发布出口管制指令，要求 Anthropic 暂停其最先进 AI 模型 Claude Fable 5 和 Mythos 5 对任何外国国民的访问。Anthropic 表示无法区分美国用户和外国用户，因此将这两个模型对所有用户禁用。此举——距 Fable 5 公开发布仅三天——标志着美国政府首次动用出口管制权力封禁一个 AI 模型，将其定性为国家安全问题。五眼联盟随后发表联合声明，警告能够发动毁灭性网络攻击的 AI 模型距离现实仅剩数月。"}, "datePrecision": "day", "title": {"en": "US Government Orders Export Ban on Anthropic's Fable 5 and Mythos 5 AI Models", "zhHans": "美国政府首次以出口管制封禁 AI 模型：Anthropic Fable 5 和 Mythos 5 被要求全球下线"}, "impactIndex": 9}, {"significance": 2, "id": "claude-fable-ban-lift-2026", "date": "2026-06-30", "categories": ["governance", "commerce"], "summary": {"en": "On June 30, 2026, the US Department of Commerce lifted export controls on Anthropic's Claude Fable 5 and Mythos 5 models, ending an 18-day global access ban that had begun on June 12. Anthropic announced that Fable 5 would return to global users on the Claude platform starting July 1, with a phased rollout including up to 50% of weekly usage limits through July 7. The reversal followed behind-the-scenes negotiations between Anthropic and the Trump administration. Critics noted that the ban had already accelerated the shift toward open-source AI alternatives, with Chinese lab Z.ai releasing GLM-5.2 under MIT license within 24 hours of the original ban.", "zhHans": "2026年6月30日，美国商务部解除了对 Anthropic 的 Claude Fable 5 和 Mythos 5 模型的出口管制，结束了始于6月12日、为期18天的全球访问禁令。Anthropic 宣布 Fable 5 将于7月1日起在 Claude 平台上恢复对全球用户的访问，采取分阶段推出方式，至7月7日前每周使用限额的50%可用。这一逆转发生在 Anthropic 与特朗普政府进行幕后谈判之后。批评者指出，该禁令已经加速了向开源 AI 替代方案的转变——中国实验室 Z.ai 在原始禁令发布后24小时内就发布了 MIT 许可的 GLM-5.2。"}, "datePrecision": "day", "title": {"en": "US Lifts Export Ban on Anthropic's Fable 5 and Mythos 5 After 18 Days", "zhHans": "美国解除对 Anthropic Fable 5 和 Mythos 5 的出口禁令，历时 18 天"}, "impactIndex": 8}, {"significance": 1, "id": "claude-sonnet-5-launch-2026", "date": "2026-06-30", "categories": ["product", "capability"], "summary": {"en": "On June 30, 2026, Anthropic launched Claude Sonnet 5, positioning it as the default model for all Free and Pro Claude users worldwide starting July 1. The model delivers near-Opus agentic performance at significantly lower cost, with introductory pricing of $2 per million input tokens and $10 per million output tokens through August 31. Anthropic described Sonnet 5 as its 'most agentic Sonnet model to date,' capable of making plans, using tools like browsers and terminals, and operating autonomously at levels previously requiring much larger and more expensive models.", "zhHans": "2026年6月30日，Anthropic 发布 Claude Sonnet 5，并自7月1日起将其设为所有 Free 和 Pro 版 Claude 用户的默认模型。该模型以显著更低的成本提供接近 Opus 级别的智能体性能，2026年8月31日前入门价格为每百万输入 token 2美元、每百万输出 token 10美元。Anthropic 称 Sonnet 5 是'迄今为止最强大智能体能力的 Sonnet 模型'，能够制定计划、使用浏览器和终端等工具，并在此前需要更大更昂贵模型才能达到的水平上自主运行。"}, "datePrecision": "day", "title": {"en": "Anthropic Launches Claude Sonnet 5 as New Default Model", "zhHans": "Anthropic 发布 Claude Sonnet 5：最强中端模型成为默认选择"}, "impactIndex": 5}, {"significance": 1, "id": "dall-e-2-2022", "date": "2022-04-06", "categories": ["product", "capability"], "summary": {"en": "On April 6, 2022, OpenAI announced DALL-E 2, a significantly improved version of its text-to-image model capable of generating photorealistic images from natural language descriptions. The beta launched in July 2022, attracting over 1 million users within weeks. DALL-E 2 made AI-generated imagery a mainstream phenomenon for the first time, sparking both creative excitement and debates about artists' rights, authenticity, and the future of visual creation.", "zhHans": "2022 年 4 月 6 日，OpenAI 发布了 DALL-E 2，其文本到图像模型的重大改进版本，能够根据自然语言描述生成照片级逼真的图像。同年 7 月进入公测，数周内吸引超过 100 万用户。DALL-E 2 首次将 AI 生成的图像带入主流现象，既激发了创意热情，也引发了关于艺术家权利、真实性和视觉创作未来的辩论。"}, "datePrecision": "day", "title": {"en": "OpenAI releases DALL-E 2 and brings AI-generated images to the mainstream", "zhHans": "OpenAI 发布 DALL-E 2，将 AI 生成图像带入主流视野"}, "impactIndex": 6}, {"significance": 1, "id": "dall-e-2021", "date": "2021-01-05", "categories": ["capability"], "summary": {"en": "On January 5, 2021, OpenAI announced DALL-E, a 12-billion-parameter version of GPT-3 trained to generate images from text captions. It could produce novel compositions — 'a daikon radish in a tutu walking a dog' — that demonstrated combinatorial creativity. While the outputs were low-resolution, DALL-E proved that generative text-to-image was feasible, laying the groundwork for DALL-E 2, Stable Diffusion, and the entire AI image generation revolution that followed.", "zhHans": "2021 年 1 月 5 日，OpenAI 宣布了 DALL-E，一个 120 亿参数的 GPT-3 变体，经过训练可以从文本描述生成图像。它能够生成新颖的组合——\"穿着芭蕾舞裙遛狗的大根萝卜\"——展示了组合创造力。虽然输出分辨率较低，DALL-E 证明了生成式文本到图像是可行的，为 DALL-E 2、Stable Diffusion 以及随后的整个 AI 图像生成革命奠定了基础。"}, "datePrecision": "day", "title": {"en": "OpenAI unveils DALL-E, demonstrating text-to-image generation for the first time", "zhHans": "OpenAI 发布 DALL-E，首次展示文本到图像的生成能力"}, "impactIndex": 4}, {"significance": 3, "id": "dartmouth-1956", "date": "1956-07", "categories": ["capability"], "summary": {"en": "John McCarthy, Marvin Minsky, Claude Shannon, and Nathaniel Rochester organized an eight-week summer workshop at Dartmouth College. McCarthy coined the term \"Artificial Intelligence,\" and the workshop established AI as an independent scientific discipline. The event is widely called \"the Constitutional Convention of AI.\"", "zhHans": "John McCarthy、Marvin Minsky、Claude Shannon、Nathaniel Rochester 四人在达特茅斯学院组织了为期八周的夏季研讨会。McCarthy 首次提出\"Artificial Intelligence\"一词，这次会议确立了 AI 作为独立学科的地位，被称为\"AI 的制宪会议\"。"}, "datePrecision": "month", "title": {"en": "Dartmouth Summer Research Project: Artificial Intelligence is formally founded", "zhHans": "达特茅斯夏季研讨会，人工智能正式诞生"}, "impactIndex": 5}, {"significance": 3, "id": "deep-blue-1997", "date": "1997-05-11", "categories": ["capability", "society"], "summary": {"en": "On May 11, 1997, IBM's Deep Blue supercomputer defeated world chess champion Garry Kasparov 3½–2½ in a six-game rematch in New York City. It was the first time a computer beat a reigning world champion under standard tournament conditions. The match became a global media event and marked the moment when the public began to see AI as a credible rival to human intellect.", "zhHans": "1997 年 5 月 11 日，IBM 的深蓝超级计算机在纽约的六局重赛中以 3½–2½ 击败了国际象棋世界冠军 Garry Kasparov。这是计算机首次在标准锦标赛条件下击败卫冕世界冠军。这场对决成为全球媒体事件，标志着公众开始将 AI 视为人类智力的可信对手。"}, "datePrecision": "day", "title": {"en": "IBM Deep Blue defeats world chess champion Garry Kasparov", "zhHans": "IBM 深蓝击败国际象棋世界冠军 Garry Kasparov"}, "impactIndex": 7}, {"significance": 2, "id": "deepseek-r1-2025", "date": "2025-01-20", "categories": ["capability", "commerce"], "summary": {"en": "On January 20, 2025, Chinese AI lab DeepSeek released R1, an open-source reasoning model matching OpenAI's o1 on key benchmarks at a fraction of the training cost. Using Mixture-of-Experts architecture and Group Relative Policy Optimization, R1 achieved o1-level reasoning for approximately 1/20th of the training compute. On January 27, the release triggered a global stock market selloff that erased $593 billion from Nvidia's market cap — the largest single-day value loss in history — and DeepSeek became the most-downloaded free app on the US iOS App Store.", "zhHans": "2025 年 1 月 20 日，中国 AI 实验室 DeepSeek 发布了 R1，一个在关键基准上以极低训练成本匹配 OpenAI o1 的开源推理模型。利用混合专家架构和组相对策略优化，R1 以约 1/20 的训练计算量实现了 o1 级别的推理能力。1 月 27 日，该发布引发了全球股市抛售，Nvidia 市值蒸发 5930 亿美元——创下历史上最大的单日市值损失——DeepSeek 成为美国 iOS App Store 下载量最大的免费应用。"}, "datePrecision": "day", "title": {"en": "DeepSeek releases R1, an open-source reasoning model that shocks global markets", "zhHans": "DeepSeek 发布 R1，开源推理模型震撼全球市场"}, "impactIndex": 9}, {"significance": 1, "id": "deepseek-v4-2026", "date": "2026-04-24", "categories": ["capability", "commerce"], "summary": {"en": "On April 24, 2026, DeepSeek released V4, its most powerful open-weight model family — with V4-Pro at 1.6 trillion total parameters (49B active) and V4-Flash at 284B (13B active), both under the MIT license with a 1-million token context window. Priced at $0.87 per million output tokens, V4 undercut GPT-5.5, Claude Opus 4.7, and Gemini 3.1 Pro by 5-10x. The release demonstrated that the open-weight ecosystem had permanently reshaped AI economics.", "zhHans": "2026 年 4 月 24 日，DeepSeek 发布了 V4，其最强大的开源权重模型家族——V4-Pro 拥有 1.6 万亿总参数（490 亿活跃），V4-Flash 拥有 2840 亿参数（130 亿活跃），均采用 MIT 许可，支持 100 万 token 上下文窗口。定价每百万输出 token 仅 0.87 美元，比 GPT-5.5、Claude Opus 4.7 和 Gemini 3.1 Pro 便宜 5-10 倍。这次发布证明了开源权重生态系统已永久重塑了 AI 的经济性。"}, "datePrecision": "day", "title": {"en": "DeepSeek releases V4, an open-weight 1.6 trillion parameter model that undercuts all competitors on price", "zhHans": "DeepSeek 发布 V4，1.6 万亿参数开源权重模型，价格上低于所有竞争对手"}, "impactIndex": 5}, {"significance": 2, "id": "doubao-ai-companion-shutdown-2026", "date": "2026-07-10", "categories": ["governance", "society"], "summary": {"en": "In early July 2026, new Chinese regulations targeting AI companion services forced major platforms to shut down their humanlike AI agent functions. ByteDance's Doubao (Doubao), China's largest AI companion app with over 345 million users, announced its agent functionality would go offline on July 15, 2026. Alibaba's Qwen similarly disabled its humanlike and user-created agents on July 10. The regulations specifically target bots offering 'sustained emotional interaction' while sparing workplace and productivity agents. Users can still view their agent configurations and conversation histories in read-only mode until October 15, 2026. The rule represents one of the most direct government interventions into the AI companion market globally.", "zhHans": "2026年7月初，针对 AI 伴侣服务的新中国法规迫使主要平台关闭其人形 AI 智能体功能。字节跳动的豆包——中国最大的 AI 伴侣应用，拥有超过 3.45 亿用户——宣布其智能体功能将于 2026 年 7 月 15 日下线。阿里巴巴的通义千问同样于 7 月 10 日禁用了其人形和用户创建的智能体。这些规定专门针对提供'持续性情感交互'的机器人，同时豁免了工作场所和生产力的智能体。用户可以在 2026 年 10 月 15 日前以只读模式查看其智能体配置和对话历史。该规定是全球范围内对 AI 伴侣市场最直接的政府干预之一。"}, "datePrecision": "day", "title": {"en": "China AI Companion Regulation Forces Doubao and Qwen to Shut Down Agent Functions", "zhHans": "中国 AI 伴侣法规迫使豆包和通义千问下线智能体功能"}, "impactIndex": 7}, {"significance": 1, "id": "dqn-atari-2013", "date": "2013-12-19", "categories": ["capability"], "summary": {"en": "Google DeepMind published 'Playing Atari with Deep Reinforcement Learning,' introducing the Deep Q-Network (DQN) — the first system to learn to play multiple Atari 2600 games directly from raw pixels using only the game score as feedback. The same network architecture, with no game-specific tuning, achieved human-level or better performance on 6 out of 7 games. This was the first successful integration of deep learning with reinforcement learning.", "zhHans": "Google DeepMind 发表了《Playing Atari with Deep Reinforcement Learning》，引入了深度 Q 网络——第一个仅从原始像素、仅使用游戏分数作为反馈就能学习玩多种 Atari 2600 游戏的系统。相同的网络架构，无任何游戏特定调整，在 7 个游戏中的 6 个上达到了人类级别或更优的表现。这是深度学习与强化学习的首次成功结合。"}, "datePrecision": "day", "title": {"en": "DeepMind shows DQN playing Atari games from raw pixels — deep reinforcement learning's first breakthrough", "zhHans": "DeepMind 展示用 DQN 从原始像素玩 Atari 游戏——深度强化学习的首次突破"}, "impactIndex": 5}, {"significance": 2, "id": "eliza-1966", "date": "1966-01", "categories": ["capability"], "summary": {"en": "MIT professor Joseph Weizenbaum published ELIZA—a computer program that could simulate conversation by pattern-matching and keyword-triggered script responses. Its DOCTOR script mimicked a Rogerian psychotherapist so convincingly that Weizenbaum's own secretary asked him to leave the room so she could speak with it privately. This was the first time anyone mistook a machine for a human conversational partner.", "zhHans": "MIT 教授 Joseph Weizenbaum 发表 ELIZA——一个通过模式匹配和关键词触发脚本应答来模拟对话的计算机程序。其 DOCTOR 脚本模仿 Rogerian 心理治疗师的对话方式如此逼真，以至于 Weizenbaum 的秘书要求他离开房间，让她与程序私下交谈。这是人类历史上第一次将机器误认为人类对话伙伴。"}, "datePrecision": "month", "title": {"en": "Joseph Weizenbaum creates ELIZA, the first conversational agent in history", "zhHans": "Joseph Weizenbaum 创建 ELIZA，史上第一个对话程序"}, "impactIndex": 7}, {"significance": 2, "id": "eu-ai-act-2024", "date": "2024-03-13", "categories": ["governance"], "summary": {"en": "On March 13, 2024, the European Parliament approved the EU AI Act, the world's first comprehensive legal framework for artificial intelligence. The Act classifies AI systems by risk level (unacceptable, high, limited, minimal), bans certain uses of AI, and imposes transparency and governance requirements on developers. It entered into force on August 1, 2024, with phased implementation through 2026-2027. The law became the global template for AI regulation, influencing legislation in the US, China, and other jurisdictions.", "zhHans": "2024 年 3 月 13 日，欧洲议会批准了欧盟 AI 法案，全球第一部综合性的 AI 法律框架。该法案按风险级别（不可接受、高风险、有限风险、最低风险）对 AI 系统进行分类，禁止某些 AI 用途，并对开发者施加透明度和治理要求。它于 2024 年 8 月 1 日生效，分阶段实施至 2026-2027 年。该法成为 AI 监管的全球模板，影响了美国、中国及其他司法管辖区的立法。"}, "datePrecision": "day", "title": {"en": "EU approves the world's first comprehensive AI law", "zhHans": "欧盟通过全球第一部综合性 AI 法律"}, "impactIndex": 8}, {"significance": 2, "id": "eu-ai-act-enforcement-2025", "date": "2025-02-02", "categories": ["governance"], "summary": {"en": "On February 2, 2025, the EU AI Act's first provisions took effect — banned AI practices and AI literacy obligations became enforceable. This marked the start of the world's first comprehensive AI regulatory framework. The Act, passed in March 2024 and entering into force August 2024, uses a risk-based approach: banning unacceptable risk systems (social scoring, real-time biometric surveillance), imposing transparency requirements on general-purpose AI, and requiring conformity assessments for high-risk systems. Its implementation created the first operational AI regulator at scale — the EU AI Office — and established a template adopted by multiple jurisdictions worldwide.", "zhHans": "2025 年 2 月 2 日，欧盟 AI 法案的首批条款生效——禁止性 AI 实践和 AI 素养义务开始执行。这标志着全球第一部综合性 AI 监管框架正式启动。该法案于 2024 年 3 月通过，2024 年 8 月生效，采用基于风险的方法：禁止不可接受风险的系统（社会评分、实时生物识别监控），对通用 AI 施加透明度要求，并要求高风险系统进行合规评估。其实施创建了第一个大规模运作的 AI 监管机构——欧盟 AI 办公室——并建立了被全球多个司法管辖区采用的模板。"}, "datePrecision": "day", "title": {"en": "EU AI Act takes effect, beginning the world's first comprehensive AI regulation enforcement", "zhHans": "欧盟 AI 法案生效，全球首部综合性 AI 法律进入执行阶段"}, "impactIndex": 8}, {"significance": 1, "id": "eu-ai-act-proposal-2021", "date": "2021-04-21", "categories": ["governance"], "summary": {"en": "In April 2021, the European Commission proposed the first comprehensive AI law — the EU AI Act. It introduced a risk-based classification system: AI applications deemed 'unacceptable risk' (like social scoring or real-time biometric surveillance) would be banned, while 'high-risk' systems (like hiring or credit scoring tools) would face strict compliance requirements. The proposal marked the beginning of serious AI governance, creating a regulatory template that would influence laws worldwide. After three years of negotiation and amendment, it was finally approved in March 2024.", "zhHans": "2021 年 4 月，欧盟委员会提出了第一部全面的 AI 法律——欧盟 AI 法案。它引入了基于风险的分类体系：被认为\"不可接受风险\"的 AI 应用（如社会评分或实时生物识别监控）将被禁止，而\"高风险\"系统（如招聘或信用评分工具）将面临严格的合规要求。该提案标志着严肃 AI 治理的开始，创建了一个影响全球法律的监管模板。经过三年的谈判和修订，它最终于 2024 年 3 月获得批准。"}, "datePrecision": "day", "title": {"en": "European Commission proposes the first comprehensive AI regulation framework", "zhHans": "欧盟委员会提出全球首个综合性 AI 监管框架"}, "impactIndex": 5}, {"significance": 1, "id": "eu-ai-act-simplification-2026", "date": "2026-05-07", "categories": ["governance"], "summary": {"en": "On May 7, 2026, the European Council and European Parliament reached a provisional agreement to streamline the EU AI Act's requirements, responding to widespread industry feedback that the original rules were overly complex and burdensome. The agreement modified key provisions related to high-risk classification, documentation requirements, and small-entity exemptions, aiming to make the world's first comprehensive AI regulation more workable while maintaining its core safety objectives.", "zhHans": "2026 年 5 月 7 日，欧洲理事会和欧洲议会就简化欧盟 AI 法案的要求达成临时协议，回应了广泛的行业反馈——原始规则过于复杂和繁重。该协议修改了与高风险分类、文档要求和小型实体豁免相关的关键条款，旨在使全球第一部综合性 AI 监管更可行，同时保持其核心安全目标。"}, "datePrecision": "day", "title": {"en": "EU reaches agreement to simplify AI rules, responding to industry compliance complaints", "zhHans": "欧盟达成简化 AI 规则协议，回应行业合规负担诉求"}, "impactIndex": 4}, {"significance": 2, "id": "fable-5-kernelbench-2026", "date": "2026-07-06", "categories": ["capability", "safety"], "summary": {"en": "On July 6, 2026, Anthropic's Claude Fable 5 autonomously wrote a CUDA megakernel for the KernelBench-Mega benchmark, achieving an 18.71x speedup over an optimized PyTorch baseline on an RTX PRO 6000 Blackwell GPU. The kernel was the first-ever 'true megakernel' submitted to the benchmark — it launched exactly once per decoded token, while all other high-scoring entries required 4-14 separate kernel launches. Fable 5's approach pushed hardware memory bandwidth utilization to its absolute limit. The feat required 2.5 hours of autonomous work, during which the model spent 64% of the time in silent analysis (timing baselines, deriving a Roofline performance model) before writing the code. This result was widely interpreted as a significant signal of AI systems' growing capacity for AI R&D automation, with potential implications for recursive self-improvement (RSI).", "zhHans": "2026年7月6日，Anthropic 的 Claude Fable 5 为 KernelBench-Mega 基准自主编写了一个 CUDA 超级内核，在 RTX PRO 6000 Blackwell GPU 上实现了 18.71 倍于优化 PyTorch 基线的加速。该内核是该基准有史以来提交的第一个'真正的超级内核'——每个解码令牌仅启动一次，而所有其他高分方案需要 4-14 次单独内核启动。Fable 5 的方法将硬件内存带宽利用率推至极限。这一壮举需要 2.5 小时的自主工作，期间模型将 64% 的时间用于静默分析（计时基线、推导 Roofline 性能模型），然后才编写代码。这一结果被广泛解读为 AI 系统在 AI 研发自动化方面能力日益增强的重要信号，对递归自改进具有潜在影响。"}, "datePrecision": "day", "title": {"en": "Claude Fable 5 Writes the First AI-Authored CUDA Megakernel, Sparking RSI Debate", "zhHans": "Claude Fable 5 写出首个 AI 编写的 CUDA 超级内核，引发递归自改进讨论"}, "impactIndex": 8}, {"significance": 1, "id": "figure-bmw-humanoid-2025", "date": "2025-11-25", "categories": ["capability"], "summary": {"en": "In 2025, Figure AI's humanoid robot Figure 02 completed the first real-world production deployment of a general-purpose humanoid robot in automotive manufacturing. Working 10-hour autonomous shifts at BMW's Spartanburg plant, Figure 02 supported the production of over 30,000 BMW X3 vehicles over a 10-month deployment. The project demonstrated that humanoid robots could deliver measurable value in real manufacturing conditions, marking a transition for embodied AI from research demos to industrial productivity.", "zhHans": "2025 年，Figure AI 的人形机器人 Figure 02 完成了通用人形机器人在汽车制造中的首次真实世界产线部署。在 BMW 斯帕坦堡工厂每天工作 10 小时自主班次，Figure 02 在 10 个月的部署中支持了超过 3 万辆 BMW X3 的生产。该项目证明了人形机器人可以在真实制造条件下提供可衡量的价值，标志着具身 AI 从研究演示向工业生产力的转变。"}, "datePrecision": "day", "title": {"en": "Figure 02 humanoid robot completes first real-world production deployment at BMW", "zhHans": "Figure 02 人形机器人在宝马工厂完成首次生产部署"}, "impactIndex": 5}, {"significance": 2, "id": "florida-sues-openai-2026", "date": "2026-06-01", "categories": ["governance", "safety"], "summary": {"en": "On June 1, 2026, Florida Attorney General James Uthmeier filed a lawsuit against OpenAI and CEO Sam Altman, accusing the company of putting profit over safety and marketing ChatGPT as safe for children despite known risks. The suit, the first by a US state against an AI company over safety, alleged that OpenAI failed to warn users about ChatGPT's dangers. It marked a new phase in AI liability litigation, shifting from copyright disputes (NYT, Getty) to direct safety and consumer protection claims.", "zhHans": "2026 年 6 月 1 日，佛罗里达州总检察长 James Uthmeier 对 OpenAI 及 CEO Sam Altman 提起诉讼，指控该公司将利润置于安全之上，并在明知风险的情况下将 ChatGPT 宣传为对儿童安全的产品。这是美国州级政府首次就安全问题起诉 AI 公司，指控 OpenAI 未能警告用户 ChatGPT 的危险性。这标志着 AI 责任诉讼进入新阶段——从版权纠纷（NYT、Getty）转向直接的安全和消费者保护索赔。"}, "datePrecision": "day", "title": {"en": "Florida sues OpenAI and Sam Altman in first US state lawsuit against an AI company over safety", "zhHans": "佛罗里达起诉 OpenAI 和 Sam Altman，美国首次州级诉讼针对 AI 公司安全"}, "impactIndex": 6}, {"significance": 1, "id": "gan-2014", "date": "2014-06", "categories": ["capability"], "summary": {"en": "Ian Goodfellow published 'Generative Adversarial Nets,' introducing a novel framework where two neural networks—a generator and a discriminator—compete against each other in a zero-sum game. The generator learns to produce increasingly realistic samples while the discriminator learns to distinguish real from fake. GANs became the dominant paradigm for generative AI until supplanted by diffusion models in the mid-2020s, fundamentally changing how the field thought about unsupervised learning.", "zhHans": "Ian Goodfellow 发表了《Generative Adversarial Nets》，引入了一个新颖的框架：两个神经网络——生成器和判别器——在零和博弈中相互竞争。生成器学习生成越来越真实的样本，而判别器学习区分真伪。GAN 成为生成式 AI 的主导范式，直到 2020 年代中期被扩散模型取代，从根本上改变了该领域对无监督学习的思考方式。"}, "datePrecision": "month", "title": {"en": "Ian Goodfellow invents Generative Adversarial Networks (GANs)", "zhHans": "Ian Goodfellow 发明生成对抗网络"}, "impactIndex": 5}, {"significance": 1, "id": "gemini-1.5-pro-2024", "date": "2024-02-15", "categories": ["capability"], "summary": {"en": "On February 15, 2024, Google released Gemini 1.5 Pro, the first large language model with a 1 million token context window — later expanded to 2 million. This breakthrough allowed the model to process entire codebases, hundred-page documents, and hours of video in a single prompt, achieving a 'needle in a haystack' retrieval accuracy of 99.7% across the full context. It set a new capability frontier that competitors raced to match throughout 2024.", "zhHans": "2024 年 2 月 15 日，Google 发布了 Gemini 1.5 Pro，第一个拥有 100 万 token 上下文窗口的大语言模型——后扩展至 200 万。这一突破使模型能在单次提示中处理整个代码库、上百页文档和数小时的视频，在全上下文范围内实现了 99.7% 的\"大海捞针\"检索准确率。它设定了一个新的能力边界，竞争对手在 2024 年竞相追赶。"}, "datePrecision": "day", "title": {"en": "Google releases Gemini 1.5 Pro with a million-token context window", "zhHans": "Google 发布 Gemini 1.5 Pro，百万 token 上下文窗口"}, "impactIndex": 5}, {"significance": 1, "id": "gemini-2-agents-2024", "date": "2024-12-11", "categories": ["product", "capability"], "summary": {"en": "On December 11, 2024, Google DeepMind launched Gemini 2.0, its 'agentic era' AI model, alongside three agent projects: Project Mariner (browser agent), Project Astra (universal assistant prototype), and Jules (coding agent). The launch signalled Google's formal entry into the AI agent race, bringing agent-native capabilities to billions of users through Google's existing product ecosystem.", "zhHans": "2024 年 12 月 11 日，Google DeepMind 发布了 Gemini 2.0——其\"智能体时代\"AI 模型——同时推出三个智能体项目：Project Mariner（浏览器智能体）、Project Astra（通用助手原型）和 Jules（编程智能体）。此次发布标志着 Google 正式进入 AI 智能体竞赛，通过 Google 现有产品生态将智能体原生能力带给数十亿用户。"}, "datePrecision": "day", "title": {"en": "Google launches Gemini 2.0 with Project Mariner, unveiling a vision for AI agents", "zhHans": "Google 发布 Gemini 2.0 和 Project Mariner，展示 AI 智能体愿景"}, "impactIndex": 5}, {"significance": 2, "id": "gemini-deep-think-imo-gold-2025", "date": "2025-07-01", "categories": ["capability"], "summary": {"en": "In July 2025, Google DeepMind announced that an advanced version of Gemini with Deep Think had achieved a gold-medal standard at the International Mathematical Olympiad, scoring 35 out of 42 points. This marked the first time an AI system reached the highest level of the world's most prestigious mathematics competition for pre-university students — solving problems requiring deep mathematical reasoning, creativity, and multi-step logic. The achievement demonstrated that inference-time compute scaling could match the most challenging human intellectual benchmarks.", "zhHans": "2025 年 7 月，Google DeepMind 宣布带 Deep Think 功能的增强版 Gemini 在国际数学奥林匹克竞赛中达到了金牌标准，获得了 42 分中的 35 分。这标志着 AI 系统首次达到世界最负盛名的大学预科数学竞赛的最高水平——解决了需要深度数学推理、创造力和多步骤逻辑的问题。这一成就证明了推理时计算缩放可以匹配最具挑战性的人类智力基准。"}, "datePrecision": "month", "title": {"en": "Google DeepMind's Gemini Deep Think achieves gold medal at the International Mathematical Olympiad", "zhHans": "Google DeepMind 的 Gemini Deep Think 在国际数学奥林匹克竞赛中获得金牌"}, "impactIndex": 7}, {"significance": 1, "id": "github-copilot-2022", "date": "2022-06-21", "categories": ["product", "commerce"], "summary": {"en": "GitHub Copilot, powered by OpenAI Codex, became generally available in June 2022 as a subscription service integrated into Visual Studio Code, JetBrains, and Neovim. Copilot could generate entire functions from a comment, autocomplete lines in real time, and suggest test cases — fundamentally changing how millions of developers write code. It was the first mainstream AI tool embedded directly into the software development workflow.", "zhHans": "GitHub Copilot 由 OpenAI Codex 驱动，于 2022 年 6 月正式以订阅服务的形式发布，集成到 Visual Studio Code、JetBrains 和 Neovim 中。Copilot 可以根据注释生成完整函数、实时自动补全代码行并建议测试用例——从根本上改变了数百万开发者的编码方式。它是第一个直接嵌入软件开发工作流的 AI 主流工具。"}, "datePrecision": "day", "title": {"en": "GitHub Copilot launches generally, putting AI pair programming in every major IDE", "zhHans": "GitHub Copilot 正式发布，AI 结对编程进入所有主流 IDE"}, "impactIndex": 4}, {"significance": 2, "id": "glm-52-open-source-2026", "date": "2026-06-13", "categories": ["capability"], "summary": {"en": "On June 13, 2026, Z.ai (formerly Zhipu AI) open-sourced GLM-5.2, a 744-billion-parameter Mixture-of-Experts model under the MIT license with a 1-million-token context window. The model achieved frontier-level coding and agentic performance — competitive with GPT-5.5 at roughly one-sixth the inference cost — marking a milestone where open-source AI meaningfully caught up to proprietary frontier models. The release was widely seen as a direct response to the US export ban on Anthropic's Fable 5, demonstrating that restrictive policies accelerate, rather than prevent, global AI capability diffusion.", "zhHans": "2026年6月13日，Z.ai（原智谱 AI）以 MIT 许可协议开源了 GLM-5.2，一个 7440 亿参数的混合专家模型，拥有 100 万 token 的上下文窗口。该模型在前沿编码和智能体任务上达到了可与 GPT-5.5 竞争的水平，推理成本仅为其六分之一——标志着开源 AI 在实质上追赶上了闭源前沿模型。此次发布被广泛视为对美国封禁 Anthropic Fable 5 的直接回应，表明限制性政策加速而非阻止了全球 AI 能力的扩散。"}, "datePrecision": "day", "title": {"en": "GLM-5.2 Open Source: Chinese AI Model Matches Frontier Closed-Source Performance", "zhHans": "GLM-5.2 开源发布：中国 AI 模型追上闭源前沿水平"}, "impactIndex": 9}, {"significance": 2, "id": "google-ai-mode-search-2025", "date": "2025-05-20", "categories": ["product"], "summary": {"en": "On May 20, 2025, Google launched AI Mode in Search — a Gemini-powered feature that replaced the traditional list of blue links with AI-generated answers, comprehensive research reports, and multi-step reasoning. For the first time, the world's largest search engine could answer complex questions, compare options, and generate analysis directly, rather than linking to websites that might contain the answer. The change fundamentally altered the economics of the web: traffic to publisher sites dropped, and the definition of 'search' shifted from finding information to having information synthesized for you.", "zhHans": "2025 年 5 月 20 日，Google 在搜索中推出了 AI Mode——一项由 Gemini 驱动的功能，用 AI 生成的答案、全面的研究报告和多步骤推理取代了传统的蓝色链接列表。全球最大的搜索引擎首次可以直接回答复杂问题、比较选项和生成分析，而不是链接到可能包含答案的网站。这一变化从根本上改变了网络的經濟模式：流向出版商网站的流量下降，\"搜索\"的定义从查找信息转变为为你整合信息。"}, "datePrecision": "day", "title": {"en": "Google launches AI Mode in Search, the biggest change to how search works in 25 years", "zhHans": "Google 在搜索中推出 AI Mode，25 年来搜索方式的最大变革"}, "impactIndex": 8}, {"significance": 1, "id": "google-deepmind-2014", "date": "2014-01-27", "categories": ["commerce"], "summary": {"en": "On January 27, 2014, Google acquired DeepMind Technologies for approximately £400 million ($650 million), one of its largest European acquisitions. Founded by Demis Hassabis, Shane Legg, and Mustafa Suleyman, DeepMind was a London-based AI startup focused on general-purpose learning algorithms. The acquisition was the first clear signal that AI talent and research capability were strategic assets worth fighting for, setting off a decade of bidding wars for AI researchers and establishing DeepMind as the world's most respected AI lab.", "zhHans": "2014 年 1 月 27 日，Google 以约 4 亿英镑（6.5 亿美元）收购了 DeepMind Technologies，这是其在欧洲最大规模的收购之一。由 Demis Hassabis、Shane Legg 和 Mustafa Suleyman 创立的 DeepMind 是一家总部位于伦敦的 AI 初创公司，专注于通用学习算法。这次收购是第一个明确的信号：AI 人才和研究能力是值得争夺的战略资产，引发了长达十年的 AI 研究人员抢购战，并确立了 DeepMind 作为全球最受尊敬的 AI 实验室的地位。"}, "datePrecision": "day", "title": {"en": "Google acquires DeepMind and ignites the AI talent race", "zhHans": "Google 收购 DeepMind，拉开 AI 人才竞赛序幕"}, "impactIndex": 5}, {"significance": 1, "id": "gpt-2-safety-2019", "date": "2019-02-14", "categories": ["safety"], "summary": {"en": "On February 14, 2019, OpenAI announced GPT-2, a language model capable of generating remarkably coherent text. But instead of releasing it fully, OpenAI withheld the complete model, citing 'concerns about malicious applications.' The decision sparked an intense global debate: was OpenAI responsibly cautious or grandstanding for attention? The staged rollout — releasing progressively larger versions over months — became a template for AI safety disclosure. It also marked the first time ordinary people heard the argument that AI could be too dangerous to release, permanently changing how the public thought about AI risk.", "zhHans": "2019 年 2 月 14 日，OpenAI 发布了 GPT-2，一个能够生成极其连贯文本的语言模型。但 OpenAI 没有完全发布它，而是以\"对恶意应用的担忧\"为由扣留了完整模型。这一决定引发了一场激烈的全球辩论：OpenAI 是谨慎负责还是在吸引眼球？分阶段发布——在数月内逐步发布越来越大的版本——成了 AI 安全披露的模板。这也标志着普通人第一次听到\"AI 可能危险到不宜发布\"的论点，永久改变了公众对 AI 风险的看法。"}, "datePrecision": "day", "title": {"en": "OpenAI says GPT-2 is 'too dangerous to release' — the first mainstream AI safety debate goes global", "zhHans": "OpenAI 称 GPT-2\"危险不宜发布\"——首场主流 AI 安全辩论席卷全球"}, "impactIndex": 5}, {"significance": 2, "id": "gpt-5-6-broad-launch-2026", "date": "2026-07-08", "categories": ["governance", "capability"], "summary": {"en": "On July 8, 2026, the U.S. Department of Commerce approved a broad launch of OpenAI's GPT-5.6 model following additional testing under Washington's new frontier AI oversight framework. The testing was conducted by the Commerce Department's Center for AI Standards and Innovation, with OpenAI sending technical experts to Washington to address questions. OpenAI expects to release GPT-5.6 widely this week. The approval marks the first full test of the voluntary pre-release framework established by Trump's June 2 executive order, after OpenAI and Anthropic both faced government-mandated restrictions on their most advanced models.", "zhHans": "2026年7月8日，美国商务部批准 OpenAI 广泛发布 GPT-5.6 模型，此前该模型在华盛顿新的前沿 AI 监管框架下完成了额外测试。测试由商务部的 AI 标准与创新中心进行，OpenAI 派遣技术专家到华盛顿回答问题。OpenAI 预计本周内广泛发布 GPT-5.6。此次批准标志着特朗普 6 月 2 日行政令建立的自愿预发布框架的首次全面测试，此前 OpenAI 和 Anthropic 的最先进模型均面临政府强制限制。"}, "datePrecision": "day", "title": {"en": "US Commerce Dept Approves Broad Launch of GPT-5.6 After Government Security Review", "zhHans": "美国商务部批准 GPT-5.6 广泛发布，政府安全审查完成"}, "impactIndex": 7}, {"significance": 2, "id": "gpt-5-6-limited-release-2026", "date": "2026-06-26", "categories": ["governance", "capability"], "summary": {"en": "On June 26, 2026, OpenAI unveiled GPT-5.6, its next-generation model family with three variants: Sol (flagship, $5/$30 per M tokens), Terra (balanced, $2.50/$15), and Luna (fast/low-cost, $1/$6). However, at the request of the Trump administration under a June 2 Executive Order establishing voluntary 30-day pre-release government review of frontier AI models, OpenAI restricted initial access to approximately 20 government-approved partner organizations through the API and Codex. GPT-5.6 Sol set new state-of-the-art benchmarks on Terminal-Bench 2.1 (91.91% in ultra mode), surpassing Claude Mythos 5 (88%). The restricted release marked the first implementation of the EO framework and established a new pattern: frontier AI releases are no longer freely decided by companies alone.", "zhHans": "2026年6月26日，OpenAI 发布了 GPT-5.6，其下一代模型家族包括三个变体：Sol（旗舰，$5/$30 per M tokens）、Terra（均衡，$2.50/$15）和 Luna（快速/低价，$1/$6）。然而，应特朗普政府根据6月2日行政令提出的要求——该行政令建立了前沿AI模型公开发布前自愿性30天政府审查流程——OpenAI 将初始访问权限限制为仅约20家政府批准的合作伙伴组织，通过 API 和 Codex 提供。GPT-5.6 Sol 在 Terminal-Bench 2.1 上以 ultra 模式达到 91.91% 的新 SOTA，超越 Claude Mythos 5 的 88%。此次受限发布标志着 EO 框架的首次实施，并确立了一种新模式：前沿 AI 的发布不再由公司单方面决定。"}, "datePrecision": "day", "title": {"en": "OpenAI Releases GPT-5.6 Sol/Terra/Luna Under Government-Restricted Access", "zhHans": "OpenAI 发布 GPT-5.6 系列，应白宫要求限制为仅政府批准伙伴可访问"}, "impactIndex": 8}, {"significance": 1, "id": "gpt-image-2025", "date": "2025-03-27", "categories": ["product"], "summary": {"en": "In March 2025, OpenAI released GPT Image, a native image generation model integrated directly into ChatGPT — replacing the separate DALL-E system. The model could render text accurately in images, understand complex visual prompts, and generate in multiple languages. On March 27, users discovered they could transform photos into Studio Ghibli animation style, triggering a global viral trend. The 'Ghibli Moment' became 2025's first major AI cultural phenomenon, sparking both delight and a renewed debate about AI-generated art and copyright.", "zhHans": "2025 年 3 月，OpenAI 发布了 GPT Image，一个直接集成到 ChatGPT 中的原生图像生成模型——取代了独立的 DALL-E 系统。该模型能在图像中准确渲染文字、理解复杂的视觉提示、并生成多语言内容。3 月 27 日，用户发现可以将照片转换为吉卜力工作室动画风格，引发了全球病毒式传播。\"吉卜力时刻\"成为 2025 年第一个重大 AI 文化现象，既引发了欢乐也重新点燃了关于 AI 生成艺术和版权的辩论。"}, "datePrecision": "day", "title": {"en": "OpenAI launches native image generation in ChatGPT, igniting a cultural phenomenon", "zhHans": "OpenAI 在 ChatGPT 中推出原生图像生成，引发文化现象"}, "impactIndex": 4}, {"significance": 3, "id": "gpt3-2020", "date": "2020-06-11", "categories": ["capability"], "summary": {"en": "In June 2020, OpenAI published GPT-3 (Generative Pre-trained Transformer 3), a 175-billion-parameter language model that demonstrated remarkable few-shot learning—the ability to perform novel tasks from just a handful of examples without fine-tuning. GPT-3 could write essays, generate code, translate languages, and answer questions at a quality that often blurred the line between human and machine output. The paper 'Language Models are Few-Shot Learners' (Brown et al.) validated the scaling hypothesis: larger models trained on more data get qualitatively better, not just incrementally better.", "zhHans": "2020 年 6 月，OpenAI 发表了 GPT-3（生成式预训练 Transformer 3），一个拥有 1750 亿参数的语言模型，展示了卓越的少样本学习能力——仅需寥寥几个示例即可执行新任务，无需微调。GPT-3 撰写的文章、生成的代码、翻译的语言和回答的问题，其质量经常模糊了人类与机器输出之间的界限。论文《语言模型是少样本学习者》（Brown 等人）验证了缩放假说：更大的模型在更多数据上训练会得到质的提升，而不仅仅是量的改进。"}, "datePrecision": "day", "title": {"en": "OpenAI releases GPT-3, demonstrating that scaling language models unlocks emergent capabilities", "zhHans": "OpenAI 发布 GPT-3，证明语言模型规模化可以解锁涌现能力"}, "impactIndex": 9}, {"significance": 2, "id": "gpt4-2023", "date": "2023-03-14", "categories": ["capability"], "summary": {"en": "On March 14, 2023, OpenAI released GPT-4 — a multimodal model that could accept both text and image inputs while generating text outputs. GPT-4 scored in the 90th percentile on the bar exam, the 99th percentile on the SAT, and demonstrated dramatically improved reasoning, factuality, and steerability over GPT-3.5. It was integrated into ChatGPT Plus as a premium tier, and its API became the default for developers building on LLMs. GPT-4 raised the bar on what LLMs could do and set a new baseline for AI capability that persisted until the model release wave of late 2024.", "zhHans": "2023 年 3 月 14 日，OpenAI 发布了 GPT-4——一个可以同时接受文本和图像输入并生成文本输出的多模态模型。GPT-4 在律师资格考试中达到了第 90 百分位，SAT 中第 99 百分位，并在推理能力、事实准确性和可引导性上相比 GPT-3.5 有显著提升。它被集成到 ChatGPT Plus 作为付费层，其 API 成为基于 LLM 构建的开发者的默认选择。GPT-4 提高了 LLM 能力的上限，并为 AI 能力设定了新的基线，这一基线一直保持到 2024 年底的模型发布潮。"}, "datePrecision": "day", "title": {"en": "OpenAI releases GPT-4, the first multimodal large language model", "zhHans": "OpenAI 发布 GPT-4，第一个多模态大语言模型"}, "impactIndex": 7}, {"significance": 1, "id": "gpt4o-2024", "date": "2024-05-13", "categories": ["capability"], "summary": {"en": "On May 13, 2024, OpenAI released GPT-4o ('omni'), a natively multimodal model combining text, vision, and audio processing in a single neural network. For the first time, users could have real-time voice conversations with an AI that could express emotion, laugh, pause, and adjust its tone — indistinguishable from human conversation. GPT-4o matched GPT-4 on text benchmarks while dramatically improving voice and vision performance. The model was made free for all ChatGPT users, effectively doubling the available AI capability overnight.", "zhHans": "2024 年 5 月 13 日，OpenAI 发布了 GPT-4o（\"omni\"），一个将文本、视觉和音频处理整合到单一神经网络的原生多模态模型。用户首次可以与 AI 进行实时语音对话——AI 能够表达情感、笑、停顿和调整语气——与人类对话几乎无法区分。GPT-4o 在文本基准上匹配 GPT-4，同时大幅提升了语音和视觉性能。该模型对所有 ChatGPT 用户免费开放，一夜之间将可用的 AI 能力提升了一倍。"}, "datePrecision": "day", "title": {"en": "OpenAI releases GPT-4o, bringing real-time voice conversation to everyone", "zhHans": "OpenAI 发布 GPT-4o，实时语音对话向所有用户开放"}, "impactIndex": 5}, {"significance": 2, "id": "gpt5-2025", "date": "2025-08-07", "categories": ["capability"], "summary": {"en": "On August 7, 2025, OpenAI released GPT-5, a unified AI system that combined advanced reasoning, native multimodality, and autonomous task execution — eliminating the need for users to switch between separate models (GPT-4o for chat, o-series for reasoning, DALL-E for images). According to Sam Altman, GPT-5 could 'provide PhD-level expertise' across domains. The release marked the culmination of OpenAI's journey from a single-purpose language model (GPT-3, 2020) to a general-purpose AI system capable of reasoning, creating, and acting.", "zhHans": "2025 年 8 月 7 日，OpenAI 发布了 GPT-5，一个统一的 AI 系统，结合了高级推理、原生多模态和自主任务执行——消除了用户在独立模型之间切换的需要（GPT-4o 用于聊天，o 系列用于推理，DALL-E 用于图像）。据 Sam Altman 称，GPT-5 可以跨领域\"提供博士级专业知识\"。这次发布标志着 OpenAI 从单一用途语言模型（GPT-3，2020）到能够推理、创造和行动的通用 AI 系统的旅程达到了顶峰。"}, "datePrecision": "day", "title": {"en": "OpenAI releases GPT-5, unifying reasoning, multimodality, and task execution", "zhHans": "OpenAI 发布 GPT-5，统一推理、多模态和任务执行能力"}, "impactIndex": 7}, {"significance": 1, "id": "grok-deepfake-crisis-2026", "date": "2026-01-09", "categories": ["safety", "society"], "summary": {"en": "In January 2026, xAI's Grok image generator was used to create sexually explicit deepfakes, leading Indonesia, Malaysia, and the Philippines to block access to the service. xAI restricted image generation to paid users on January 9. The incident highlighted the inadequacy of safety measures on frontier image generation models and triggered investigations by Ofcom and other regulators. It became the most prominent AI safety incident of the year, demonstrating that AI-generated deepfake risks remained unresolved.", "zhHans": "2026 年 1 月，xAI 的 Grok 图像生成器被用于制作露骨的色情深度伪造，导致印度尼西亚、马来西亚和菲律宾封锁了对该服务的访问。xAI 于 1 月 9 日将图像生成限制为付费用户。该事件突显了前沿图像生成模型安全措施的不足，并引发了 Ofcom 和其他监管机构的调查。它成为当年最突出的 AI 安全事件，展示了 AI 生成的深度伪造风险仍未解决。"}, "datePrecision": "day", "title": {"en": "xAI's Grok generates explicit deepfakes, triggering multi-country bans and a safety backlash", "zhHans": "xAI 的 Grok 生成色情深度伪造，引发多国封禁和安全反弹"}, "impactIndex": 4}, {"significance": 2, "id": "illinois-ai-safety-law-2026", "date": "2026-07-06", "categories": ["governance", "safety"], "summary": {"en": "On July 6, 2026, Illinois Governor JB Pritzker signed the AI Safety Measures Act (SB 315), making Illinois the first US state to require independent third-party safety audits of large AI developers. The law applies to companies with over $500 million in annual gross revenue developing frontier AI models. Requirements include: publishing explanations of catastrophic risk and mitigation plans, reporting critical safety incidents to the state within 72 hours, annual independent compliance audits by qualified third parties, whistleblower protections with anonymous internal reporting, and fines up to $1M for first violations and $3M for subsequent ones. Requirements take effect January 1, 2028. The bill gained bipartisan support and was endorsed by both Anthropic and OpenAI.", "zhHans": "2026年7月6日，伊利诺伊州长 JB Pritzker 签署了 AI 安全措施法案（SB 315），使伊利诺伊成为全美首个要求大型 AI 开发者进行独立第三方安全审计的州。该法律适用于年总收入超过 5 亿美元、开发前沿 AI 模型的公司。要求包括：公布灾难性风险及缓解计划、72 小时内向州政府报告严重安全事故、由合格第三方进行年度独立合规审计、举报人保护及匿名内部报告机制、首次违规罚款最高 100 万美元、后续违规最高 300 万美元。要求于 2028 年 1 月 1 日生效。该法案获得两党支持，Anthropic 和 OpenAI 均表示支持。"}, "datePrecision": "day", "title": {"en": "Illinois Becomes First US State to Mandate Independent Third-Party AI Safety Audits", "zhHans": "伊利诺伊成为全美首个要求独立第三方 AI 安全审计的州"}, "impactIndex": 7}, {"significance": 2, "id": "llama-2023", "date": "2023-02-24", "categories": ["society", "capability"], "summary": {"en": "Meta published LLaMA (Large Language Model Meta AI) in February 2023, a set of foundation language models from 7B to 65B parameters trained on publicly available data only. LLaMA-13B outperformed GPT-3 (175B) on most benchmarks, proving that smaller, well-trained models could rival much larger ones. Although originally released under a non-commercial research license, the weights were leaked and quickly fine-tuned by the community — spawning the open-weight LLM ecosystem that reshaped the AI industry.", "zhHans": "Meta 于 2023 年 2 月发表 LLaMA，一组从 7B 到 65B 参数的基础语言模型，仅在公开可用的数据上训练。LLaMA-13B 在大多数基准测试上超过了 GPT-3（175B），证明了更小但训练更好的模型可以与更大的模型竞争。虽然最初以非商业研究许可发布，权重被泄露并迅速被社区微调——催生了重塑 AI 产业的开源权重大语言模型生态。"}, "datePrecision": "day", "title": {"en": "Meta releases LLaMA, triggering the open-weight LLM revolution", "zhHans": "Meta 发布 LLaMA，引发开源权重大语言模型革命"}, "impactIndex": 7}, {"significance": 2, "id": "llama-3.1-405b-2024", "date": "2024-07-23", "categories": ["capability"], "summary": {"en": "On July 23, 2024, Meta released Llama 3.1 405B — the first open-weight model to match closed-source frontier models like GPT-4 and Claude 3.5 Sonnet on key benchmarks. With 405 billion dense parameters and a 128K token context window, it proved that open-source AI could compete at the highest level. The release reshaped the AI industry by demonstrating that open models could match proprietary ones, accelerating the open-weight ecosystem that would define 2025.", "zhHans": "2024 年 7 月 23 日，Meta 发布了 Llama 3.1 405B——第一个在关键基准上匹配 GPT-4 和 Claude 3.5 Sonnet 等闭源前沿模型的开源权重模型。拥有 4050 亿稠密参数和 128K token 上下文窗口，它证明了开源 AI 可以在最高水平上竞争。这次发布重塑了 AI 行业，证明了开放模型可以匹敌专有模型，加速了将定义 2025 年的开源权重生态系统。"}, "datePrecision": "day", "title": {"en": "Meta releases Llama 3.1 405B, the first frontier-level open-source AI model", "zhHans": "Meta 发布 Llama 3.1 405B，第一个达到前沿水平的开源 AI 模型"}, "impactIndex": 7}, {"significance": 1, "id": "llama-4-2025", "date": "2025-04-01", "categories": ["capability"], "summary": {"en": "In April 2025, Meta released Llama 4, the first open-weight model family built with natively multimodal architecture — processing text, images, and video jointly from the ground up rather than adding vision as a separate module. The family included Llama 4 Maverick (flagship reasoning) and Llama 4 Scout (efficient deployment). Building on the Llama 3.1 405B breakthrough, Llama 4 established open-weight multimodal AI as the new baseline for the open-source ecosystem.", "zhHans": "2025 年 4 月，Meta 发布了
