<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{SEO_TITLE}} · EpochArc</title>
  <meta name="description" content="{{SEO_DESC}}" />
  <meta name="theme-color" content="#f7f8fb" />
  <meta name="color-scheme" content="light dark" />

  <meta property="og:title" content="{{SEO_TITLE}} · EpochArc" />
  <meta property="og:description" content="{{SEO_DESC}}" />
  <meta property="og:type" content="article" />
  <meta property="og:url" content="https://epoch-arc.com/arcs/{{SLUG}}/" />

  <link rel="icon" href="../../assets/logo-icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../src/css/arcs.css" />
  {{SCHEMA_JSON_LD}}
</head>
<body data-theme="light">

  <!-- Sticky Top Nav -->
  <header class="topnav">
    <div class="container topnav-inner">
      <a href="../../index.html" class="logo">
        <img class="brand-icon" src="../../assets/logo-icon.svg" alt="" aria-hidden="true">
        <span>EpochArc</span>
      </a>
      <div class="topnav-actions">
        <a href="../../arcs.html" class="control-btn">
          <span data-zh="专题" data-en="Arcs">专题</span>
        </a>
        <label class="language-picker" aria-label="Language">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path stroke-linecap="round" d="M3.6 9h16.8M3.6 15h16.8M12 3c2.2 2.4 3.3 5.4 3.3 9S14.2 18.6 12 21M12 3C9.8 5.4 8.7 8.4 8.7 12S9.8 18.6 12 21"></path>
          </svg>
          <select class="language-select" id="langSelect">
            <option value="en">EN</option>
            <option value="zh-Hans">中文</option>
          </select>
        </label>
        <button class="control-btn" id="themeToggle">
          <svg id="themeIcon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width: 14px; height: 14px;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"></path>
          </svg>
          <span id="themeText" data-zh="深色模式" data-en="Dark Mode">深色模式</span>
        </button>
      </div>
    </div>
  </header>

  <main class="arc-detail-container">
    <a href="../../arcs.html" class="back-link">
      <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
      </svg>
      <span data-zh="返回专题列表" data-en="Back to Arcs">返回专题列表</span>
    </a>

    <div class="arc-hero">
      <h1 data-zh="{{TITLE_ZH}}" data-en="{{TITLE_EN}}">{{TITLE_EN}}</h1>
      <p class="arc-subtitle" data-zh="{{SUBTITLE_ZH}}" data-en="{{SUBTITLE_EN}}">{{SUBTITLE_EN}}</p>
    </div>

    <!-- Table of Contents -->
    {{TOC_HTML}}

    <!-- Abstract -->
    <div class="arc-abstract">
      <p data-zh="{{ABSTRACT_ZH}}" data-en="{{ABSTRACT_EN}}">{{ABSTRACT_EN}}</p>
    </div>

    <!-- Chapters -->
    {{CHAPTERS_HTML}}

    <!-- Conclusion -->
    <div class="arc-conclusion">
      <h3 data-zh="结语" data-en="Conclusion">Conclusion</h3>
      <p class="arc-conclusion-text" data-zh="{{CONCLUSION_ZH}}" data-en="{{CONCLUSION_EN}}">{{CONCLUSION_EN}}</p>
    </div>

    <!-- Related Arcs -->
    {{RELATED_ARCS_HTML}}
  </main>

  <footer class="pagefoot">
    <div class="container row-between">
      <span data-zh="© 2026 EpochArc · Curated by an independent maker" data-en="© 2026 EpochArc · Curated by an independent maker">© 2026 EpochArc · Curated by an independent maker</span>
      <nav class="footer-links" aria-label="Footer">
        <a href="../../methods.html"><span data-zh="方法与来源" data-en="Methodology">方法与来源</span></a>
      </nav>
    </div>
  </footer>

  <script type="module" src="../../src/js/arcs.js"></script>
</body>
</html>
